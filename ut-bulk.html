<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>UT — Massevalg fra lager</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#151c30;--dark:#0d1426;--text:#f5f7ff;--muted:#aab4ce;--line:#303b59;--accent:#f4c430;--ok:#48d597;--warn:#f6b94b;--bad:#ff7373;--info:#75b7ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg),#11182a)}button{font:inherit}.app{width:min(850px,100%);margin:auto;padding:14px 12px 80px}.top{display:flex;justify-content:space-between;gap:9px;align-items:center;flex-wrap:wrap}.back{min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--dark);color:var(--text);text-decoration:none;font-weight:900}.version{color:var(--muted);font-size:10px;text-align:right}.lang{display:flex;gap:5px}.lang button{min-width:38px;min-height:34px;border:1px solid var(--line);border-radius:9px;background:var(--dark);color:var(--muted);font-weight:950}.lang button.active{border-color:var(--accent);color:var(--accent)}h1{margin:14px 0 5px;font-size:clamp(29px,8vw,44px)}.subtitle{margin:0 0 13px;color:var(--muted);line-height:1.45}.card{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--card)}.ramp{text-align:center;border:2px solid var(--accent);background:rgba(244,196,48,.07)}.ramp small{display:block;color:var(--muted)}.ramp strong{display:block;margin-top:4px;color:var(--accent);font-size:clamp(36px,11vw,60px)}.need{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.need div{padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--dark);text-align:center}.need span{display:block;color:var(--muted);font-size:10px}.need b{display:block;margin-top:4px;font-size:19px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.filter{min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--dark);color:var(--text);font-weight:950}.filter.active{border-color:var(--accent);background:rgba(244,196,48,.11);color:var(--accent)}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{min-height:52px;border:0;border-radius:12px;padding:10px 12px;font-weight:950;cursor:pointer}.primary{background:var(--accent);color:#17130a}.secondary{background:#2c395c;color:var(--text)}.success{background:var(--ok);color:#062418}.summary{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.45;text-align:center}.rows{display:grid;gap:7px;margin-top:10px}.row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--dark)}.row.selected{border-color:var(--ok);background:rgba(72,213,151,.07)}.row input{width:25px;height:25px}.row strong{color:var(--accent)}.code{margin-top:4px;font:900 20px Consolas,monospace}.meta{margin-top:3px;color:var(--muted);font-size:10px;word-break:break-all}.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.message{min-height:24px;margin-top:10px;color:var(--muted);text-align:center;white-space:pre-wrap;line-height:1.45}.message.ok{color:var(--ok)}.message.warn{color:var(--warn)}.message.bad{color:var(--bad)}.sticky{position:sticky;bottom:8px;z-index:10;padding:10px;border:1px solid var(--line);border-radius:15px;background:rgba(13,20,38,.96);box-shadow:0 10px 30px rgba(0,0,0,.45)}.sticky .btn{width:100%;font-size:18px}@media(max-width:620px){.need{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="app">
  <div class="top"><a class="back" id="backLink" href="utsending.html">← UT</a><div class="lang"><button data-lang="nb">NO</button><button data-lang="pl">PL</button><button data-lang="uk">UA</button></div><div class="version">UT Massevalg v1<br>07.08.2026 kl. 14:22</div></div>
  <h1 id="title"></h1><p class="subtitle" id="subtitle"></p>
  <section class="card ramp"><small id="rampCaption"></small><strong id="rampName">RAMPE —</strong><div class="need"><div><span>Bunner</span><b id="bNeed">0</b></div><div><span>Hyller x30</span><b id="h30Need">0</b></div><div><span>Hyller x60</span><b id="h60Need">0</b></div></div></section>
  <section class="card">
    <div class="filters"><button class="filter active" data-filter="all">Усі</button><button class="filter" data-filter="bunner">Bunner</button><button class="filter" data-filter="hyller30">Hyller x30</button><button class="filter" data-filter="hyller60">Hyller x60</button></div>
    <div class="toolbar"><button class="btn primary" id="selectNeeded" type="button"></button><button class="btn secondary" id="clearSelected" type="button"></button></div>
    <div class="summary" id="summary"></div>
    <div class="rows" id="rows"><div class="empty">…</div></div>
    <div class="message" id="message"></div>
  </section>
  <div class="sticky"><button class="btn success" id="reserveSelected" type="button" disabled></button></div>
</main>
<script>
"use strict";
const BASE="https://hzjsatehehhpgpskckfi.supabase.co",KEY="sb_publishable_5swzjbs4yq7N8sDNR00FHA_n1xbnMya";
const params=new URLSearchParams(location.search),ORDER_ID=params.get("order")||"",RAMP_PARAM=params.get("ramp")||"";
const $=id=>document.getElementById(id),productNames={bunner:"Bunner",hyller30:"Hyller x30",hyller60:"Hyller x60"};
let order=null,scans=[],stock=[],filter="all",selected=new Set(),busy=false;
const T={
nb:{title:"UT — Velg flere fra lager",subtitle:"Velg mange allerede godkjente INN-varer samtidig. Systemet tillater aldri mer enn det som mangler på rampen.",caption:"Velger til",select:"✓ Velg nødvendig antall",clear:"☐ Fjern alle valg",reserve:"Legg valgte på",none:"Ingen tilgjengelige varer i dette filteret.",need:"Mangler",selected:"Valgt",available:"tilgjengelig",tooMany:"Du kan ikke velge flere av denne varen enn rampen mangler.",saving:"Reserverer valgte varer…",saved:"Valgte varer er lagt til rampen.",complete:"Rampen er komplett.",needOrder:"Mangler UT-oppdrag."},
pl:{title:"UT — Wybierz wiele z magazynu",subtitle:"Wybierz jednocześnie wiele zatwierdzonych towarów INN. System nie pozwoli przekroczyć brakującej ilości rampy.",caption:"Wybór do",select:"✓ Wybierz potrzebną ilość",clear:"☐ Odznacz wszystko",reserve:"Dodaj wybrane do",none:"Brak dostępnych towarów w tym filtrze.",need:"Brakuje",selected:"Wybrano",available:"dostępnych",tooMany:"Nie można wybrać więcej tego produktu niż brakuje na rampie.",saving:"Rezerwowanie wybranych…",saved:"Wybrane towary dodano do rampy.",complete:"Rampa jest kompletna.",needOrder:"Brak zlecenia UT."},
uk:{title:"UT — Масове додавання зі складу",subtitle:"Виберіть багато вже підтверджених INN-товарів одночасно. Система не дозволить додати більше, ніж ще бракує цій рампі.",caption:"Вибір для",select:"✓ Вибрати потрібну кількість",clear:"☐ Зняти всі галочки",reserve:"Додати вибрані на",none:"У цьому фільтрі немає доступних товарів.",need:"Бракує",selected:"Вибрано",available:"доступно",tooMany:"Не можна вибрати більше цього товару, ніж ще бракує рампі.",saving:"Резервую вибрані товари…",saved:"Вибрані товари додано на рампу.",complete:"Рампа повністю укомплектована.",needOrder:"Немає UT-завдання."}};
let lang=localStorage.getItem("mottak_ut_language")||"nb";if(!T[lang])lang="nb";function tr(k){return T[lang][k]||T.nb[k]||k}
function headers(){return{apikey:KEY,Authorization:`Bearer ${KEY}`,Accept:"application/json","Content-Type":"application/json"}}async function req(path,opt={}){const r=await fetch(`${BASE}/rest/v1/${path}`,{...opt,headers:{...headers(),...(opt.headers||{})}}),txt=await r.text();let body=null;try{body=txt?JSON.parse(txt):null}catch{body=txt}if(!r.ok)throw new Error(body?.message||body?.hint||body||`HTTP ${r.status}`);return body}async function rpc(name,args){return req(`rpc/${name}`,{method:"POST",body:JSON.stringify(args)})}
function activeScans(){return scans.filter(s=>!s.released_at)}function request(){return{b:+order?.bunner_stacks||0,h30:+order?.hyller30_sets||0,h60:+order?.hyller60_sets||0}}function current(){const a=activeScans();return{b:a.filter(s=>s.product==="bunner").length,h30:a.filter(s=>s.product==="hyller30").length,h60:a.filter(s=>s.product==="hyller60").length}}function remaining(){const r=request(),c=current();return{b:Math.max(0,r.b-c.b),h30:Math.max(0,r.h30-c.h30),h60:Math.max(0,r.h60-c.h60)}}function cap(product){const x=remaining();return product==="bunner"?x.b:product==="hyller30"?x.h30:product==="hyller60"?x.h60:0}function selectedCount(product){return[...selected].map(id=>stock.find(r=>String(r.id)===String(id))).filter(r=>r?.product===product).length}function complete(){const x=remaining();return x.b===0&&x.h30===0&&x.h60===0}
function visible(){return stock.filter(r=>(r.stock_status||"in_stock")==="in_stock"&&(filter==="all"||r.product===filter)&&cap(r.product)>0).sort((a,b)=>{const p=(productNames[a.product]||a.product).localeCompare(productNames[b.product]||b.product,"nb");return p||String(a.lower_number||"").localeCompare(String(b.lower_number||""),"nb",{numeric:true})})}
function msg(text,type=""){$("message").textContent=text;$("message").className=`message ${type}`.trim()}function clean(v){return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function applyLang(){document.documentElement.lang=lang==="uk"?"uk":lang;$("title").textContent=tr("title");$("subtitle").textContent=tr("subtitle");$("rampCaption").textContent=tr("caption");$("selectNeeded").textContent=tr("select");$("clearSelected").textContent=tr("clear");document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));render()}
function render(){const rem=remaining();$("rampName").textContent=`RAMPE ${order?.ramp||RAMP_PARAM||"—"}`;$("bNeed").textContent=`${tr("need")}: ${rem.b}`;$("h30Need").textContent=`${tr("need")}: ${rem.h30}`;$("h60Need").textContent=`${tr("need")}: ${rem.h60}`;$("backLink").href=`utsending.html?open=${encodeURIComponent(ORDER_ID)}`;const rows=visible();$("rows").innerHTML=rows.length?rows.map(r=>`<label class="row ${selected.has(String(r.id))?"selected":""}"><input type="checkbox" data-id="${String(r.id)}" ${selected.has(String(r.id))?"checked":""}><div><strong>${productNames[r.product]||r.product}</strong><div class="code">${clean(r.lower_number)||"------"}</div><div class="meta">${r.scanner_code?`EPC …${clean(r.scanner_code).slice(-10)}`:"EPC —"}</div></div></label>`).join(""):`<div class="empty">${tr("none")}</div>`;const by={b:selectedCount("bunner"),h30:selectedCount("hyller30"),h60:selectedCount("hyller60")};$("summary").textContent=`${tr("selected")}: Bunner ${by.b}/${rem.b} · x30 ${by.h30}/${rem.h30} · x60 ${by.h60}/${rem.h60} · ${tr("available")}: ${rows.length}`;$("reserveSelected").textContent=`${tr("reserve")} RAMPE ${order?.ramp||RAMP_PARAM||""} (${selected.size})`;$("reserveSelected").disabled=busy||selected.size===0;document.querySelectorAll("[data-id]").forEach(cb=>cb.onchange=()=>toggle(cb.dataset.id,cb.checked))}
function toggle(id,on){const row=stock.find(r=>String(r.id)===String(id));if(!row)return;if(on){if(selectedCount(row.product)>=cap(row.product)){msg(tr("tooMany"),"warn");render();return}selected.add(String(id))}else selected.delete(String(id));render()}
function selectNeeded(){selected.clear();const products=filter==="all"?["bunner","hyller30","hyller60"]:[filter];for(const product of products){const limit=cap(product);stock.filter(r=>r.product===product&&(r.stock_status||"in_stock")==="in_stock").slice(0,limit).forEach(r=>selected.add(String(r.id)))}render()}
async function load(){if(!ORDER_ID)throw new Error(tr("needOrder"));const[o,s,st]=await Promise.all([req(`ut_orders?select=*&id=eq.${encodeURIComponent(ORDER_ID)}&limit=1`),req(`ut_order_scans?select=*&order_id=eq.${encodeURIComponent(ORDER_ID)}&limit=1000`),req("mottak_scans?select=id,product,status,stock_status,scanner_code,lower_number,created_at&status=eq.verified&stock_status=eq.in_stock&limit=10000")]);order=o?.[0]||null;scans=s||[];stock=st||[];if(!order)throw new Error(tr("needOrder"));selected=new Set([...selected].filter(id=>stock.some(r=>String(r.id)===id)));render();if(complete())msg(tr("complete"),"ok")}
async function reserve(){if(!selected.size||busy)return;busy=true;render();msg(tr("saving"));try{const ids=[...selected];const n=await rpc("reserve_ut_scans_bulk",{p_order_id:ORDER_ID,p_mottak_scan_ids:ids});selected.clear();await load();msg(`${tr("saved")} ${Number(n)||ids.length}. ${complete()?tr("complete"):""}`,"ok")}catch(e){msg(e.message||String(e),"bad")}finally{busy=false;render()}}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("mottak_ut_language",lang);applyLang()});$("selectNeeded").onclick=selectNeeded;$("clearSelected").onclick=()=>{selected.clear();render()};$("reserveSelected").onclick=reserve;applyLang();load().catch(e=>msg(e.message||String(e),"bad"));
</script>
</body>
</html>
