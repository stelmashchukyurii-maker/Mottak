<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>UT — Lager TEST v5</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1020}
    #core{display:block;width:100%;min-height:100vh;border:0;background:#0b1020}
  </style>
</head>
<body>
<iframe id="core" src="utsending-v4.html?v=20260804-2031" title="UT — Lager TEST"></iframe>
<script>
"use strict";
const outer=document.getElementById("core");
const URL="https://hzjsatehehhpgpskckfi.supabase.co";
const KEY="sb_publishable_5swzjbs4yq7N8sDNR00FHA_n1xbnMya";
let baseObserver=null,patchTimer=null,physicalTimer=null,busy=false;

function v4doc(){try{return outer.contentDocument}catch{return null}}
function innerFrame(){return v4doc()?.getElementById("core")||null}
function baseDoc(){try{return innerFrame()?.contentDocument||null}catch{return null}}
function baseWin(){try{return innerFrame()?.contentWindow||null}catch{return null}}
function resizeOuter(){try{const d=v4doc();if(d)outer.style.height=Math.max(innerHeight,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+"px"}catch{}}
function currentOrder(){try{return baseWin()?.current?.()||null}catch{return null}}

async function rpc(name,args={}){
  const response=await fetch(`${URL}/rest/v1/rpc/${encodeURIComponent(name)}`,{
    method:"POST",
    headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,Accept:"application/json","Content-Type":"application/json"},
    body:JSON.stringify(args)
  });
  const text=await response.text();
  let body=null;try{body=text?JSON.parse(text):null}catch{body=text}
  if(!response.ok){const message=body&&typeof body==="object"?(body.message||body.hint||`HTTP ${response.status}`):(body||`HTTP ${response.status}`);throw new Error(message)}
  return body;
}

function addStyles(doc){
  if(doc.getElementById("utTestV5Styles"))return;
  const style=doc.createElement("style");
  style.id="utTestV5Styles";
  style.textContent=`
    .test-v5-banner{margin:12px 0;padding:15px;border:2px solid var(--accent);border-radius:17px;background:rgba(244,196,48,.1);text-align:center}
    .test-v5-banner strong{display:block;color:var(--accent);font-size:23px}.test-v5-banner span{display:block;margin-top:6px;color:var(--text);line-height:1.45}
    .physical-v5{margin:10px 0 0;padding:14px;border:2px solid var(--ok);border-radius:15px;background:rgba(72,213,151,.07);text-align:center}
    .physical-v5 span{display:block;color:var(--muted);font-size:12px;font-weight:900}.physical-v5 strong{display:block;margin-top:6px;font-size:27px}
    .test-v5-panel{margin-top:12px;padding:14px;border:2px solid var(--accent);border-radius:15px;background:rgba(244,196,48,.08)}
    .test-v5-title{margin:0 0 8px;color:var(--accent);font-size:20px;text-align:center}.test-v5-note{color:var(--muted);font-size:12px;line-height:1.45;text-align:center}
    .test-v5-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:11px}
    .test-v5-cell{padding:11px 8px;border:1px solid var(--line);border-radius:12px;background:var(--dark);text-align:center}.test-v5-cell span{display:block;color:var(--muted);font-size:10px}.test-v5-cell strong{display:block;margin-top:5px;font-size:20px}
    .test-v5-return{width:100%;min-height:62px;margin-top:12px;border:0;border-radius:13px;background:var(--accent);color:#17130a;font-weight:950;font-size:18px}
    .test-v5-result{margin-top:10px;color:var(--muted);font-size:12px;text-align:center;white-space:pre-wrap}.test-v5-result.ok{color:var(--ok)}.test-v5-result.bad{color:var(--bad)}
    @media(min-width:700px){.test-v5-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  `;
  doc.head.appendChild(style);
}

function ensureBanner(doc){
  if(doc.getElementById("testV5Banner"))return;
  const banner=doc.createElement("div");banner.id="testV5Banner";banner.className="test-v5-banner";
  banner.innerHTML="<strong>TESTMODUS — INGEN LIVE-UTSENDING</strong><span>Varene blir først midlertidig trukket fra fysisk lager. Deretter må hele rampen returneres med en egen knapp.</span>";
  const subtitle=doc.querySelector(".subtitle");subtitle?.insertAdjacentElement("afterend",banner);
}

function ensurePhysical(doc){
  if(doc.getElementById("physicalV5"))return;
  const card=doc.createElement("div");card.id="physicalV5";card.className="physical-v5";
  card.innerHTML='<span>FYSISK PÅ LAGER NÅ</span><strong id="physicalV5Value">Laster…</strong>';
  const summary=doc.querySelector(".stock-summary");summary?.insertAdjacentElement("afterend",card);
}

function ensurePanel(doc){
  const confirm=doc.querySelector(".confirm");if(!confirm)return null;
  let panel=doc.getElementById("testV5Panel");
  if(!panel){
    panel=doc.createElement("div");panel.id="testV5Panel";panel.className="test-v5-panel";
    panel.innerHTML=`<h3 class="test-v5-title">Kontroll av testbevegelse</h3><div class="test-v5-note" id="testV5Note"></div><div class="test-v5-grid" id="testV5Grid"></div><button class="test-v5-return" id="testV5Return" type="button" hidden>Returner alle varer til lager</button><div class="test-v5-result" id="testV5Result"></div>`;
    confirm.insertAdjacentElement("afterend",panel);
    panel.querySelector("#testV5Return").addEventListener("click",returnTest);
  }
  return panel;
}

function fmt(b,h){return `${Number(b)||0} Bunner · ${Number(h)||0} hyller`}
function cell(label,value){return `<div class="test-v5-cell"><span>${label}</span><strong>${value}</strong></div>`}

function bindTestButton(doc){
  const old=doc.getElementById("confirmButton");if(!old||old.dataset.testV5Bound)return;
  const fresh=old.cloneNode(true);fresh.dataset.testV5Bound="1";fresh.textContent="Testowo списати всю рампу";
  old.replaceWith(fresh);fresh.addEventListener("click",dispatchTest);
}

function patchStatic(doc){
  addStyles(doc);ensureBanner(doc);ensurePhysical(doc);ensurePanel(doc);bindTestButton(doc);
  const version=doc.querySelector(".version");if(version)version.innerHTML="UT Lager v5 TEST<br>Oppdatert 04.08.2026 kl. 20:31";
  const subtitle=doc.querySelector(".subtitle");if(subtitle)subtitle.textContent="Reversibel test av reservasjon, rampe, fysisk lagerfratrekk og full retur.";
  const mode=doc.getElementById("modeText");if(mode)mode.innerHTML="<strong>Kun TEST:</strong> vanlig sluttutsending er deaktivert. Alle varer skal returneres etter at lagerfratrekket er kontrollert.";
  const demo=doc.getElementById("demoButton");if(demo)demo.hidden=true;
  const dispatchedLabel=doc.querySelector(".stock-state.dispatched span");if(dispatchedLabel)dispatchedLabel.textContent="TEST — MIDLERTIDIG TRUKKET";
  const dispatchedSmall=doc.querySelector(".stock-state.dispatched small");if(dispatchedSmall)dispatchedSmall.textContent="Skal returneres til lager";
  const checkText=doc.querySelector(".confirm-check span");if(checkText)checkText.textContent="Jeg bekrefter at hele rampen er kontrollert og klar for midlertidig testfratrekk.";
}

function patchOrderState(doc){
  const order=currentOrder(),panel=ensurePanel(doc);if(!panel)return;
  const check=doc.getElementById("confirmCheck"),button=doc.getElementById("confirmButton"),returnBtn=doc.getElementById("testV5Return"),note=doc.getElementById("testV5Note"),grid=doc.getElementById("testV5Grid"),result=doc.getElementById("testV5Result"),pill=doc.getElementById("detailStatus");
  if(!order){panel.hidden=true;return}panel.hidden=false;
  const state=order.test_state||"active";
  if(state==="dispatched"){
    if(check)check.closest("label").hidden=true;if(button)button.hidden=true;returnBtn.hidden=false;
    if(pill)pill.textContent="TEST — списано";
    note.textContent="Загальний фізичний залишок реально зменшено. Перевірте цифри, а потім обов’язково поверніть товар.";
    grid.innerHTML=cell("ДО СПИСАННЯ",fmt(order.test_before_bunner,order.test_before_hyller))+cell("ПІСЛЯ СПИСАННЯ",fmt(order.test_after_dispatch_bunner,order.test_after_dispatch_hyller))+cell("СПИСАНО BUNNER",String((order.test_before_bunner||0)-(order.test_after_dispatch_bunner||0)))+cell("СПИСАНО HYLLER",String((order.test_before_hyller||0)-(order.test_after_dispatch_hyller||0)));
    result.textContent="Тест ще не завершено: товар потрібно повернути на склад.";result.className="test-v5-result";
  }else if(state==="returned"){
    if(check)check.closest("label").hidden=true;if(button)button.hidden=true;returnBtn.hidden=true;
    if(pill)pill.textContent="TEST — повернено";
    note.textContent="Тимчасово списані товари повернено до in_stock без видалення INN-записів.";
    grid.innerHTML=cell("ДО ТЕСТУ",fmt(order.test_before_bunner,order.test_before_hyller))+cell("ПІСЛЯ СПИСАННЯ",fmt(order.test_after_dispatch_bunner,order.test_after_dispatch_hyller))+cell("ПІСЛЯ ПОВЕРНЕННЯ",fmt(order.test_after_return_bunner,order.test_after_return_hyller))+cell("РІЗНИЦЯ ПІСЛЯ ПОВЕРНЕННЯ",fmt((order.test_after_return_bunner||0)-(order.test_before_bunner||0),(order.test_after_return_hyller||0)-(order.test_before_hyller||0)));
    const ok=Number(order.test_after_return_bunner)===Number(order.test_before_bunner)&&Number(order.test_after_return_hyller)===Number(order.test_before_hyller);
    result.textContent=ok?"Повернення успішне. Початковий фізичний залишок відновлено.":"Увага: залишок після повернення відрізняється. Потрібна перевірка.";result.className=`test-v5-result ${ok?"ok":"bad"}`;
  }else{
    if(check)check.closest("label").hidden=false;if(button){button.hidden=false;button.textContent="Тестово списати всю рампу"}returnBtn.hidden=true;
    note.textContent="Після тестового списання сторінка покаже фактичне зменшення фізичного залишку. Повернення виконується окремою кнопкою.";
    grid.innerHTML="";result.textContent="";result.className="test-v5-result";
  }
}

async function refreshPhysical(){
  const doc=baseDoc();if(!doc)return;
  try{const rows=await rpc("ut_physical_stock");const row=Array.isArray(rows)?rows[0]:rows;const value=doc.getElementById("physicalV5Value");if(value)value.textContent=fmt(row?.total_bunner,row?.total_hyller)}catch(error){const value=doc.getElementById("physicalV5Value");if(value)value.textContent="SQL TESTMODUS må installeres"}
}

async function dispatchTest(){
  if(busy)return;const doc=baseDoc(),win=baseWin(),order=currentOrder();if(!doc||!win||!order)return;
  const check=doc.getElementById("confirmCheck"),button=doc.getElementById("confirmButton"),result=doc.getElementById("testV5Result");
  if(!check?.checked){result.textContent="Поставте контрольну галочку перед тестовим списанням.";result.className="test-v5-result bad";return}
  busy=true;button.disabled=true;result.textContent="Виконується реальне тестове списання з фізичного залишку…";result.className="test-v5-result";
  try{await rpc("test_dispatch_ut_order",{p_order_id:order.id});check.checked=false;await win.loadAll?.();await refreshPhysical();setTimeout(()=>patchOrderState(doc),150)}catch(error){result.textContent=error.message||String(error);result.className="test-v5-result bad"}finally{busy=false;patchOrderState(doc)}
}

async function returnTest(){
  if(busy)return;const doc=baseDoc(),win=baseWin(),order=currentOrder(),button=doc?.getElementById("testV5Return"),result=doc?.getElementById("testV5Result");if(!doc||!win||!order)return;
  busy=true;button.disabled=true;result.textContent="Повертаємо всі товари до in_stock…";result.className="test-v5-result";
  try{await rpc("return_ut_test_order",{p_order_id:order.id});await win.loadAll?.();await refreshPhysical();setTimeout(()=>patchOrderState(doc),150)}catch(error){result.textContent=error.message||String(error);result.className="test-v5-result bad"}finally{busy=false;button.disabled=false;patchOrderState(doc)}
}

function patch(){const doc=baseDoc();if(!doc)return;patchStatic(doc);patchOrderState(doc);resizeOuter();clearTimeout(patchTimer);patchTimer=setTimeout(refreshPhysical,250)}
function connect(){const inner=innerFrame();if(!inner)return false;const attach=()=>{const doc=baseDoc();if(!doc)return;patch();baseObserver?.disconnect();baseObserver=new MutationObserver(patch);baseObserver.observe(doc.body,{childList:true,subtree:true,characterData:true});clearInterval(physicalTimer);physicalTimer=setInterval(refreshPhysical,5000);resizeOuter()};if(inner.contentDocument?.readyState==="complete")attach();else inner.addEventListener("load",attach,{once:true});return true}
outer.addEventListener("load",()=>{const timer=setInterval(()=>{if(connect())clearInterval(timer)},100);setTimeout(resizeOuter,500)});
addEventListener("resize",resizeOuter);
</script>
</body>
</html>
