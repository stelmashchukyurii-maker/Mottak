<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Lagerstatus — ett synlig nummer</title>
  <style>html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7ff;font-family:Arial,sans-serif}#loading{padding:24px;text-align:center;font-weight:800}</style>
</head>
<body>
<div id="loading">Laster lagerstatus…</div>
<script>
"use strict";
(async()=>{
  try{
    const response=await fetch("lagerstatus-core-v1.html?v=20260806-1527",{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();
    const policy='<script src="upper-number-policy.js?v=20260806-1527"><\/script>';
    html=html.includes("</body>")?html.replace("</body>",`${policy}</body>`):`${html}${policy}`;
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById("loading").textContent=`Kunne ikke laste lagerstatus: ${error.message||error}`;}
})();
</script>
</body>
</html>
