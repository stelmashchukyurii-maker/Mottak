<body>
<iframe id="utCore" src="utsending-core-v7.html?v=20260807-2043" title="UT — Lager og utsending"></iframe><button id="utFloatScan" type="button">📷 <span id="utFloatText">Kamera</span></button><div id="utHint"></div>
<script>
"use strict";
const f=document.getElementById("utCore"),scan=document.getElementById("utFloatScan"),scanText=document.getElementById("utFloatText"),hint=document.getElementById("utHint");let obs,timer,tries=0;
function resize(){try{const d=f.contentDocument;f.style.height=Math.max(innerHeight,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+"px"}catch{}}
function add(d,id,src){if(d.getElementById(id))return;const s=d.createElement("script");s.id=id;s.src=src;d.body.appendChild(s)}
function lang(){try{return f.contentWindow.UT_LANG||localStorage.getItem("mottak_ut_language")||"nb"}catch{return"nb"}}
function tx(){return lang()==="uk"?{cam:"Камера",open:"Спочатку відкрийте потрібну рампу.",done:"Ця рампа вже завершена.",camera:"📷 Камера / телефон — сканувати на",bulk:"☑ Масово вибрати зі складу для"}:lang()==="pl"?{cam:"Aparat",open:"Najpierw otwórz właściwą rampę.",done:"Ta rampa jest już zakończona.",camera:"📷 Aparat / telefon — skanuj do",bulk:"☑ Wybierz wiele z magazynu do"}:{cam:"Kamera",open:"Åpne først riktig rampe.",done:"Denne rampen er allerede avsluttet.",camera:"📷 Kamera / telefon — skann til",bulk:"☑ Velg mange fra lager til"}}
function order(){try{return typeof f.contentWindow.current==="function"?f.contentWindow.current():null}catch{return null}}
function cameraUrl(o){return`ut-camera-v5.html?order=${encodeURIComponent(o.id)}&ramp=${encodeURIComponent(o.ramp||"")}&v=20260807-2043`}
function bulkUrl(o){return`ut-bulk.html?order=${encodeURIComponent(o.id)}&ramp=${encodeURIComponent(o.ramp||"")}&v=20260807-2043`}
function note(s){clearTimeout(timer);hint.textContent=s;hint.classList.add("show");timer=setTimeout(()=>hint.classList.remove("show"),2600)}
function goCamera(){const o=order();if(!o)return note(tx().open);if(["completed","cancelled"].includes(o.status))return note(tx().done);location.href=cameraUrl(o)}
function hideStockOverview(d){
  let style=d.getElementById("utHideStockOverviewStyle");
  if(!style){style=d.createElement("style");style.id="utHideStockOverviewStyle";style.textContent=`#bamaSharedStock{display:none!important}#dispatchedStock.closest{display:none!important}@media(min-width:760px){.stock-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}}`;d.head.appendChild(style)}
  d.getElementById("bamaSharedStock")?.style.setProperty("display","none","important");
  d.getElementById("dispatchedStock")?.closest(".stock")?.style.setProperty("display","none","important");
}
function tools(d){const box=d.getElementById("scanBox"),o=order();if(!box)return;d.querySelector('[data-mode="photo"]')?.classList.add("hidden");d.getElementById("photoPanel")?.classList.add("hidden");let wrap=d.getElementById("utFastTools");if(!wrap){wrap=d.createElement("div");wrap.id="utFastTools";wrap.style.cssText="display:grid;gap:9px;margin:0 0 13px";wrap.innerHTML='<button id="utDedicatedCameraButton" type="button"></button><button id="utBulkButton" type="button"></button>';box.insertAdjacentElement("beforebegin",wrap)}const c=d.getElementById("utDedicatedCameraButton"),b=d.getElementById("utBulkButton"),r=o?.ramp||"—",disabled=!o||["completed","cancelled"].includes(o.status);c.style.cssText="width:100%;min-height:64px;border:0;border-radius:14px;background:#f4c430;color:#17130a;font-weight:950;font-size:18px";b.style.cssText="width:100%;min-height:60px;border:2px solid #48d597;border-radius:14px;background:#163c32;color:#eafff6;font-weight:950;font-size:17px";c.textContent=`${tx().camera} RAMPE ${r}`;b.textContent=`${tx().bulk} RAMPE ${r}`;c.disabled=b.disabled=disabled;c.onclick=goCamera;b.onclick=()=>{const x=order();if(x)location.href=bulkUrl(x)}}
function openRequested(){const id=new URLSearchParams(location.search).get("open");if(!id)return;try{if(typeof f.contentWindow.openOrder==="function"){f.contentWindow.openOrder(id,true);history.replaceState(null,"","utsending.html");return}}catch{}if(tries++<25)setTimeout(openRequested,300)}
function enhance(){const d=f.contentDocument;if(!d)return;f.contentWindow.BAMA_HOME_TARGET="utsending.html";const v=d.querySelector(".version");if(v)v.innerHTML="UT Lager v27.2 UTEN LAGER NÅ<br>Oppdatert 07.08.2026 kl. 20:43";d.querySelectorAll("a[href]").forEach(a=>a.target="_top");add(d,"utProductionFlow","utsending-production-flow.js?v=20260807-2043");add(d,"utLanguageSwitch","utsending-language.js?v=20260807-2043");add(d,"utAllowedPickerModule","utsending-allowed-picker.js?v=20260807-2043");add(d,"bamaUpperNumberPolicy","upper-number-policy.js?v=20260807-2043");add(d,"utStatusColors","utsending-status-colors.js?v=20260807-2043");add(d,"bamaSharedStockScript","shared-stock-status.js?v=20260807-2043");add(d,"bamaLagerstatusLinkScript","lagerstatus-link.js?v=20260807-2043");hideStockOverview(d);tools(d);obs?.disconnect();obs=new MutationObserver(()=>requestAnimationFrame(()=>{resize();hideStockOverview(d);tools(d);scanText.textContent=tx().cam}));obs.observe(d.body,{childList:true,subtree:true});resize();scanText.textContent=tx().cam;setTimeout(openRequested,450)}
scan.onclick=goCamera;f.addEventListener("load",enhance);addEventListener("resize",resize);setInterval(()=>scanText.textContent=tx().cam,1000);
</script>
