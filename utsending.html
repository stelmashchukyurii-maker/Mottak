<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>UT — Lager og utsending</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020}#utCore{display:block;width:100%;min-height:100vh;border:0;background:#0b1020}#utFloatScan{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));z-index:99999;min-height:58px;padding:9px 16px;border:2px solid #f4c430;border-radius:999px;background:#f4c430;color:#17130a;font:950 15px Arial,sans-serif;box-shadow:0 14px 34px rgba(0,0,0,.48);touch-action:manipulation}#utHint{position:fixed;right:12px;bottom:82px;z-index:99998;display:none;max-width:min(330px,calc(100vw - 24px));padding:10px 12px;border:1px solid #303b59;border-radius:12px;background:#151c30;color:#f5f7ff;font:700 13px/1.4 Arial,sans-serif}#utHint.show{display:block}
</style>
</head>
<body>
<iframe id="utCore" src="utsending-core-v7.html?v=20260809-0004" title="UT — Lager og utsending"></iframe>
<button id="utFloatScan" type="button">📷 <span id="utFloatText">Kamera</span></button><div id="utHint"></div>
<script>
"use strict";
const VERSION="20260809-0004";
const f=document.getElementById("utCore"),scan=document.getElementById("utFloatScan"),scanText=document.getElementById("utFloatText"),hint=document.getElementById("utHint");
let hintTimer=0,openTries=0;
function resize(){try{const d=f.contentDocument;f.style.height=Math.max(innerHeight,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+"px"}catch{}}
function inject(d,src){return new Promise((resolve,reject)=>{const s=d.createElement("script");s.src=`${src}?v=${VERSION}`;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)})}
function lang(){try{return f.contentWindow.UT_LANG||localStorage.getItem("mottak_ut_language")||"nb"}catch{return"nb"}}
function tx(){return lang()==="uk"?{cam:"Камера",open:"Спочатку відкрийте потрібну рампу.",done:"Ця рампа вже завершена.",camera:"📷 Камера / телефон — сканувати на",bulk:"☑ Масове сканування"}:lang()==="pl"?{cam:"Aparat",open:"Najpierw otwórz właściwą rampę.",done:"Ta rampa jest już zakończona.",camera:"📷 Aparat / telefon — skanuj do",bulk:"☑ Skanowanie masowe"}:{cam:"Kamera",open:"Åpne først riktig rampe.",done:"Denne rampen er allerede avsluttet.",camera:"📷 Kamera / telefon — skann til",bulk:"☑ Masseskanning"}}
function order(){try{return typeof f.contentWindow.current==="function"?f.contentWindow.current():null}catch{return null}}
function note(text){clearTimeout(hintTimer);hint.textContent=text;hint.classList.add("show");hintTimer=setTimeout(()=>hint.classList.remove("show"),2600)}
function cameraUrl(o){return`ut-camera-v5.html?order=${encodeURIComponent(o.id)}&ramp=${encodeURIComponent(o.ramp||"")}&v=${VERSION}`}
function bulkUrl(o){return`ut-bulk.html?order=${encodeURIComponent(o.id)}&ramp=${encodeURIComponent(o.ramp||"")}&v=${VERSION}`}
function goCamera(){const o=order();if(!o)return note(tx().open);if(["completed","cancelled"].includes(o.status))return note(tx().done);location.href=cameraUrl(o)}
function hideOldStock(d){let s=d.getElementById("utHideOldStock");if(!s){s=d.createElement("style");s.id="utHideOldStock";s.textContent=".stock-card{display:none!important}";d.head.appendChild(s)}}
function tools(d){const box=d.getElementById("scanBox"),o=order();if(!box)return;d.querySelector('[data-mode="photo"]')?.classList.add("hidden");d.getElementById("photoPanel")?.classList.add("hidden");let wrap=d.getElementById("utFastTools");if(!wrap){wrap=d.createElement("div");wrap.id="utFastTools";wrap.style.cssText="display:grid;gap:9px;margin:0 0 13px";wrap.innerHTML='<button id="utDedicatedCameraButton" type="button"></button><button id="utBulkButton" type="button"></button>';box.insertAdjacentElement("beforebegin",wrap)}const c=d.getElementById("utDedicatedCameraButton"),b=d.getElementById("utBulkButton"),r=o?.ramp||"—",disabled=!o||["completed","cancelled"].includes(o.status);c.style.cssText="width:100%;min-height:64px;border:0;border-radius:14px;background:#f4c430;color:#17130a;font-weight:950;font-size:18px;touch-action:manipulation";b.style.cssText="width:100%;min-height:60px;border:2px solid #48d597;border-radius:14px;background:#163c32;color:#eafff6;font-weight:950;font-size:17px;touch-action:manipulation";c.textContent=`${tx().camera} RAMPE ${r}`;b.textContent=tx().bulk;c.disabled=b.disabled=disabled;c.onclick=goCamera;b.onclick=()=>{const x=order();if(x)location.href=bulkUrl(x)}}
function scrollToOpenedRamp(){try{resize();const d=f.contentDocument,w=f.contentWindow,detail=d.getElementById("detail");if(!detail||!detail.classList.contains("show"))return;requestAnimationFrame(()=>requestAnimationFrame(()=>{try{resize();const frameTop=f.getBoundingClientRect().top+window.scrollY;const innerTop=detail.getBoundingClientRect().top+(w.scrollY||0);window.scrollTo({top:Math.max(0,frameTop+innerTop-10),behavior:"smooth"})}catch{}}))}catch{}}
function afterRender(){try{const d=f.contentDocument,w=f.contentWindow;hideOldStock(d);tools(d);w.UT_LANGUAGE_APPLY?.();w.UT_PRODUCTION_ENHANCE?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();scanText.textContent=tx().cam;resize()}catch{}}
function patchCore(){const w=f.contentWindow;if(w.__BAMA_LIGHT_PATCH__)return;w.__BAMA_LIGHT_PATCH__=true;
  if(typeof w.openOrder==="function"){const original=w.openOrder;w.openOrder=async function(id){const result=await original.call(w,id,false);afterRender();setTimeout(scrollToOpenedRamp,60);return result}}
  if(typeof w.renderDetail==="function"){const original=w.renderDetail;w.renderDetail=function(...args){const result=original.apply(w,args);queueMicrotask(afterRender);return result}}
  if(typeof w.renderRamps==="function"){const original=w.renderRamps;w.renderRamps=function(...args){const result=original.apply(w,args);queueMicrotask(()=>{try{w.UT_LANGUAGE_APPLY?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();resize()}catch{}});return result}}
  if(typeof w.loadAll==="function"){const original=w.loadAll;w.loadAll=async function(...args){const result=await original.apply(w,args);try{await w.UT_PRODUCT_STOCK_REFRESH?.()}catch{}afterRender();return result}}
}
function openRequested(){const id=new URLSearchParams(location.search).get("open");if(!id)return;try{const w=f.contentWindow;if(typeof w.openOrder==="function"){w.openOrder(id);history.replaceState(null,"","utsending.html");return}}catch{}if(openTries++<20)setTimeout(openRequested,250)}
async function enhance(){const d=f.contentDocument;if(!d)return;try{
  f.contentWindow.BAMA_HOME_TARGET="utsending.html";
  d.querySelectorAll("a[href]").forEach(a=>a.target="_top");
  await inject(d,"utsending-production-flow.js");
  await inject(d,"utsending-language.js");
  await inject(d,"utsending-allowed-picker.js");
  await inject(d,"utsending-status-colors.js");
  await inject(d,"utsending-product-stock-v273.js");
  await inject(d,"utsending-compact-connection-v275.js");
  patchCore();
  hideOldStock(d);
  const v=d.querySelector(".version");if(v)v.innerHTML="UT Lager v27.13 · 3 STATUS<br>Oppdatert 09.08.2026 kl. 00:04";
  d.querySelector("#utLanguageSwitch")?.addEventListener("click",()=>setTimeout(()=>{scanText.textContent=tx().cam;afterRender()},0));
  afterRender();
  setTimeout(afterRender,250);
  setTimeout(openRequested,300);
}catch(error){note(`UT startfeil: ${error.message||error}`)}}
scan.addEventListener("click",goCamera,{passive:true});
f.addEventListener("load",enhance,{once:true});
addEventListener("resize",resize,{passive:true});
</script>
</body></html>
