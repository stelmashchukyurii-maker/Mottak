<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>UT — Bekreft rampe</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1020}
    #utCore{display:block;width:100%;min-height:100vh;border:0;background:#0b1020}
  </style>
</head>
<body>
<iframe id="utCore" src="utsending-core-v7.html?v=20260805-1049" title="UT — Bekreft rampe"></iframe>
<script>
"use strict";
const frame=document.getElementById("utCore");
let observer=null;
function resize(){try{const doc=frame.contentDocument;if(!doc)return;frame.style.height=Math.max(innerHeight,doc.documentElement.scrollHeight,doc.body?.scrollHeight||0)+"px"}catch{}}
function loadSharedStock(doc){
  if(doc.getElementById("bamaSharedStockScript"))return;
  frame.contentWindow.BAMA_HOME_TARGET="utsending.html";
  const shared=doc.createElement("script");
  shared.id="bamaSharedStockScript";
  shared.src="shared-stock-status.js?v=20260805-1049";
  doc.body.appendChild(shared);
}
function loadPicker(doc){
  if(doc.getElementById("utAllowedPickerModule")){loadSharedStock(doc);return}
  const picker=doc.createElement("script");
  picker.id="utAllowedPickerModule";
  picker.src="utsending-allowed-picker.js?v=20260804-2250";
  picker.onload=()=>loadSharedStock(doc);
  doc.body.appendChild(picker);
}
function enhance(){
  const doc=frame.contentDocument;
  if(!doc)return;
  const version=doc.querySelector(".version");
  if(version)version.innerHTML="UT Bekreftelse v13 FELLES LAGER<br>Oppdatert 05.08.2026 kl. 10:49";
  doc.querySelectorAll("a[href]").forEach(link=>link.target="_top");
  const existing=doc.getElementById("utGeminiModule");
  if(existing){
    loadPicker(doc);
  }else{
    const script=doc.createElement("script");
    script.id="utGeminiModule";
    script.src="utsending-photo-gemini.js?v=20260804-2240";
    script.onload=()=>loadPicker(doc);
    doc.body.appendChild(script);
  }
  observer?.disconnect();
  observer=new MutationObserver(()=>requestAnimationFrame(resize));
  observer.observe(doc.body,{childList:true,subtree:true});
  resize();
}
frame.addEventListener("load",enhance);
addEventListener("resize",resize);
</script>
</body>
</html>
