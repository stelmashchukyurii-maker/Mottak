<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>UT — Lager og utsending</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1020}
    #utCore{display:block;width:100%;min-height:100vh;border:0;background:#0b1020}
  </style>
</head>
<body>
<iframe id="utCore" src="utsending-core-v7.html?v=20260807-1230" title="UT — Lager og utsending"></iframe>
<script>
"use strict";
const frame=document.getElementById("utCore");
let observer=null;
function resize(){try{const doc=frame.contentDocument;if(!doc)return;frame.style.height=Math.max(innerHeight,doc.documentElement.scrollHeight,doc.body?.scrollHeight||0)+"px"}catch{}}
function addScript(doc,id,src,onload){
  if(doc.getElementById(id)){onload?.();return}
  const script=doc.createElement("script");
  script.id=id;
  script.src=src;
  if(onload)script.onload=onload;
  doc.body.appendChild(script);
}
function loadSharedStock(doc){
  addScript(doc,"bamaUpperNumberPolicy","upper-number-policy.js?v=20260806-1544");
  addScript(doc,"utStatusColors","utsending-status-colors.js?v=20260807-1230");
  if(!doc.getElementById("bamaSharedStockScript")){
    frame.contentWindow.BAMA_HOME_TARGET="utsending.html";
    const shared=doc.createElement("script");
    shared.id="bamaSharedStockScript";
    shared.src="shared-stock-status.js?v=20260806-1544";
    doc.body.appendChild(shared);
  }
  if(!doc.getElementById("bamaLagerstatusLinkScript")){
    const admin=doc.createElement("script");
    admin.id="bamaLagerstatusLinkScript";
    admin.src="lagerstatus-link.js?v=20260806-1544";
    doc.body.appendChild(admin);
  }
}
function loadPicker(doc){
  if(doc.getElementById("utAllowedPickerModule")){loadSharedStock(doc);return}
  const picker=doc.createElement("script");
  picker.id="utAllowedPickerModule";
  picker.src="utsending-allowed-picker.js?v=20260806-1544";
  picker.onload=()=>loadSharedStock(doc);
  doc.body.appendChild(picker);
}
function enhance(){
  const doc=frame.contentDocument;
  if(!doc)return;
  const version=doc.querySelector(".version");
  if(version)version.innerHTML="UT Lager v20 STATUS + IDÉBANK<br>Oppdatert 07.08.2026 kl. 12:30";
  doc.querySelectorAll("a[href]").forEach(link=>link.target="_top");
  addScript(doc,"utProductionFlow","utsending-production-flow.js?v=20260807-1052",()=>{
    addScript(doc,"utLanguageSwitch","utsending-language.js?v=20260807-1052");
  });
  const existing=doc.getElementById("utGeminiModule");
  if(existing){
    loadPicker(doc);
  }else{
    const script=doc.createElement("script");
    script.id="utGeminiModule";
    script.src="utsending-photo-gemini.js?v=20260806-1544";
    script.onload=()=>loadPicker(doc);
    doc.body.appendChild(script);
  }
  observer?.disconnect();
  observer=new MutationObserver(()=>requestAnimationFrame(resize));
  observer.observe(doc.body,{childList:true,subtree:true});
  resize();
}
frame.addEventListener("load",enhance);
addEventListener("resize",resize);
</script>
<script src="idebank-float.js?v=20260807-1230"></script>
</body>
</html>
