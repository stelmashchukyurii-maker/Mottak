<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151c30;--dark:#0d1426;--text:#f5f7ff;--muted:#aab4ce;--line:#303b59;--yellow:#f4c430;--green:#48d597;--red:#ff7373;--blue:#79b8ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{background:linear-gradient(180deg,#0b1020,#11182a)}main{width:min(720px,100%);margin:auto;padding:12px 11px 46px}.version{color:var(--muted);font-size:10px;text-align:center;margin:4px 0 8px}.topbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:0;z-index:40;padding:7px 0;background:rgba(11,16,32,.96)}.topbar button{min-height:58px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);font-size:16px;font-weight:1000}.topbar .test{border-color:var(--green);background:rgba(72,213,151,.1)}.topbar .work{border-color:var(--red);color:#ffd0d0}.langs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.lang{min-height:46px;border:2px solid var(--line);border-radius:13px;background:var(--dark);color:var(--muted);font-weight:1000;font-size:15px}.lang.active{border-color:var(--yellow);color:#fff3b0;background:rgba(244,196,48,.09)}.banner{padding:10px;border:1px solid var(--green);border-radius:14px;background:rgba(72,213,151,.06);color:#c9f7e2;text-align:center;font-size:11px;font-weight:900;line-height:1.4}.section{margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--card)}h1{margin:2px 0 3px;color:var(--yellow);font-size:clamp(28px,9vw,43px)}.sub{margin:0;color:var(--muted);font-size:11px;line-height:1.4}.sessionline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px;padding:9px 10px;border-radius:12px;background:var(--dark);font-size:11px}.sessionline b{color:var(--yellow)}button{font-family:inherit}.primary,.secondary,.danger,.manual{width:100%;min-height:58px;border:0;border-radius:15px;font-size:17px;font-weight:1000}.primary{background:var(--green);color:#062418}.secondary{background:#303b59;color:var(--text)}.danger{background:rgba(255,115,115,.16);border:2px solid var(--red);color:#ffd0d0}.manual{background:var(--yellow);color:#17130a}.scanbox{text-align:center;border:2px solid var(--green);background:rgba(72,213,151,.055)}.scanstate{margin:8px 0;padding:18px 6px;border:2px solid var(--yellow);border-radius:17px;background:var(--dark);color:var(--yellow);font-size:clamp(35px,12vw,62px);font-weight:1000;line-height:1}.scanstate.ready{border-color:var(--green);color:var(--green)}.scanstate.bad{border-color:var(--red);color:#ffb4b4}.last{margin-top:8px;color:var(--muted);font-size:10px;line-height:1.4}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.stat{padding:8px 4px;border:1px solid var(--line);border-radius:11px;background:var(--dark);text-align:center}.stat b{display:block;color:var(--yellow);font-size:19px}.stat span{font-size:9px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.journalHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.journalHead strong{color:var(--yellow)}#search{width:100%;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--dark);color:var(--text);font-size:16px}.filters{display:flex;gap:6px;overflow:auto}.filter{flex:1;min-width:82px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--dark);color:var(--muted);font-weight:900}.filter.active{border-color:var(--yellow);color:var(--yellow)}details.item{margin-top:7px;border:1px solid var(--line);border-radius:12px;background:var(--dark);overflow:hidden}details.item[open]{border-color:#52617f}.item summary{cursor:pointer;list-style:none;padding:11px;font-weight:900}.item summary::-webkit-details-marker{display:none}.rowtop{display:flex;justify-content:space-between;gap:8px}.rowtop .tag{font-family:monospace;color:#fff3b0;font-size:17px}.rowtop .what{color:#dfe7ff;font-size:12px;text-align:right}.meta{padding:0 11px 11px;color:var(--muted);font-size:10px;line-height:1.55;word-break:break-all}.empty{padding:16px;color:var(--muted);font-size:11px;text-align:center}.completed{border-color:var(--blue);background:rgba(121,184,255,.07)}.completed h2{margin:0;color:#bdddff}.back{display:block;margin-top:12px;text-align:center;color:var(--muted);font-size:11px;text-decoration:none}#nidInput{position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;opacity:0;border:0;padding:0}#modal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:10px;background:rgba(0,0,0,.86)}#modal.show{display:flex}.sheet{width:min(620px,100%);max-height:94vh;overflow:auto;padding:16px;border:2px solid var(--yellow);border-radius:20px;background:#111827}.kick{color:var(--muted);font-size:10px;font-weight:950}.bigTag{margin:4px 0 12px;font:1000 clamp(35px,13vw,58px)/1 monospace;color:var(--yellow)}.types{display:grid;grid-template-columns:1fr 1fr;gap:7px}.type{min-height:54px;padding:8px;border:2px solid var(--line);border-radius:12px;background:var(--dark);color:var(--text);font-size:12px;font-weight:1000}.type.active{border-color:var(--green);background:rgba(72,213,151,.09)}.counter{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--dark)}.counter label{display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:5px}.numrow{display:grid;grid-template-columns:52px 1fr 52px;gap:7px}.numrow button{border:0;border-radius:11px;background:#303b59;color:var(--text);font-size:27px;font-weight:1000}.numrow input{width:100%;min-height:54px;border:2px solid var(--yellow);border-radius:11px;background:#090e19;color:var(--text);font-size:30px;font-weight:1000;text-align:center}.calc{display:none;margin-top:10px}.calc.show{display:block}.calc input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#090e19;color:var(--text);font-size:21px}.calcResult{margin-top:5px;color:var(--yellow);font-weight:1000}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{min-height:58px;border:0;border-radius:13px;font-size:15px;font-weight:1000}.save{background:var(--green);color:#062418}.cancel{background:#303b59;color:var(--text)}.dup{color:#ffb4b4;font-weight:1000}@media(max-width:470px){.summary{grid-template-columns:1fr 1fr}.types{grid-template-columns:1fr 1fr}}
</style>

<body>
<main>
<div class="version">TEST · Florivo Inventering · Browser V0.2 · 14.08.2026 kl. 20:15 · Europe/Oslo</div>
<div class="topbar"><button class="test" id="testBtn">🧪 TEST</button><button class="work" id="workBtn">🏭 WORK · IKKE AKTIV</button></div>
<div class="langs"><button class="lang active" id="langNo">🇳🇴 Norsk</button><button class="lang" id="langUk">🇺🇦 Українська</button></div>
<div class="banner" id="banner"></div>
<section class="section">
<h1>📋 Inventering</h1><p class="sub" id="subtitle"></p>
<div class="sessionline"><span id="sessionLabel">Session</span><b id="sessionId">—</b></div>
<div id="startArea" style="margin-top:9px"><button class="primary" id="startBtn"></button></div>
</section>
<section class="section scanbox" id="scanSection" hidden>
<div class="scanstate" id="scanState">START</div>
<div class="sub" id="scanHelp"></div>
<div class="toolbar"><button class="manual" id="manualBtn"></button><button class="secondary" id="focusBtn">📡 RFID AKTIV</button></div>
<div class="last" id="last"></div>
<input id="nidInput" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true">
<div class="summary"><div class="stat"><b id="sAll">0</b><span id="labAll">ALLE</span></div><div class="stat"><b id="sRfid">0</b><span>RFID</span></div><div class="stat"><b id="sManual">0</b><span id="labManual">MANUELL</span></div><div class="stat"><b id="sHyller">0</b><span id="labHyller">HYLLER</span></div></div>
</section>
<section class="section" id="journalSection" hidden>
<div class="journalHead"><strong id="journalTitle"></strong><span id="countLabel">0</span></div>
<input id="search">
<div class="filters"><button class="filter active" data-filter="all" id="fAll">ALLE</button><button class="filter" data-filter="rfid">RFID</button><button class="filter" data-filter="manual" id="fManual">MANUELL</button></div>
<div id="journal"></div>
</section>
<section class="section" id="finishSection" hidden><button class="danger" id="finishBtn"></button></section>
<section class="section completed" id="completedSection" hidden><h2 id="completedTitle"></h2><div class="sub" id="completedText"></div><button class="secondary" id="newBtn" style="margin-top:10px"></button></section>
<a class="back" href="scanner-home.html" id="backLink"></a>
</main>
<div id="modal"><div class="sheet"><div class="kick" id="mKick">TEST · RFID</div><div class="bigTag" id="mTag">000000</div><div class="types" id="types"></div><div class="counter" id="counterBox"><label id="countLabelModal"></label><div class="numrow"><button id="minusBtn">−</button><input id="qty" type="number" min="0" step="1" value="0"><button id="plusBtn">+</button></div><div class="calc" id="calc"><label id="calcLabel"></label><input id="expr" inputmode="numeric" placeholder="10+10+3"><div class="calcResult" id="calcResult">= 0</div></div></div><div class="actions"><button class="save" id="saveBtn"></button><button class="cancel" id="cancelBtn"></button></div></div></div>
<script>
"use strict";
const STORE="florivo_inventory_test_sessions_v01",CURRENT="florivo_inventory_test_current_v01",LANGKEY="florivo_inventory_lang_v01";
const $=id=>document.getElementById(id);
const I18N={
no:{banner:"TEST DEFAULT · Ingen registrering på denne siden endrer WORK-lager. V0.2 lagrer testinventeringen bare i denne nettleseren.",subtitle:"Månedlig fysisk telling. Vi registrerer det vi faktisk ser; historisk produkt blokkerer ikke tellingen.",session:"Økt",start:"START TEST INVENTERING",resume:"FORTSETT TEST INVENTERING",scanStart:"Etter START venter Nordic ID på RFID.",scanReady:"Trykk kort på Nordic ID-triggeren.",manual:"+ MANUELL",last:"Siste handling: —",all:"ALLE",manualShort:"MANUELL",hyller:"HYLLER",journal:"TELT I DENNE INVENTERINGEN",search:"Søk brikke / MAN-nr.",finish:"AVSLUTT TEST INVENTERING",completed:"✅ INVENTERING FULLFØRT",newInv:"NY TEST INVENTERING",back:"← Nordic ID Scanner",workBlocked:"WORK er ikke aktivert for Inventering ennå. Ingen WORK-data endres.",already:"⚠ ALLEREDE TELT",duplicate:"Duplikat",rfidLength:"RFID må gi 24 HEX",received:"mottatt",calc:"Kalkulator, f.eks. 10+10+3",save:"✓ TELT",cancel:"AVBRYT",countH:"ANTALL HYLLER",countB:"ANTALL BUNNER",noCount:"INGEN ANTALL",empty:"Ingen registreringer ennå.",rfid:"RFID",manualRecord:"MANUELL",time:"Telt",epc:"EPC",confirmFinish:"Avslutte denne TEST-inventeringen? Etterpå kan den bare vises.",finishedAt:"Fullført",records:"registreringer",bunner:"Bunner",typeCombo:"1 Bunner + Hyller",typeBunner:"Bare 1 Bunner",typeStack:"Bunner stabel",typeVrakH:"Hyller vrak",typeVrakB:"Bunner vrak"},
uk:{banner:"TEST DEFAULT · Жоден запис цієї сторінки не змінює WORK-склад. V0.2 зберігає тестову інвентаризацію лише в цьому браузері.",subtitle:"Щомісячний фізичний підрахунок. Записуємо те, що реально бачимо; історичний продукт не блокує підрахунок.",session:"Сесія",start:"ПОЧАТИ TEST ІНВЕНТАРИЗАЦІЮ",resume:"ПРОДОВЖИТИ TEST ІНВЕНТАРИЗАЦІЮ",scanStart:"Після START Nordic ID чекає RFID.",scanReady:"Коротко натисни trigger Nordic ID.",manual:"+ ВРУЧНУ",last:"Остання дія: —",all:"ВСІ",manualShort:"ВРУЧНУ",hyller:"ПОЛИЦІ",journal:"ПОРАХОВАНО У ЦІЙ ІНВЕНТАРИЗАЦІЇ",search:"Пошук бірки / MAN-номера",finish:"ЗАВЕРШИТИ TEST ІНВЕНТАРИЗАЦІЮ",completed:"✅ ІНВЕНТАРИЗАЦІЮ ЗАВЕРШЕНО",newInv:"НОВА TEST ІНВЕНТАРИЗАЦІЯ",back:"← Nordic ID Scanner",workBlocked:"WORK для Inventering ще не активований. Жодні WORK-дані не змінюються.",already:"⚠ ВЖЕ ПОРАХОВАНО",duplicate:"Дубль",rfidLength:"RFID має дати 24 HEX",received:"отримано",calc:"Калькулятор, напр. 10+10+3",save:"✓ ПОРАХОВАНО",cancel:"СКАСУВАТИ",countH:"КІЛЬКІСТЬ ПОЛИЦЬ",countB:"КІЛЬКІСТЬ BUNNER",noCount:"БЕЗ КІЛЬКОСТІ",empty:"Поки немає записів.",rfid:"RFID",manualRecord:"ВРУЧНУ",time:"Пораховано",epc:"EPC",confirmFinish:"Завершити цю TEST-інвентаризацію? Після цього вона буде лише для перегляду.",finishedAt:"Завершено",records:"записів",bunner:"Bunner",typeCombo:"1 Bunner + Hyller",typeBunner:"Тільки 1 Bunner",typeStack:"Стопка Bunner",typeVrakH:"Hyller vrak",typeVrakB:"Bunner vrak"}
};
let lang=localStorage.getItem(LANGKEY)==="uk"?"uk":"no",session=null,pending=null,selectedType="combo",filter="all",commitTimer=0;
const t=k=>I18N[lang][k]||k;
function typeDefs(){return {combo:{label:t("typeCombo"),count:"hyller"},bunner:{label:t("typeBunner"),count:"none"},stack:{label:t("typeStack"),count:"bunner",def:10},vrak_h:{label:t("typeVrakH"),count:"hyller"},vrak_b:{label:t("typeVrakB"),count:"bunner"}}}
function setLang(next){lang=next==="uk"?"uk":"no";localStorage.setItem(LANGKEY,lang);document.documentElement.lang=lang==="uk"?"uk":"no";applyLang();render()}
function applyLang(){$("langNo").classList.toggle("active",lang==="no");$("langUk").classList.toggle("active",lang==="uk");$("banner").textContent=t("banner");$("subtitle").textContent=t("subtitle");$("sessionLabel").textContent=t("session");$("manualBtn").textContent=t("manual");$("labAll").textContent=t("all");$("labManual").textContent=t("manualShort");$("labHyller").textContent=t("hyller");$("journalTitle").textContent=t("journal");$("search").placeholder=t("search");$("fAll").textContent=t("all");$("fManual").textContent=t("manualShort");$("finishBtn").textContent=t("finish");$("completedTitle").textContent=t("completed");$("newBtn").textContent=t("newInv");$("backLink").textContent=t("back");$("calcLabel").textContent=t("calc");$("saveBtn").textContent=t("save");$("cancelBtn").textContent=t("cancel");if(!session)$("startBtn").textContent=t("start")}
function loadAll(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch{return[]}}
function saveAll(list){localStorage.setItem(STORE,JSON.stringify(list))}
function persist(){if(!session)return;const all=loadAll(),i=all.findIndex(x=>x.id===session.id);if(i>=0)all[i]=session;else all.push(session);saveAll(all);localStorage.setItem(CURRENT,session.id)}
function loadCurrent(){const id=localStorage.getItem(CURRENT);if(!id)return null;return loadAll().find(x=>x.id===id)||null}
function newSession(){const now=new Date(),stamp=now.toISOString().replace(/[-:TZ.]/g,"").slice(0,12);session={id:"INV-TEST-"+stamp,status:"open",startedAt:now.toISOString(),completedAt:null,records:[]};persist();render();arm()}
function normalize(v){return String(v||"").toUpperCase().replace(/[^0-9A-F]/g,"").slice(0,24)}
function tagOf(epc){return epc.slice(-6)}
function hideKb(){try{navigator.virtualKeyboard?.hide?.()}catch{}}
function arm(){if(!session||session.status!=="open"||pending)return;const n=$("nidInput");n.value="";try{n.focus({preventScroll:true})}catch{n.focus()}hideKb();$("scanState").textContent="READY";$("scanState").className="scanstate ready";$("scanHelp").textContent=t("scanReady")}
function setBad(html){$("scanState").textContent="STOP";$("scanState").className="scanstate bad";$("scanHelp").innerHTML=html}
function onEpc(raw){if(!session||session.status!=="open"||pending)return;const epc=normalize(raw);if(epc.length!==24){setBad(`${t("rfidLength")} · ${t("received")}: ${epc.length}`);setTimeout(arm,1100);return}const tag=tagOf(epc);const dup=session.records.find(r=>r.epc===epc||(!r.manual&&r.tag===tag));if(dup){setBad(`<span class="dup">${t("already")}</span><br>${tag} · ${describe(dup)}`);$("last").textContent=`${t("duplicate")}: ${tag}`;setTimeout(arm,1800);return}openEditor({manual:false,epc,tag})}
function manualNumber(){let max=0;for(const r of session.records){const m=/^MAN-(\d+)$/.exec(r.tag||"");if(m)max=Math.max(max,+m[1])}return "MAN-"+String(max+1).padStart(3,"0")}
function openEditor(base){pending={...base};selectedType="combo";$("mKick").textContent=base.manual?`TEST · ${t("manualRecord")}`:"TEST · RFID";$("mTag").textContent=base.tag;renderTypes();$("qty").value=0;$("expr").value="";$("calcResult").textContent="= 0";$("calc").classList.toggle("show",!!base.manual);updateCounter();$("modal").classList.add("show");try{$("nidInput").blur()}catch{}hideKb()}
function closeEditor(){pending=null;$("modal").classList.remove("show");setTimeout(arm,80)}
function renderTypes(){const defs=typeDefs();$("types").innerHTML=Object.entries(defs).map(([id,d])=>`<button class="type${selectedType===id?" active":""}" data-type="${id}">${d.label}</button>`).join("")}
function updateCounter(){const d=typeDefs()[selectedType];$("counterBox").style.display=d.count==="none"?"none":"block";$("countLabelModal").textContent=d.count==="bunner"?t("countB"):d.count==="hyller"?t("countH"):t("noCount");if(d.def!=null&&+$("qty").value===0)$("qty").value=d.def}
function calcExpr(){const s=$("expr").value.replace(/[^0-9+]/g,"");if(!s){$("calcResult").textContent="= 0";return}const nums=s.split("+").filter(Boolean).map(Number),sum=nums.reduce((a,b)=>a+b,0);$("calcResult").textContent=`= ${sum}`;if(nums.length)$("qty").value=sum}
function saveRecord(){if(!pending||!session||session.status!=="open")return;const d=typeDefs()[selectedType],qty=Math.max(0,parseInt($("qty").value||"0",10));let bunner=0,hyller=0;if(selectedType==="combo"){bunner=1;hyller=qty}else if(selectedType==="bunner"){bunner=1}else if(selectedType==="stack"||selectedType==="vrak_b"){bunner=qty}else if(selectedType==="vrak_h"){hyller=qty}const r={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),manual:!!pending.manual,tag:pending.tag,epc:pending.epc||"",type:selectedType,typeLabelNo:I18N.no[{combo:"typeCombo",bunner:"typeBunner",stack:"typeStack",vrak_h:"typeVrakH",vrak_b:"typeVrakB"}[selectedType]],bunner,hyller,qty,countKind:d.count,teltAt:new Date().toISOString()};session.records.push(r);persist();$("last").textContent=`${r.tag} · ${describe(r)}`;closeEditor();render()}
function describe(r){let label=typeDefs()[r.type]?.label||r.typeLabelNo||r.type;if(r.type==="combo")return `${label} · ${r.hyller}`;if(r.type==="bunner")return label;if(r.type==="stack"||r.type==="vrak_b")return `${label} · ${r.bunner}`;if(r.type==="vrak_h")return `${label} · ${r.hyller}`;return label}
function totalBunner(){return session?session.records.reduce((s,r)=>s+(r.bunner||0),0):0}
function totalHyller(){return session?session.records.reduce((s,r)=>s+(r.hyller||0),0):0}
function renderJournal(){if(!session)return;const q=$("search").value.trim().toLowerCase();let rows=session.records.filter(r=>(filter==="all"||(filter==="rfid"&&!r.manual)||(filter==="manual"&&r.manual)));if(q)rows=rows.filter(r=>(r.tag+" "+r.epc+" "+describe(r)).toLowerCase().includes(q));$("journal").innerHTML=rows.length?rows.slice().reverse().map(r=>`<details class="item"><summary><div class="rowtop"><span class="tag">${r.tag}</span><span class="what">${describe(r)}</span></div></summary><div class="meta">${r.manual?t("manualRecord"):t("rfid")}<br>${t("time")}: ${new Date(r.teltAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}${r.epc?`<br>${t("epc")}: ${r.epc}`:""}</div></details>`).join(""):`<div class="empty">${t("empty")}</div>`}
function render(){applyLang();const open=!!session&&session.status==="open",done=!!session&&session.status==="completed";$("sessionId").textContent=session?.id||"—";$("startArea").hidden=!!session;$("startBtn").textContent=t("start");$("scanSection").hidden=!open;$("journalSection").hidden=!session;$("finishSection").hidden=!open;$("completedSection").hidden=!done;if(open&&$("scanState").textContent==="START")$("scanHelp").textContent=t("scanReady");if(session){const rec=session.records||[];$("sAll").textContent=rec.length;$("sRfid").textContent=rec.filter(r=>!r.manual).length;$("sManual").textContent=rec.filter(r=>r.manual).length;$("sHyller").textContent=totalHyller();$("countLabel").textContent=rec.length;renderJournal()}if(done){$("completedText").innerHTML=`${t("finishedAt")}: ${new Date(session.completedAt).toLocaleString()}<br>${session.records.length} ${t("records")} · ${t("bunner")}: ${totalBunner()} · ${t("hyller")}: ${totalHyller()}`}}
function finish(){if(!session||session.status!=="open")return;if(!confirm(t("confirmFinish")))return;session.status="completed";session.completedAt=new Date().toISOString();persist();render();try{$("nidInput").blur()}catch{}}
$("langNo").onclick=()=>setLang("no");$("langUk").onclick=()=>setLang("uk");$("testBtn").onclick=()=>{};$("workBtn").onclick=()=>alert(t("workBlocked"));$("startBtn").onclick=newSession;$("manualBtn").onclick=()=>openEditor({manual:true,tag:manualNumber(),epc:""});$("focusBtn").onclick=arm;$("finishBtn").onclick=finish;$("newBtn").onclick=()=>{localStorage.removeItem(CURRENT);session=null;$("scanState").textContent="START";render()};$("cancelBtn").onclick=closeEditor;$("saveBtn").onclick=saveRecord;$("minusBtn").onclick=()=>$("qty").value=Math.max(0,+$("qty").value-1);$("plusBtn").onclick=()=>$("qty").value=Math.max(0,+$("qty").value+1);$("expr").addEventListener("input",calcExpr);$("types").onclick=e=>{const b=e.target.closest("[data-type]");if(!b)return;selectedType=b.dataset.type;renderTypes();$("qty").value=0;updateCounter()};$("search").addEventListener("input",renderJournal);document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));renderJournal()});
const input=$("nidInput");input.addEventListener("input",()=>{clearTimeout(commitTimer);commitTimer=setTimeout(()=>{const v=input.value;input.value="";if(v)onEpc(v)},120)});input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(commitTimer);const v=input.value;input.value="";if(v)onEpc(v)}});
addEventListener("pageshow",()=>{applyLang();if(session?.status==="open")setTimeout(arm,120)});
session=loadCurrent();if(session&&!session.records)session.records=[];applyLang();render();if(session?.status==="open")setTimeout(arm,120);
</script>
