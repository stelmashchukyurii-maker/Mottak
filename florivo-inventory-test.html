function applyLang(){document.documentElement.lang=lang;$('langNo').classList.toggle('active',lang==='no');$('langUk').classList.toggle('active',lang==='uk');$('pageTitle').textContent=t('title');$('banner').textContent=t('banner');$('subtitle').textContent=t('subtitle');$('sessionLabel').textContent=t('session');$('startBtn').textContent=t('start');$('workBtn').textContent=t('work');$('productTitle').textContent=t('productTitle');$('productHint').textContent=t('productHint');$('manualBtn').textContent=t('manual');$('focusBtn').textContent=t('focus');$('labAll').textContent=t('all');$('labManual').textContent=t('manualShort');$('labHyller').textContent=t('hyller');$('labLong').textContent=t('longShort');$('labShort').textContent=t('shortShort');$('journalTitle').textContent=t('journal');$('search').placeholder=t('search');$('fAll').textContent=t('all');$('fManual').textContent=t('manualShort');$('finishBtn').textContent=t('finish');$('completedTitle').textContent=t('completed');$('newBtn').textContent=t('newInv');$('backLink').textContent=t('back');$('calcLabel').textContent=t('calc');$('saveBtn').textContent=t('save');$('cancelBtn').textContent=t('cancel');renderMainTypes();if(pending){renderModalTypes();updateCounter(false)}setScan(stateMode,stateExtra);if(session)renderJournal()}
function setLang(x){lang=x==='uk'?'uk':'no';localStorage.setItem(LANGKEY,lang);stateExtra='';applyLang();render()}
function newSession(){const n=new Date(),stamp=n.toISOString().replace(/[-:TZ.]/g,'').slice(0,12);session={id:'INV-TEST-'+stamp,status:'open',startedAt:n.toISOString(),completedAt:null,records:[]};persist();render();disarm()}function manualNumber(){let m=0;for(const r of session.records){const x=/^MAN-(\d+)$/.exec(r.tag||'');if(x)m=Math.max(m,+x[1])}return 'MAN-'+String(m+1).padStart(3,'0')}
function disarm(){clearTimeout(armTimer);clearTimeout(idleTimer);clearTimeout(globalTimer);globalBuffer='';const input=$('nidInput');input.value='';input.readOnly=true;try{input.blur()}catch{}hideKb();if(session?.status==='open'&&!pending)setScan('ready')}
function arm(){if(!session||session.status!=='open'||pending)return;clearTimeout(armTimer);clearTimeout(idleTimer);globalBuffer='';const input=$('nidInput');input.value='';input.readOnly=false;try{input.focus({preventScroll:true})}catch{input.focus()}hideKb();setScan('scan');armTimer=setTimeout(()=>{if(!input.value&&!pending){input.readOnly=true;try{input.blur()}catch{}hideKb();setScan('ready')}},ARM_MS)}
function commitValue(raw){if(!session||session.status!=='open'||pending)return;const input=$('nidInput');clearTimeout(armTimer);clearTimeout(idleTimer);clearTimeout(globalTimer);input.value='';input.readOnly=true;try{input.blur()}catch{}hideKb();const epc=normalize(raw);if(performance.now()<lockUntil)return;lockUntil=performance.now()+LOCK_MS;if(epc.length!==24){setScan('bad',`${t('rfidLength')} · ${t('received')}: ${epc.length}`);setTimeout(disarm,1200);return}onEpc(epc)}function commitGlobal(){const v=globalBuffer;globalBuffer='';if(v)commitValue(v)}
function onEpc(epc){const tag=tagOf(epc),dup=session.records.find(r=>r.epc===epc||(!r.manual&&r.tag===tag));if(dup){setScan('bad',`<span class='dup'>${t('already')}</span><br>${tag} · ${describe(dup)}`);setTimeout(disarm,1800);return}openEditor({manual:false,epc,tag})}
function openEditor(base){if(!session||session.status!=='open')return;pending={...base};editType=base.manual?'no_tag':selectedType;const input=$('nidInput');input.readOnly=true;try{input.blur()}catch{}hideKb();$('mKick').textContent=base.manual?`TEST · ${t('manualRecord')}`:'TEST · RFID';$('mTag').textContent=base.tag;$('expr').value='';$('calcResult').textContent='= 0';$('sheet').classList.toggle('largeSheet',!base.manual&&isLarge(editType));renderModalTypes();updateCounter(true);$('modal').classList.add('show')}
function closeEditor(){pending=null;$('modal').classList.remove('show');$('sheet').classList.remove('largeSheet');disarm()}
function updateCounter(reset){const d=typeDef(editType);$('counterBox').style.display=d.count==='none'?'none':'block';$('countLabelModal').textContent=d.count==='bunner'?t('countB'):d.count==='forlengere'?t('countF'):t('countH');if(reset&&d.count!=='none')$('qty').value=d.def;const showQuick=!pending?.manual&&isLarge(editType);$('presets').classList.toggle('show',showQuick);$('miniPresets').classList.toggle('show',!pending?.manual&&editType==='combo');if(showQuick){const vals=editType==='combo'?[30,60]:[15,16];$('presetA').textContent=vals[0];$('presetA').dataset.preset=vals[0];$('presetB').textContent=vals[1];$('presetB').dataset.preset=vals[1]}$('calc').classList.toggle('show',!!pending?.manual&&d.count!=='none')}
function calcExpr(){const p=$('expr').value.replace(/[^0-9+]/g,'').split('+').filter(Boolean),n=p.reduce((s,x)=>s+(parseInt(x,10)||0),0);$('calcResult').textContent='= '+n;if(p.length)$('qty').value=n}
function saveRecord(){if(!pending||!session||session.status!=='open')return;const d=typeDef(editType),qty=d.count==='none'?1:Math.max(0,parseInt($('qty').value,10)||0);let bunner=0,hyller=0,forlengere=0;if(editType==='combo'){bunner=1;hyller=qty}else if(editType==='bunner')bunner=1;else if(editType==='stack'||editType==='vrak_b'||editType==='no_tag')bunner=qty;else if(editType==='vrak_h'){bunner=1;hyller=qty}else if(isExt(editType))forlengere=qty;const r={id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),manual:!!pending.manual,tag:pending.tag,epc:pending.epc||'',type:editType,qty,bunner,hyller,forlengere,teltAt:new Date().toISOString()};session.records.push(r);persist();pending=null;$('modal').classList.remove('show');$('sheet').classList.remove('largeSheet');render();setScan('saved',`${t('saved')}: ${r.tag} · ${describe(r)}`);setTimeout(disarm,900)}
function describe(r){if(r.type==='combo')return `${typeLabel('combo')} · ${r.hyller}`;if(r.type==='bunner')return typeLabel('bunner');if(r.type==='stack')return `${typeLabel('stack')} · ${r.bunner}`;if(r.type==='vrak_h')return `${typeLabel('vrak_h')} · ${r.hyller}`;if(r.type==='vrak_b')return `${typeLabel('vrak_b')} · ${r.bunner}`;if(r.type==='forl_long'||r.type==='forl_short')return `${typeLabel(r.type)} · ${r.forlengere||r.qty||0} stk.`;if(r.type==='no_tag')return `${typeLabel('no_tag')} · ${r.bunner}`;return r.type}
function totalBunner(){return session?session.records.reduce((s,r)=>s+(r.bunner||0),0):0}function totalHyller(){return session?session.records.reduce((s,r)=>s+(r.hyller||0),0):0}function totalType(type){return session?session.records.filter(r=>r.type===type).reduce((s,r)=>s+(r.forlengere||r.qty||0),0):0}
function renderJournal(){if(!session)return;const q=$('search').value.trim().toLowerCase();let rows=session.records.filter(r=>filter==='all'||(filter==='rfid'&&!r.manual)||(filter==='manual'&&r.manual));if(q)rows=rows.filter(r=>(r.tag+' '+r.epc+' '+describe(r)).toLowerCase().includes(q));$('journal').innerHTML=rows.length?rows.slice().reverse().map(r=>`<details class='item'><summary><div class='rowtop'><span class='tag'>${r.tag}</span><span class='what'>${describe(r)}</span></div></summary><div class='meta'>${r.manual?t('manualRecord'):t('rfid')}<br>${t('time')}: ${new Date(r.teltAt).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'})}${r.epc?`<br>${t('epc')}: ${r.epc}`:''}</div></details>`).join(''):`<div class='empty'>${t('empty')}</div>`}
function render(){applyLang();const open=!!session&&session.status==='open',done=!!session&&session.status==='completed';$('sessionId').textContent=session?.id||'—';$('startArea').hidden=!!session;$('productSection').hidden=!open;$('scanSection').hidden=!open;$('journalSection').hidden=!session;$('finishSection').hidden=!open;$('completedSection').hidden=!done;if(session){const rec=session.records||[];$('sAll').textContent=rec.length;$('sRfid').textContent=rec.filter(r=>!r.manual).length;$('sManual').textContent=rec.filter(r=>r.manual).length;$('sHyller').textContent=totalHyller();$('sLong').textContent=totalType('forl_long');$('sShort').textContent=totalType('forl_short');$('countLabel').textContent=rec.length;const last=rec[rec.length-1];$('last').textContent=last?`${t('lastPrefix')}: ${last.tag} · ${describe(last)}`:t('last');renderJournal()}else $('last').textContent=t('last');if(done)$('completedText').innerHTML=`${t('finishedAt')}: ${new Date(session.completedAt).toLocaleString(locale())}<br>${session.records.length} ${t('records')} · ${t('bunner')}: ${totalBunner()} · ${t('hyller')}: ${totalHyller()}<br>${typeLabel('forl_long')}: ${totalType('forl_long')} · ${typeLabel('forl_short')}: ${totalType('forl_short')}`;if(open&&!pending&&stateMode==='start')setScan('ready')}
function finish(){if(!session||session.status!=='open')return;if(!confirm(t('confirmFinish')))return;session.status='completed';session.completedAt=new Date().toISOString();persist();disarm();render()}
$('langNo').onclick=()=>setLang('no');$('langUk').onclick=()=>setLang('uk');$('workBtn').onclick=()=>alert(t('workBlocked'));$('startBtn').onclick=newSession;$('manualBtn').onclick=()=>openEditor({manual:true,tag:manualNumber(),epc:''});$('focusBtn').onclick=arm;$('finishBtn').onclick=finish;$('newBtn').onclick=()=>{localStorage.removeItem(CURRENT);session=null;stateMode='start';stateExtra='';render()};$('cancelBtn').onclick=closeEditor;$('saveBtn').onclick=saveRecord;$('minusBtn').onclick=()=>$('qty').value=Math.max(0,+$('qty').value-1);$('plusBtn').onclick=()=>$('qty').value=Math.max(0,+$('qty').value+1);$('miniPresets').onclick=e=>{const b=e.target.closest('[data-mini]');if(b)$('qty').value=b.dataset.mini};$('presets').onclick=e=>{const b=e.target.closest('[data-preset]');if(b)$('qty').value=b.dataset.preset};$('expr').addEventListener('input',calcExpr);$('mainTypes').onclick=e=>{const b=e.target.closest('[data-type]');if(b)chooseMainType(b.dataset.type)};$('modalTypes').onclick=e=>{const b=e.target.closest('[data-type]');if(b)chooseModalType(b.dataset.type)};$('search').addEventListener('input',renderJournal);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderJournal()});
const input=$('nidInput');document.addEventListener('keydown',e=>{if(!session||session.status!=='open'||pending)return;const target=e.target;if(e.key==='Unidentified'){arm();return}if((e.key==='Enter'||e.key==='Tab')&&!input.readOnly&&input.value){e.preventDefault();commitValue(input.value);return}if((e.key==='Enter'||e.key==='Tab')&&globalBuffer){e.preventDefault();commitGlobal();return}const editable=target&&target!==input&&(target.matches?.('input,textarea,select')||target.isContentEditable);if(!editable&&input.readOnly&&/^[0-9a-fA-F]$/.test(e.key)){e.preventDefault();globalBuffer=(globalBuffer+e.key).toUpperCase().slice(0,24);setScan('scan');clearTimeout(globalTimer);if(globalBuffer.length>=24){commitGlobal();return}globalTimer=setTimeout(()=>{if(globalBuffer)commitGlobal()},IDLE_MS)}},true);
input.addEventListener('input',()=>{input.value=normalize(input.value);clearTimeout(idleTimer);if(input.value.length>=24){commitValue(input.value);return}idleTimer=setTimeout(()=>{if(input.value)commitValue(input.value)},IDLE_MS)});
addEventListener('pageshow',()=>{hideKb();setTimeout(hideKb,80);setTimeout(hideKb,300);if(session?.status==='open'&&!pending)disarm()});
session=loadCurrent();if(session&&!session.records)session.records=[];applyLang();render();if(session?.status==='open')disarm();else setScan('start');
</script>
