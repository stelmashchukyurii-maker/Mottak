};
let lang=localStorage.getItem(LANGKEY)==="uk"?"uk":"no",session=null,pending=null,selectedType="combo",filter="all",idleTimer=0,armTimer=0,lockUntil=0,globalBuffer="",globalTimer=0,stateMode="start",stateExtra="";
function t(k){return I18N[lang][k]||k}
function typeLabel(type){return t({combo:"typeCombo",bunner:"typeBunner",stack:"typeStack",vrak_h:"typeVrakH",vrak_b:"typeVrakB"}[type]||"typeCombo")}
function typeDef(type){return {combo:{count:"hyller",def:0},bunner:{count:"none",def:1},stack:{count:"bunner",def:10},vrak_h:{count:"hyller",def:0},vrak_b:{count:"bunner",def:1}}[type]}
function loadAll(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch{return[]}}
function saveAll(list){localStorage.setItem(STORE,JSON.stringify(list))}
function persist(){if(!session)return;const all=loadAll(),i=all.findIndex(x=>x.id===session.id);if(i>=0)all[i]=session;else all.push(session);saveAll(all);localStorage.setItem(CURRENT,session.id)}

function setLang(next){lang=next==="uk"?"uk":"no";localStorage.setItem(LANGKEY,lang);stateExtra="";applyLang();render()}
function newSession(){const now=new Date(),stamp=now.toISOString().replace(/[-:TZ.]/g,"").slice(0,12);session={id:"INV-TEST-"+stamp,status:"open",startedAt:now.toISOString(),completedAt:null,records:[]};persist();render();disarm()}

function disarm(){clearTimeout(armTimer);clearTimeout(idleTimer);clearTimeout(globalTimer);globalBuffer="";const input=$("nidInput");input.value="";input.readOnly=true;try{input.blur()}catch{}hideKb();if(session?.status==="open"&&!pending)setScan("ready")}
function arm(){if(!session||session.status!=="open"||pending)return;clearTimeout(armTimer);clearTimeout(idleTimer);globalBuffer="";const input=$("nidInput");input.value="";input.readOnly=false;try{input.focus({preventScroll:true})}catch{input.focus()}hideKb();setScan("scan");armTimer=setTimeout(()=>{if(!input.value&&!pending){input.readOnly=true;try{input.blur()}catch{}hideKb();setScan("ready")}},ARM_MS)}
function commitValue(raw){if(!session||session.status!=="open"||pending)return;const input=$("nidInput");clearTimeout(armTimer);clearTimeout(idleTimer);clearTimeout(globalTimer);input.value="";input.readOnly=true;try{input.blur()}catch{}hideKb();const epc=normalize(raw);if(performance.now()<lockUntil)return;lockUntil=performance.now()+LOCK_MS;if(epc.length!==24){setScan("bad",`${t("rfidLength")} · ${t("received")}: ${epc.length}`);setTimeout(disarm,1200);return}onEpc(epc)}

function saveRecord(){if(!pending||!session||session.status!=="open")return;const d=typeDef(selectedType),qty=d.count==="none"?1:Math.max(0,parseInt($("qty").value,10)||0);let bunner=0,hyller=0;if(selectedType==="combo"){bunner=1;hyller=qty}else if(selectedType==="bunner"){bunner=1}else if(selectedType==="stack"){bunner=qty}else if(selectedType==="vrak_h"){bunner=1;hyller=qty}else if(selectedType==="vrak_b"){bunner=qty}const r={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()),manual:!!pending.manual,tag:pending.tag,epc:pending.epc||"",type:selectedType,qty,bunner,hyller,teltAt:new Date().toISOString()};session.records.push(r);persist();pending=null;$("modal").classList.remove("show");render();setScan("saved",`${t("saved")}: ${r.tag} · ${describe(r)}`);setTimeout(disarm,900)}
function describe(r){if(r.type==="combo")return `${typeLabel("combo")} · ${r.hyller}`;if(r.type==="bunner")return typeLabel("bunner");if(r.type==="stack")return `${typeLabel("stack")} · ${r.bunner}`;if(r.type==="vrak_h")return `${typeLabel("vrak_h")} · ${r.hyller}`;if(r.type==="vrak_b")return `${typeLabel("vrak_b")} · ${r.bunner}`;return r.type}
function totalBunner(){return session?session.records.reduce((s,r)=>s+(r.bunner||0),0):0}
function totalHyller(){return session?session.records.reduce((s,r)=>s+(r.hyller||0),0):0}
function renderJournal(){if(!session)return;const q=$("search").value.trim().toLowerCase();let rows=session.records.filter(r=>filter==="all"||(filter==="rfid"&&!r.manual)||(filter==="manual"&&r.manual));if(q)rows=rows.filter(r=>(r.tag+" "+r.epc+" "+describe(r)).toLowerCase().includes(q));$("journal").innerHTML=rows.length?rows.slice().reverse().map(r=>`<details class="item"><summary><div class="rowtop"><span class="tag">${r.tag}</span><span class="what">${describe(r)}</span></div></summary><div class="meta">${r.manual?t("manualRecord"):t("rfid")}<br>${t("time")}: ${new Date(r.teltAt).toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"})}${r.epc?`<br>${t("epc")}: ${r.epc}`:""}</div></details>`).join(""):`<div class="empty">${t("empty")}</div>`}
function render(){applyLang();const open=!!session&&session.status==="open",done=!!session&&session.status==="completed";$("sessionId").textContent=session?.id||"—";$("startArea").hidden=!!session;$("scanSection").hidden=!open;$("journalSection").hidden=!session;$("finishSection").hidden=!open;$("completedSection").hidden=!done;if(session){const rec=session.records||[];$("sAll").textContent=rec.length;$("sRfid").textContent=rec.filter(r=>!r.manual).length;$("sManual").textContent=rec.filter(r=>r.manual).length;$("sHyller").textContent=totalHyller();$("countLabel").textContent=rec.length;const lastRec=rec[rec.length-1];$("last").textContent=lastRec?`${t("lastPrefix")}: ${lastRec.tag} · ${describe(lastRec)}`:t("last");renderJournal()}else{$("last").textContent=t("last")}if(done)$("completedText").innerHTML=`${t("finishedAt")}: ${new Date(session.completedAt).toLocaleString(locale())}<br>${session.records.length} ${t("records")} · ${t("bunner")}: ${totalBunner()} · ${t("hyller")}: ${totalHyller()}`;if(open&&!pending&&stateMode==="start")setScan("ready")}
function finish(){if(!session||session.status!=="open")return;if(!confirm(t("confirmFinish")))return;session.status="completed";session.completedAt=new Date().toISOString();persist();disarm();render()}
$("langNo").onclick=()=>setLang("no");$("langUk").onclick=()=>setLang("uk");$("testBtn").onclick=()=>{};$("workBtn").onclick=()=>alert(t("workBlocked"));$("startBtn").onclick=newSession;$("manualBtn").onclick=()=>openEditor({manual:true,tag:manualNumber(),epc:""});$("focusBtn").onclick=()=>{arm()};$("finishBtn").onclick=finish;$("newBtn").onclick=()=>{localStorage.removeItem(CURRENT);session=null;stateMode="start";stateExtra="";render()};$("cancelBtn").onclick=closeEditor;$("saveBtn").onclick=saveRecord;$("minusBtn").onclick=()=>$("qty").value=Math.max(0,+$("qty").value-1);$("plusBtn").onclick=()=>$("qty").value=Math.max(0,+$("qty").value+1);$("expr").addEventListener("input",calcExpr);$("types").onclick=e=>{const b=e.target.closest("[data-type]");if(!b)return;selectedType=b.dataset.type;renderTypes();updateCounter()};$("search").addEventListener("input",renderJournal);document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));renderJournal()});
const input=$("nidInput");
document.addEventListener("keydown",e=>{if(!session||session.status!=="open"||pending)return;const target=e.target;if(e.key==="Unidentified"){arm();return}if((e.key==="Enter"||e.key==="Tab")&&!input.readOnly&&input.value){e.preventDefault();commitValue(input.value);return}if((e.key==="Enter"||e.key==="Tab")&&globalBuffer){e.preventDefault();commitGlobal();return}const editable=target&&target!==input&&(target.matches?.("input,textarea,select")||target.isContentEditable);if(!editable&&input.readOnly&&/^[0-9a-fA-F]$/.test(e.key)){e.preventDefault();globalBuffer=(globalBuffer+e.key).toUpperCase().slice(0,24);setScan("scan");clearTimeout(globalTimer);if(globalBuffer.length>=24){commitGlobal();return}globalTimer=setTimeout(()=>{if(globalBuffer)commitGlobal()},IDLE_MS)}},true);
input.addEventListener("input",()=>{input.value=normalize(input.value);clearTimeout(idleTimer);if(input.value.length>=24){commitValue(input.value);return}idleTimer=setTimeout(()=>{if(input.value)commitValue(input.value)},IDLE_MS)});
addEventListener("pageshow",()=>{hideKb();setTimeout(hideKb,80);setTimeout(hideKb,300);if(session?.status==="open"&&!pending)disarm()});
session=loadCurrent();if(session&&!session.records)session.records=[];applyLang();render();if(session?.status==="open")disarm();else setScan("start");
</script>
</body>
