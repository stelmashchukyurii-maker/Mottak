<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Nordic ID v1.3 — Scan Table</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:10px;font-family:Arial,Helvetica,sans-serif;color:#f5f7ff;background:#0b1020}
    main{width:min(720px,100%);margin:0 auto;padding:13px;border:1px solid #303b59;border-radius:16px;background:#151c30}
    h1{margin:0 0 4px;font-size:22px}
    .version{color:#aab4ce;font-size:11px;line-height:1.4}
    .status{margin:9px 0;padding:8px 10px;border:1px solid #48d597;border-radius:10px;background:rgba(72,213,151,.08);color:#bdf5da;font-size:12px;font-weight:800;line-height:1.35}
    .status.bad{border-color:#ff6b6b;color:#ffc1c1;background:rgba(255,107,107,.08)}
    label{display:block;margin:11px 0 6px;font-weight:900;font-size:14px}
    input{width:100%;min-height:64px;padding:10px 12px;border:3px solid #f4c430;border-radius:13px;background:#070b14;color:#f5f7ff;font:700 21px ui-monospace,Consolas,monospace;outline:none;caret-color:#fff}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
    button{min-height:44px;padding:8px;border:1px solid #303b59;border-radius:11px;background:#202a45;color:#f5f7ff;font-weight:900;font-size:13px}
    button.primary{border-color:#48d597;background:#17372c}
    .counter{margin:12px 0 5px;font-size:16px;font-weight:900}
    .tableWrap{overflow-x:auto;border:1px solid #303b59;border-radius:11px;background:#0d1426}
    table{width:100%;border-collapse:collapse;table-layout:auto}
    th,td{padding:9px 7px;border-bottom:1px solid #303b59;text-align:left;font-size:12px}
    th{color:#aab4ce;background:#111a2d;position:sticky;top:0}
    td.no{width:38px;text-align:center;font-weight:900;color:#f4c430}
    td.time{width:72px;white-space:nowrap;color:#b9c5df;font-family:ui-monospace,Consolas,monospace}
    td.code{font:700 13px ui-monospace,Consolas,monospace;overflow-wrap:anywhere;color:#fff}
    tr:last-child td{border-bottom:0}
    .empty{padding:18px 10px;text-align:center;color:#7683a4;font-size:12px}
    .footer{margin-top:10px;text-align:center;color:#7683a4;font-size:9px;line-height:1.4}
  </style>
</head>
<body>
<main>
  <h1>Nordic ID — SCAN TABLE</h1>
  <div class="version"><strong>Test v1.3</strong> · Updated 09.08.2026 15:10 (Europe/Oslo)</div>

  <div class="status" id="remoteStatus">Журнал: запускається…</div>

  <label for="scanInput">Scan code</label>
  <input id="scanInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus placeholder="Waiting for scan…" />

  <div class="buttons">
    <button class="primary" id="sendBtn" type="button">☁ ВІДПРАВИТИ ЖУРНАЛ</button>
    <button id="focusBtn" type="button">⌖ ФОКУС У ПОЛЕ</button>
  </div>

  <div class="counter">Проскановано: <span id="scanCount">0</span></div>
  <div class="tableWrap">
    <table>
      <thead><tr><th>№</th><th>Час</th><th>Номер</th></tr></thead>
      <tbody id="scanRows"></tbody>
    </table>
    <div class="empty" id="emptyState">Ще немає просканованих номерів</div>
  </div>

  <div class="footer">NORDIC ID TEST v1.3 · технічний журнал прихований і автоматично передається в TEST</div>
</main>
<script>
(function(){
  "use strict";

  var SUPABASE_URL="https://hzjsatehehhpgpskckfi.supabase.co";
  var SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiJ9";
  // Runtime key is replaced below with the actual public anon key used by this TEST page.
  SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6anNhdGVoZWhocGdwc2tja2ZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1OTkyNTMsImV4cCI6MjEwMTE3NTI1M30.sti5fzcHsfhlve3GR-wrF_RCecRZysv12qpTBvL11-U";

  var scanInput=document.getElementById("scanInput");
  var remoteStatus=document.getElementById("remoteStatus");
  var scanRows=document.getElementById("scanRows");
  var scanCount=document.getElementById("scanCount");
  var emptyState=document.getElementById("emptyState");

  var queue=[];
  var eventNo=0;
  var flushTimer=null;
  var idleTimer=null;
  var sending=false;
  var scans=[];
  var lastCommitted="";
  var sessionId="nid-"+new Date().toISOString().replace(/[-:.TZ]/g,"")+"-"+Math.random().toString(36).slice(2,8);

  function activeName(){var a=document.activeElement;return a?((a.tagName||"?")+(a.id?"#"+a.id:"")):"none"}
  function setStatus(text,bad){remoteStatus.className=bad?"status bad":"status";remoteStatus.textContent=text}

  function scheduleFlush(){
    if(flushTimer)return;
    flushTimer=setTimeout(function(){flushTimer=null;flush(false)},350);
  }

  function logEvent(type,extra){
    eventNo+=1;
    var d=extra||{};
    if(d.value===undefined)d.value=scanInput.value;
    if(d.length===undefined)d.length=scanInput.value.length;
    if(d.active===undefined)d.active=activeName();
    d.client_iso=new Date().toISOString();
    d.performance_ms=Math.round(performance.now());
    d.visibility=document.visibilityState;
    queue.push({session_id:sessionId,event_no:eventNo,event_type:type,detail:d});
    scheduleFlush();
  }

  async function flush(force){
    if(sending||queue.length===0)return;
    sending=true;
    var batch=queue.splice(0,force?queue.length:Math.min(queue.length,80));
    setStatus("Журнал: передаю…",false);
    try{
      var res=await fetch(SUPABASE_URL+"/rest/v1/nordic_id_test_log",{
        method:"POST",
        headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
        body:JSON.stringify(batch),keepalive:true
      });
      if(!res.ok)throw new Error("HTTP "+res.status);
      setStatus("Журнал: ✓ працює · ✓ передано",false);
    }catch(err){
      queue=batch.concat(queue);
      setStatus("Журнал: ПОМИЛКА · дані залишились у черзі",true);
    }finally{
      sending=false;
      if(queue.length)setTimeout(function(){flush(false)},1200);
    }
  }

  function hms(d){
    return d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  }

  function renderScan(code,when){
    scans.push({code:code,time:when});
    scanCount.textContent=String(scans.length);
    emptyState.style.display="none";
    var tr=document.createElement("tr");
    var tdNo=document.createElement("td"); tdNo.className="no"; tdNo.textContent=String(scans.length);
    var tdTime=document.createElement("td"); tdTime.className="time"; tdTime.textContent=hms(when);
    var tdCode=document.createElement("td"); tdCode.className="code"; tdCode.textContent=code;
    tr.appendChild(tdNo);tr.appendChild(tdTime);tr.appendChild(tdCode);
    scanRows.insertBefore(tr,scanRows.firstChild);
  }

  function commitCurrent(reason){
    var code=scanInput.value;
    if(!code)return;
    if(code===lastCommitted){
      // Duplicates are valid scans; allow them after the field was cleared and filled again.
    }
    var when=new Date();
    renderScan(code,when);
    logEvent("SCAN_COMMIT",{reason:reason,scan_no:scans.length,scan_code:code,value:code,length:code.length,scan_time_iso:when.toISOString()});
    lastCommitted=code;
    scanInput.value="";
    setTimeout(function(){scanInput.focus()},20);
  }

  function eventDetail(e){return{key:e.key,code:e.code,keyCode:e.keyCode,which:e.which,repeat:e.repeat,ctrlKey:e.ctrlKey,altKey:e.altKey,shiftKey:e.shiftKey,metaKey:e.metaKey,inputType:e.inputType,data:e.data,isComposing:e.isComposing,value:scanInput.value,length:scanInput.value.length,active:activeName()}}

  document.addEventListener("keydown",function(e){
    logEvent("KEYDOWN",eventDetail(e));
    if((e.key==="Enter"||e.key==="Tab")&&scanInput.value){
      e.preventDefault();
      clearTimeout(idleTimer);
      commitCurrent(e.key.toUpperCase());
    }
  },true);
  document.addEventListener("keyup",function(e){logEvent("KEYUP",eventDetail(e))},true);
  scanInput.addEventListener("beforeinput",function(e){logEvent("BEFOREINPUT",eventDetail(e))});
  scanInput.addEventListener("input",function(e){
    logEvent("INPUT",eventDetail(e));
    clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){if(scanInput.value)commitCurrent("IDLE_450MS")},450);
  });
  scanInput.addEventListener("change",function(e){logEvent("CHANGE",eventDetail(e))});
  scanInput.addEventListener("focus",function(){logEvent("INPUT_FOCUS",{})});
  scanInput.addEventListener("blur",function(){logEvent("INPUT_BLUR",{})});
  document.addEventListener("visibilitychange",function(){logEvent("VISIBILITY",{state:document.visibilityState})});
  window.addEventListener("focus",function(){logEvent("WINDOW_FOCUS",{});setTimeout(function(){scanInput.focus()},50)});
  window.addEventListener("blur",function(){logEvent("WINDOW_BLUR",{})});
  window.addEventListener("pagehide",function(){logEvent("PAGE_HIDE",{});flush(true)});

  document.getElementById("sendBtn").addEventListener("click",function(){
    logEvent("MANUAL_SEND",{});flush(true);setTimeout(function(){scanInput.focus()},100);
  });
  document.getElementById("focusBtn").addEventListener("click",function(){
    scanInput.focus();logEvent("MANUAL_FOCUS",{});
  });

  window.addEventListener("load",function(){
    scanInput.focus();
    logEvent("PAGE_OPEN",{href:location.href,screen_w:screen.width,screen_h:screen.height,version:"v1.3"});
    setTimeout(function(){logEvent("READY",{});flush(true)},150);
  });
})();
</script>
</body>
</html>
