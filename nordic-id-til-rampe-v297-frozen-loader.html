<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nordic ID – Til rampe · STABLE V2.9.7</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7ff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#box{max-width:640px;font-weight:900;line-height:1.5}
small{color:#aab4ce}
.err{color:#ffb7b7}
</style>
</head>
<body>
<div id="box">Nordic ID – Til rampe<br><small>STABLE V2.9.7 · laster låst versjon…</small></div>
<script>
"use strict";
(async()=>{
  const PIN="ed3a19b20efd9af0bf07bc4a079589b3b6038157";
  const CDN=`https://cdn.jsdelivr.net/gh/stelmashchukyurii-maker/Mottak@${PIN}/`;
  const box=document.getElementById("box");
  try{
    const r=await fetch(CDN+"utsending-nordic-test.html",{cache:"no-store",mode:"cors"});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    let html=await r.text();
    if(!html.includes('PAGE_VERSION="V2.9.7"'))throw new Error("Frozen V2.9.7 signature mangler");

    // Keep the exact V2.9.7 application logic, but pin every local dependency
    // to the same frozen commit instead of navigating the Nordic browser to CDN HTML.
    html=html.replace('fetch(`utsending-core-v7.html','fetch(`'+CDN+'utsending-core-v7.html');
    html=html.replace(/inject\(d,"([^"]+\.js)"/g,(m,p)=>`inject(d,"${CDN}${p}"`);
    html=html.split('./ut-test-api.js').join(CDN+'ut-test-api.js');

    // Nordic browser compatibility: the frozen V2.9.7 WORK control used only
    // Pointer Events + long hold. Some Nordic Android browser builds do not
    // dispatch that gesture reliably. Add a safe single-tap fallback that still
    // requires an explicit confirmation before entering the real WORK database.
    html=html.replace(
      'loader.textContent=work?',
      'workBtn.textContent=work?"🏭 WORK ✓":"🏭 WORK";loader.textContent=work?'
    );
    html=html.replace(
      'workBtn.addEventListener("pointerdown",startHold);workBtn.addEventListener("pointerup",cancelHold);workBtn.addEventListener("pointerleave",cancelHold);workBtn.addEventListener("pointercancel",cancelHold);',
      'workBtn.addEventListener("pointerdown",startHold);workBtn.addEventListener("pointerup",cancelHold);workBtn.addEventListener("pointerleave",cancelHold);workBtn.addEventListener("pointercancel",cancelHold);workBtn.addEventListener("click",function(){if(MODE==="work"||holdDone)return;if(confirm("Перейти в WORK? Це реальний склад і реальні замовлення."))switchMode("work");else updateOuter()});if(!("PointerEvent" in window)){workBtn.addEventListener("touchstart",startHold,{passive:false});workBtn.addEventListener("touchend",cancelHold,{passive:false});workBtn.addEventListener("touchcancel",cancelHold,{passive:false});}'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    box.className="err";
    box.innerHTML=`Kunne ikke starte STABLE V2.9.7.<br><small>${String(e&&e.message||e)}</small><br><br><button onclick="location.reload()" style="min-height:52px;padding:10px 18px;border:0;border-radius:12px;background:#f4c430;color:#17130a;font-weight:950">PRØV IGJEN</button>`;
  }
})();
</script>
</body>
</html>
