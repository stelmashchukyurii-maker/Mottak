<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Camera Cloud v4.6</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:5}
  </style>
</head>
<body>
  <div id="loader">Завантаження Camera Cloud v4.6…</div>
  <iframe id="app" title="Camera Cloud v4.6" src="camera-live.html?base=46-2315"></iframe>
  <script>
    "use strict";
    const frame = document.getElementById("app");
    const loader = document.getElementById("loader");

    function injectScript(doc, src) {
      return new Promise((resolve, reject) => {
        const script = doc.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        doc.body.appendChild(script);
      });
    }

    frame.addEventListener("load", async () => {
      try {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        await injectScript(doc, "camera-live-v4-source-fix.js?v=46-2315");
        await injectScript(doc, "camera-live-v4-server-ocr.js?v=46-2315");
        await injectScript(doc, "shared-stock-status.js?v=20260804-2315");
        const version = doc.querySelector(".version");
        if (version) version.innerHTML = "Kamera Cloud v4.6 FELLES LAGER<br>Oppdatert 04.08.2026 kl. 23:15";
        [doc.getElementById("languages"), doc.getElementById("products")].forEach(element => {
          element?.addEventListener("click", () => setTimeout(() => win.refreshBamaStock?.().catch(() => {}), 80));
        });
        loader.style.display = "none";
      } catch (error) {
        loader.textContent = `Помилка запуску Camera Cloud v4.6: ${error.message || error}`;
      }
    });
  </script>
</body>
</html>
