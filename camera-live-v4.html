<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Camera Cloud v4.3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:5}
  </style>
</head>
<body>
  <div id="loader">Завантаження Camera Cloud v4.3…</div>
  <iframe id="app" title="Camera Cloud v4.3" src="camera-live.html?base=43-1331"></iframe>
  <script>
    "use strict";
    const frame = document.getElementById("app");
    const loader = document.getElementById("loader");

    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;
        const script = doc.createElement("script");
        script.src = "camera-live-v4-source-fix.js?v=43-1331";
        script.onload = () => { loader.style.display = "none"; };
        script.onerror = () => { loader.textContent = "Не вдалося завантажити Camera Cloud v4.3."; };
        doc.body.appendChild(script);
      } catch (error) {
        loader.textContent = `Помилка запуску Camera Cloud v4.3: ${error.message || error}`;
      }
    });
  </script>
</body>
</html>
