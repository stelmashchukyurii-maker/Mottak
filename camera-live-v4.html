<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Camera Cloud v4.5</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:5}
  </style>
</head>
<body>
  <div id="loader">Завантаження Camera Cloud v4.5…</div>
  <iframe id="app" title="Camera Cloud v4.5" src="camera-live.html?base=45-2247"></iframe>
  <script>
    "use strict";
    const frame = document.getElementById("app");
    const loader = document.getElementById("loader");

    function injectScript(doc, src) {
      return new Promise((resolve, reject) => {
        const script = doc.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        doc.body.appendChild(script);
      });
    }

    frame.addEventListener("load", async () => {
      try {
        const doc = frame.contentDocument;
        await injectScript(doc, "camera-live-v4-source-fix.js?v=45-2247");
        await injectScript(doc, "camera-live-v4-server-ocr.js?v=45-2247");
        loader.style.display = "none";
      } catch (error) {
        loader.textContent = `Помилка запуску Camera Cloud v4.5: ${error.message || error}`;
      }
    });
  </script>
</body>
</html>
