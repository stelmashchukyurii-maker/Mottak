<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Camera Cloud v4.29</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:5}
  </style>
</head>
<body>
  <div id="loader">Laster Camera Cloud v4.29…</div>
  <iframe id="app" title="Camera Cloud v4.29" src="camera-live.html?base=429-stock8-plast-receipt-20260811-0818"></iframe>
  <script>
    "use strict";
    const VERSION = "20260811-0818";
    const frame = document.getElementById("app");
    const loader = document.getElementById("loader");

    function injectScript(doc, src) {
      return new Promise((resolve, reject) => {
        const script = doc.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        doc.body.appendChild(script);
      });
    }

    function enableStockSectionsCollapse(doc) {
      const root = doc.getElementById("bamaStockSummary8");
      if (!root) return false;

      if (!doc.getElementById("cameraStockSectionsCollapseStyle")) {
        const style = doc.createElement("style");
        style.id = "cameraStockSectionsCollapseStyle";
        style.textContent = `
          #bamaStockSummary8 .bs8-section.camera-stock-collapsed .bs8-grid{display:none!important}
          #bamaStockSummary8 .bs8-section.camera-stock-collapsed .bs8-head{margin-bottom:0}
          #bamaStockSummary8 .bs8-section .bs8-head{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
          #bamaStockSummary8 .camera-stock-chevron{flex:0 0 auto;min-width:34px;min-height:34px;border:1px solid #303b59;border-radius:10px;background:#151c30;color:#aab4ce;font:1000 15px/34px Arial,sans-serif;text-align:center}
        `;
        doc.head.appendChild(style);
      }

      root.querySelectorAll(".bs8-section.physical,.bs8-section.available").forEach(section => {
        const head = section.querySelector(".bs8-head");
        if (!head || section.dataset.cameraCollapseReady === "1") return;
        section.dataset.cameraCollapseReady = "1";

        const chevron = doc.createElement("span");
        chevron.className = "camera-stock-chevron";
        head.appendChild(chevron);

        const setCollapsed = collapsed => {
          section.classList.toggle("camera-stock-collapsed", collapsed);
          chevron.textContent = collapsed ? "▼" : "▲";
          head.setAttribute("aria-expanded", collapsed ? "false" : "true");
        };

        head.addEventListener("click", event => {
          event.preventDefault();
          setCollapsed(!section.classList.contains("camera-stock-collapsed"));
        });

        setCollapsed(true);
      });
      return true;
    }

    frame.addEventListener("load", async () => {
      try {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        win.BAMA_HOME_TARGET = "camera-live-v414.html";

        await injectScript(doc, `camera-live-v4-source-fix.js?v=${VERSION}`);
        await injectScript(doc, "camera-live-v4-server-ocr.js?v=414-newurl-20260807-1834");
        await injectScript(doc, `camera-live-v4-stock-filters.js?v=${VERSION}`);
        await injectScript(doc, `upper-number-policy.js?v=${VERSION}`);
        await injectScript(doc, `shared-stock-status.js?v=${VERSION}`);
        await injectScript(doc, `camera-extra-rfid-products.js?v=${VERSION}`);
        await injectScript(doc, `camera-live-v4-floating-camera-v2.js?v=${VERSION}`);
        await injectScript(doc, "camera-live-v4-floating-workflow.js?v=414-newurl-20260807-1834");
        await injectScript(doc, "camera-live-v4-compact-language.js?v=414-newurl-20260807-1834");
        await injectScript(doc, "camera-live-v4-mobile-ui.js?v=414-newurl-20260807-1834");
        await injectScript(doc, `camera-lower-only.js?v=${VERSION}`);
        await injectScript(doc, `camera-auto-save-focus.js?v=${VERSION}`);
        await injectScript(doc, `stock-lifecycle-ui.js?v=${VERSION}`);
        await injectScript(doc, `camera-current-stock-only.js?v=${VERSION}`);

        loader.style.display = "none";
        win.__BAMA_COMPACT_STOCK_COUNTER__ = true;
        await injectScript(doc, `stock-summary-8-v1.js?v=${VERSION}`);
        enableStockSectionsCollapse(doc);
        await injectScript(doc, `camera-plast-manual-receipt.js?v=${VERSION}`);

        const version = doc.querySelector(".version");
        if (version) version.innerHTML = "Kamera Cloud v4.29 · 8 PRODUKTER · PLAST MANUELT MOTTAK<br>Oppdatert 13.08.2026 kl. 16:02";

        [doc.getElementById("languages"), doc.getElementById("products")].forEach(element => {
          element?.addEventListener("click", () => setTimeout(() => {
            win.refreshBamaStock?.().catch(() => {});
            win.BAMA_STOCK_SUMMARY_REFRESH?.();
            win.CAMERA_PLAST_RECEIPT?.refresh?.();
            enableStockSectionsCollapse(doc);
          }, 80));
        });
      } catch (error) {
        loader.textContent = `Kunne ikke starte Camera Cloud v4.29: ${error.message || error}`;
      }
    });
  </script>
</body>
</html>
