<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Mottak Live v2.1</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#151c30;--dark:#0d1426;--text:#f5f7ff;--muted:#aab4ce;--accent:#f4c430;--ok:#48d597;--warn:#f6b94b;--bad:#ff6b6b;--line:#303b59}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg),#11182a)}
    button,input,select,textarea{font:inherit}
    .app{width:min(1200px,100%);margin:auto;padding:14px 12px 46px}
    h1{margin:0 0 5px;font-size:clamp(28px,6vw,43px)}
    h2{margin:0 0 12px;font-size:20px}
    .subtitle,.note{color:var(--muted);line-height:1.45}
    .version{font-size:12px;color:var(--muted)}
    .card{margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
    .grid3,.actions,.stats{display:grid;gap:9px}
    .grid3{grid-template-columns:repeat(3,1fr)}
    .actions{grid-template-columns:repeat(4,1fr)}
    .stats{grid-template-columns:repeat(5,1fr)}
    button,.link{min-height:48px;padding:10px 13px;border:0;border-radius:12px;font-weight:800;cursor:pointer;text-align:center}
    button:disabled{opacity:.45;cursor:not-allowed}
    .choice,.secondary{color:var(--text);background:var(--dark);border:2px solid var(--line)}
    .choice.active{color:#17130a;background:var(--accent);border-color:var(--accent)}
    .primary{color:#17130a;background:var(--accent)}
    .success{color:#062418;background:var(--ok)}
    .danger{color:#ffd0d0;background:rgba(255,107,107,.17);border:1px solid rgba(255,107,107,.42)}
    .link{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);background:#2c395c}
    textarea,input,select{width:100%;min-height:43px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:#070b14}
    textarea{min-height:105px;border:3px solid var(--accent);font:900 clamp(20px,5vw,31px) Consolas,monospace}
    .message{min-height:25px;margin-top:10px;color:var(--muted);white-space:pre-wrap}
    .message.ok{color:var(--ok)}
    .message.bad{color:var(--bad)}
    .message.warn{color:var(--warn)}
    .stat{padding:10px 5px;border:1px solid var(--line);border-radius:12px;background:var(--dark);text-align:center}
    .stat span{display:block;color:var(--muted);font-size:11px}
    .stat strong{font-size:29px}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
    table{width:100%;min-width:1040px;border-collapse:collapse;background:var(--dark)}
    th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
    th{color:var(--muted);background:#111a31;font-size:11px;text-transform:uppercase}
    .mono{font-family:Consolas,monospace;font-weight:800}
    .toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:9px;align-items:center}
    .toolbar>div{display:flex;flex-wrap:wrap;gap:8px}
    .thumb{width:92px;height:72px;object-fit:cover;border-radius:9px;background:#070b14}
    .no-photo{width:92px;padding:8px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:11px;text-align:center}
    .empty{padding:22px;text-align:center;color:var(--muted)}
    @media(max-width:760px){
      .grid3,.actions,.stats{grid-template-columns:1fr}
      .toolbar>div,.toolbar button,.toolbar .link{width:100%}
    }
  </style>
</head>
<body>
<main class="app">
  <h1 data-t="title">Mottak Live v2.1</h1>
  <div class="version">Nordic ID · 3-part parsing · updated 01.08.2026 23:02 Europe/Oslo</div>
  <p class="subtitle" data-t="subtitle"></p>

  <section class="card">
    <div class="grid3" id="languages">
      <button class="choice" data-language="nb">Norsk</button>
      <button class="choice" data-language="pl">Polski</button>
      <button class="choice" data-language="uk">Українська</button>
    </div>
  </section>

  <section class="card">
    <h2 data-t="chooseProduct"></h2>
    <div class="grid3" id="products">
      <button class="choice" data-product="bunner">Bunner</button>
      <button class="choice" data-product="hyller30">Hyller x30</button>
      <button class="choice" data-product="hyller60">Hyller x60</button>
    </div>
  </section>

  <section class="card">
    <h2 data-t="scanTitle"></h2>
    <textarea id="scanInput" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="none"></textarea>
    <p class="note" data-t="scanHelp"></p>
    <div class="actions">
      <button class="primary" id="addButton" data-t="add"></button>
      <button class="secondary" id="clearButton" data-t="clear"></button>
      <button class="secondary" id="focusButton" data-t="focus"></button>
      <button class="success" id="verifyButton" data-t="verify"></button>
    </div>
    <div class="message" id="message"></div>
  </section>

  <section class="card">
    <h2 data-t="counts"></h2>
    <div class="stats">
      <div class="stat"><span data-t="queue"></span><strong id="queueCount">0</strong></div>
      <div class="stat"><span data-t="pending"></span><strong id="pendingCount">0</strong></div>
      <div class="stat"><span data-t="verified"></span><strong id="verifiedCount">0</strong></div>
      <div class="stat"><span data-t="cloud"></span><strong id="cloudCount">0</strong></div>
      <div class="stat"><span data-t="photos"></span><strong id="photoCount">0</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2 data-t="queueTitle"></h2>
      <div>
        <button class="success" id="saveButton" data-t="save"></button>
        <button class="danger" id="clearQueueButton" data-t="clearQueue"></button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th data-t="product"></th>
            <th data-t="serviceCode"></th>
            <th data-t="upper"></th>
            <th data-t="lower"></th>
            <th data-t="status"></th>
            <th data-t="action"></th>
          </tr>
        </thead>
        <tbody id="queueBody"></tbody>
      </table>
    </div>
    <p class="note" data-t="queueNote"></p>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2 data-t="cloudTitle"></h2>
      <div>
        <a class="link" href="camera-live.html" data-t="camera"></a>
        <button class="secondary" id="refreshButton" data-t="refresh"></button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-t="photo"></th>
            <th data-t="time"></th>
            <th data-t="product"></th>
            <th data-t="serviceCode"></th>
            <th data-t="upper"></th>
            <th data-t="lower"></th>
            <th data-t="status"></th>

          </tr>
        </thead>
        <tbody id="cloudBody"></tbody>
      </table>
    </div>
    <p class="note" data-t="cloudNote"></p>
  </section>
</main>

const $ = id => document.getElementById(id);
const t = () => TEXT[language];

let language = TEXT[localStorage.getItem(LANGUAGE_KEY)]
  ? localStorage.getItem(LANGUAGE_KEY)
  : "nb";

let product = PRODUCTS[localStorage.getItem(PRODUCT_KEY)]
  ? localStorage.getItem(PRODUCT_KEY)
  : "bunner";

let cloudRows = [];
let timer = null;
let channel = null;

const deviceId = (() => {
  let value = localStorage.getItem(DEVICE_KEY);
  if (!value) {
    value = `nordic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    localStorage.setItem(DEVICE_KEY, value);
  }
  return value;
})();

function normalizeRaw(value) {
  return String(value || "")
    .replace(/[\r\n\t]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .toUpperCase();
}

function compactCode(value) {
  return normalizeRaw(value).replace(/[^A-Z0-9]/g, "");
}

function parseScan(value) {
  const rawData = normalizeRaw(value);
  const compact = compactCode(rawData);

  let serviceCode = "";
  let upperNumber = "";
  let lowerNumber = "";

  const exact = compact.match(/^([A-Z0-9]{12})(\d{6})([A-Z0-9]{6})$/);
  const atEnd = compact.match(/([A-Z0-9]{12})(\d{6})([A-Z0-9]{6})$/);

  if (exact || atEnd) {
    const match = exact || atEnd;
    serviceCode = match[1];
    upperNumber = match[2];
    lowerNumber = match[3];
  } else {
    const parts = rawData
      .split(/[\s|;,/:]+/)
      .map(part => part.replace(/[^A-Z0-9]/g, ""))
      .filter(Boolean);

    const serviceIndex = parts.findIndex(part => /^[A-Z0-9]{12}$/.test(part));
    if (serviceIndex !== -1) {
      serviceCode = parts[serviceIndex];
      upperNumber = parts.slice(serviceIndex + 1).find(part => /^\d{6}$/.test(part)) || "";
      lowerNumber = parts
        .slice(serviceIndex + 1)
        .find(part => /^[A-Z0-9]{6}$/.test(part) && part !== upperNumber) || "";
    }

    if (!upperNumber || !lowerNumber) {
      const pair = compact.match(/(\d{6})([A-Z0-9]{6})$/);
      if (pair) {
        upperNumber = pair[1];
        lowerNumber = pair[2];
        const beforePair = compact.slice(0, -12);
        serviceCode = beforePair.slice(-12);
      }
    }
  }

  serviceCode = serviceCode.slice(0, 12);
  upperNumber = upperNumber.slice(0, 6);
  lowerNumber = lowerNumber.slice(0, 6);

  const valid =
    /^[A-Z0-9]{12}$/.test(serviceCode) &&
    /^\d{6}$/.test(upperNumber) &&
    /^[A-Z0-9]{6}$/.test(lowerNumber);

  return {
    rawData,
    scannerCode: serviceCode,
    upperNumber,
    lowerNumber,
    valid
  };
}

function pairKey(upperNumber, lowerNumber) {
  return `${upperNumber}|${lowerNumber}`;
}

function uid() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

function loadQueue() {
  try {
    const value = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
    if (!Array.isArray(value)) return [];

    return value.map(row => {
      const source = row.rawData || row.scannerCode || "";
      const parsed = parseScan(source);

      if (parsed.valid) {
        return {
          ...row,
          scannerCode: parsed.scannerCode,
          upperNumber: parsed.upperNumber,
          lowerNumber: parsed.lowerNumber,
          rawData: parsed.rawData
        };
      }

      return {
        ...row,
        rawData: row.rawData || normalizeRaw(row.scannerCode || "")
      };
    });
  } catch {
    return [];
  }
}

let queue = loadQueue();

function saveQueue() {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function show(text, type = "") {
  $("message").textContent = text;
  $("message").className = `message ${type}`;
}

function isCloudScannerDuplicate(parsed) {
  return cloudRows.some(row =>
    pairKey(row.upper_number || "", row.lower_number || "") ===
      pairKey(parsed.upperNumber, parsed.lowerNumber) &&
    Boolean(compactCode(row.scanner_code || ""))
  );
}

function addScan() {
  clearTimeout(timer);

  const parsed = parseScan($("scanInput").value);

  if (!parsed.rawData) {
    show(t().noCode, "bad");
    return;
  }

  if (!parsed.valid) {
    show(`${t().invalidScan}\n${parsed.rawData}`, "bad");
    return;
  }

  if (queue.some(row =>
    pairKey(row.upperNumber, row.lowerNumber) ===
    pairKey(parsed.upperNumber, parsed.lowerNumber)
  )) {
    show(t().duplicateQueue, "warn");
    $("scanInput").value = "";
    $("scanInput").focus();
    return;
  }

  if (isCloudScannerDuplicate(parsed)) {
    show(t().duplicateCloud, "warn");
    $("scanInput").value = "";
    $("scanInput").focus();
    return;
  }

  queue.push({
    id: uid(),
    product,
    scannerCode: parsed.scannerCode,
    upperNumber: parsed.upperNumber,
    lowerNumber: parsed.lowerNumber,
    rawData: parsed.rawData,
    status: "pending"
  });

  saveQueue();
  $("scanInput").value = "";
  show(t().added, "ok");
  render();
  $("scanInput").focus();
}

function statusOptions(value) {
  return [
    ["pending", t().pendingStatus],
    ["verified", t().verifiedStatus],
    ["invalid", t().invalidStatus]
  ].map(([key, label]) =>
    `<option value="${key}" ${key === value ? "selected" : ""}>${label}</option>`
  ).join("");
}

function renderQueue() {
  const body = $("queueBody");

  if (!queue.length) {
    body.innerHTML = `<tr><td class="empty" colspan="7">${t().emptyQueue}</td></tr>`;
    return;
  }

  body.innerHTML = queue.map((row, index) => `
    <tr data-id="${esc(row.id)}">
      <td>${index + 1}</td>
      <td>
        <select data-field="product">
          <option value="bunner" ${row.product === "bunner" ? "selected" : ""}>Bunner</option>
          <option value="hyller30" ${row.product === "hyller30" ? "selected" : ""}>Hyller x30</option>
          <option value="hyller60" ${row.product === "hyller60" ? "selected" : ""}>Hyller x60</option>
        </select>
      </td>
      <td><input class="mono" data-field="scannerCode" maxlength="12" value="${esc(row.scannerCode)}"></td>
      <td><input class="mono" data-field="upperNumber" maxlength="6" value="${esc(row.upperNumber)}"></td>
      <td><input class="mono" data-field="lowerNumber" maxlength="6" value="${esc(row.lowerNumber)}"></td>
      <td><select data-field="status">${statusOptions(row.status)}</select></td>
      <td><button class="danger" data-remove="${esc(row.id)}">${t().remove}</button></td>
    </tr>
  `).join("");
}

function renderCloud() {
  const body = $("cloudBody");

  if (!cloudRows.length) {
    body.innerHTML = `<tr><td class="empty" colspan="8">${t().emptyCloud}</td></tr>`;
    return;
  }

  body.innerHTML = cloudRows.map(row => `
    <tr>
      <td>
        ${row.photo_url
          ? `<a href="${esc(row.photo_url)}" target="_blank"><img class="thumb" src="${esc(row.photo_url)}" loading="lazy" alt="Mottak photo"></a>`
          : `<div class="no-photo">${t().noPhoto}</div>`
        }
      </td>
      <td>${esc(new Date(row.created_at).toLocaleString())}</td>
      <td>${esc(PRODUCTS[row.product] || row.product)}</td>
      <td class="mono">${esc(row.scanner_code || "—")}</td>
      <td class="mono">${esc(row.upper_number || "—")}</td>
      <td class="mono">${esc(row.lower_number || "—")}</td>
      <td>${esc(row.status)}</td>
      <td>${esc(row.source)}</td>
    </tr>
  `).join("");
}

function renderCounts() {
  $("queueCount").textContent = queue.length;
  $("pendingCount").textContent = queue.filter(row => row.status === "pending").length;
  $("verifiedCount").textContent = queue.filter(row => row.status === "verified").length;
  $("cloudCount").textContent = cloudRows.length;
  $("photoCount").textContent = cloudRows.filter(row => row.photo_url).length;
}

function renderChoices() {
  document.querySelectorAll("[data-language]").forEach(button => {
    button.classList.toggle("active", button.dataset.language === language);
  });

  document.querySelectorAll("[data-product]").forEach(button => {
    button.classList.toggle("active", button.dataset.product === product);
  });
}

function render() {
  renderChoices();
  renderQueue();
  renderCloud();
  renderCounts();
}

function applyLanguage() {
  document.documentElement.lang = language;

  document.querySelectorAll("[data-t]").forEach(element => {
    const value = t()[element.dataset.t];
    if (typeof value === "string") element.textContent = value;
  });

  $("scanInput").placeholder = t().scanTitle;
  render();
}

async function loadCloud() {
  const response = await client
    .from(TABLE)
    .select("id,created_at,product,scanner_code,upper_number,lower_number,status,source,device_id,photo_url,photo_path,confidence,raw_data")
    .order("created_at", { ascending: false })
    .limit(500);

  if (response.error) {
    show(`${t().loadError}\n${response.error.message}`, "bad");
    return false;
  }

  cloudRows = response.data || [];
  render();
  return true;
}

async function findExactMatch(row) {
  const response = await client
    .from(TABLE)
    .select("id,scanner_code,upper_number,lower_number,status,source,photo_url")
    .eq("upper_number", row.upperNumber)
    .eq("lower_number", row.lowerNumber)
    .order("created_at", { ascending: false })
    .limit(1)
    .maybeSingle();

  if (response.error) throw response.error;
  return response.data;
}

async function saveRows() {
  const verifiedRows = queue.filter(row => row.status === "verified");

  if (!verifiedRows.length) {
    show(t().nothing, "warn");
    return;
  }

  $("saveButton").disabled = true;
  show(t().saving);

  let saved = 0;
  let matched = 0;

  try {
    for (const row of verifiedRows) {
      const scannerCode = compactCode(row.scannerCode).slice(0, 12);
      const upperNumber = compactCode(row.upperNumber).replace(/\D/g, "").slice(0, 6);
      const lowerNumber = compactCode(row.lowerNumber).slice(0, 6);
      const rawData = compactCode(row.rawData || `${scannerCode}${upperNumber}${lowerNumber}`);

      const valid =
        /^[A-Z0-9]{12}$/.test(scannerCode) &&
        /^\d{6}$/.test(upperNumber) &&
        /^[A-Z0-9]{6}$/.test(lowerNumber);

      if (!valid) continue;

      const existing = await findExactMatch({ upperNumber, lowerNumber });
      let result;

      if (existing) {
        result = await client
          .from(TABLE)
          .update({
            product: row.product,
            scanner_code: scannerCode,
            upper_number: upperNumber,
            lower_number: lowerNumber,
            status: row.status,
            source: existing.photo_url ? "camera+nordic_id" : "nordic_id",
            device_id: deviceId,
            raw_data: rawData,
            verified_at: new Date().toISOString()
          })
          .eq("id", existing.id);

        if (existing.photo_url) matched++;
      } else {
        result = await client
          .from(TABLE)
          .upsert({
            product: row.product,
            scanner_code: scannerCode,
            upper_number: upperNumber,
            lower_number: lowerNumber,
            status: row.status,
            source: "nordic_id",
            device_id: deviceId,
            raw_data: rawData,
            verified_at: new Date().toISOString()
          }, {
            onConflict: "scanner_code,upper_number,lower_number"
          });
      }

      if (result.error) throw result.error;
      saved++;
    }

    const savedIds = new Set(verifiedRows.map(row => row.id));
    queue = queue.filter(row => !savedIds.has(row.id));
    saveQueue();
    await loadCloud();
    show(t().saved(saved, matched), "ok");
  } catch (error) {
    show(`${t().saveError}\n${error.message || error}`, "bad");
  } finally {
    $("saveButton").disabled = false;
    render();
    $("scanInput").focus();
  }
}

$("scanInput").addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === "Tab") {
    event.preventDefault();
    addScan();
  }
});

$("scanInput").addEventListener("input", () => {
  clearTimeout(timer);
  if ($("scanInput").value.trim()) {
    timer = setTimeout(addScan, 420);
  }
});

$("addButton").addEventListener("click", addScan);

$("clearButton").addEventListener("click", () => {
  $("scanInput").value = "";
  $("scanInput").focus();
});

$("focusButton").addEventListener("click", () => $("scanInput").focus());

$("verifyButton").addEventListener("click", () => {
  let count = 0;

  queue.forEach(row => {
    const valid =
      /^[A-Z0-9]{12}$/.test(compactCode(row.scannerCode)) &&
      /^\d{6}$/.test(compactCode(row.upperNumber)) &&
      /^[A-Z0-9]{6}$/.test(compactCode(row.lowerNumber));

    if (valid) {
      if (row.status !== "verified") count++;
      row.status = "verified";
    } else {
      row.status = "invalid";
    }
  });

  saveQueue();
  show(t().verifiedMessage(count), "ok");
  render();
});

$("saveButton").addEventListener("click", saveRows);

$("clearQueueButton").addEventListener("click", () => {
  if (queue.length && confirm(t().confirmClear)) {
    queue = [];
    saveQueue();
    render();
  }
});

$("refreshButton").addEventListener("click", loadCloud);

$("languages").addEventListener("click", event => {
  const button = event.target.closest("[data-language]");
  if (!button) return;

  language = button.dataset.language;
  localStorage.setItem(LANGUAGE_KEY, language);
  applyLanguage();
});

$("products").addEventListener("click", event => {
  const button = event.target.closest("[data-product]");
  if (!button) return;

  product = button.dataset.product;
  localStorage.setItem(PRODUCT_KEY, product);
  renderChoices();
  $("scanInput").focus();
});

$("queueBody").addEventListener("input", event => {
  const rowElement = event.target.closest("tr[data-id]");
  const field = event.target.dataset.field;

  if (!rowElement || !field) return;

  const row = queue.find(item => item.id === rowElement.dataset.id);
  if (!row) return;

  let value = event.target.value;

  if (field === "scannerCode") {
    value = compactCode(value).slice(0, 12);
  }

  if (field === "upperNumber") {
    value = value.replace(/\D/g, "").slice(0, 6);
  }

  if (field === "lowerNumber") {
    value = compactCode(value).slice(0, 6);
  }

  row[field] = value;
  row.rawData = `${row.scannerCode || ""}${row.upperNumber || ""}${row.lowerNumber || ""}`;
  event.target.value = value;

  saveQueue();
  renderCounts();
});

$("queueBody").addEventListener("change", event => {
  const rowElement = event.target.closest("tr[data-id]");
  const field = event.target.dataset.field;

  if (!rowElement || !field) return;

  const row = queue.find(item => item.id === rowElement.dataset.id);
  if (!row) return;

  row[field] = event.target.value;
  saveQueue();
  renderCounts();
});

$("queueBody").addEventListener("click", event => {
  const button = event.target.closest("[data-remove]");
  if (!button) return;

  queue = queue.filter(row => row.id !== button.dataset.remove);
  saveQueue();
  render();
});

channel = client
  .channel("mottak-live-v2-1")
  .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, loadCloud)
  .subscribe();

applyLanguage();
loadCloud();
$("scanInput").focus();
</script>
</body>
</html>
