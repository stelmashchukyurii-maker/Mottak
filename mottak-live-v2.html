<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>INN Nordic ID — kontrollert skanning</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="mottak-live-v4.css" />
</head>
<body>
<main class="app">
  <div class="topbar"><a class="back" href="index.html">← Hovedmeny</a><div class="version">Nordic ID Cloud v4<br />Oppdatert 02.08.2026 kl. 14:16</div></div>
  <h1 data-t="title">INN — Nordic ID</h1><p class="subtitle" data-t="subtitle"></p>

  <section class="card"><div class="grid3" id="languages"><button class="choice" data-language="nb">Norsk</button><button class="choice" data-language="pl">Polski</button><button class="choice" data-language="uk">Українська</button></div></section>

  <section class="card"><h2 data-t="chooseProduct"></h2><div class="grid3" id="products"><button class="choice" data-product="bunner">Bunner</button><button class="choice" data-product="hyller30">Hyller x30</button><button class="choice" data-product="hyller60">Hyller x60</button></div></section>

  <section class="card">
    <h2 data-t="scanTitle"></h2>
    <textarea id="scanInput" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="none"></textarea>
    <p class="note" data-t="scanHelp"></p>
    <div class="actions"><button class="primary" id="splitButton" data-t="splitScan"></button><button class="secondary" id="clearButton" data-t="clear"></button><button class="secondary" id="focusButton" data-t="focus"></button></div>
    <div class="raw-preview" id="rawPreview"></div>
  </section>

  <section class="card">
    <h2 data-t="checkTitle"></h2>
    <div class="parts">
      <div class="part"><label for="serviceCode" data-t="serviceCode"></label><input id="serviceCode" maxlength="12" /><small data-t="serviceHint"></small></div>
      <div class="part"><label for="upperNumber" data-t="upper"></label><input id="upperNumber" maxlength="6" inputmode="numeric" /><small data-t="upperHint"></small></div>
      <div class="part"><label for="lowerNumber" data-t="lower"></label><input id="lowerNumber" maxlength="6" /><small data-t="lowerHint"></small></div>
    </div>
    <p class="note" data-t="manualHelp"></p>
    <button class="success" id="saveScanButton" data-t="savePending" disabled></button>
    <div class="message" id="message" aria-live="polite"></div>
  </section>

  <section class="card"><h2 data-t="counts"></h2><div class="stats"><div class="stat"><span data-t="all"></span><strong id="allCount">0</strong></div><div class="stat"><span data-t="pending"></span><strong id="pendingCount">0</strong></div><div class="stat"><span data-t="verified"></span><strong id="verifiedCount">0</strong></div><div class="stat"><span data-t="photos"></span><strong id="photoCount">0</strong></div></div></section>

  <section class="card">
    <div class="toolbar"><h2 data-t="cloudTitle"></h2><div><a class="link" href="camera-live.html" data-t="openCamera"></a><button class="secondary" id="refreshButton" data-t="refresh"></button></div></div>
    <div class="table-wrap"><table><thead><tr><th data-t="photo"></th><th data-t="time"></th><th data-t="product"></th><th data-t="serviceCode"></th><th data-t="upper"></th><th data-t="lower"></th><th data-t="status"></th><th data-t="source"></th><th data-t="action"></th></tr></thead><tbody id="cloudBody"></tbody></table></div>
    <p class="note" data-t="cloudNote"></p>
  </section>
</main>
<script src="mottak-live-v4-text.js"></script>
<script src="mottak-live-v4.js"></script>
</body>
</html>
