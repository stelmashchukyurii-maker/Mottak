    textarea,input,select{width:100%;min-height:43px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:#070b14}textarea{min-height:105px;border:3px solid var(--accent);font:900 clamp(20px,5vw,31px) Consolas,monospace}.message{min-height:25px;margin-top:10px;color:var(--muted);white-space:pre-wrap}.message.ok{color:var(--ok)}.message.bad{color:var(--bad)}.message.warn{color:var(--warn)}.stat{padding:10px 5px;border:1px solid var(--line);border-radius:12px;background:var(--dark);text-align:center}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:29px}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:1000px;border-collapse:collapse;background:var(--dark)}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--muted);background:#111a31;font-size:11px;text-transform:uppercase}.mono{font-family:Consolas,monospace;font-weight:800}.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:9px;align-items:center}.toolbar>div{display:flex;flex-wrap:wrap;gap:8px}.thumb{width:92px;height:72px;object-fit:cover;border-radius:9px;background:#070b14}.no-photo{width:92px;padding:8px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:11px;text-align:center}.empty{padding:22px;text-align:center;color:var(--muted)}

 nb:{title:"Mottak Live v2",subtitle:"Nordic ID-skanning kobles til bilder fra kameratelefonen via det øvre sekssifrede nummeret.",chooseProduct:"1. Velg produkt",scanTitle:"2. Masseskanning Nordic ID",scanHelp:"Skanneren kan sende kode + øvre nummer. Nedre nummer er valgfritt dersom bildet allerede finnes i skyen.",add:"Legg i kø",clear:"Tøm felt",focus:"Aktiver skannerfelt",verify:"Godkjenn komplette",counts:"Telling",queue:"I kø",pending:"Venter",verified:"Godkjent",cloud:"I databasen",photos:"Med bilde",queueTitle:"3. Kontroll og lagring",save:"Lagre og koble til bilder",clearQueue:"Tøm kø",product:"Produkt",scannerCode:"Scannerkode / rådata",upper:"Øvre nummer",lower:"Nedre nummer",status:"Status",action:"Handling",queueNote:"En post kan godkjennes med scannerkode og 6-sifret øvre nummer. Ved treff beholdes bildet og nedre nummer fra kameraregistreringen.",cloudTitle:"Felles Mottak-tabell",camera:"Åpne kamera",refresh:"Oppdater",photo:"Bilde",time:"Tid",source:"Kilde",cloudNote:"Et bilde vises etter at kameratelefonen har lagret samme øvre nummer.",pendingStatus:"Venter",verifiedStatus:"Godkjent",invalidStatus:"Feil",remove:"Fjern",emptyQueue:"Køen er tom.",emptyCloud:"Ingen poster i databasen.",noPhoto:"Uten bilde",noCode:"Skann eller skriv inn en kode.",added:"Skanningen ble lagt i kø.",duplicate:"Duplikatet finnes allerede i køen.",verifiedMessage:n=>`${n} poster ble godkjent.`,nothing:"Ingen godkjente poster å lagre.",saving:"Lagrer og leter etter bilder…",saved:(n,m)=>`${n} poster lagret. ${m} ble koblet til eksisterende bilde.`,saveError:"Kunne ikke lagre. Postene ligger fortsatt i køen.",loadError:"Kunne ikke laste tabellen. Kjør supabase-photo-setup.sql først.",confirmClear:"Tømme lokal kø?"},
 pl:{title:"Mottak Live v2",subtitle:"Skan Nordic ID łączy się ze zdjęciem z telefonu według górnego sześciocyfrowego numeru.",chooseProduct:"1. Wybierz produkt",scanTitle:"2. Skanowanie masowe Nordic ID",scanHelp:"Skaner może przesłać kod + górny numer. Dolny numer jest opcjonalny, gdy zdjęcie istnieje już w chmurze.",add:"Dodaj do kolejki",clear:"Wyczyść pole",focus:"Aktywuj pole",verify:"Potwierdź kompletne",counts:"Liczniki",queue:"W kolejce",pending:"Oczekuje",verified:"Potwierdzone",cloud:"W bazie",photos:"Ze zdjęciem",queueTitle:"3. Kontrola i zapis",save:"Zapisz i połącz ze zdjęciami",clearQueue:"Wyczyść kolejkę",product:"Produkt",scannerCode:"Kod skanera / dane",upper:"Górny numer",lower:"Dolny numer",status:"Status",action:"Działanie",queueNote:"Wpis można potwierdzić z kodem skanera i 6-cyfrowym górnym numerem. Przy dopasowaniu zdjęcie i dolny numer pozostają z wpisu aparatu.",cloudTitle:"Wspólna tabela Mottak",camera:"Otwórz aparat",refresh:"Odśwież",photo:"Zdjęcie",time:"Czas",source:"Źródło",cloudNote:"Zdjęcie pojawi się po zapisaniu przez telefon tego samego górnego numeru.",pendingStatus:"Oczekuje",verifiedStatus:"Potwierdzona",invalidStatus:"Błędna",remove:"Usuń",emptyQueue:"Kolejka jest pusta.",emptyCloud:"Brak wpisów w bazie.",noPhoto:"Bez zdjęcia",noCode:"Zeskanuj lub wpisz kod.",added:"Skan dodano do kolejki.",duplicate:"Duplikat jest już w kolejce.",verifiedMessage:n=>`Potwierdzono wpisów: ${n}.`,nothing:"Brak potwierdzonych wpisów do zapisu.",saving:"Zapisywanie i wyszukiwanie zdjęć…",saved:(n,m)=>`Zapisano ${n}. Połączono ze zdjęciem: ${m}.`,saveError:"Nie udało się zapisać. Wpisy pozostają w kolejce.",loadError:"Nie udało się pobrać tabeli. Najpierw uruchom supabase-photo-setup.sql.",confirmClear:"Wyczyścić lokalną kolejkę?"},

};
const $=id=>document.getElementById(id),scanInput=$("scanInput"),queueBody=$("queueBody"),cloudBody=$("cloudBody"),message=$("message");let language=TEXT[localStorage.getItem(LANGUAGE_KEY)]?localStorage.getItem(LANGUAGE_KEY):"nb",product=PRODUCTS[localStorage.getItem(PRODUCT_KEY)]?localStorage.getItem(PRODUCT_KEY):"bunner",queue=loadQueue(),cloudRows=[],timer=null,channel=null;
const deviceId=(()=>{let v=localStorage.getItem(DEVICE_KEY);if(!v){v=`nordic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;localStorage.setItem(DEVICE_KEY,v)}return v})();const t=()=>TEXT[language];
function loadQueue(){try{const v=JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]");return Array.isArray(v)?v:[]}catch{return[]}}function saveQueue(){localStorage.setItem(QUEUE_KEY,JSON.stringify(queue))}function uid(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`}
function normalize(v){return String(v||"").replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim().toUpperCase()}function parseScan(v){const raw=normalize(v),parts=raw.split(/[\s|;,/:]+/).filter(Boolean),upper=parts.find(x=>/^\d{6}$/.test(x))||(raw.match(/\d{6}/)||[""])[0],lower=parts.find(x=>/^[A-Z0-9]{6}$/.test(x)&&x!==upper)||((raw.match(/[A-Z0-9]{6}/g)||[]).find(x=>x!==upper)||"");return{scannerCode:raw,upperNumber:upper,lowerNumber:lower}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}function show(text,type=""){message.textContent=text;message.className=`message ${type}`}
function addScan(){clearTimeout(timer);const p=parseScan(scanInput.value);if(!p.scannerCode){show(t().noCode,"bad");return}if(queue.some(r=>r.scannerCode===p.scannerCode&&r.upperNumber===p.upperNumber)){show(t().duplicate,"warn");scanInput.value="";scanInput.focus();return}queue.push({id:uid(),product,scannerCode:p.scannerCode,upperNumber:p.upperNumber,lowerNumber:p.lowerNumber,status:"pending"});saveQueue();scanInput.value="";show(t().added,"ok");render();scanInput.focus()}
function statusOptions(v){return[["pending",t().pendingStatus],["verified",t().verifiedStatus],["invalid",t().invalidStatus]].map(([k,l])=>`<option value="${k}" ${k===v?"selected":""}>${l}</option>`).join("")}
function renderQueue(){if(!queue.length){queueBody.innerHTML=`<tr><td class="empty" colspan="7">${t().emptyQueue}</td></tr>`;return}queueBody.innerHTML=queue.map((r,i)=>`<tr data-id="${r.id}"><td>${i+1}</td><td><select data-field="product"><option value="bunner" ${r.product==="bunner"?"selected":""}>Bunner</option><option value="hyller30" ${r.product==="hyller30"?"selected":""}>Hyller x30</option><option value="hyller60" ${r.product==="hyller60"?"selected":""}>Hyller x60</option></select></td><td><input class="mono" data-field="scannerCode" value="${esc(r.scannerCode)}"></td><td><input class="mono" data-field="upperNumber" maxlength="6" value="${esc(r.upperNumber)}"></td><td><input class="mono" data-field="lowerNumber" maxlength="6" value="${esc(r.lowerNumber)}"></td><td><select data-field="status">${statusOptions(r.status)}</select></td><td><button class="danger" data-remove="${r.id}">${t().remove}</button></td></tr>`).join("")}
function renderCloud(){if(!cloudRows.length){cloudBody.innerHTML=`<tr><td class="empty" colspan="8">${t().emptyCloud}</td></tr>`;return}cloudBody.innerHTML=cloudRows.map(r=>`<tr><td>${r.photo_url?`<a href="${esc(r.photo_url)}" target="_blank"><img class="thumb" src="${esc(r.photo_url)}" loading="lazy" alt="Mottak photo"></a>`:`<div class="no-photo">${t().noPhoto}</div>`}</td><td>${esc(new Date(r.created_at).toLocaleString())}</td><td>${esc(PRODUCTS[r.product]||r.product)}</td><td class="mono">${esc(r.scanner_code)}</td><td class="mono">${esc(r.upper_number)}</td><td class="mono">${esc(r.lower_number)}</td><td>${esc(r.status)}</td><td>${esc(r.source)}</td></tr>`).join("")}
function renderCounts(){$("queueCount").textContent=queue.length;$("pendingCount").textContent=queue.filter(r=>r.status==="pending").length;$("verifiedCount").textContent=queue.filter(r=>r.status==="verified").length;$("cloudCount").textContent=cloudRows.length;$("photoCount").textContent=cloudRows.filter(r=>r.photo_url).length}
function renderChoices(){document.querySelectorAll("[data-language]").forEach(b=>b.classList.toggle("active",b.dataset.language===language));document.querySelectorAll("[data-product]").forEach(b=>b.classList.toggle("active",b.dataset.product===product))}function render(){renderChoices();renderQueue();renderCloud();renderCounts()}
function applyLanguage(){document.documentElement.lang=language;document.querySelectorAll("[data-t]").forEach(e=>{const v=t()[e.dataset.t];if(typeof v==="string")e.textContent=v});scanInput.placeholder=t().scanTitle;render()}
async function loadCloud(){const q=await client.from(TABLE).select("id,created_at,product,scanner_code,upper_number,lower_number,status,source,device_id,photo_url,photo_path,confidence").order("created_at",{ascending:false}).limit(500);if(q.error){show(`${t().loadError}\n${q.error.message}`,"bad");return false}cloudRows=q.data||[];render();return true}
async function findMatch(row){let q=client.from(TABLE).select("id,scanner_code,upper_number,lower_number,status,source,photo_url").eq("upper_number",row.upperNumber).order("created_at",{ascending:false}).limit(1);if(row.lowerNumber)q=q.eq("lower_number",row.lowerNumber);const r=await q.maybeSingle();if(r.error)throw r.error;return r.data}
async function saveRows(){const checked=queue.filter(r=>r.status!=="pending");if(!checked.length){show(t().nothing,"warn");return}$("saveButton").disabled=true;show(t().saving);let saved=0,matched=0;try{for(const row of checked){const scannerCode=normalize(row.scannerCode),upper=normalize(row.upperNumber).replace(/\D/g,"").slice(0,6),lower=normalize(row.lowerNumber).replace(/[^A-Z0-9]/g,"").slice(0,6);if(!scannerCode||!/^\d{6}$/.test(upper))continue;const existing=await findMatch({...row,upperNumber:upper,lowerNumber:lower});let result;if(existing){const patch={product:row.product,scanner_code:scannerCode,status:row.status,device_id:deviceId,raw_data:scannerCode,verified_at:row.status==="verified"?new Date().toISOString():null};if(!existing.lower_number&&lower)patch.lower_number=lower;result=await client.from(TABLE).update(patch).eq("id",existing.id);if(existing.photo_url)matched++}else{result=await client.from(TABLE).upsert({product:row.product,scanner_code:scannerCode,upper_number:upper,lower_number:lower,status:row.status,source:"nordic_id",device_id:deviceId,raw_data:scannerCode,verified_at:row.status==="verified"?new Date().toISOString():null},{onConflict:"scanner_code,upper_number,lower_number"})}if(result.error)throw result.error;saved++}const ids=new Set(checked.map(r=>r.id));queue=queue.filter(r=>!ids.has(r.id));saveQueue();await loadCloud();show(t().saved(saved,matched),"ok")}catch(e){show(`${t().saveError}\n${e.message||e}`,"bad")}finally{$("saveButton").disabled=false;render();scanInput.focus()}}
scanInput.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();addScan()}});scanInput.addEventListener("input",()=>{clearTimeout(timer);if(scanInput.value.trim())timer=setTimeout(addScan,420)});$("addButton").addEventListener("click",addScan);$("clearButton").addEventListener("click",()=>{scanInput.value="";scanInput.focus()});$("focusButton").addEventListener("click",()=>scanInput.focus());
$("verifyButton").addEventListener("click",()=>{let n=0;queue.forEach(r=>{if(r.scannerCode&&/^\d{6}$/.test(r.upperNumber)){if(r.status!=="verified")n++;r.status="verified"}});saveQueue();show(t().verifiedMessage(n),"ok");render()});$("saveButton").addEventListener("click",saveRows);$("clearQueueButton").addEventListener("click",()=>{if(queue.length&&confirm(t().confirmClear)){queue=[];saveQueue();render()}});$("refreshButton").addEventListener("click",loadCloud);
$("languages").addEventListener("click",e=>{const b=e.target.closest("[data-language]");if(!b)return;language=b.dataset.language;localStorage.setItem(LANGUAGE_KEY,language);applyLanguage()});$("products").addEventListener("click",e=>{const b=e.target.closest("[data-product]");if(!b)return;product=b.dataset.product;localStorage.setItem(PRODUCT_KEY,product);renderChoices();scanInput.focus()});
queueBody.addEventListener("input",e=>{const tr=e.target.closest("tr[data-id]"),field=e.target.dataset.field;if(!tr||!field)return;const row=queue.find(r=>r.id===tr.dataset.id);if(!row)return;let v=e.target.value;if(field==="upperNumber")v=v.replace(/\D/g,"").slice(0,6);if(field==="lowerNumber")v=v.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);if(field==="scannerCode")v=normalize(v);row[field]=v;e.target.value=v;saveQueue();renderCounts()});queueBody.addEventListener("change",e=>{const tr=e.target.closest("tr[data-id]"),field=e.target.dataset.field;if(!tr||!field)return;const row=queue.find(r=>r.id===tr.dataset.id);if(row){row[field]=e.target.value;saveQueue();renderCounts()}});queueBody.addEventListener("click",e=>{const b=e.target.closest("[data-remove]");if(!b)return;queue=queue.filter(r=>r.id!==b.dataset.remove);saveQueue();render()});
channel=client.channel("mottak-live-v2").on("postgres_changes",{event:"*",schema:"public",table:TABLE},()=>loadCloud()).subscribe();applyLanguage();loadCloud();scanInput.focus();
</script>
