<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>INN Nordic ID — felles sky</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #151c30;
      --dark: #0d1426;
      --text: #f5f7ff;
      --muted: #aab4ce;
      --line: #303b59;
      --accent: #f4c430;
      --ok: #48d597;
      --warn: #f6b94b;
      --bad: #ff7373;
      --info: #75b7ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg), #11182a);
    }

    button, input, select, textarea { font: inherit; }
    .app { width: min(1180px, 100%); margin: 0 auto; padding: 14px 12px 48px; }
    .topbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .back { min-height: 44px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--dark); color: var(--text); text-decoration: none; font-weight: 800; }
    .version { color: var(--muted); font-size: 12px; text-align: right; }
    h1 { margin: 14px 0 5px; font-size: clamp(29px, 7vw, 46px); }
    h2 { margin: 0 0 12px; font-size: 21px; }
    .subtitle, .note { color: var(--muted); line-height: 1.5; }
    .card { margin: 13px 0; padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
    .grid3, .actions, .stats { display: grid; gap: 9px; }
    .grid3 { grid-template-columns: repeat(3, 1fr); }
    .actions { grid-template-columns: repeat(3, 1fr); }
    .stats { grid-template-columns: repeat(4, 1fr); }
    button, .link { min-height: 50px; padding: 11px 13px; border: 0; border-radius: 12px; font-weight: 800; cursor: pointer; text-align: center; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .choice, .secondary { color: var(--text); background: var(--dark); border: 2px solid var(--line); }
    .choice.active { color: #17130a; background: var(--accent); border-color: var(--accent); }
    .primary { color: #17130a; background: var(--accent); }
    .success { color: #062418; background: var(--ok); }
    .danger { color: #ffd8dc; background: rgba(255,115,115,.17); border: 1px solid rgba(255,115,115,.45); }
    .link { display: flex; align-items: center; justify-content: center; color: var(--text); background: #2c395c; text-decoration: none; }
    textarea { width: 100%; min-height: 110px; padding: 12px; border: 3px solid var(--accent); border-radius: 12px; background: #070b14; color: var(--text); font: 900 clamp(21px, 5vw, 32px) Consolas, monospace; text-transform: uppercase; outline: none; }
    .message { min-height: 26px; margin-top: 10px; color: var(--muted); white-space: pre-wrap; }
    .message.ok { color: var(--ok); }
    .message.warn { color: var(--warn); }
    .message.bad { color: var(--bad); }
    .stat { padding: 11px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--dark); text-align: center; }
    .stat span { display: block; color: var(--muted); font-size: 11px; }
    .stat strong { display: block; margin-top: 3px; font-size: 30px; }
    .toolbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar > div { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 13px; }
    table { width: 100%; min-width: 980px; border-collapse: collapse; background: var(--dark); }
    th, td { padding: 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { color: var(--muted); background: #111a31; font-size: 11px; text-transform: uppercase; }
    .mono { font-family: Consolas, monospace; font-weight: 800; }
    .thumb { width: 88px; height: 68px; object-fit: cover; border-radius: 9px; background: #070b14; }
    .no-photo { width: 88px; padding: 8px; border: 1px dashed var(--line); border-radius: 9px; color: var(--muted); font-size: 11px; text-align: center; }
    .status-pill { display: inline-block; padding: 5px 8px; border-radius: 999px; font-size: 11px; font-weight: 900; }
    .status-pending { color: #2a1a00; background: var(--warn); }
    .status-verified { color: #062418; background: var(--ok); }
    .status-invalid { color: #2b080d; background: var(--bad); }
    .empty { padding: 22px; text-align: center; color: var(--muted); }

    @media (max-width: 760px) {
      .grid3, .actions, .stats { grid-template-columns: 1fr; }
      .toolbar > div, .toolbar button, .toolbar .link { width: 100%; }
    }
  </style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <a class="back" href="index.html">← Hovedmeny</a>

  <h1 data-t="title">INN — Nordic ID</h1>
  <p class="subtitle" data-t="subtitle"></p>

  <section class="card">
    <div class="grid3" id="languages">
      <button class="choice" data-language="nb">Norsk</button>

    <h2 data-t="chooseProduct"></h2>

  <section class="card">

    <textarea id="scanInput" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="none"></textarea>
    <p class="note" data-t="scanHelp"></p>
    <div class="actions">

      <button class="secondary" id="clearButton" data-t="clear"></button>
      <button class="secondary" id="focusButton" data-t="focus"></button>
    </div>
    <div class="message" id="message" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2 data-t="counts"></h2>
    <div class="stats">
      <div class="stat"><span data-t="all"></span><strong id="allCount">0</strong></div>
      <div class="stat"><span data-t="pending"></span><strong id="pendingCount">0</strong></div>

  <section class="card">
    <div class="toolbar">

        <a class="link" href="camera-live.html" data-t="openCamera"></a>
        <button class="secondary" id="refreshButton" data-t="refresh"></button>

    </div>
    <div class="table-wrap">
      <table>
        <thead>

            <th data-t="time"></th>
            <th data-t="product"></th>
            <th data-t="serviceCode"></th>
            <th data-t="upper"></th>
            <th data-t="lower"></th>
            <th data-t="status"></th>
            <th data-t="source"></th>

          </tr>
        </thead>
        <tbody id="cloudBody"></tbody>
      </table>
    </div>
    <p class="note" data-t="cloudNote"></p>
  </section>
</main>

const $ = id => document.getElementById(id);
let language = TEXT[localStorage.getItem(LANGUAGE_KEY)] ? localStorage.getItem(LANGUAGE_KEY) : "nb";
let product = PRODUCTS[localStorage.getItem(PRODUCT_KEY)] ? localStorage.getItem(PRODUCT_KEY) : "bunner";
let cloudRows = [];
let saving = false;
let timer = null;

const deviceId = (() => {
  let value = localStorage.getItem(DEVICE_KEY);
  if (!value) {
    value = `nordic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    localStorage.setItem(DEVICE_KEY, value);
  }
  return value;
})();

const t = () => TEXT[language];
const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
})[char]);
const compact = value => String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

function show(text, type = "") {
  $("message").textContent = text;
  $("message").className = `message ${type}`;
}

function parseScan(value) {
  const rawData = compact(value);
  const scannerCode = rawData.slice(0, 12);
  const upperNumber = rawData.slice(12, 18);
  const lowerNumber = rawData.slice(18, 24);
  const valid = rawData.length === 24 &&
    /^[A-Z0-9]{12}$/.test(scannerCode) &&
    /^\d{6}$/.test(upperNumber) &&
    /^[A-Z0-9]{6}$/.test(lowerNumber);
  return { rawData, scannerCode, upperNumber, lowerNumber, valid };
}

function renderChoices() {
  document.querySelectorAll("[data-language]").forEach(button => {
    button.classList.toggle("active", button.dataset.language === language);
  });
  document.querySelectorAll("[data-product]").forEach(button => {
    button.classList.toggle("active", button.dataset.product === product);
  });
}

function applyLanguage() {
  document.documentElement.lang = language;
  document.querySelectorAll("[data-t]").forEach(element => {
    const value = t()[element.dataset.t];
    if (typeof value === "string") element.textContent = value;
  });
  $("scanInput").placeholder = t().scanTitle;
  renderChoices();
  renderCloud();
}

function statusPill(status) {
  const safe = ["pending", "verified", "invalid"].includes(status) ? status : "pending";
  const label = safe === "verified" ? t().verified : safe === "invalid" ? t().problem : t().pending;
  return `<span class="status-pill status-${safe}">${esc(label)}</span>`;
}

function renderCounts() {
  $("allCount").textContent = cloudRows.length;
  $("pendingCount").textContent = cloudRows.filter(row => row.status === "pending").length;
  $("verifiedCount").textContent = cloudRows.filter(row => row.status === "verified").length;
  $("photoCount").textContent = cloudRows.filter(row => Boolean(row.photo_url)).length;
}

function renderCloud() {
  const body = $("cloudBody");
  renderCounts();
  if (!cloudRows.length) {
    body.innerHTML = `<tr><td class="empty" colspan="9">${esc(t().empty)}</td></tr>`;
    return;
  }

  body.innerHTML = cloudRows.map(row => `
    <tr>
      <td>${row.photo_url
        ? `<a href="${esc(row.photo_url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(row.photo_url)}" loading="lazy" alt="Mottak"></a>`
        : `<div class="no-photo">${esc(t().noPhoto)}</div>`}
      </td>
      <td>${esc(new Date(row.created_at).toLocaleString())}</td>
      <td>${esc(PRODUCTS[row.product] || row.product || "—")}</td>
      <td class="mono">${esc(row.scanner_code || "—")}</td>
      <td class="mono">${esc(row.upper_number || "—")}</td>
      <td class="mono">${esc(row.lower_number || "—")}</td>
      <td>${statusPill(row.status)}</td>
      <td>${esc(row.source || "—")}</td>
      <td>
        <button class="success" type="button" data-status-id="${esc(row.id)}" data-status-value="verified">${esc(t().approve)}</button>
        <button class="danger" type="button" data-status-id="${esc(row.id)}" data-status-value="invalid">${esc(t().problem)}</button>
      </td>
    </tr>
  `).join("");
}

async function loadCloud() {
  const response = await client
    .from(TABLE)
    .select("id,created_at,product,scanner_code,upper_number,lower_number,status,source,device_id,photo_url,photo_path,confidence,raw_data")
    .order("created_at", { ascending: false })
    .limit(300);

  if (response.error) {
    show(`${t().loadError}\n${response.error.message}`, "bad");
    return false;
  }

  cloudRows = response.data || [];
  renderCloud();
  return true;
}

async function savePending() {
  if (saving) return;
  clearTimeout(timer);

  const parsed = parseScan($("scanInput").value);
  if (!parsed.rawData) {
    show(t().noCode, "bad");
    return;
  }
  if (!parsed.valid) {
    show(`${t().invalidScan}\n${parsed.rawData}`, "bad");
    return;
  }

  saving = true;
  $("saveScanButton").disabled = true;
  show(t().saving);

  try {
    const found = await client
      .from(TABLE)
      .select("id,scanner_code,photo_url,source,status")
      .eq("upper_number", parsed.upperNumber)
      .eq("lower_number", parsed.lowerNumber)
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();

    if (found.error) throw found.error;

    if (found.data?.scanner_code) {
      if (compact(found.data.scanner_code) === parsed.scannerCode) {
        show(t().duplicate, "warn");
        $("scanInput").value = "";
        await loadCloud();
        return;
      }
      show(t().conflict, "bad");
      return;
    }

    let result;
    if (found.data) {
      result = await client
        .from(TABLE)
        .update({
          product,
          scanner_code: parsed.scannerCode,
          status: "pending",
          source: found.data.photo_url ? "camera+nordic_id" : "nordic_id",
          device_id: deviceId,
          raw_data: parsed.rawData
        })
        .eq("id", found.data.id);
    } else {
      result = await client
        .from(TABLE)
        .insert({
          product,
          scanner_code: parsed.scannerCode,
          upper_number: parsed.upperNumber,
          lower_number: parsed.lowerNumber,
          status: "pending",
          source: "nordic_id",
          device_id: deviceId,
          raw_data: parsed.rawData,
          photo_url: "",
          photo_path: ""
        });
    }

    if (result.error) throw result.error;

    show(found.data ? t().linked : t().saved, "ok");
    $("scanInput").value = "";
    await loadCloud();
  } catch (error) {
    show(`${t().saveError}\n${error.message || error}`, "bad");
  } finally {
    saving = false;
    $("saveScanButton").disabled = false;
    $("scanInput").focus();
  }
}

async function updateStatus(id, status) {
  const payload = status === "verified"
    ? { status, verified_at: new Date().toISOString() }
    : { status };

  const response = await client.from(TABLE).update(payload).eq("id", id);
  if (response.error) {
    show(`${t().updateError}\n${response.error.message}`, "bad");
    return;
  }
  await loadCloud();
}

$("scanInput").addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === "Tab") {
    event.preventDefault();
    savePending();
  }
});

$("scanInput").addEventListener("input", () => {
  clearTimeout(timer);
  if ($("scanInput").value.trim()) timer = setTimeout(savePending, 500);
});

$("saveScanButton").addEventListener("click", savePending);
$("clearButton").addEventListener("click", () => {
  $("scanInput").value = "";
  $("scanInput").focus();
  show("");
});
$("focusButton").addEventListener("click", () => $("scanInput").focus());
$("refreshButton").addEventListener("click", loadCloud);

$("languages").addEventListener("click", event => {
  const button = event.target.closest("[data-language]");
  if (!button) return;
  language = button.dataset.language;
  localStorage.setItem(LANGUAGE_KEY, language);
  applyLanguage();
});

$("products").addEventListener("click", event => {
  const button = event.target.closest("[data-product]");
  if (!button) return;
  product = button.dataset.product;
  localStorage.setItem(PRODUCT_KEY, product);
  renderChoices();
  $("scanInput").focus();
});

$("cloudBody").addEventListener("click", event => {
  const button = event.target.closest("[data-status-id]");
  if (!button) return;
  updateStatus(button.dataset.statusId, button.dataset.statusValue);
});

client
  .channel("mottak-nordic-cloud-v3")
  .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, loadCloud)
  .subscribe();

applyLanguage();
loadCloud();
$("scanInput").focus();
</script>
</body>
</html>
