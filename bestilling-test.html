<script>
"use strict";
const BUILD="20260809-2259",frame=document.getElementById("app"),loader=document.getElementById("loader");
function inject(doc,src,mark){return new Promise((ok,bad)=>{if(mark&&doc.querySelector(`script[data-test-module="${mark}"]`))return ok();const s=doc.createElement("script");s.src=`${src}?v=${BUILD}`;if(mark)s.dataset.testModule=mark;s.onload=ok;s.onerror=()=>bad(new Error(`Kunne ikke laste ${src}`));doc.body.appendChild(s)})}

function mark(){try{const d=frame.contentDocument,w=frame.contentWindow;if(!d?.body)return;w.BAMA_HOME_TARGET="bestilling-test.html";let b=d.getElementById("bestillingTestBanner");if(!b){b=d.createElement("div");b.id="bestillingTestBanner";b.style.cssText="margin:10px 0 12px;padding:11px 13px;border:2px solid #48d597;border-radius:14px;background:rgba(72,213,151,.09);color:#eafff6;font:900 13px/1.45 Arial,sans-serif;text-align:center";const h=d.querySelector("h1");if(h?.parentElement)h.insertAdjacentElement("beforebegin",b)}if(b)b.innerHTML="🧪 <b>TEST — UT KONTOR · ISOLERT</b> · Samme bestillingsflyt som WORKING, men lager og ordre er bare <b>ut_test_*</b>.";const v=d.querySelector(".version");if(v)v.innerHTML="TEST · UT Kontor WORKING mirror · 6 PRODUKTER<br>Oppdatert 09.08.2026 kl. 22:59";let home=d.querySelector("a.home");if(home){home.style.display="inline-flex";home.href="test-home.html";home.target="_top";home.onclick=e=>{e.preventDefault();top.location.href="test-home.html"}}}catch{}}
async function refresh(){try{const w=frame.contentWindow;await w.UT_KONTOR_HISTORY_VISUALS?.refreshProgress?.();w.UT_KONTOR_HISTORY_VISUALS?.decorate?.();w.BAMA_COMPACT_STOCK_REFRESH?.();mark()}catch{}}
async function build(){try{const r=await fetch(`bestilling-core-v29.html?v=${BUILD}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);let html=await r.text();html=html.replace(/<script src="office-home-setting\.js[^>]*><\/script>/i,"");html=html.replace("</head>",`<script src="./ut-test-api.js?v=${BUILD}"><\/script></head>`);frame.srcdoc=html}catch(e){loader.textContent=`Kunne ikke laste TEST UT Kontor: ${e.message||e}`}}
frame.addEventListener("load",async()=>{try{const d=frame.contentDocument,w=frame.contentWindow;mark();await inject(d,"ut-kontor-products.js","products");await waitProducts(w);await inject(d,"ut-kontor-history-visuals.js","history");await inject(d,"ut-test-language.js","language");await refresh();w.UT_TEST_LANG?.apply?.();mark();setTimeout(refresh,350);setTimeout(mark,1200);loader.style.display="none"}catch(e){loader.style.display="flex";loader.textContent=`TEST UT Kontor startfeil: ${e.message||e}`}});
build();
