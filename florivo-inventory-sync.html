const STORE='florivo_inventory_v012_dev_sessions_v01',CURRENT='florivo_inventory_v012_dev_current_v01',LANGKEY='florivo_inventory_lang_v02',PRODUCTKEY='florivo_inventory_v012_product_v01',VIEWKEY='florivo_inventory_v012_zone_view_v01';

function openEditor(base,type){pending=base;editType=type||selectedType;$('mKick').textContent=`${zone} · ${base.manual?t('manualShort'):'RFID'}`;$('mTag').textContent=base.tag;$('modalTypes').style.display=base.manual?'grid':'none';if(base.manual)$('modalTypes').innerHTML=TYPES.map(x=>`<button class="type${editType===x?' active':''}" data-mtype="${x}">${label(x)}</button>`).join('');$('modalProduct').textContent=label(editType);updateEditor(true);$('modal').classList.add('show')}
function updateEditor(reset=false){const manualCombo=!!pending?.manual&&editType==='combo';$('batchBox').classList.toggle('show',manualCombo);$('counterBox').hidden=editType==='bunner';$('extBox').hidden=!(editType==='forl_long'||editType==='forl_short');$('qtyLabel').textContent=manualCombo?t('batchH'):(editType==='stack'||editType==='vrak_b'||editType==='no_tag'?t('qtyB'):t('qtyH'));$('batchBLabel').textContent=t('batchB');$('extLabel').textContent=t('qtyF');if(reset){$('batchB').value=manualCombo?1:1;$('qty').value=editType==='stack'||editType==='vrak_b'?10:editType==='forl_long'||editType==='forl_short'?15:(session.defaults?.[zone]?.comboHyller||0);$('extQty').value=''}const vals=editType==='combo'?[3,4,5,30,60]:editType==='forl_long'||editType==='forl_short'?[15,16]:editType==='stack'||editType==='vrak_b'?[10,20,30]:[];$('presets').innerHTML=vals.map(v=>`<button class="preset" data-preset="${v}">${v}</button>`).join('');$('batchResult').hidden=!manualCombo;updateBatch();$('modalProduct').textContent=label(editType)}function updateBatch(){if(!(pending?.manual&&editType==='combo'))return;const b=Math.max(1,+$('batchB').value||1),h=Math.max(0,+$('qty').value||0);$('batchResult').textContent=`${b} Bunner × ${h} Hyller = ${b*h} Hyller`}
function saveRecord(){if(!pending||!zone)return;let b=0,h=0,f=0;const q=Math.max(0,+$('qty').value||0);if(editType==='combo'){if(pending.manual){b=Math.max(1,+$('batchB').value||1);h=b*q}else{b=1;h=q}}else if(editType==='bunner')b=1;else if(editType==='stack'||editType==='vrak_b'||editType==='no_tag')b=q;else if(editType==='vrak_h'){b=1;h=q}else if(editType==='forl_long'||editType==='forl_short'){f=Math.max(0,+$('extQty').value||0);h=q;if(!f)return alert(t('qtyF'))}const m=meta(zone);const r={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),manual:!!pending.manual,sim:!!pending.sim,tag:pending.tag,epc:pending.epc||'',zone,revision:m.revision,type:editType,bunner:b,hyller:h,forlengere:f,teltAt:new Date().toISOString()};session.records.push(r);session.defaults ||= {};session.defaults[zone] ||= {comboHyller:0};if(editType==='combo'&&!session.defaults[zone].comboHyller&&q>0)session.defaults[zone].comboHyller=q;pending=null;$('modal').classList.remove('show');push();render()}
function describe(r){if(r.type==='combo')return `${label(r.type)} · B ${r.bunner} · H ${r.hyller}`;if(r.type==='bunner')return label(r.type);if(r.type==='stack'||r.type==='vrak_b'||r.type==='no_tag')return `${label(r.type)} · ${r.bunner}`;if(r.type==='vrak_h')return `${label(r.type)} · ${r.hyller}`;if(r.type==='forl_long'||r.type==='forl_short')return `${label(r.type)} · ${r.forlengere} · H ${r.hyller}`;return r.type}
function renderJournal(){const a=rows(zone),s=stats(zone);$('journal').innerHTML=a.length?a.slice(-8).reverse().map(r=>`<details class="item"><summary><div class="rowtop"><span class="tag">${r.tag}</span><span class="what">${describe(r)}</span></div></summary><div class="meta">${r.zone} · #${r.revision} · ${new Date(r.teltAt).toLocaleTimeString()}</div></details>`).join(''):`<div class="empty">—</div>`;$('sAll').textContent=s.n;$('sManual').textContent=s.m;$('sBunner').textContent=s.b;$('sHyller').textContent=s.h;$('sForl').textContent=s.f;$('sRfid').textContent=s.rfid;$('activeStats').textContent=`#${meta(zone).revision} · ${s.n} · B ${s.b} · H ${s.h}`}
function simulate(){let n=(session.records||[]).filter(r=>r.sim).length+1;const epc=('E20000172211014418900000'+n.toString(16).toUpperCase().padStart(4,'0')).slice(-24);onEpc(epc,true)}function onEpc(epc,sim=false){const tag=epc.slice(-6);const d=(session.records||[]).find(r=>r.epc===epc||(!r.manual&&r.tag===tag));if(d)return alert(`ALLEREDE TELT · ${d.zone}`);openEditor({manual:false,sim,tag,epc},selectedType)}
function arm(){const i=$('nidInput');i.value='';i.readOnly=false;i.focus();$('scanState').textContent='SCAN';setTimeout(()=>{i.readOnly=true;i.blur();$('scanState').textContent='KLAR'},1600)}
function applyLang(x){lang=x==='uk'?'uk':'no';localStorage.setItem(LANGKEY,lang);$('langNo').classList.toggle('active',lang==='no');$('langUk').classList.toggle('active',lang==='uk');$('title').textContent=t('title');$('subtitle').textContent=t('subtitle');$('startBtn').textContent=t('start');$('zoneTitle').textContent=t('zoneTitle');$('visualBtn').textContent=t('visual');$('tableBtn').textContent=t('table');$('activeLabel').textContent=t('active');$('changeZoneBtn').textContent=t('change');$('productTitle').textContent=t('product');$('manualBtn').textContent=t('manual');$('simulateBtn').textContent=t('simulate');$('focusBtn').textContent=t('focus');$('labAll').textContent=t('all');$('labManual').textContent=t('manualShort');$('labHyller').textContent=t('hyller');$('journalTitle').textContent=t('journal');$('finishZoneBtn').textContent=t('finish');$('recountBtn').textContent=t('recount');$('saveBtn').textContent=t('save');$('cancelBtn').textContent=t('cancel');render()}
function render(){const open=!!session&&session.status==='open';$('startSection').hidden=open;$('zoneSection').hidden=!open||!!zone;$('activeSection').hidden=!open||!zone;$('productSection').hidden=!open||!zone;$('scanSection').hidden=!open||!zone;$('journalSection').hidden=!open||!zone;$('actionsSection').hidden=!open||!zone;if(open&&!zone){renderZones();$('visualZones').hidden=view!=='visual';$('tableZones').hidden=view!=='table';$('visualBtn').classList.toggle('active',view==='visual');$('tableBtn').classList.toggle('active',view==='table')}if(open&&zone){$('activeZone').textContent=zone.toUpperCase();renderTypes();renderJournal();$('scanState').textContent='KLAR'}}
$('langNo').onclick=()=>applyLang('no');$('langUk').onclick=()=>applyLang('uk');$('startBtn').onclick=newSession;$('visualBtn').onclick=()=>{view='visual';localStorage.setItem(VIEWKEY,view);render()};$('tableBtn').onclick=()=>{view='table';localStorage.setItem(VIEWKEY,view);render()};$('warehouse').onclick=e=>{const b=e.target.closest('[data-zone]');if(b){pendingZone=b.dataset.zone;renderZones()}};$('tableZones').onclick=e=>{const b=e.target.closest('[data-zone]');if(b){pendingZone=b.dataset.zone;renderZones()}};$('startZoneBtn').onclick=startZone;$('changeZoneBtn').onclick=showChooser;$('mainTypes').onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;selectedType=b.dataset.type;localStorage.setItem(PRODUCTKEY,selectedType);if(selectedType==='no_tag')openEditor({manual:true,tag:manualNum(),epc:'',sim:false},'no_tag');else renderTypes()};$('manualBtn').onclick=()=>openEditor({manual:true,tag:manualNum(),epc:'',sim:false},selectedType);$('simulateBtn').onclick=simulate;$('focusBtn').onclick=arm;$('modalTypes').onclick=e=>{const b=e.target.closest('[data-mtype]');if(b){editType=b.dataset.mtype;updateEditor(true)}};$('presets').onclick=e=>{const b=e.target.closest('[data-preset]');if(b){$('qty').value=b.dataset.preset;updateBatch()}};document.querySelector('.batch .presets').onclick=e=>{const b=e.target.closest('[data-batch]');if(b){$('batchB').value=b.dataset.batch;updateBatch()}};$('minus').onclick=()=>{$('qty').value=Math.max(0,+$('qty').value-1);updateBatch()};$('plus').onclick=()=>{$('qty').value=(+$('qty').value||0)+1;updateBatch()};$('qty').oninput=updateBatch;$('batchB').oninput=updateBatch;$('saveBtn').onclick=saveRecord;$('cancelBtn').onclick=()=>{pending=null;$('modal').classList.remove('show')};$('finishZoneBtn').onclick=()=>{const m=meta(zone);m.status='completed';m.completedAt=new Date().toISOString();push();showChooser()};$('recountBtn').onclick=()=>{const m=meta(zone);m.revision++;m.status='in_progress';m.startedAt=new Date().toISOString();m.completedAt=null;push();render()};
const input=$('nidInput');input.addEventListener('input',()=>{const epc=String(input.value||'').toUpperCase().replace(/[^0-9A-F]/g,'').slice(0,24);input.value=epc;if(epc.length===24){input.readOnly=true;input.blur();onEpc(epc,false)}});document.addEventListener('keydown',e=>{if(!zone||pending)return;if(e.key==='Unidentified'){arm();return}if(!input.readOnly&&e.key==='Enter'&&input.value){onEpc(String(input.value).toUpperCase().replace(/[^0-9A-F]/g,''),false)}});
applyLang(lang);render();bootstrap().then(()=>{applyLang(lang);render()}).catch(()=>{syncState('bad');render()});
</script></body></html>
