<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Nordic ID Minimal</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:16px;background:#0b1020;color:#f5f7ff;font-family:Arial,sans-serif}
    main{max-width:620px;margin:auto}
    h1{margin:0 0 6px;font-size:32px}
    .version{margin:0 0 18px;color:#aab4ce;font-size:13px}
    textarea{width:100%;min-height:150px;padding:18px;border:4px solid #f4c430;border-radius:18px;outline:none;background:#050811;color:#fff;font:900 26px/1.35 Consolas,monospace;resize:none;overflow-wrap:anywhere}
    textarea:focus{border-color:#48d597;box-shadow:0 0 0 4px rgba(72,213,151,.18)}
    #status{margin:12px 0;padding:13px;border-radius:12px;background:#151c30;color:#aab4ce;font-weight:800}
    #status.ok{color:#48d597}
    #status.bad{color:#ff8d8d}
    .part{margin-top:12px;padding:14px;border:1px solid #303b59;border-radius:14px;background:#151c30}
    .label{display:block;margin-bottom:6px;color:#aab4ce;font-size:13px}
    .value{font:900 26px Consolas,monospace;overflow-wrap:anywhere}
    .count{margin-top:16px;color:#aab4ce;text-align:center}
  </style>
</head>
<body>
<main>
  <h1>Nordic ID — мінімум</h1>
  <p class="version">Minimal v1 · 02.08.2026 19:10</p>

  <textarea id="scanInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="none" placeholder="Натисніть сюди один раз, потім скануйте"></textarea>

  <div id="status">Поле ще не активне.</div>

  <div class="part"><span class="label">Службовий код — 12</span><div id="service" class="value">—</div></div>
  <div class="part"><span class="label">Верхній номер — 6</span><div id="upper" class="value">—</div></div>
  <div class="part"><span class="label">Нижній номер — 6</span><div id="lower" class="value">—</div></div>

  <div class="count">Прийнято сканувань: <strong id="count">0</strong></div>
</main>

<script>
"use strict";

const input = document.getElementById("scanInput");
const status = document.getElementById("status");
const service = document.getElementById("service");
const upper = document.getElementById("upper");
const lower = document.getElementById("lower");
const count = document.getElementById("count");
let total = 0;

function setStatus(text, type="") {
  status.textContent = text;
  status.className = type;
}

function clean(value) {
  return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function accept(raw) {
  const code = clean(raw);

  if (code.length !== 24) {
    setStatus(`Не прийнято: ${code.length} символів замість 24.`, "bad");
  } else if (!/^[A-Z0-9]{12}[0-9]{6}[A-Z0-9]{6}$/.test(code)) {
    setStatus("Не прийнято: неправильний формат коду.", "bad");
  } else {
    service.textContent = code.slice(0, 12);
    upper.textContent = code.slice(12, 18);
    lower.textContent = code.slice(18, 24);
    total += 1;
    count.textContent = total;
    setStatus(`Прийнято: ${code}`, "ok");
  }

  input.value = "";
}

input.addEventListener("focus", () => setStatus("Поле активне. Один раз натисніть курок."));
input.addEventListener("blur", () => setStatus("Поле не активне. Натисніть на нього пальцем."));

input.addEventListener("input", () => {
  const value = input.value;
  const end = value.search(/[\r\n\t]/);
  if (end === -1) return;
  accept(value.slice(0, end));
});

window.addEventListener("pageshow", () => {
  setTimeout(() => {
    try { input.focus({preventScroll:true}); } catch { input.focus(); }
  }, 150);
});
</script>
</body>
</html>
