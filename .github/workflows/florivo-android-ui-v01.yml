name: Florivo Android v0.8.0 LAST 3 + PLAIN NUMBER

on:
  push:
    branches:
      - florivo-v08-last3-plain-number
    paths:
      - 'android-terminal-test/**'
      - '.github/workflows/florivo-android-ui-v01.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        working-directory: android-terminal-test
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Florivo-Android-v0.8.0
          path: android-terminal-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
