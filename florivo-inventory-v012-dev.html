<!DOCTYPE html>
<html lang="nb" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Florivo Inventering V0.12</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}#ui{display:block;width:100%;height:100%;border:0;background:#0b1020}
</style>
</head>
<body class="notranslate">
<iframe id="ui" title="Florivo Inventering V0.12"></iframe>
<script>
'use strict';
const STORE='florivo_inventory_v012_dev_sessions_v01';
const CURRENT='florivo_inventory_v012_dev_current_v01';
const SUPA='https://hzjsatehehhpgpskckfi.supabase.co/rest/v1/florivo_inventory_events';
const KEY='sb_publishable_5swzjbs4yq7N8sDNR00FHA_n1xbnMya';
const H={'apikey':KEY,'Content-Type':'application/json'};
let lastSent='';
let pushing=false;
let uiStarted=false;
let lastServerId=0;
function allSessions(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function currentSession(){const a=allSessions(),id=localStorage.getItem(CURRENT);if(id){const s=a.find(x=>x&&x.id===id);if(s)return s}return a.slice().reverse().find(x=>x&&x.status==='open')||a[a.length-1]||null}
function storeSession(s){if(!s||!s.id)return;const a=allSessions(),i=a.findIndex(x=>x&&x.id===s.id);if(i>=0)a[i]=s;else a.push(s);localStorage.setItem(STORE,JSON.stringify(a));if(s.status==='open')localStorage.setItem(CURRENT,s.id)}
function ts(v){const n=Date.parse(v||'');return Number.isFinite(n)?n:0}
function newerSession(a,b){if(!a)return b;if(!b)return a;return ts(a.startedAt)>=ts(b.startedAt)?a:b}
function mergeZone(a,b){if(!a)return b||null;if(!b)return a;const ar=Number(a.revision||1),br=Number(b.revision||1);if(ar!==br)return ar>br?a:b;const ac=ts(a.completedAt),bc=ts(b.completedAt);if(ac||bc)return ac>=bc?a:b;const as=ts(a.startedAt),bs=ts(b.startedAt);return as>=bs?a:b}
function mergeSameSession(local,server){if(!local)return server;if(!server)return local;if(local.id!==server.id)return newerSession(local,server);const out={...server,...local};const byId=new Map();for(const r of [...(server.records||[]),...(local.records||[])]){if(!r)continue;const k=r.id||[r.tag,r.zone,r.revision,r.teltAt].join('|');if(!byId.has(k))byId.set(k,r)}out.records=[...byId.values()].sort((a,b)=>ts(a.teltAt)-ts(b.teltAt));out.zones={...(server.zones||{})};for(const z of new Set([...Object.keys(server.zones||{}),...Object.keys(local.zones||{})]))out.zones[z]=mergeZone(local.zones?.[z],server.zones?.[z]);out.defaults={...(server.defaults||{}),...(local.defaults||{})};out.startedAt=ts(local.startedAt)>=ts(server.startedAt)?local.startedAt:server.startedAt;out.completedAt=ts(local.completedAt)>=ts(server.completedAt)?local.completedAt:server.completedAt;out.status=(local.status==='completed'||server.status==='completed')?'completed':'open';return out}
async function serverCandidates(){const r=await fetch(SUPA+'?select=id,session_id,payload,created_at&mode=eq.test&source=eq.florivo-inventory&event_type=eq.snapshot&order=created_at.desc&limit=40',{headers:{apikey:KEY}});if(!r.ok)throw Error(await r.text());return await r.json()}
function canonicalEvent(rows){if(!Array.isArray(rows)||!rows.length)return null;return rows.slice().sort((a,b)=>{const sa=ts(a?.payload?.startedAt),sb=ts(b?.payload?.startedAt);if(sa!==sb)return sb-sa;return ts(b.created_at)-ts(a.created_at)})[0]||null}
async function latestServer(){return canonicalEvent(await serverCandidates())}
async function postSnapshot(s){const r=await fetch(SUPA,{method:'POST',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify({session_id:s.id,mode:'test',source:'florivo-inventory',event_type:'snapshot',payload:s})});if(!r.ok)throw Error(await r.text())}
async function reconcileAndPush(force=false){if(pushing)return;pushing=true;try{const local=currentSession();let e=null;try{e=await latestServer()}catch(err){console.error('Inventory server read failed',err)}const server=e?.payload||null;let chosen=null;if(local&&server){if(local.id===server.id)chosen=mergeSameSession(local,server);else chosen=newerSession(local,server)}else chosen=local||server;if(!chosen)return;if(!local||JSON.stringify(local)!==JSON.stringify(chosen))storeSession(chosen);const sig=JSON.stringify(chosen);if(force||sig!==lastSent){await postSnapshot(chosen);lastSent=sig}lastServerId=e?.id||lastServerId}catch(e){console.error('Inventory sync failed',e)}finally{pushing=false}}
async function pullRemote(){if(pushing)return;try{const e=await latestServer();if(!e||!e.payload)return;const local=currentSession();let chosen=local?mergeSameSession(local,e.payload):e.payload;if(local&&local.id!==e.payload.id)chosen=newerSession(local,e.payload);if(!local||JSON.stringify(local)!==JSON.stringify(chosen)){storeSession(chosen);const frame=document.getElementById('ui');try{const modal=frame.contentDocument?.getElementById('modal');if(!modal||!modal.classList.contains('show'))frame.contentWindow.location.reload()}catch{}}lastServerId=e.id}catch(err){console.error('Inventory remote pull failed',err)}}
function startUi(){if(uiStarted)return;uiStarted=true;const q=location.search||'';document.getElementById('ui').src='florivo-inventory-v012-ui.html'+q}
async function bootstrap(){try{const e=await latestServer();const local=currentSession();if(e?.payload){const chosen=local?(local.id===e.payload.id?mergeSameSession(local,e.payload):newerSession(local,e.payload)):e.payload;storeSession(chosen)}}catch(err){console.error('Inventory sync bootstrap failed',err)}startUi();setTimeout(()=>reconcileAndPush(true),500)}
function patchCompletedZoneRecount(){
  const frame=document.getElementById('ui');
  try{
    const d=frame.contentDocument;
    if(!d||!d.body||d.getElementById('florivo-recount-patch'))return;
    const s=d.createElement('script');
    s.id='florivo-recount-patch';
    s.textContent=`
      (function(){
        const oldRenderZoneChooser=renderZoneChooser;
        renderZoneChooser=function(){
          oldRenderZoneChooser();
          if(pendingZone && zoneMeta(pendingZone).status==='completed'){
            const b=document.getElementById('startZoneBtn');
            if(b){b.hidden=false;b.textContent=(lang==='uk'?'↻ ПЕРЕРАХУВАТИ ЗОНУ':'↻ RECOUNT SONE')+' · '+pendingZone.toUpperCase();}
          }
        };
        startPendingZone=function(){
          if(!pendingZone)return;
          const z=pendingZone,m=zoneMeta(z);
          if(m.status==='completed'){
            if(!confirm(t('confirmRecount')))return;
            selectedZone=z;pendingZone='';
            m.revision=(m.revision||1)+1;
            m.status='in_progress';
            m.startedAt=new Date().toISOString();
            m.completedAt=null;
            persist();render();return;
          }
          selectedZone=z;pendingZone='';
          if(m.status==='not_started'){m.status='in_progress';m.startedAt=new Date().toISOString()}
          persist();render();
        };
        const recountButton=document.getElementById('startZoneBtn');
        if(recountButton)recountButton.onclick=startPendingZone;
        render();
      })();`;
    d.body.appendChild(s);
  }catch(e){console.error('Inventory recount patch failed',e)}
}
window.addEventListener('storage',e=>{if(e.key===STORE||e.key===CURRENT)setTimeout(()=>reconcileAndPush(),30)});
setInterval(()=>reconcileAndPush(),1000);
setInterval(()=>pullRemote(),2500);
document.getElementById('ui').addEventListener('load',()=>{try{const w=document.getElementById('ui').contentWindow;if(!w)return;const p=w.location.pathname||'';if(!p.endsWith('/florivo-inventory-v012-ui.html')){location.href=w.location.href;return}patchCompletedZoneRecount()}catch{}});
bootstrap();
</script>
</body>
</html>
