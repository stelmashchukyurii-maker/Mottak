<!DOCTYPE html>
<html lang="nb" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Florivo Inventering V0.12</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}#ui{display:block;width:100%;height:100%;border:0;background:#0b1020}
</style>
</head>
<body class="notranslate">
<iframe id="ui" title="Florivo Inventering V0.12"></iframe>
<script>
'use strict';
const STORE='florivo_inventory_v012_dev_sessions_v01';
const CURRENT='florivo_inventory_v012_dev_current_v01';
const SUPA='https://hzjsatehehhpgpskckfi.supabase.co/rest/v1/florivo_inventory_events';
const KEY='sb_publishable_5swzjbs4yq7N8sDNR00FHA_n1xbnMya';
const H={'apikey':KEY,'Content-Type':'application/json'};
let lastSent='';
let pushing=false;
let uiStarted=false;
function allSessions(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function currentSession(){const a=allSessions(),id=localStorage.getItem(CURRENT);if(id){const s=a.find(x=>x&&x.id===id);if(s)return s}return a.slice().reverse().find(x=>x&&x.status==='open')||a[a.length-1]||null}
function storeSession(s){if(!s||!s.id)return;const a=allSessions(),i=a.findIndex(x=>x&&x.id===s.id);if(i>=0)a[i]=s;else a.push(s);localStorage.setItem(STORE,JSON.stringify(a));if(s.status==='open')localStorage.setItem(CURRENT,s.id)}
async function latestServer(){const r=await fetch(SUPA+'?select=id,payload,created_at&mode=eq.test&source=eq.florivo-inventory&event_type=eq.snapshot&order=created_at.desc&limit=1',{headers:{apikey:KEY}});if(!r.ok)throw Error(await r.text());const a=await r.json();return a[0]||null}
async function pushNow(force=false){const s=currentSession();if(!s||pushing)return;const sig=JSON.stringify(s);if(!force&&sig===lastSent)return;pushing=true;try{const r=await fetch(SUPA,{method:'POST',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify({session_id:s.id,mode:'test',source:'florivo-inventory',event_type:'snapshot',payload:s})});if(!r.ok)throw Error(await r.text());lastSent=sig}catch(e){console.error('Inventory sync push failed',e)}finally{pushing=false}}
function startUi(){if(uiStarted)return;uiStarted=true;const q=location.search||'';document.getElementById('ui').src='florivo-inventory-v012-ui.html'+q}
async function bootstrap(){const local=currentSession();if(local){await pushNow(true);startUi();return}try{const e=await latestServer();if(e&&e.payload)storeSession(e.payload)}catch(err){console.error('Inventory sync bootstrap failed',err)}startUi()}
window.addEventListener('storage',e=>{if(e.key===STORE||e.key===CURRENT)setTimeout(()=>pushNow(),20)});
setInterval(()=>pushNow(),800);
document.getElementById('ui').addEventListener('load',()=>{try{const w=document.getElementById('ui').contentWindow;if(!w)return;const p=w.location.pathname||'';if(!p.endsWith('/florivo-inventory-v012-ui.html'))location.href=w.location.href}catch{}});
bootstrap();
</script>
</body>
</html>
