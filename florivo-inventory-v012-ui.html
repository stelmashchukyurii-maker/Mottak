function zoneMeta(z){if(!session.zones[z])session.zones[z]={status:'not_started',revision:1,startedAt:null,completedAt:null};return session.zones[z]}function zoneDefault(z){if(!session.defaults[z])session.defaults[z]={comboHyller:0};return session.defaults[z]}
function zoneRecords(z,rev=null){return session?session.records.filter(r=>r.zone===z&&(rev==null||r.revision===rev)):[]}function currentMeta(){return selectedZone?zoneMeta(selectedZone):null}
function zoneStats(z){const m=zoneMeta(z),rows=zoneRecords(z,m.revision);return {rows,bunner:rows.reduce((s,r)=>s+(r.bunner||0),0),hyller:rows.reduce((s,r)=>s+(r.hyller||0),0),manual:rows.filter(r=>r.manual).length}}
function selectZone(z,start=false){if(!session||session.status!=='open'||!ZONES.includes(z))return;pendingZone=z;renderZoneChooser();if(start)startPendingZone()}
function startPendingZone(){if(!pendingZone)return;selectedZone=pendingZone;pendingZone='';const m=zoneMeta(selectedZone);if(m.status==='completed'){pendingZone=selectedZone;selectedZone='';render();return}if(m.status==='not_started'){m.status='in_progress';m.startedAt=new Date().toISOString()}persist();render()}
function showZoneChooser(){selectedZone='';pendingZone='';render()}
function manualNumber(){let n=0;for(const r of session.records){const m=/^MAN-(\d+)$/.exec(r.tag||'');if(m)n=Math.max(n,+m[1])}return 'MAN-'+String(n+1).padStart(3,'0')}
function statusText(m){return m.status==='completed'?t('zoneDone'):m.status==='in_progress'?t('zoneOpen'):t('zoneNot')}
function renderZoneChooser(){document.querySelectorAll('#warehouse [data-zone]').forEach(el=>{const z=el.dataset.zone,m=session?zoneMeta(z):{status:'not_started'},s=session?zoneStats(z):{rows:[],bunner:0,hyller:0};el.classList.toggle('selected',pendingZone===z);const sm=el.querySelector('small');if(sm)sm.textContent=`${statusText(m)} · ${s.rows.length} ${t('records')} · B ${s.bunner} · H ${s.hyller}`});document.querySelectorAll('#tableZones [data-zone]').forEach(el=>{const z=el.dataset.zone,m=zoneMeta(z),s=zoneStats(z);el.classList.toggle('selected',pendingZone===z);const sm=el.querySelector('small');if(sm)sm.textContent=`${statusText(m)} · ${s.rows.length} · B ${s.bunner} · H ${s.hyller}`});$('zoneInfo').innerHTML=pendingZone?`${t('chooseZone')} <b>${pendingZone}</b>`:t('chooseZone');$('startZoneBtn').hidden=!pendingZone;$('startZoneBtn').textContent=pendingZone?`${t('startZone')} ${pendingZone.toUpperCase()}`:t('startZone')}
function renderTableZones(){$('tableZones').innerHTML=ZONES.map(z=>`<button class="zoneRow${pendingZone===z?' selected':''}" data-zone="${z}"><span>${z.toUpperCase()}</span><small></small></button>`).join('');renderZoneChooser()}
function showView(v){view=v==='table'?'table':'visual';localStorage.setItem(VIEWKEY,view);$('visualBtn').classList.toggle('active',view==='visual');$('tableBtn').classList.toggle('active',view==='table');$('visualZones').hidden=view!=='visual';$('tableZones').hidden=view!=='table';if(view==='table')renderTableZones()}
function renderMainTypes(){$('mainTypes').innerHTML=DISPLAY_TYPES.map(x=>`<button class="type${selectedType===x?' active':''}${x==='no_tag'?' manualonly':''}" data-type="${x}">${typeLabel(x)}</button>`).join('');$('productCurrent').textContent=typeLabel(selectedType)}
function chooseType(x){if(x==='no_tag'){openEditor({manual:true,tag:manualNumber(),epc:'',sim:false},'no_tag');return}if(!MAIN_TYPES.includes(x))return;selectedType=x;localStorage.setItem(PRODUCTKEY,x);renderMainTypes()}
function qtyDef(type){if(type==='bunner')return 1;if(type==='stack'||type==='vrak_b')return 10;if(isExt(type))return 15;if(type==='combo')return selectedZone?zoneDefault(selectedZone).comboHyller||0:0;return 0}
function openEditor(base,type){pending=base;editType=type||selectedType;$('mKick').textContent=`${selectedZone} · ${base.manual?t('manualRecord'):base.sim?t('simRecord'):t('rfidRecord')}`;$('mTag').textContent=base.tag;$('modalTypes').style.display=base.manual?'grid':'none';if(base.manual)$('modalTypes').innerHTML=MANUAL_TYPES.map(x=>`<button class="type${editType===x?' active':''}${x==='no_tag'?' manualonly':''}" data-mtype="${x}">${typeLabel(x)}</button>`).join('');$('modalProduct').textContent=typeLabel(editType);$('extQty').value='';$('batchQty').value='1';$('qty').value=qtyDef(editType);$('expr').value='';$('calcResult').textContent='= 0';updateModal();$('modal').classList.add('show')}
function batchMode(){return !!pending?.manual&&editType==='combo'}
function updateBatchPreview(){const b=Math.max(1,parseInt($('batchQty').value,10)||1),h=Math.max(0,parseInt($('qty').value,10)||0);$('batchResult').textContent=`${b} Bunner × ${h} Hyller = ${b*h} Hyller`}
function updateModal(){$('modalProduct').textContent=typeLabel(editType);$('batchLabel').textContent=t('batchB');$('batchBox').classList.toggle('show',batchMode());$('qtyLabel').textContent=batchMode()?t('perB'):(editType==='stack'||editType==='vrak_b'||editType==='no_tag')?t('qtyB'):t('qtyH');$('extLabel').textContent=t('qtyF');$('calcLabel').textContent=t('calc');$('defaultBtn').textContent=t('setDefault');$('defaultBtn').classList.toggle('show',editType==='combo');$('calc').classList.toggle('show',!!pending?.manual);$('counterBox').style.display=editType==='bunner'?'none':'block';$('extBox').classList.toggle('show',isExt(editType));const vals=editType==='combo'?[3,4,5,30,60]:isExt(editType)?[15,16]:editType==='stack'||editType==='vrak_b'?[10,20,30]:[];$('presets').innerHTML=vals.map(v=>`<button class="preset" data-preset="${v}">${v}</button>`).join('');if(pending?.manual)$('modalTypes').innerHTML=MANUAL_TYPES.map(x=>`<button class="type${editType===x?' active':''}${x==='no_tag'?' manualonly':''}" data-mtype="${x}">${typeLabel(x)}</button>`).join('');if(batchMode())updateBatchPreview()}
function closeEditor(){pending=null;$('modal').classList.remove('show')}
function calcExpr(){const p=$('expr').value.replace(/[^0-9+]/g,'').split('+').filter(Boolean),n=p.reduce((s,x)=>s+(parseInt(x,10)||0),0);$('calcResult').textContent='= '+n;if(p.length){$('qty').value=n;if(batchMode())updateBatchPreview()}}
function saveRecord(){if(!pending||!selectedZone)return;const qty=Math.max(0,parseInt($('qty').value,10)||0);let bunner=0,hyller=0,forlengere=0,batchBunner=0,hyllerPerBunner=0;if(editType==='combo'){if(batchMode()){batchBunner=Math.max(1,parseInt($('batchQty').value,10)||1);hyllerPerBunner=qty;bunner=batchBunner;hyller=batchBunner*qty}else{bunner=1;hyller=qty}}else if(editType==='bunner')bunner=1;else if(editType==='stack'||editType==='vrak_b'||editType==='no_tag')bunner=qty;else if(editType==='vrak_h'){bunner=1;hyller=qty}else if(isExt(editType)){forlengere=Math.max(0,parseInt($('extQty').value,10)||0);hyller=qty;if(!forlengere){alert(t('needF'));return}}const m=currentMeta(),r={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),manual:!!pending.manual,sim:!!pending.sim,tag:pending.tag,epc:pending.epc||'',zone:selectedZone,revision:m.revision,type:editType,bunner,hyller,forlengere,batchBunner,hyllerPerBunner,teltAt:new Date().toISOString()};session.records.push(r);if(editType==='combo'&&!zoneDefault(selectedZone).comboHyller&&qty>0)zoneDefault(selectedZone).comboHyller=qty;persist();closeEditor();$('scanState').textContent=t('saved');$('scanState').className='scanstate';render();setTimeout(()=>{$('scanState').textContent=t('ready')},700)}
function describe(r){if(r.type==='combo'){if((r.batchBunner||0)>1)return `${r.batchBunner} Bunner × ${r.hyllerPerBunner||0} Hyller = ${r.hyller} Hyller`;return `${typeLabel(r.type)} · ${r.hyller}`}if(r.type==='bunner')return typeLabel(r.type);if(r.type==='stack'||r.type==='vrak_b'||r.type==='no_tag')return `${typeLabel(r.type)} · ${r.bunner}`;if(r.type==='vrak_h')return `${typeLabel(r.type)} · ${r.hyller}`;if(isExt(r.type))return `${typeLabel(r.type)} · ${r.forlengere} stk. · ${r.hyller} ${t('hyller')}`;return r.type}
function renderJournal(){if(!session||!selectedZone)return;const m=currentMeta(),rows=zoneRecords(selectedZone,m.revision);$('journalCount').textContent=rows.length;$('journal').innerHTML=rows.length?rows.slice().reverse().map(r=>`<details class="item"><summary><div class="rowtop"><span class="tag">${r.tag}</span><span class="what">${describe(r)}</span></div></summary><div class="meta">${r.manual?t('manualRecord'):r.sim?t('simRecord'):t('rfidRecord')} · ${r.zone} · ${t('revision')} ${r.revision}<br>${new Date(r.teltAt).toLocaleTimeString(lang==='uk'?'uk-UA':'nb-NO',{hour:'2-digit',minute:'2-digit'})}${r.epc?`<br>EPC: ${r.epc}`:''}</div></details>`).join(''):`<div class="empty">${t('empty')}</div>`;const all=rows;$('sAll').textContent=all.length;$('sRfid').textContent=all.filter(r=>!r.manual).length;$('sManual').textContent=all.filter(r=>r.manual).length;$('sBunner').textContent=all.reduce((s,r)=>s+(r.bunner||0),0);$('sHyller').textContent=all.reduce((s,r)=>s+(r.hyller||0),0);$('sForl').textContent=all.reduce((s,r)=>s+(r.forlengere||0),0);const last=all[all.length-1];$('last').textContent=last?`${t('lastPrefix')}: ${last.tag} · ${describe(last)}`:t('last')}
function finishZone(){if(!selectedZone||!confirm(t('confirmZone')))return;const m=currentMeta();m.status='completed';m.completedAt=new Date().toISOString();persist();showZoneChooser()}
function recountZone(){if(!selectedZone||!confirm(t('confirmRecount')))return;const z=selectedZone,m=currentMeta();m.revision=(m.revision||1)+1;m.status='in_progress';m.startedAt=new Date().toISOString();m.completedAt=null;persist();render()}
function finishAll(){if(!session||!confirm(t('confirmAll')))return;session.status='completed';session.completedAt=new Date().toISOString();persist();localStorage.removeItem(CURRENT);session=null;selectedZone='';pendingZone='';render()}
function cancelSession(){if(!session||!confirm(t('confirmCancel')))return;localStorage.removeItem(CURRENT);session=null;selectedZone='';pendingZone='';render()}
function simulateRfid(){if(!selectedZone)return;let n=session.records.filter(r=>r.sim).length+1,epc=('E2000017221101441890'+n.toString(16).toUpperCase().padStart(4,'0')).slice(-24);while(session.records.some(r=>r.epc===epc)){n++;epc=('E2000017221101441890'+n.toString(16).toUpperCase().padStart(4,'0')).slice(-24)}onEpc(epc,true)}
function normalize(v){return String(v||'').toUpperCase().replace(/[^0-9A-F]/g,'').slice(0,24)}function onEpc(epc,sim=false){if(!session||!selectedZone)return;const tag=epc.slice(-6),dup=session.records.find(r=>r.epc===epc||(!r.manual&&r.tag===tag));if(dup){$('scanState').textContent=t('bad');$('scanState').className='scanstate bad';$('last').textContent=`${t('already')} · ${tag} · ${t('alreadyZone')} ${dup.zone} · ${t('revision')} ${dup.revision}`;return}openEditor({manual:false,sim,tag,epc},selectedType)}
function arm(){if(!session||!selectedZone||pending)return;const input=$('nidInput');input.value='';input.readOnly=false;try{input.focus({preventScroll:true})}catch{}$('scanState').textContent='SCAN';clearTimeout(armTimer);armTimer=setTimeout(()=>{input.readOnly=true;try{input.blur()}catch{}$('scanState').textContent=t('ready')},1600)}
function commitValue(raw){const epc=normalize(raw),input=$('nidInput');input.value='';input.readOnly=true;try{input.blur()}catch{}if(performance.now()<lockUntil)return;lockUntil=performance.now()+600;if(epc.length!==24){$('scanState').textContent=t('bad');$('scanState').className='scanstate bad';$('last').textContent=`RFID: ${epc.length}/24 HEX`;setTimeout(()=>{$('scanState').textContent=t('ready');$('scanState').className='scanstate'},1000);return}onEpc(epc,false)}
function applyLang(x){lang=x==='uk'?'uk':'no';localStorage.setItem(LANGKEY,lang);document.documentElement.lang=lang==='uk'?'uk':'nb';$('langNo').classList.toggle('active',lang==='no');$('langUk').classList.toggle('active',lang==='uk');$('banner').textContent=t('banner');$('pageTitle').textContent=t('title');$('subtitle').textContent=t('subtitle');$('sessionLabel').textContent=t('session');$('startBtn').textContent=t('start');$('zoneTitle').textContent=t('zoneTitle');$('visualBtn').textContent=t('visual');$('tableBtn').textContent=t('table');$('finishAllBtn').textContent=t('finishAll');$('currentZoneLabel').textContent=t('currentZone');$('changeZoneBtn').textContent=t('changeZone');$('productTitle').textContent=t('productTitle');$('productHint').textContent=t('productHint');$('manualBtn').textContent=t('manual');$('simulateBtn').textContent=t('simulate');$('focusBtn').textContent=t('focus');$('labAll').textContent=t('all');$('labManual').textContent=t('manualShort');$('labHyller').textContent=t('hyller');$('journalTitle').textContent=t('journal');$('finishZoneBtn').textContent=t('finishZone');$('recountBtn').textContent=t('recount');$('cancelSessionBtn').textContent=t('cancelSession');$('backLink').textContent=t('back');$('saveBtn').textContent=t('save');$('cancelBtn').textContent=t('cancel');render()}
function render(){const open=!!session&&session.status==='open';$('sessionId').textContent=session?.id||'—';$('startSection').hidden=!!session;$('zoneSection').hidden=!open||!!selectedZone;$('workSection').hidden=!open||!selectedZone;$('productSection').hidden=!open||!selectedZone;$('scanSection').hidden=!open||!selectedZone;$('journalSection').hidden=!open||!selectedZone;$('zoneFinishSection').hidden=!open||!selectedZone;if(open&&!selectedZone){renderTableZones();renderZoneChooser();showView(view)}if(open&&selectedZone){const m=currentMeta(),s=zoneStats(selectedZone);$('currentZone').textContent=selectedZone.toUpperCase();$('revisionLabel').textContent=`${t('revision')}: ${m.revision} · ${s.rows.length} ${t('records')} · B ${s.bunner} · H ${s.hyller}`;$('scanState').textContent=t('ready');$('scanState').className='scanstate';renderMainTypes();renderJournal()}if(pending)updateModal()}
$('langNo').onclick=()=>applyLang('no');$('langUk').onclick=()=>applyLang('uk');$('startBtn').onclick=newSession;$('visualBtn').onclick=()=>showView('visual');$('tableBtn').onclick=()=>showView('table');$('warehouse').onclick=e=>{const b=e.target.closest('[data-zone]');if(b)selectZone(b.dataset.zone)};$('tableZones').onclick=e=>{const b=e.target.closest('[data-zone]');if(b)selectZone(b.dataset.zone)};$('startZoneBtn').onclick=startPendingZone;$('changeZoneBtn').onclick=showZoneChooser;$('manualBtn').onclick=()=>openEditor({manual:true,sim:false,tag:manualNumber(),epc:''},'no_tag');$('simulateBtn').onclick=simulateRfid;$('focusBtn').onclick=arm;$('mainTypes').onclick=e=>{const b=e.target.closest('[data-type]');if(b)chooseType(b.dataset.type)};$('modalTypes').onclick=e=>{const b=e.target.closest('[data-mtype]');if(b){editType=b.dataset.mtype;$('qty').value=qtyDef(editType);$('batchQty').value='1';updateModal()}};$('presets').onclick=e=>{const b=e.target.closest('[data-preset]');if(b){$('qty').value=b.dataset.preset;if(batchMode())updateBatchPreview()}};document.querySelector('.batchPresets').onclick=e=>{const b=e.target.closest('[data-batch]');if(b){$('batchQty').value=b.dataset.batch;updateBatchPreview()}};$('batchMinus').onclick=()=>{$('batchQty').value=Math.max(1,(+$('batchQty').value||1)-1);updateBatchPreview()};$('batchPlus').onclick=()=>{$('batchQty').value=(+$('batchQty').value||1)+1;updateBatchPreview()};$('batchQty').oninput=updateBatchPreview;$('qty').oninput=()=>{if(batchMode())updateBatchPreview()};$('minusBtn').onclick=()=>{$('qty').value=Math.max(0,(+$('qty').value||0)-1);if(batchMode())updateBatchPreview()};$('plusBtn').onclick=()=>{$('qty').value=(+$('qty').value||0)+1;if(batchMode())updateBatchPreview()};$('expr').oninput=calcExpr;$('defaultBtn').onclick=()=>{if(selectedZone&&editType==='combo'){zoneDefault(selectedZone).comboHyller=Math.max(0,+$('qty').value||0);persist();$('defaultBtn').textContent=`✓ ${t('defaultNow')}: ${zoneDefault(selectedZone).comboHyller}`}};$('saveBtn').onclick=saveRecord;$('cancelBtn').onclick=closeEditor;$('finishZoneBtn').onclick=finishZone;$('recountBtn').onclick=recountZone;$('finishAllBtn').onclick=finishAll;$('cancelSessionBtn').onclick=cancelSession;
const input=$('nidInput');document.addEventListener('keydown',e=>{if(!session||!selectedZone||pending)return;if(e.key==='Unidentified'){arm();return}if((e.key==='Enter'||e.key==='Tab')&&!input.readOnly&&input.value){e.preventDefault();commitValue(input.value);return}const editable=e.target&&e.target!==input&&(e.target.matches?.('input,textarea,select')||e.target.isContentEditable);if(!editable&&input.readOnly&&/^[0-9a-fA-F]$/.test(e.key)){e.preventDefault();globalBuffer=(globalBuffer+e.key).toUpperCase().slice(0,24);$('scanState').textContent='SCAN';clearTimeout(globalTimer);if(globalBuffer.length>=24){const v=globalBuffer;globalBuffer='';commitValue(v);return}globalTimer=setTimeout(()=>{if(globalBuffer){const v=globalBuffer;globalBuffer='';commitValue(v)}},150)}},true);input.addEventListener('input',()=>{input.value=normalize(input.value);clearTimeout(idleTimer);if(input.value.length>=24){commitValue(input.value);return}idleTimer=setTimeout(()=>{if(input.value)commitValue(input.value)},150)});
session=loadCurrent();if(session&&session.status!=='open')session=null;const q=new URLSearchParams(location.search),qz=q.get('zone'),auto=q.get('autostart')==='1';if(!session&&auto&&ZONES.includes(qz)){newSession()}else if(session&&ZONES.includes(qz)){selectZone(qz,true)}applyLang(lang);render();
</script>
