<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>GREEN — UT Lager</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}#loader{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#0b1020;color:#f5f7ff;font:900 18px/1.5 Arial,sans-serif;text-align:center;z-index:5}#loader b{color:#48d597}</style>
</head>
<body>
<div id="loader"><div><b>GREEN — UT Lager</b><br><br>Laster siste arbeidsversjon…</div></div>
<iframe id="app" src="utsending.html?v=20260808-1530" title="GREEN — UT Lager"></iframe>
<script>
"use strict";
const frame=document.getElementById("app"),loader=document.getElementById("loader");
function patchLinks(doc){
  if(!doc)return;
  doc.querySelectorAll('a[href="index.html"],a[href$="/index.html"]').forEach(a=>a.href="green-home.html?v=20260808-1530");
}
function patchCore(){
  try{
    const doc=frame.contentDocument;
    patchLinks(doc);
    const inner=doc.getElementById("utCore");
    if(inner){
      const apply=()=>{
        try{
          const d=inner.contentDocument;patchLinks(d);
          const v=d?.querySelector(".version");
          if(v)v.innerHTML="GREEN · UT Lager v27.12 AVBRYT<br>Oppdatert 08.08.2026 kl. 15:30";
        }catch{}
      };
      inner.addEventListener("load",()=>{setTimeout(apply,250);setTimeout(apply,800)});
      setTimeout(apply,350);setTimeout(apply,1000);
    }
    loader.style.display="none";
  }catch(e){loader.textContent=`GREEN UT Lager startfeil: ${e.message||e}`}
}
frame.addEventListener("load",patchCore,{once:true});
</script>
</body>
</html>
