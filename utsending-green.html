<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GREEN — UT Lager v27.15 · Shared DB</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020}#utCore{display:block;width:100%;min-height:100vh;border:0;background:#0b1020}#utFloatScan{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));z-index:99999;min-height:58px;padding:9px 16px;border:2px solid #48d597;border-radius:999px;background:#48d597;color:#062418;font:950 15px Arial,sans-serif;box-shadow:0 14px 34px rgba(0,0,0,.48);touch-action:manipulation}#utHint{position:fixed;right:12px;bottom:82px;z-index:99998;display:none;max-width:min(330px,calc(100vw - 24px));padding:10px 12px;border:1px solid #303b59;border-radius:12px;background:#151c30;color:#f5f7ff;font:700 13px/1.4 Arial,sans-serif}#utHint.show{display:block}#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:100000}
</style>
</head>
<body>
<div id="loader">Laster GREEN — UT Lager…</div>
<iframe id="utCore" title="GREEN — UT Lager og utsending"></iframe>
<button id="utFloatScan" type="button">📷 <span id="utFloatText">Kamera GREEN</span></button><div id="utHint"></div>
<script>
"use strict";
const VERSION="20260809-0004";
const f=document.getElementById("utCore"),scan=document.getElementById("utFloatScan"),scanText=document.getElementById("utFloatText"),hint=document.getElementById("utHint"),loader=document.getElementById("loader");
let hintTimer=0,openTries=0,extraOrderId=null,brandTimer=0;
function resize(){try{const d=f.contentDocument;f.style.height=Math.max(innerHeight,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+"px"}catch{}}
function inject(d,src){return new Promise((resolve,reject)=>{const s=d.createElement("script");s.src=`${src}?v=${VERSION}`;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)})}
function lang(){try{return f.contentWindow.UT_LANG||localStorage.getItem("mottak_ut_language")||"nb"}catch{return"nb"}}
function tx(){
  if(lang()==="uk")return{cam:"Камера GREEN",open:"Спочатку відкрийте потрібну рампу.",done:"Ця рампа вже завершена.",camera:"📷 Камера GREEN — сканувати на",bulk:"☑ Масове сканування",later:"пізніше",bulkNotConnected:"Масове сканування ще не підключене до GREEN.",banner:"🟢 <b>GREEN — ПАРАЛЕЛЬНИЙ КЛОН · СПІЛЬНА БАЗА</b> · GREEN і WORKING працюють з тими самими нормальними замовленнями та складом. Окремий UT TEST залишається ізольованим."};
  if(lang()==="pl")return{cam:"Aparat GREEN",open:"Najpierw otwórz właściwą rampę.",done:"Ta rampa jest już zakończona.",camera:"📷 Aparat GREEN — skanuj do",bulk:"☑ Skanowanie masowe",later:"później",bulkNotConnected:"Skanowanie masowe nie jest jeszcze podłączone do GREEN.",banner:"🟢 <b>GREEN — KLON RÓWNOLEGŁY · WSPÓLNA BAZA</b> · GREEN i WORKING korzystają z tych samych normalnych zamówień i magazynu. Oddzielny UT TEST pozostaje izolowany."};
  return{cam:"Kamera GREEN",open:"Åpne først riktig rampe.",done:"Denne rampen er allerede avsluttet.",camera:"📷 Kamera GREEN — skann til",bulk:"☑ Masseskanning",later:"senere",bulkNotConnected:"Masseskanning er ikke koblet til GREEN ennå.",banner:"🟢 <b>GREEN — PARALLELL KLONE · FELLES DATABASE</b> · GREEN og WORKING bruker de samme normale ordrene og samme lager. Egen UT TEST forblir isolert."};
}
function order(){try{return typeof f.contentWindow.current==="function"?f.contentWindow.current():null}catch{return null}}
function note(text){clearTimeout(hintTimer);hint.textContent=text;hint.classList.add("show");hintTimer=setTimeout(()=>hint.classList.remove("show"),2800)}
function cameraUrl(o){return`ut-camera-v5.html?order=${encodeURIComponent(o.id)}&ramp=${encodeURIComponent(o.ramp||"")}&from=green&v=${VERSION}`}
function goCamera(){const o=order();if(!o)return note(tx().open);if(["completed","cancelled"].includes(o.status))return note(tx().done);location.href=cameraUrl(o)}
function hideOldStock(d){let s=d.getElementById("utHideOldStock");if(!s){s=d.createElement("style");s.id="utHideOldStock";s.textContent=".stock-card{display:none!important}";d.head.appendChild(s)}}
function bindExtraDraftGuard(d){
  if(d.__greenExtraDraftGuardBound)return;
  d.__greenExtraDraftGuardBound=true;
  d.addEventListener("input",event=>{const el=event.target;if(el?.matches?.("[data-extra-hyller],[data-extra-forlengere]"))el.dataset.extraDirty="1"},true);
}
function refreshExtra(d,w,force=false){
  const o=order(),nextId=o?.id||null,changed=nextId!==extraOrderId,block=d.getElementById("utTestExtraProducts"),dirty=Boolean(block?.querySelector('[data-extra-dirty="1"]'));
  if(force||changed||!dirty){w.UT_EXTRA_PRODUCTS_REFRESH?.();extraOrderId=nextId}
}
function replaceTestBrand(root){if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{if(n.nodeValue?.includes("TEST"))n.nodeValue=n.nodeValue.replaceAll("TEST","GREEN")})}
function markGreen(d){
  if(!d)return;
  const v=d.querySelector(".version");if(v)v.innerHTML="GREEN · UT Lager v27.15 · SHARED DB<br>Oppdatert 09.08.2026 kl. 00:04";
  let banner=d.getElementById("utGreenCloneBanner");
  if(!banner){banner=d.createElement("div");banner.id="utGreenCloneBanner";banner.style.cssText="margin:10px 0 12px;padding:11px 13px;border:2px solid #48d597;border-radius:14px;background:rgba(72,213,151,.09);color:#eafff6;font:900 13px/1.45 Arial,sans-serif;text-align:center";const main=d.querySelector("main.app,main,.app"),title=d.querySelector("h1");if(title?.parentElement)title.insertAdjacentElement("beforebegin",banner);else main?.prepend(banner)}
  banner.innerHTML=tx().banner;
  const old=d.getElementById("utTestCloneBanner");if(old)old.remove();
  replaceTestBrand(d.getElementById("utTestExtraProducts"));
  const home=d.querySelector("a.home");if(home&&!home.dataset.greenBound){home.dataset.greenBound="1";home.href="green-home.html";home.target="_top";home.addEventListener("click",e=>{e.preventDefault();window.top.location.href="green-home.html"},{capture:true})}
}
function tools(d){const box=d.getElementById("scanBox"),o=order();if(!box)return;d.querySelector('[data-mode="photo"]')?.classList.add("hidden");d.getElementById("photoPanel")?.classList.add("hidden");let wrap=d.getElementById("utFastTools");if(!wrap){wrap=d.createElement("div");wrap.id="utFastTools";wrap.style.cssText="display:grid;gap:9px;margin:0 0 13px";wrap.innerHTML='<button id="utDedicatedCameraButton" type="button"></button><button id="utBulkButton" type="button"></button>';box.insertAdjacentElement("beforebegin",wrap)}const c=d.getElementById("utDedicatedCameraButton"),b=d.getElementById("utBulkButton"),r=o?.ramp||"—",disabled=!o||["completed","cancelled"].includes(o.status);c.style.cssText="width:100%;min-height:64px;border:0;border-radius:14px;background:#48d597;color:#062418;font-weight:950;font-size:18px;touch-action:manipulation";b.style.cssText="width:100%;min-height:60px;border:2px solid #303b59;border-radius:14px;background:#0d1426;color:#aab4ce;font-weight:950;font-size:17px;touch-action:manipulation";c.textContent=`${tx().camera} RAMPE ${r}`;b.textContent=`${tx().bulk} · ${tx().later}`;c.disabled=disabled;b.disabled=true;c.onclick=goCamera;b.onclick=()=>note(tx().bulkNotConnected)}
function scrollToOpenedRamp(){try{resize();const d=f.contentDocument,w=f.contentWindow,detail=d.getElementById("detail");if(!detail||!detail.classList.contains("show"))return;requestAnimationFrame(()=>requestAnimationFrame(()=>{try{resize();const frameTop=f.getBoundingClientRect().top+window.scrollY,innerTop=detail.getBoundingClientRect().top+(w.scrollY||0);window.scrollTo({top:Math.max(0,frameTop+innerTop-10),behavior:"smooth"})}catch{}}))}catch{}}
function afterRender(forceExtra=false){try{const d=f.contentDocument,w=f.contentWindow;hideOldStock(d);tools(d);bindExtraDraftGuard(d);w.UT_LANGUAGE_APPLY?.();w.UT_PRODUCTION_ENHANCE?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();refreshExtra(d,w,forceExtra);markGreen(d);scanText.textContent=tx().cam;resize();setTimeout(()=>{markGreen(d);resize()},100)}catch{}}
function patchCore(){const w=f.contentWindow;if(w.__BAMA_GREEN_CLONE_PATCH__)return;w.__BAMA_GREEN_CLONE_PATCH__=true;
  if(typeof w.openOrder==="function"){const original=w.openOrder;w.openOrder=async function(id){const result=await original.call(w,id,false);afterRender(true);setTimeout(scrollToOpenedRamp,60);return result}}
  if(typeof w.renderDetail==="function"){const original=w.renderDetail;w.renderDetail=function(...args){const result=original.apply(w,args);queueMicrotask(()=>afterRender(false));return result}}
  if(typeof w.renderRamps==="function"){const original=w.renderRamps;w.renderRamps=function(...args){const result=original.apply(w,args);queueMicrotask(()=>{try{w.UT_LANGUAGE_APPLY?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();markGreen(f.contentDocument);resize()}catch{}});return result}}
  if(typeof w.loadAll==="function"){const original=w.loadAll;w.loadAll=async function(...args){const result=await original.apply(w,args);try{await w.UT_PRODUCT_STOCK_REFRESH?.()}catch{}afterRender(false);return result}}
}
function openRequested(){const id=new URLSearchParams(location.search).get("open");if(!id)return;try{const w=f.contentWindow;if(typeof w.openOrder==="function"){w.openOrder(id);history.replaceState(null,"","utsending-green.html");return}}catch{}if(openTries++<20)setTimeout(openRequested,250)}
async function build(){
  try{const response=await fetch(`utsending-core-v7.html?v=${VERSION}`,{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);let html=await response.text();html=html.replace("</head>",`<script src="./green-ut-api.js?v=${VERSION}"><\/script></head>`);f.srcdoc=html}catch(error){loader.textContent=`Kunne ikke laste GREEN UT Lager: ${error.message||error}`}
}
async function enhance(){const d=f.contentDocument;if(!d)return;try{
  f.contentWindow.BAMA_HOME_TARGET="utsending-green.html";
  d.querySelectorAll("a[href]").forEach(a=>a.target="_top");
  await inject(d,"utsending-production-flow.js");
  await inject(d,"utsending-language.js");
  await inject(d,"utsending-allowed-picker.js");
  await inject(d,"utsending-status-colors.js");
  await inject(d,"utsending-product-stock-v273.js");
  await inject(d,"utsending-compact-connection-v275.js");
  await inject(d,"utsending-test-extra-products.js");
  patchCore();hideOldStock(d);
  d.querySelector("#utLanguageSwitch")?.addEventListener("click",()=>setTimeout(()=>{scanText.textContent=tx().cam;afterRender(false)},0));
  afterRender(true);setTimeout(()=>afterRender(false),250);setTimeout(openRequested,300);clearInterval(brandTimer);brandTimer=setInterval(()=>{try{markGreen(f.contentDocument)}catch{}},900);loader.style.display="none";
}catch(error){loader.textContent=`GREEN UT startfeil: ${error.message||error}`}}
scan.addEventListener("click",goCamera,{passive:true});
f.addEventListener("load",enhance,{once:true});
addEventListener("resize",resize,{passive:true});
build();
</script>
</body></html>
