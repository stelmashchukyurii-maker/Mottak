<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>UT Kamera v5</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:5}
  </style>
</head>
<body>
  <div id="loader">Laster UT Kamera v5…</div>
  <iframe id="app" title="UT Kamera v5"></iframe>
  <script>
    "use strict";
    const VERSION="20260807-1855";
    const params=new URLSearchParams(location.search);
    const order=params.get("order")||"";
    const ramp=params.get("ramp")||"";
    const frame=document.getElementById("app");
    const loader=document.getElementById("loader");
    frame.src=`ut-camera.html?order=${encodeURIComponent(order)}&ramp=${encodeURIComponent(ramp)}&base=${VERSION}`;

    function inject(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement("script");s.src=src;s.onload=resolve;s.onerror=reject;doc.body.appendChild(s)})}

    frame.addEventListener("load",async()=>{
      try{
        const doc=frame.contentDocument;
        await inject(doc,`ut-camera-register-flow-v2.js?v=${VERSION}`);
        await inject(doc,`ut-camera-floating-workflow.js?v=${VERSION}`);
        const version=doc.querySelector(".version");
        if(version)version.innerHTML="UT Kamera v5 FLYTENDE UT<br>Oppdatert 07.08.2026 kl. 18:55";
        loader.style.display="none";
      }catch(error){
        loader.textContent=`Kunne ikke starte UT Kamera v5: ${error.message||error}`;
      }
    });
  </script>
</body>
</html>
