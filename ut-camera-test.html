<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>TEST — UT Foto</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:Arial,Helvetica,sans-serif;color:#f5f7ff}body{display:flex;flex-direction:column}.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;border-bottom:2px solid #f4c430;background:#10172a}.bar strong{color:#f4c430;font-size:14px}.bar small{display:block;margin-top:2px;color:#aab4ce;font-size:10px}.bar a{display:inline-flex;align-items:center;min-height:34px;padding:6px 9px;border:1px solid #303b59;border-radius:999px;color:#f5f7ff;text-decoration:none;font-size:11px;font-weight:900}iframe{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:#0b1020}#loader{position:fixed;inset:52px 0 0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;font-weight:900;text-align:center;z-index:4}
  </style>
</head>
<body>
  <header class="bar"><div><strong>TEST — UT Foto · ISOLERT</strong><small>Фото працює тільки з TEST-складом</small></div><a href="utsending-test.html">← UT Bekreft TEST</a></header>
  <div id="loader">Laster TEST — UT Foto…</div>
  <iframe id="app" title="TEST — UT Foto"></iframe>
<script>
"use strict";
const VERSION="20260808-1039",params=new URLSearchParams(location.search),ORDER=params.get("order")||"",RAMP=params.get("ramp")||"",frame=document.getElementById("app"),loader=document.getElementById("loader");
function inject(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement("script");s.src=src;s.onload=resolve;s.onerror=reject;doc.body.appendChild(s)})}
async function build(){
  try{
    const res=await fetch(`ut-camera.html?v=${VERSION}`,{cache:"no-store"});if(!res.ok)throw new Error(`HTTP ${res.status}`);
    let html=await res.text();
    html=html.replace("new URLSearchParams(location.search)",`new URLSearchParams(${JSON.stringify(location.search)})`);
    html=html.replace("</head>",`<script src="./ut-test-api.js?v=${VERSION}"><\/script></head>`);
    frame.srcdoc=html;
  }catch(e){loader.textContent=`Kunne ikke laste TEST Foto: ${e.message||e}`}
}
frame.addEventListener("load",async()=>{
  try{
    const doc=frame.contentDocument;
    doc.querySelector('[data-lang="pl"]')?.remove();
    const version=doc.querySelector(".version");if(version)version.innerHTML="TEST UT Kamera v1.1 ISOLERT<br>Oppdatert 08.08.2026 kl. 10:39";
    const back=doc.getElementById("backLink");if(back){back.href=`utsending-test.html?open=${encodeURIComponent(ORDER)}`;back.addEventListener("click",e=>{e.preventDefault();location.href=`utsending-test.html?open=${encodeURIComponent(ORDER)}`},{capture:true})}
    try{await inject(doc,`ut-camera-register-flow-v2.js?v=${VERSION}`)}catch{}
    try{await inject(doc,`ut-camera-floating-workflow.js?v=${VERSION}`)}catch{}
    try{await inject(doc,`ut-camera-manual-toggle.js?v=${VERSION}`)}catch{}
    const notice=doc.createElement("div");notice.style.cssText="margin:10px 0;padding:10px;border:1px solid #48d597;border-radius:12px;background:rgba(72,213,151,.08);color:#48d597;font:900 12px/1.45 Arial,sans-serif;text-align:center";notice.textContent="TEST — ізольований склад. Production-дані не читаються і не змінюються.";doc.querySelector("main")?.prepend(notice);
    loader.style.display="none";
  }catch(e){loader.textContent=`TEST Foto startfeil: ${e.message||e}`}
});
build();
</script>
</body>
</html>
