<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Nordic ID Exact Repeat Test</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7ff;font-family:Arial,sans-serif}
    .loading{padding:24px;text-align:center;font-size:20px;line-height:1.5}
    .bad{color:#ff8b8b}
  </style>
</head>
<body>
  <div id="loading" class="loading">Завантажую точну робочу версію без блокування повторів…</div>
  <script>
    "use strict";
    fetch("scanner-test.html?exact-repeat=20260802-1843", { cache: "no-store" })
      .then(function(response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.text();
      })
      .then(function(html) {
        html = html.replace(
          'const DUPLICATE_WINDOW_MS = 2500;',
          'const DUPLICATE_WINDOW_MS = -1;'
        );
        html = html.replace(
          '<strong>CC Wedge Test v1</strong>',
          '<strong>CC Wedge Test v1 · повтори дозволено</strong>'
        );
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(error) {
        var loading = document.getElementById("loading");
        loading.className = "loading bad";
        loading.textContent = "Не вдалося завантажити тест: " + error.message;
      });
  </script>
</body>
</html>
