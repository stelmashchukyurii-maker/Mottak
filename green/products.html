<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>Produkter — BaMavaremottak</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#151c30;--text:#f5f7ff;--muted:#aab4ce;--accent:#f4c430;--ok:#48d597;--line:#303b59}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#0b1020 0%,#10172a 100%);color:var(--text)}
    .wrap{width:min(920px,calc(100% - 28px));margin:0 auto;padding:28px 0 48px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}h1{margin:0 0 6px;font-size:clamp(28px,6vw,44px)}.subtitle,.meta,.empty{color:var(--muted)}
    .badge{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:13px}.notice{border:1px solid rgba(244,196,48,.45);background:rgba(244,196,48,.08);border-radius:14px;padding:14px 16px;margin-bottom:18px;color:#ffe88a}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.card h2{margin:0 0 12px;font-size:22px}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ok);margin-bottom:12px}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
    dl{margin:0;display:grid;grid-template-columns:92px 1fr;gap:8px 10px;font-size:14px}dt{color:var(--muted)}dd{margin:0}.kit{margin-top:13px;padding:12px;border:1px solid rgba(244,196,48,.38);border-radius:12px;background:rgba(244,196,48,.06);line-height:1.45}.kit b{color:#ffe17a}.note{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.45}footer{border-top:1px solid var(--line);margin-top:24px;padding-top:16px;color:var(--muted);font-size:13px;line-height:1.6}@media(max-width:620px){.top{flex-direction:column}.badge{white-space:normal}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><div><h1>Produkter</h1><div class="subtitle">Sentral produktliste for BaMavaremottak</div></div><div class="badge" id="versionBadge">Laster register …</div></div>
    <div class="notice">Denne siden er foreløpig kun for visning. Produksjonssidene er ikke koblet til produktregisteret ennå. TEST-sidene kan lese registeret.</div>
    <section class="grid" id="productGrid" aria-live="polite"></section>
    <footer><div id="footerVersion"></div><div id="footerUpdated"></div><div>Products view v1.2 · Oppdatert 08.08.2026 kl. 13:40 · Europe/Oslo</div></footer>
  </main>
  <script src="./products.js?v=20260808-1340"></script>
  <script>
    (function(){
      const api=window.BAMA_PRODUCTS,grid=document.getElementById("productGrid"),versionBadge=document.getElementById("versionBadge"),footerVersion=document.getElementById("footerVersion"),footerUpdated=document.getElementById("footerUpdated");
      if(!api){grid.innerHTML='<div class="empty">Produktregisteret kunne ikke lastes.</div>';versionBadge.textContent="Register ikke tilgjengelig";return}
      versionBadge.textContent=`Register v${api.meta.version} · view 1.2`;footerVersion.textContent=`Produktregister v${api.meta.version} · schema ${api.meta.schemaVersion}`;
      try{const updated=new Date(api.meta.updatedAt);footerUpdated.textContent=`Register oppdatert: ${updated.toLocaleString("nb-NO",{timeZone:"Europe/Oslo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})} (Europe/Oslo)`}catch(_){footerUpdated.textContent=`Register oppdatert: ${api.meta.updatedAt}`}
      const labels={bunner:"Bunner",hyller:"Hyller",cc_post:"CC Post",forlengere:"Forlengere"};
      function listComponents(components){return Object.entries(components||{}).map(([key,c])=>{const label=labels[key]||key;if(c.mode==="fixed")return `${c.quantity} ${label}`;if(c.mode==="ut_confirmation")return `${label}: registreres per vogn`;return label}).join(" + ")}
      function kitText(product){
        if(product.id==="bunner") return "10 Bunner + 40 CC Post (10 × 4)";
        if(product.id==="hyller30") return "1 Bunner + 30 Hyller + 4 CC Post";
        if(product.id==="hyller60") return "1 Bunner + 60 Hyller + 4 CC Post";
        if(product.id==="forlengere_korte") return "1 Bunner + 4 CC Post + Hyller/Forlengere registreres ved UT-bekreftelse";
        if(product.id==="forlengere_lange") return "1 Bunner + 4 CC Post + Hyller/Forlengere registreres ved UT-bekreftelse";
        if(product.id==="forlengere_plast") return "1 eske · ingen Bunner, Hyller eller CC Post";
        if(product.id==="cc_post") return "Kun visningskomponent · ingen lager/INN/rampe/UT-flyt";
        const normal=listComponents(product.shipment?.components);
        return normal||"—";
      }
      function describeShipment(product){if(product.ut?.derivedOnly)return "Kun visning · ingen lager/INN/rampe/UT-flyt";return listComponents(product.shipment?.components)||"—"}
      const products=api.getAllProducts();if(!products.length){grid.innerHTML='<div class="empty">Ingen produkter i registeret.</div>';return}
      grid.innerHTML=products.map(product=>{const stack=product.stackSize==null?(product.shipment?"Variabel":"Ikke fastsatt"):`${product.stackSize} stk`;const note=product.notes?.no||"";return `<article class="card"><h2>${product.name.no}</h2><div class="status"><span class="dot"></span>${product.active?"Aktiv":"Inaktiv"}</div><dl><dt>ID</dt><dd>${product.id}</dd><dt>Norsk</dt><dd>${product.name.no}</dd><dt>Polski</dt><dd>${product.name.pl}</dd><dt>Українська</dt><dd>${product.name.uk}</dd><dt>Enhet</dt><dd>${product.unit}</dd><dt>Stabel</dt><dd>${stack}</dd><dt>UT-oppsett</dt><dd>${describeShipment(product)}</dd></dl><div class="kit"><b>Komplett:</b> ${kitText(product)}</div>${note?`<div class="note">${note}</div>`:""}</article>`}).join("")
    })();
  </script>
</body>
</html>
