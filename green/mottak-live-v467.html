<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Nordic ID v4.6.7 scanner journal</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:5}
  </style>
</head>
<body>
  <div id="loader">Завантаження Nordic ID v4.6.7 JOURNAL…</div>
  <iframe id="app" title="Nordic ID v4.6.7 JOURNAL" src="mottak-live-v46.html?base=467-0846"></iframe>
  <script>
    "use strict";
    const frame = document.getElementById("app");
    const loader = document.getElementById("loader");

    function focusFrameAndScanner(reason) {
      try {
        frame.focus({ preventScroll: true });
      } catch {
        try { frame.focus(); } catch {}
      }
      try { frame.contentWindow.focus(); } catch {}
      try {
        const win = frame.contentWindow;
        if (typeof win.focusChannel === "function") win.focusChannel(win.activeChannel || "A", 0);
        if (typeof win.addTechnical === "function") win.addTechnical(`v4.6.7 OUTER FOCUS ASSIST: ${reason}.`);
      } catch {}
    }

    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;
        const oldFix = doc.querySelector('script[src*="mottak-live-v46-wedge-fix.js"]');
        if (oldFix) oldFix.remove();

        const recovery = doc.createElement("script");
        recovery.src = "mottak-live-v46-wedge-v462.js?v=467-0846";
        recovery.onload = () => {
          const selector = doc.createElement("script");
          selector.src = "mottak-live-v46-candidate-select-v465.js?v=467-0846";
          selector.onload = () => {
            const autoStart = doc.createElement("script");
            autoStart.src = "mottak-live-v46-autostart-v466.js?v=467-0846";
            autoStart.onload = () => {
              const journal = doc.createElement("script");
              journal.src = "mottak-live-v46-sharelog-v467.js?v=467-0846";
              journal.onload = () => {
                loader.style.display = "none";
                focusFrameAndScanner("all modules loaded");
                setTimeout(() => focusFrameAndScanner("retry 0.4s"), 400);
                setTimeout(() => focusFrameAndScanner("retry 1.2s"), 1200);
              };
              journal.onerror = () => { loader.textContent = "Не вдалося завантажити журнал v4.6.7."; };
              doc.body.appendChild(journal);
            };
            autoStart.onerror = () => { loader.textContent = "Не вдалося завантажити автоматичний старт v4.6.6."; };
            doc.body.appendChild(autoStart);
          };
          selector.onerror = () => { loader.textContent = "Не вдалося завантажити вибір бірки v4.6.5."; };
          doc.body.appendChild(selector);
        };
        recovery.onerror = () => { loader.textContent = "Не вдалося завантажити відновлення Wedge."; };
        doc.body.appendChild(recovery);
      } catch (error) {
        loader.textContent = `Помилка запуску v4.6.7: ${error.message || error}`;
      }
    });

    window.addEventListener("focus", () => setTimeout(() => focusFrameAndScanner("outer window focus"), 250));
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) setTimeout(() => focusFrameAndScanner("outer page visible"), 250);
    });
    document.addEventListener("pointerdown", event => {
      if (event.target === frame) setTimeout(() => focusFrameAndScanner("user touched frame"), 30);
    }, true);
  </script>
</body>
</html>
