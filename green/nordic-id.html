<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Nordic ID Scanner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #f5f7ff;
      background: #0b1020;
    }
    main {
      width: min(560px, 100%);
      padding: 24px;
      border: 1px solid #303b59;
      border-radius: 18px;
      background: #151c30;
    }
    h1 { margin-top: 0; }
    .version { color: #aab4ce; font-size: 13px; line-height: 1.5; }
    label { display: block; margin: 22px 0 8px; font-weight: 700; }
    input {
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      border: 2px solid #f4c430;
      border-radius: 12px;
      background: #070b14;
      color: #f5f7ff;
      font: 700 22px ui-monospace, Consolas, monospace;
      outline: none;
    }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Nordic ID Scanner</h1>
    <div class="version">
      <strong>Nordic ID Test v1</strong><br />
      Code updated: 01.08.2026 17:23 (Europe/Oslo)
    </div>

    <p>Minimal test page for checking that the Nordic ID scanner can enter data into a browser field.</p>

    <label for="scanInput">Scan code</label>
    <input
      id="scanInput"
      type="text"
      autocomplete="off"
      autofocus
      placeholder="Waiting for scan…"
    />
  </main>

  <script>
    const scanInput = document.getElementById("scanInput");
    window.addEventListener("load", () => scanInput.focus());
    window.addEventListener("focus", () => scanInput.focus());
  </script>
</body>
</html>
