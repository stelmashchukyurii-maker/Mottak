<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Nordic ID v4.6.8.1 — завантаження</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7ff;font-family:Arial,sans-serif}
    body{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    #state{font-size:18px;font-weight:800;line-height:1.5}
  </style>
</head>
<body>
  <div id="state">Завантаження Nordic ID v4.6.8.1…</div>
  <script>
    "use strict";
    (async () => {
      const state = document.getElementById("state");
      try {
        const response = await fetch("mottak-live-v468.html?source=4681-0915", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let html = await response.text();
        html = html
          .replace("Nordic ID Cloud v4.6.8 TEST<br />Oppdatert 04.08.2026 kl. 09:05", "Nordic ID Cloud v4.6.8.1 TEST<br />Oppdatert 04.08.2026 kl. 09:15")
          .replace("INN Nordic ID — v4.6.8 stabilt felt", "INN Nordic ID — v4.6.8.1 stabilt felt")
          .replaceAll("v=468-0905", "v=4681-0915")
          .replaceAll("v=468\"", "v=4681-0915\"");
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        state.textContent = `Не вдалося завантажити v4.6.8.1: ${error.message || error}`;
      }
    })();
  </script>
</body>
</html>
