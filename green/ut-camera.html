  <style>

    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg),#11182a)}button,input{font:inherit}.app{width:min(760px,100%);margin:auto;padding:14px 12px 54px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.back{min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--dark);color:var(--text);text-decoration:none;font-weight:900}.version{color:var(--muted);font-size:10px;text-align:right;line-height:1.4}.lang{display:flex;gap:5px}.lang button{min-width:38px;min-height:34px;border:1px solid var(--line);border-radius:9px;background:var(--dark);color:var(--muted);font-weight:950}.lang button.active{border-color:var(--accent);color:var(--accent)}h1{margin:14px 0 5px;font-size:clamp(31px,8vw,46px)}.subtitle{margin:0 0 13px;color:var(--muted);line-height:1.45}.card{margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.ramp{padding:16px;border:2px solid var(--accent);border-radius:17px;background:rgba(244,196,48,.07);text-align:center}.ramp small{display:block;color:var(--muted);font-weight:800}.ramp strong{display:block;margin-top:5px;color:var(--accent);font-size:clamp(37px,12vw,65px);line-height:1}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.p{padding:9px 5px;border:1px solid var(--line);border-radius:11px;background:var(--dark);text-align:center}.p span{display:block;color:var(--muted);font-size:10px}.p strong{display:block;margin-top:4px;font-size:18px}.photo-label{display:flex;align-items:center;justify-content:center;min-height:64px;border:2px dashed var(--info);border-radius:14px;background:rgba(117,183,255,.08);font-size:21px;font-weight:950;cursor:pointer}.photo-input{position:absolute;width:1px;height:1px;opacity:0}.preview{display:block;width:100%;max-height:54vh;margin-top:11px;border:1px solid var(--line);border-radius:14px;object-fit:contain;background:#070b14}.hidden{display:none!important}.ai-title{text-align:center;font-weight:950;color:#d9ecff;margin-top:11px}.ai-note{text-align:center;color:var(--muted);font-size:10px;line-height:1.4;margin-top:5px}.ai-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{width:100%;min-height:58px;margin-top:10px;padding:11px 13px;border:0;border-radius:13px;font-weight:950;font-size:18px;cursor:pointer}.btn:disabled{opacity:.43;cursor:not-allowed}.primary{background:var(--accent);color:#17130a}.success{background:var(--ok);color:#062418}.secondary{background:#2c395c;color:var(--text)}.openai{background:#163c32;color:#eafff6;border:2px solid var(--ok)}.field-wrap{margin-top:11px}.field-wrap label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}.field{width:100%;min-height:68px;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:#070b14;color:var(--text);font:900 clamp(31px,9vw,46px) Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}.candidate{display:none;margin-top:11px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--dark)}.candidate.show{display:block}.candidate.warn{border-color:var(--warn);background:rgba(246,185,75,.07)}.candidate strong{display:block;color:var(--accent);font-size:20px}.candidate .code{margin-top:5px;font:900 29px Consolas,monospace}.candidate p{margin:7px 0 0;color:var(--muted);line-height:1.4}.message{min-height:24px;margin-top:10px;color:var(--muted);text-align:center;white-space:pre-wrap;line-height:1.45}.message.ok{color:var(--ok)}.message.warn{color:var(--warn)}.message.bad{color:var(--bad)}.done-card{display:none;margin-top:12px;padding:14px;border:2px solid var(--ok);border-radius:14px;background:rgba(72,213,151,.08);text-align:center}.done-card.show{display:block}.done-card strong{display:block;color:var(--ok);font-size:22px}@media(max-width:560px){.progress,.ai-actions{grid-template-columns:1fr}.lang{order:3;width:100%}}

  </section>
</main>

pl:{title:"UT — Aparat / telefon",subtitle:"Zrób zdjęcie, odczytaj etykietę przez AI i dodaj istniejący towar INN bezpośrednio do rampy.",rampCaption:"Skanowanie do",take:"📷 Zrób zdjęcie",aiTitle:"AI — zabezpieczony serwer",aiNote:"Gemini jest główny. OpenAI jest rezerwą. Bez kluczy API w telefonie.",lower:"Dolny numer",find:"Znajdź towar",add:"Dodaj do",next:"📷 Następne zdjęcie",needOrder:"Brak zlecenia UT. Wróć i otwórz rampę.",notFound:"Brak dostępnego towaru z tym numerem pasującego do braków rampy.",many:"Kilka towarów ma ten sam numer. Zrób nowe zdjęcie lub użyj listy masowej na stronie UT.",suggest:"Brak dokładnego trafienia. To jedyny możliwy wynik różniący się jednym znakiem. Sprawdź przed dodaniem.",found:"Towar znaleziony. Sprawdź i dodaj go do rampy.",added:"Towar dodano do rampy.",complete:"Rampa jest kompletna. Wróć i oznacz Gotowe na rampie.",start:"Uruchamianie rampy…",photoReady:"Zdjęcie gotowe. Naciśnij Gemini.",reading:"odczytuje etykietę…",aiFail:"AI nie odczytało pewnego 6-znakowego numeru.",searching:"Numer odczytany. Szukam w magazynie…"},

let lang=localStorage.getItem("mottak_ut_language")||"nb";if(!T[lang])lang="nb";
function tr(k){return T[lang][k]||T.nb[k]||k}function headers(){return{apikey:KEY,Authorization:`Bearer ${KEY}`,Accept:"application/json","Content-Type":"application/json"}}
async function req(path,opt={}){const r=await fetch(`${BASE}/rest/v1/${path}`,{...opt,headers:{...headers(),...(opt.headers||{})}}),txt=await r.text();let body=null;try{body=txt?JSON.parse(txt):null}catch{body=txt}if(!r.ok)throw new Error(body?.message||body?.hint||body||`HTTP ${r.status}`);return body}
async function rpc(name,args){return req(`rpc/${name}`,{method:"POST",body:JSON.stringify(args)})}
function norm(v){return String(v||"").trim().toUpperCase()}function cleanLower(v){return norm(v).replace(/[^A-Z0-9]/g,"").slice(0,6)}
function rq(){return{b:+order?.bunner_stacks||0,h30:+order?.hyller30_sets||0,h60:+order?.hyller60_sets||0}}function sq(){const a=scans.filter(s=>!s.released_at);return{b:a.filter(s=>s.product==="bunner").length,h30:a.filter(s=>s.product==="hyller30").length,h60:a.filter(s=>s.product==="hyller60").length}}
function needed(product){const r=rq(),s=sq();return product==="bunner"?s.b<r.b:product==="hyller30"?s.h30<r.h30:product==="hyller60"?s.h60<r.h60:false}function complete(){const r=rq(),s=sq();return r.b===s.b&&r.h30===s.h30&&r.h60===s.h60}
function distance(a,b){a=norm(a);b=norm(b);if(a.length!==6||b.length!==6)return 99;let d=0;for(let i=0;i<6;i++)if(a[i]!==b[i])d++;return d}

function render(){const r=rq(),s=sq();$("rampName").textContent=`RAMPE ${order?.ramp||RAMP_PARAM||"—"}`;$("bProgress").textContent=`${s.b} / ${r.b}`;$("h30Progress").textContent=`${s.h30} / ${r.h30}`;$("h60Progress").textContent=`${s.h60} / ${r.h60}`;$("addButton").textContent=`${tr("add")} RAMPE ${order?.ramp||RAMP_PARAM||""}`;$("backLink").href=`utsending.html?open=${encodeURIComponent(ORDER_ID)}`}
async function load(){if(!ORDER_ID){msg(tr("needOrder"),"bad");$("findButton").disabled=true;return}const[o,s,st]=await Promise.all([req(`ut_orders?select=*&id=eq.${encodeURIComponent(ORDER_ID)}&limit=1`),req(`ut_order_scans?select=*&order_id=eq.${encodeURIComponent(ORDER_ID)}&order=scanned_at.desc&limit=1000`),req("mottak_scans?select=id,product,status,stock_status,scanner_code,lower_number,ut_order_id,created_at&status=eq.verified&stock_status=eq.in_stock&limit=10000")]);order=o?.[0]||null;scans=s||[];stock=st||[];if(!order)throw new Error(tr("needOrder"));render();if(complete())msg(tr("complete"),"ok")}
async function ensureStarted(){if(order.status!=="new")return;msg(tr("start"));const rows=await req(`ut_orders?id=eq.${encodeURIComponent(order.id)}`,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({status:"in_progress",received_at:new Date().toISOString(),started_at:new Date().toISOString(),updated_at:new Date().toISOString()})});if(rows?.[0])order=rows[0]}
function showCandidate(row,warning=false){selectedRow=row;$("candidate").className=`candidate show${warning?" warn":""}`;$("candidateProduct").textContent=productNames[row.product]||row.product;$("candidateCode").textContent=norm(row.lower_number);$("candidateText").textContent=warning?tr("suggest"):tr("found");$("addButton").disabled=false;msg(warning?tr("suggest"):tr("found"),warning?"warn":"ok")}
function findCandidate(){selectedRow=null;$("candidate").className="candidate";$("addButton").disabled=true;const code=cleanLower($("lowerInput").value);$("lowerInput").value=code;if(!/^[A-Z0-9]{6}$/.test(code))return;const allowed=stock.filter(r=>needed(r.product));const exact=allowed.filter(r=>norm(r.lower_number)===code);if(exact.length===1){showCandidate(exact[0],false);return}if(exact.length>1){msg(tr("many"),"bad");return}const near=allowed.filter(r=>distance(r.lower_number,code)===1);if(near.length===1){showCandidate(near[0],true);return}msg(tr("notFound"),"bad")}
async function add(){if(!selectedRow||busy)return;busy=true;$("addButton").disabled=true;const addedRow=selectedRow;try{await ensureStarted();await rpc("reserve_ut_scan_by_id",{p_order_id:order.id,p_mottak_scan_id:String(addedRow.id)});await load();$("doneCard").classList.add("show");$("doneTitle").textContent=tr("added");$("doneText").textContent=`${productNames[addedRow.product]||addedRow.product} · ${norm(addedRow.lower_number)} → RAMPE ${order.ramp}`;msg(complete()?tr("complete"):tr("added"),"ok");selectedRow=null;$("candidate").className="candidate";$("lowerInput").value=""}catch(e){msg(e.message||String(e),"bad")}finally{busy=false;$("addButton").disabled=true;render()}}
function loadImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Bildet kunne ikke åpnes."))};img.src=url})}
async function compress(file){const img=await loadImage(file),max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=$("canvas");canvas.width=w;canvas.height=h;const c=canvas.getContext("2d",{alpha:false});c.fillStyle="#fff";c.fillRect(0,0,w,h);c.drawImage(img,0,0,w,h);return canvas.toDataURL("image/jpeg",.84)}

$("geminiButton").onclick=()=>ai("gemini");$("openaiButton").onclick=()=>ai("openai");$("findButton").onclick=findCandidate;$("addButton").onclick=add;$("nextButton").onclick=()=>{clearPhoto();$("doneCard").classList.remove("show");msg(complete()?tr("complete"):tr("take"));if(!complete())$("photoInput").click()};
