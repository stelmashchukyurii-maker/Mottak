<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151c30;--panel2:#0d1426;--text:#f5f7ff;--muted:#aab4ce;--line:#303b59;--yellow:#f4c430;--green:#48d597;--blue:#79b8ff;--plukk:#203d5a;--varm:#514422;--kald:#203a58;--dem:#4b3854;--prod:#244b38;--cc:#42345c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{background:linear-gradient(180deg,#0b1020,#11182a)}button,a{font:inherit}.app{width:min(1220px,100%);margin:auto;padding:10px 12px 26px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.version{color:var(--muted);font-size:10px}.langbar{display:flex;gap:5px}.lang{min-width:48px;height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:1000}.lang.active{border-color:var(--yellow);background:rgba(244,196,48,.12);color:#fff3b0}.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin:4px 0 8px}h1{margin:2px 0;color:var(--yellow);font-size:clamp(28px,4vw,44px)}.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.35}.modebar{display:grid;grid-template-columns:1fr 1fr;gap:7px;min-width:360px}.mode{min-height:48px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--muted);font-size:14px;font-weight:1000}.mode.active{border-color:var(--yellow);background:rgba(244,196,48,.10);color:#fff3b0}.banner{margin:7px 0;padding:8px 11px;border:1px solid var(--green);border-radius:12px;background:rgba(72,213,151,.06);color:#c9f7e2;font-weight:900;font-size:10px}.panel{padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.panel[hidden]{display:none}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}.panelHead strong{color:var(--yellow);font-size:15px}.status{padding:5px 8px;border:1px solid var(--blue);border-radius:999px;color:#bdddff;background:rgba(121,184,255,.08);font-size:9px;font-weight:900}.desktopGrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:10px}.warehouse{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:72px 92px 110px 120px;gap:5px;border:2px solid var(--line);border-radius:15px;padding:5px;background:#080d18;overflow:hidden}.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:6px;border:2px solid rgba(255,255,255,.16);border-radius:11px;color:white;text-align:center;font-size:clamp(16px,2vw,25px);font-weight:1000;cursor:pointer}.zone small{margin-top:4px;color:#dce4f5;font-size:9px;font-weight:800}.zone.selected{outline:3px solid var(--yellow);outline-offset:-3px}.plukk{grid-column:1/3;background:var(--plukk)}.varm{background:var(--varm)}.kald{background:var(--kald)}.demontering{grid-row:3/5;background:var(--dem)}.produksjon{background:var(--prod)}.cc{background:var(--cc)}.rampsTitle{margin:7px 0 5px;text-align:center;color:var(--muted);font-size:10px;font-weight:1000}.ramps{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.ramp{min-height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:#fff;font-size:14px;font-weight:1000}.sideCard{padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);min-height:100%}.selectedName{color:#fff3b0;font-size:28px;font-weight:1000;margin:2px 0 8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{padding:9px;border:1px solid var(--line);border-radius:11px;background:#10182b}.stat b{display:block;color:var(--yellow);font-size:19px}.stat span{color:var(--muted);font-size:9px}.selection{margin-top:8px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:#10182b;color:var(--muted);font-size:10px}.startZone{display:none;min-height:48px;margin-top:8px;place-items:center;border:0;border-radius:12px;background:var(--green);color:#062418;text-decoration:none;text-align:center;font-size:15px;font-weight:1000}.startZone.show{display:grid}.recentTitle{margin:10px 0 5px;color:var(--yellow);font-size:11px;font-weight:1000}.recent{display:grid;gap:5px}.recentRow{display:grid;grid-template-columns:82px 1fr auto;gap:7px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:#10182b;font-size:10px}.recentRow b{color:#fff3b0}.empty{color:var(--muted);font-size:10px;padding:8px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:850px;background:var(--panel2)}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:11px}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#10182b;font-weight:1000}th{color:#fff3b0;background:#10182b;font-size:9px;text-transform:uppercase}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.nav a{min-height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);text-decoration:none;font-size:11px;font-weight:900}.nav a:first-child{border-color:var(--yellow);color:#fff3b0}
@media(max-width:820px){.app{padding:12px}.hero{grid-template-columns:1fr}.modebar{min-width:0}.desktopGrid{grid-template-columns:1fr}.warehouse{grid-template-rows:86px 112px 135px 175px}.zone{font-size:clamp(17px,5vw,26px)}.ramp{min-height:48px;font-size:15px}.sideCard{min-height:0}.nav{grid-template-columns:1fr}}
@media(min-width:1000px) and (max-height:850px){.app{padding-top:6px}.topline{height:28px}.hero{margin:1px 0 5px}h1{font-size:30px}.sub{font-size:11px}.banner{margin:4px 0;padding:6px 9px}.mode{min-height:40px}.panel{padding:8px}.warehouse{grid-template-rows:58px 72px 82px 88px}.zone{font-size:18px}.rampsTitle{margin:5px 0 3px}.ramp{min-height:30px;font-size:12px}.selectedName{font-size:23px}.stat{padding:7px}.stat b{font-size:16px}.recentRow{padding:5px 7px}.nav a{min-height:34px}}
</style></head>
<body class="notranslate"><main class="app">
<div class="topline"><div class="version">Florivo Inventeringer · V0.5 · 23.08.2026 kl. 13:19</div><div class="langbar"><button class="lang active" id="langNo">🇳🇴 NO</button><button class="lang" id="langUk">🇺🇦 UK</button></div></div>
<div class="hero"><div><h1>📋 INVENTERINGER</h1><p class="sub" id="subtitle"></p></div><div class="modebar"><button class="mode active" id="visualBtn"></button><button class="mode" id="tableBtn"></button></div></div>
<div class="banner" id="banner"></div>
<section class="panel" id="visualPanel"><div class="panelHead"><strong id="mapTitle"></strong><span class="status" id="mapStatus"></span></div><div class="desktopGrid"><div><div class="warehouse" id="warehouse"><button class="zone plukk" data-zone="Plukk">PLUKK<small></small></button><button class="zone varm" data-zone="Varm">VARM<small></small></button><button class="zone kald" data-zone="Kald">KALD<small></small></button><button class="zone demontering" data-zone="Demontering">DEMONTERING<small></small></button><button class="zone produksjon" data-zone="Produksjon">PRODUKSJON<small></small></button><button class="zone cc" data-zone="CC">CC<small></small></button></div><div class="rampsTitle" id="rampsTitle"></div><div class="ramps"><div class="ramp">28</div><div class="ramp">29</div><div class="ramp">30</div><div class="ramp">31</div><div class="ramp">32</div><div class="ramp">33</div><div class="ramp">34</div></div></div><aside class="sideCard"><div class="selectedName" id="selectedName">—</div><div class="stats"><div class="stat"><b id="sRecords">0</b><span id="labRecords"></span></div><div class="stat"><b id="sManual">0</b><span id="labManual"></span></div><div class="stat"><b id="sBunner">0</b><span>BUNNER</span></div><div class="stat"><b id="sHyller">0</b><span>HYLLER</span></div><div class="stat"><b id="sShort">0</b><span id="labShort"></span></div><div class="stat"><b id="sLong">0</b><span id="labLong"></span></div></div><div class="selection" id="selection"></div><a class="startZone" id="startZone" href="florivo-inventory-v012-dev.html"></a><div class="recentTitle" id="recentTitle"></div><div class="recent" id="recent"></div></aside></div></section>
<section class="panel" id="tablePanel" hidden><div class="panelHead"><strong id="tableTitle"></strong><span class="status" id="tableStatus"></span></div><div class="tableWrap"><table><thead><tr><th id="thZone"></th><th id="thStatus"></th><th id="thRecords"></th><th id="thManual"></th><th>Bunner</th><th>Hyller</th><th id="thShort"></th><th id="thLong"></th></tr></thead><tbody id="zoneRows"></tbody></table></div></section>
<div class="nav"><a href="index.html" id="homeLink"></a><a href="scanner-home.html" id="scannerLink"></a></div></main>
<script>
'use strict';
const STORE='florivo_inventory_v012_dev_sessions_v01',CURRENT='florivo_inventory_v012_dev_current_v01',LANGKEY='florivo_inventory_lang_v02',VIEWKEY='florivo_inventory_pc_view_v01';const zones=['Plukk','Varm','Kald','Demontering','Produksjon','CC'];const $=id=>document.getElementById(id);let lang=localStorage.getItem(LANGKEY)==='uk'?'uk':'no',selectedZone='',view=localStorage.getItem(VIEWKEY)==='table'?'table':'visual',session=null;
const T={no:{subtitle:'Fysisk inventering per sone. Kart og tabell viser samme inventeringsdata.',banner:'📋 INVENTERING · Inventeringsdata er separat. Lagerbeholdning og tellere på andre sider endres ikke automatisk.',visual:'🗺 VISUALISERING',table:'☷ TABELL',mapTitle:'LAGERKART',mapStatus:'LOKALE INVENTERINGSDATA',ramps:'RAMPER · samme nummer som i UT KONTOR',choose:'Velg en sone.',selected:'Valgt sone',start:'▶ ÅPNE',records:'REGISTRERINGER',manual:'MANUELL',short:'FORL. KORTE',long:'FORL. LANGE',recent:'SISTE REGISTRERINGER',none:'Ingen lokale registreringer i denne nettleseren.',tableTitle:'SONER · TALLVISNING',tableStatus:'SAMME LOKALE DATA',zone:'Sone',status:'Status',not:'IKKE STARTET',open:'PÅGÅR',done:'FULLFØRT',home:'⌂ FLORIVO HOVEDMENY',scanner:'📡 NORDIC ID SCANNER'},uk:{subtitle:'Фізична інвентаризація по зонах. Карта і таблиця показують ті самі дані інвентаризації.',banner:'📋 ІНВЕНТАРИЗАЦІЯ · Дані інвентаризації окремі. Залишки складу та лічильники інших сторінок автоматично не змінюються.',visual:'🗺 ВІЗУАЛІЗАЦІЯ',table:'☷ ТАБЛИЦЯ',mapTitle:'КАРТА СКЛАДУ',mapStatus:'ЛОКАЛЬНІ ДАНІ ІНВЕНТАРИЗАЦІЇ',ramps:'РАМПИ · ті самі номери, що в UT KONTOR',choose:'Вибери зону.',selected:'Вибрана зона',start:'▶ ВІДКРИТИ',records:'ЗАПИСИ',manual:'ВРУЧНУ',short:'ПРОДОВЖ. КОРОТКІ',long:'ПРОДОВЖ. ДОВГІ',recent:'ОСТАННІ ЗАПИСИ',none:'У цьому браузері локальних записів ще немає.',tableTitle:'ЗОНИ · ЦИФРОВИЙ ВИГЛЯД',tableStatus:'ТІ САМІ ЛОКАЛЬНІ ДАНІ',zone:'Зона',status:'Статус',not:'НЕ ПОЧАТО',open:'В РОБОТІ',done:'ЗАВЕРШЕНО',home:'⌂ ГОЛОВНА FLORIVO',scanner:'📡 NORDIC ID СКАНЕР'}};
function load(){try{const all=JSON.parse(localStorage.getItem(STORE)||'[]'),id=localStorage.getItem(CURRENT);session=(id&&all.find(x=>x.id===id))||all[all.length-1]||null}catch{session=null}}
function meta(z){return session?.zones?.[z]||{status:'not_started',revision:1}}function rows(z){const m=meta(z);return session?.records?.filter(r=>r.zone===z&&r.revision===(m.revision||1))||[]}function stat(z){const r=rows(z);return{r,records:r.length,manual:r.filter(x=>x.manual).length,bunner:r.reduce((s,x)=>s+(x.bunner||0),0),hyller:r.reduce((s,x)=>s+(x.hyller||0),0),short:r.filter(x=>x.type==='forl_short').reduce((s,x)=>s+(x.forlengere||0),0),long:r.filter(x=>x.type==='forl_long').reduce((s,x)=>s+(x.forlengere||0),0)}}function status(z){const s=meta(z).status;return s==='completed'?T[lang].done:s==='in_progress'?T[lang].open:T[lang].not}
function applyLang(x){lang=x==='uk'?'uk':'no';localStorage.setItem(LANGKEY,lang);document.documentElement.lang=lang==='uk'?'uk':'nb';$('langNo').classList.toggle('active',lang==='no');$('langUk').classList.toggle('active',lang==='uk');const t=T[lang];$('subtitle').textContent=t.subtitle;$('banner').textContent=t.banner;$('visualBtn').textContent=t.visual;$('tableBtn').textContent=t.table;$('mapTitle').textContent=t.mapTitle;$('mapStatus').textContent=t.mapStatus;$('rampsTitle').textContent=t.ramps;$('labRecords').textContent=t.records;$('labManual').textContent=t.manual;$('labShort').textContent=t.short;$('labLong').textContent=t.long;$('recentTitle').textContent=t.recent;$('tableTitle').textContent=t.tableTitle;$('tableStatus').textContent=t.tableStatus;$('thZone').textContent=t.zone;$('thStatus').textContent=t.status;$('thRecords').textContent=t.records;$('thManual').textContent=t.manual;$('thShort').textContent=t.short;$('thLong').textContent=t.long;$('homeLink').textContent=t.home;$('scannerLink').textContent=t.scanner;render()}
function render(){load();document.querySelectorAll('#warehouse [data-zone]').forEach(el=>{const z=el.dataset.zone,s=stat(z);el.classList.toggle('selected',selectedZone===z);el.querySelector('small').textContent=`${status(z)} · ${s.records} · B ${s.bunner} · H ${s.hyller}`});$('zoneRows').innerHTML=zones.map(z=>{const s=stat(z);return`<tr><td>${z}</td><td>${status(z)}</td><td>${s.records}</td><td>${s.manual}</td><td>${s.bunner}</td><td>${s.hyller}</td><td>${s.short}</td><td>${s.long}</td></tr>`}).join('');const t=T[lang],z=selectedZone||'Plukk',s=stat(z);$('selectedName').textContent=z.toUpperCase();$('sRecords').textContent=s.records;$('sManual').textContent=s.manual;$('sBunner').textContent=s.bunner;$('sHyller').textContent=s.hyller;$('sShort').textContent=s.short;$('sLong').textContent=s.long;$('selection').textContent=selectedZone?`${t.selected}: ${selectedZone}`:t.choose;const a=$('startZone');a.classList.toggle('show',!!selectedZone);if(selectedZone){a.textContent=`${t.start} ${selectedZone.toUpperCase()}`;a.href=`florivo-inventory-v012-dev.html?zone=${encodeURIComponent(selectedZone)}&autostart=1&v=${Date.now()}`}$('recent').innerHTML=s.r.length?s.r.slice(-5).reverse().map(r=>`<div class="recentRow"><b>${r.tag}</b><span>${r.type}</span><span>${new Date(r.teltAt).toLocaleTimeString(lang==='uk'?'uk-UA':'nb-NO',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):`<div class="empty">${t.none}</div>`}
function show(v){view=v==='table'?'table':'visual';localStorage.setItem(VIEWKEY,view);$('visualBtn').classList.toggle('active',view==='visual');$('tableBtn').classList.toggle('active',view==='table');$('visualPanel').hidden=view!=='visual';$('tablePanel').hidden=view!=='table'}
$('langNo').onclick=()=>applyLang('no');$('langUk').onclick=()=>applyLang('uk');$('visualBtn').onclick=()=>show('visual');$('tableBtn').onclick=()=>show('table');$('warehouse').onclick=e=>{const b=e.target.closest('[data-zone]');if(!b)return;selectedZone=b.dataset.zone;render()};addEventListener('storage',render);applyLang(lang);show(view);render();
</script></body></html>
