<!DOCTYPE html>
<html lang="nb" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Florivo — Inventeringer</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151c30;--panel2:#0d1426;--text:#f5f7ff;--muted:#aab4ce;--line:#303b59;--yellow:#f4c430;--green:#48d597;--blue:#79b8ff;--plukk:#203d5a;--varm:#514422;--kald:#203a58;--dem:#4b3854;--prod:#244b38;--cc:#42345c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{background:linear-gradient(180deg,#0b1020,#11182a)}button,a{font:inherit}.app{width:min(1120px,100%);margin:auto;padding:14px 12px 54px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.version{color:var(--muted);font-size:10px}.langbar{display:flex;gap:5px}.lang{min-width:48px;height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:1000}.lang.active{border-color:var(--yellow);background:rgba(244,196,48,.12);color:#fff3b0}h1{margin:6px 0 4px;color:var(--yellow);font-size:clamp(30px,7vw,50px)}.sub{margin:0;color:var(--muted);line-height:1.45}.banner{margin:12px 0;padding:11px 13px;border:1px solid var(--green);border-radius:14px;background:rgba(72,213,151,.06);color:#c9f7e2;font-weight:900;font-size:12px}.modebar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0;background:rgba(11,16,32,.96)}.mode{min-height:58px;border:2px solid var(--line);border-radius:16px;background:var(--panel);color:var(--muted);font-size:17px;font-weight:1000}.mode.active{border-color:var(--yellow);background:rgba(244,196,48,.10);color:#fff3b0}.panel{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.panel[hidden]{display:none}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.panelHead strong{color:var(--yellow);font-size:18px}.status{padding:6px 9px;border:1px solid var(--blue);border-radius:999px;color:#bdddff;background:rgba(121,184,255,.08);font-size:10px;font-weight:900}.warehouse{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:110px 145px 165px 210px;gap:6px;border:2px solid var(--line);border-radius:18px;padding:6px;background:#080d18;overflow:hidden}.zone{position:relative;display:flex;align-items:center;justify-content:center;min-height:80px;padding:12px;border:2px solid rgba(255,255,255,.18);border-radius:14px;color:white;text-align:center;font-size:clamp(18px,3.5vw,31px);font-weight:1000;cursor:pointer;transition:.12s}.zone:hover,.zone.selected{outline:3px solid var(--yellow);outline-offset:-3px}.zone small{display:block;margin-top:5px;color:#dce4f5;font-size:10px;font-weight:800}.plukk{grid-column:1/3;background:var(--plukk)}.varm{background:var(--varm)}.kald{background:var(--kald)}.demontering{grid-row:3/5;background:var(--dem)}.produksjon{background:var(--prod)}.cc{background:var(--cc)}.rampsTitle{margin:14px 0 7px;text-align:center;color:var(--muted);font-size:12px;font-weight:1000}.ramps{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.ramp{min-height:62px;display:grid;place-items:center;border:2px solid var(--line);border-radius:13px;background:var(--panel2);color:#fff;font-size:20px;font-weight:1000}.selection{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--muted)}.selection b{color:#fff3b0}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px;background:var(--panel2)}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:right;font-size:12px}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#10182b;font-weight:1000}th{color:#fff3b0;background:#10182b;font-size:10px;text-transform:uppercase}td{color:#dfe7ff}.notready{color:var(--muted);font-style:italic}.hint{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.5}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.nav a{min-height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);text-decoration:none;font-weight:900}.nav a:first-child{border-color:var(--yellow);color:#fff3b0}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.legend span{padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px}@media(max-width:620px){.warehouse{grid-template-rows:86px 112px 135px 175px;gap:4px;padding:4px}.zone{padding:7px;border-radius:10px}.ramps{gap:4px}.ramp{min-height:48px;font-size:15px}.mode{min-height:52px;font-size:14px}.nav{grid-template-columns:1fr}}
</style>
</head>
<body class="notranslate">
<main class="app">
<div class="topline"><div class="version">Florivo Inventeringer · PC/WEB DEV V0.3 · 23.08.2026 kl. 12:39 · NO LIVE MUTATION</div><div class="langbar"><button class="lang active" id="langNo" type="button">🇳🇴 NO</button><button class="lang" id="langUk" type="button">🇺🇦 UK</button></div></div>
<h1>📋 INVENTERINGER</h1>
<p class="sub" id="subtitle"></p>
<div class="banner" id="banner"></div>
<div class="modebar"><button class="mode active" id="visualBtn" type="button"></button><button class="mode" id="tableBtn" type="button"></button></div>
<section class="panel" id="visualPanel">
<div class="panelHead"><strong id="mapTitle"></strong><span class="status" id="mapStatus"></span></div>
<div class="warehouse" id="warehouse">
<div class="zone plukk" data-zone="Plukk">PLUKK</div>
<div class="zone varm" data-zone="Varm">VARM</div>
<div class="zone kald" data-zone="Kald">KALD</div>
<div class="zone demontering" data-zone="Demontering">DEMONTERING</div>
<div class="zone produksjon" data-zone="Produksjon">PRODUKSJON</div>
<div class="zone cc" data-zone="CC">CC</div>
</div>
<div class="rampsTitle" id="rampsTitle"></div>
<div class="ramps" aria-label="Ramper 28 til 34"><div class="ramp">28</div><div class="ramp">29</div><div class="ramp">30</div><div class="ramp">31</div><div class="ramp">32</div><div class="ramp">33</div><div class="ramp">34</div></div>
<div class="selection" id="selection"></div>
<div class="legend"><span>PLUKK</span><span>VARM</span><span>KALD</span><span>DEMONTERING</span><span>PRODUKSJON</span><span>CC</span></div>
</section>
<section class="panel" id="tablePanel" hidden>
<div class="panelHead"><strong id="tableTitle"></strong><span class="status" id="tableStatus"></span></div>
<div class="tableWrap"><table><thead><tr><th id="thZone"></th><th id="thStatus"></th><th>RFID</th><th id="thManual"></th><th>Bunner</th><th>Hyller</th><th id="thShort"></th><th id="thLong"></th><th id="thAvvik"></th></tr></thead><tbody id="zoneRows"></tbody></table></div>
<p class="hint" id="hint"></p>
</section>
<div class="nav"><a href="index.html" id="homeLink"></a><a href="scanner-home.html" id="scannerLink"></a></div>
</main>
<script>
'use strict';
const zones=['Plukk','Varm','Kald','Demontering','Produksjon','CC'];
const T={
 no:{subtitle:'Fysisk inventering per sone. Visuelt lagerkart og tabell er to visninger av samme fremtidige serverdata.',banner:'🧪 DEV / TEST · Denne siden viser foreløpig struktur og soner. Ingen LIVE/WORK-lagerdata endres her.',visual:'🗺 VISUALISERING',table:'☷ TABELL',mapTitle:'LAGERKART',mapStatus:'SERVERDATA KOMMER',ramps:'RAMPER · samme nummer som i UT KONTOR',choose:'Velg en sone på kartet. <b>Ingen tall vises som om de var ekte før serverkoblingen er klar.</b>',selected:'Valgt sone',selectedTail:'tall, AVVIK og recount kobles inn når server-session er klar.',tableTitle:'SONER · TALLVISNING',tableStatus:'IKKE TILKOBLET',zone:'Sone',status:'Status',manual:'Manuell',short:'Forl. korte',long:'Forl. lange',avvik:'Avvik',notConnected:'ikke koblet',hint:'Når server-session er koblet til, skal denne tabellen vise samme inventering som kartet: hele lageret eller valgt sone/recount. Inntil da bruker vi «—» i stedet for falske 0-tall.',home:'⌂ FLORIVO HOVEDMENY',scanner:'📡 NORDIC ID SCANNER'},
 uk:{subtitle:'Фізична інвентаризація по зонах. Візуальна карта складу і таблиця — два види тих самих майбутніх серверних даних.',banner:'🧪 DEV / TEST · Поки це структура та зони. Жодні LIVE/WORK залишки тут не змінюються.',visual:'🗺 ВІЗУАЛІЗАЦІЯ',table:'☷ ТАБЛИЦЯ',mapTitle:'КАРТА СКЛАДУ',mapStatus:'СЕРВЕРНІ ДАНІ ПІЗНІШЕ',ramps:'РАМПИ · ті самі номери, що в UT KONTOR',choose:'Вибери зону на карті. <b>Поки сервер не підключений, реальні цифри не підміняємо тестовими.</b>',selected:'Вибрана зона',selectedTail:'цифри, AVVIK і перерахунок підключимо разом із серверною сесією.',tableTitle:'ЗОНИ · ЦИФРОВИЙ ВИГЛЯД',tableStatus:'НЕ ПІДКЛЮЧЕНО',zone:'Зона',status:'Статус',manual:'Вручну',short:'Продовж. короткі',long:'Продовж. довгі',avvik:'Розбіжності',notConnected:'не підключено',hint:'Після підключення серверної сесії таблиця показуватиме ту саму інвентаризацію, що й карта: весь склад або вибрану зону / перерахунок. До того показуємо «—», а не фальшиві нулі.',home:'⌂ ГОЛОВНА FLORIVO',scanner:'📡 NORDIC ID СКАНЕР'}
};
let lang='no',selectedZone='';
const visualBtn=document.getElementById('visualBtn'),tableBtn=document.getElementById('tableBtn'),visualPanel=document.getElementById('visualPanel'),tablePanel=document.getElementById('tablePanel'),selection=document.getElementById('selection');
function renderRows(){document.getElementById('zoneRows').innerHTML=zones.map(z=>`<tr><td>${z}</td><td class="notready">${T[lang].notConnected}</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`).join('')}
function applyLang(next){lang=next;document.documentElement.lang=lang==='no'?'nb':'uk';try{localStorage.setItem('florivo_inventory_lang_v02',lang)}catch{}document.getElementById('langNo').classList.toggle('active',lang==='no');document.getElementById('langUk').classList.toggle('active',lang==='uk');const t=T[lang];document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('banner').textContent=t.banner;visualBtn.textContent=t.visual;tableBtn.textContent=t.table;document.getElementById('mapTitle').textContent=t.mapTitle;document.getElementById('mapStatus').textContent=t.mapStatus;document.getElementById('rampsTitle').textContent=t.ramps;document.getElementById('tableTitle').textContent=t.tableTitle;document.getElementById('tableStatus').textContent=t.tableStatus;document.getElementById('thZone').textContent=t.zone;document.getElementById('thStatus').textContent=t.status;document.getElementById('thManual').textContent=t.manual;document.getElementById('thShort').textContent=t.short;document.getElementById('thLong').textContent=t.long;document.getElementById('thAvvik').textContent=t.avvik;document.getElementById('hint').textContent=t.hint;document.getElementById('homeLink').textContent=t.home;document.getElementById('scannerLink').textContent=t.scanner;selection.innerHTML=selectedZone?`${t.selected}: <b>${selectedZone}</b> · ${t.selectedTail}`:t.choose;renderRows()}
function show(mode){const visual=mode==='visual';visualBtn.classList.toggle('active',visual);tableBtn.classList.toggle('active',!visual);visualPanel.hidden=!visual;tablePanel.hidden=visual;try{localStorage.setItem('florivo_inventory_pc_view_v01',mode)}catch{}}
visualBtn.onclick=()=>show('visual');tableBtn.onclick=()=>show('table');document.getElementById('langNo').onclick=()=>applyLang('no');document.getElementById('langUk').onclick=()=>applyLang('uk');
document.getElementById('warehouse').addEventListener('click',e=>{const el=e.target.closest('[data-zone]');if(!el)return;selectedZone=el.dataset.zone;document.querySelectorAll('[data-zone]').forEach(x=>x.classList.toggle('selected',x===el));applyLang(lang)});
let savedView='visual',savedLang='no';try{savedView=localStorage.getItem('florivo_inventory_pc_view_v01')||'visual';savedLang=localStorage.getItem('florivo_inventory_lang_v02')||'no'}catch{}applyLang(savedLang==='uk'?'uk':'no');show(savedView==='table'?'table':'visual');
</script>
</body>
</html>
