function applyLang(x){lang=x==='uk'?'uk':'no';localStorage.setItem('florivo_inventory_lang_v02',lang);document.documentElement.lang=lang==='uk'?'uk':'nb';$('langNo').classList.toggle('active',lang==='no');$('langUk').classList.toggle('active',lang==='uk');const t=T[lang];$('subtitle').textContent=t.subtitle;$('banner').textContent=t.banner;$('visualBtn').textContent=t.visual;$('tableBtn').textContent=t.table;$('mapTitle').textContent=t.mapTitle;$('mapStatus').textContent=t.mapStatus;$('rampsTitle').textContent=t.ramps;$('tableTitle').textContent=t.tableTitle;$('tableStatus').textContent=t.tableStatus;$('thZone').textContent=t.zone;$('thStatus').textContent=t.status;$('thManual').textContent=t.manual;$('thShort').textContent=t.short;$('thLong').textContent=t.long;$('thAvvik').textContent=t.avvik;$('hint').textContent=t.hint;$('homeLink').textContent=t.home;$('scannerLink').textContent=t.scanner;$('selection').innerHTML=selectedZone?`${t.selected}: <b>${selectedZone}</b>`:t.choose;const a=$('startZone');a.classList.toggle('show',!!selectedZone);if(selectedZone){a.textContent=`${t.start} ${selectedZone.toUpperCase()}`;a.href=`florivo-inventory-v012-dev.html?zone=${encodeURIComponent(selectedZone)}&autostart=1&v=${Date.now()}`}rows()}
function show(v){view=v==='table'?'table':'visual';localStorage.setItem('florivo_inventory_pc_view_v01',view);$('visualBtn').classList.toggle('active',view==='visual');$('tableBtn').classList.toggle('active',view==='table');$('visualPanel').hidden=view!=='visual';$('tablePanel').hidden=view!=='table'}
