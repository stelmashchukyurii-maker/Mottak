<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>TEST — Nordic ID · UT Lager</title>
<style>html,body{margin:0;min-height:100%;background:#0b1020}#utCore{display:block;width:100%;min-height:100vh;border:0;background:#0b1020}#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:100000}</style>
</head>
<body><div id="loader">Laster TEST — Nordic ID · UT Lager…</div><iframe id="utCore" title="TEST — Nordic ID · UT Lager"></iframe>
<script>
"use strict";
const VERSION="20260809-2259",f=document.getElementById("utCore"),loader=document.getElementById("loader");let openTries=0;
function resize(){try{const d=f.contentDocument;f.style.height=Math.max(innerHeight,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+"px"}catch{}}
function inject(d,src,mark=""){return new Promise((ok,bad)=>{if(mark&&d.querySelector(`script[data-test-module="${mark}"]`))return ok();const s=d.createElement("script");s.src=`${src}?v=${VERSION}`;if(mark)s.dataset.testModule=mark;s.onload=ok;s.onerror=()=>bad(new Error(`Kunne ikke laste ${src}`));d.body.appendChild(s)})}
function mark(){try{const d=f.contentDocument,w=f.contentWindow;if(!d?.body)return;w.BAMA_HOME_TARGET="test-home.html";let b=d.getElementById("utNordicMirrorBanner");if(!b){b=d.createElement("div");b.id="utNordicMirrorBanner";b.style.cssText="margin:10px 0 12px;padding:11px 13px;border:2px solid #48d597;border-radius:14px;background:rgba(72,213,151,.09);color:#eafff6;font:900 13px/1.45 Arial,sans-serif;text-align:center";const h=d.querySelector("h1");if(h?.parentElement)h.insertAdjacentElement("beforebegin",b)}if(b)b.innerHTML="📡 <b>NORDIC ID TEST · ISOLERT</b> · Samme UT Lager-form som WORKING. Ordre, lager, rampe og utsending bruker bare <b>ut_test_*</b>. Foto / AI / manuell skanning er slått av på denne enheten.";const v=d.querySelector(".version");if(v)v.innerHTML="TEST · UT Lager v27.15 mirror · NORDIC RFID<br>Oppdatert 09.08.2026 kl. 22:59";const home=d.querySelector("a.home");if(home&&!home.dataset.testHome){home.dataset.testHome="1";home.href="test-home.html";home.target="_top";home.addEventListener("click",e=>{e.preventDefault();top.location.href="test-home.html"},{capture:true})}}catch{}}
function hideOldStock(){try{const d=f.contentDocument;if(!d.getElementById("utHideOldStock")){const s=d.createElement("style");s.id="utHideOldStock";s.textContent=".stock-card{display:none!important}";d.head.appendChild(s)}}catch{}}
function afterRender(){try{const w=f.contentWindow;hideOldStock();w.UT_LANGUAGE_APPLY?.();w.UT_PRODUCTION_ENHANCE?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();w.UT_PRODUCT_STOCK_REFRESH?.();w.UT_EXTRA_PRODUCTS_REFRESH?.();w.NORDIC_UT_REFRESH?.();mark();resize();setTimeout(resize,80)}catch{}}
function patchCore(){const w=f.contentWindow;if(w.__NORDIC_WORKING_MIRROR_PATCH__)return;w.__NORDIC_WORKING_MIRROR_PATCH__=true;if(typeof w.openOrder==="function"){const o=w.openOrder;w.openOrder=async function(id,...rest){const r=await o.call(w,id,...rest);afterRender();setTimeout(()=>{try{const d=f.contentDocument,x=d.getElementById("detail");if(x?.classList.contains("show")){const topY=f.getBoundingClientRect().top+scrollY+x.getBoundingClientRect().top+(w.scrollY||0);scrollTo({top:Math.max(0,topY-10),behavior:"smooth"})}}catch{}},70);return r}}if(typeof w.renderDetail==="function"){const o=w.renderDetail;w.renderDetail=function(...a){const r=o.apply(w,a);queueMicrotask(afterRender);return r}}if(typeof w.renderRamps==="function"){const o=w.renderRamps;w.renderRamps=function(...a){const r=o.apply(w,a);queueMicrotask(afterRender);return r}}if(typeof w.loadAll==="function"){const o=w.loadAll;w.loadAll=async function(...a){const r=await o.apply(w,a);afterRender();return r}}}
function openRequested(){const id=new URLSearchParams(location.search).get("open");if(!id)return;try{const w=f.contentWindow;if(typeof w.openOrder==="function"){w.openOrder(id);return}}catch{}if(openTries++<25)setTimeout(openRequested,250)}
async function build(){try{const r=await fetch(`utsending-core-v7.html?v=${VERSION}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);let html=await r.text();html=html.replace("</head>",`<script src="./ut-test-api.js?v=${VERSION}"><\/script></head>`);f.srcdoc=html}catch(e){loader.textContent=`Kunne ikke laste Nordic TEST UT: ${e.message||e}`}}
async function enhance(){const d=f.contentDocument;if(!d)return;try{f.contentWindow.BAMA_HOME_TARGET="test-home.html";d.querySelectorAll("a[href]").forEach(a=>a.target="_top");await inject(d,"utsending-production-flow.js","production-flow");await inject(d,"utsending-language.js","language");await inject(d,"utsending-allowed-picker.js","picker");await inject(d,"utsending-status-colors.js","status");await inject(d,"utsending-product-stock-v273.js","stock");await inject(d,"utsending-test-extra-products.js","extras");await inject(d,"utsending-compact-connection-v275.js","connection");await inject(d,"nordic-ut-test-scanner.js","nordic");patchCore();hideOldStock();d.querySelector("#utLanguageSwitch")?.addEventListener("click",()=>setTimeout(afterRender,0));afterRender();setTimeout(afterRender,250);setTimeout(afterRender,900);setTimeout(openRequested,300);loader.style.display="none"}catch(e){loader.textContent=`Nordic TEST startfeil: ${e.message||e}`}}
f.addEventListener("load",enhance,{once:true});addEventListener("resize",resize,{passive:true});build();
</script></body></html>
