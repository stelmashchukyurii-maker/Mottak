<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Nordic ID · TEST / WORK</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7ff;font-family:Arial,sans-serif}*{box-sizing:border-box}#envBar{position:sticky;top:0;z-index:100001;padding:9px 10px;background:#0b1020;border-bottom:1px solid #303b59}.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:760px;margin:auto}.env-btn{min-height:52px;border:2px solid #303b59;border-radius:13px;background:#151c30;color:#f5f7ff;font-size:16px;font-weight:950}.env-btn.test.active{border-color:#48d597;background:rgba(72,213,151,.13);color:#bff5dc}.env-btn.work.active{border-color:#ff7373;background:rgba(255,115,115,.14);color:#ffd0d0}.env-note{max-width:760px;margin:6px auto 0;color:#aab4ce;font-size:10px;line-height:1.35;text-align:center}.env-note b{color:#f5f7ff}#utCore{display:block;width:100%;min-height:calc(100vh - 95px);border:0;background:#0b1020}#loader{position:fixed;inset:94px 0 0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:100000}
</style>
</head>
<body>
<div id="envBar"><div class="env-grid"><button id="testBtn" class="env-btn test active" type="button">🧪 TEST</button><button id="workBtn" class="env-btn work" type="button">🏭 WORK · УТРИМАТИ</button></div><div id="envNote" class="env-note"><b>TEST</b> · ті самі робочі таблиці, тільки рядки environment=test · дублікати RFID дозволені.</div></div>
<div id="loader">Laster Nordic ID · TEST…</div><iframe id="utCore" title="Nordic ID · TEST / WORK"></iframe>
<script>
"use strict";
const VERSION="20260810-1043",f=document.getElementById("utCore"),loader=document.getElementById("loader"),testBtn=document.getElementById("testBtn"),workBtn=document.getElementById("workBtn"),envNote=document.getElementById("envNote");
let MODE="test",openTries=0,holdTimer=0,holdDone=false;
function resize(){try{const d=f.contentDocument;f.style.height=Math.max(innerHeight-90,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+"px"}catch{}}
function inject(d,src,mark=""){return new Promise((ok,bad)=>{if(mark&&d.querySelector(`script[data-test-module="${mark}"]`))return ok();const s=d.createElement("script");s.src=`${src}?v=${VERSION}`;if(mark)s.dataset.testModule=mark;s.onload=ok;s.onerror=()=>bad(new Error(`Kunne ikke laste ${src}`));d.body.appendChild(s)})}
function updateOuter(){const work=MODE==="work";testBtn.classList.toggle("active",!work);workBtn.classList.toggle("active",work);loader.textContent=work?"Laster Nordic ID · WORK…":"Laster Nordic ID · TEST…";envNote.innerHTML=work?"<b>WORK · REAL DATABASE</b> · реальний склад · дублікати RFID заблоковані.":"<b>TEST</b> · ті самі робочі таблиці, тільки рядки environment=test · дублікати RFID дозволені."}
function mark(){try{const d=f.contentDocument,w=f.contentWindow;if(!d?.body)return;w.BAMA_HOME_TARGET="test-home.html";let b=d.getElementById("utNordicMirrorBanner");if(!b){b=d.createElement("div");b.id="utNordicMirrorBanner";const h=d.querySelector("h1");if(h?.parentElement)h.insertAdjacentElement("beforebegin",b)}if(b){const work=MODE==="work";b.style.cssText=`margin:10px 0 12px;padding:11px 13px;border:2px solid ${work?'#ff7373':'#48d597'};border-radius:14px;background:${work?'rgba(255,115,115,.09)':'rgba(72,213,151,.09)'};color:#f5f7ff;font:900 13px/1.45 Arial,sans-serif;text-align:center`;b.innerHTML=work?"🏭 <b>NORDIC ID · WORK · REAL DATABASE</b><br>Реальні mottak_scans / ut_orders. Повний EPC → scanner_code, останні 6 → lower_number. Дублікати заблоковані.":"🧪 <b>NORDIC ID · TEST · SHARED TABLES</b><br>Ті самі mottak_scans / ut_orders, але тільки environment=<b>test</b>. Одна фізична RFID-бірка може використовуватись багато разів."}const v=d.querySelector(".version");if(v)v.innerHTML=`NORDIC ENV v2.8 · ${MODE.toUpperCase()} · SHARED TABLES<br>Oppdatert 10.08.2026 kl. 10:43`;const home=d.querySelector("a.home");if(home&&!home.dataset.testHome){home.dataset.testHome="1";home.href="test-home.html";home.target="_top";home.addEventListener("click",e=>{e.preventDefault();top.location.href="test-home.html"},{capture:true})}}catch{}}
function hideOldStock(){try{const d=f.contentDocument;if(!d.getElementById("utHideOldStock")){const s=d.createElement("style");s.id="utHideOldStock";s.textContent=".stock-card{display:none!important}";d.head.appendChild(s)}}catch{}}
function afterRender(){try{const w=f.contentWindow;hideOldStock();w.UT_LANGUAGE_APPLY?.();w.UT_PRODUCTION_ENHANCE?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();w.UT_PRODUCT_STOCK_REFRESH?.();w.UT_EXTRA_PRODUCTS_REFRESH?.();w.NORDIC_UT_REFRESH?.();mark();resize();setTimeout(resize,80)}catch{}}
function patchCore(){const w=f.contentWindow;if(w.__NORDIC_ENV_MIRROR_PATCH__)return;w.__NORDIC_ENV_MIRROR_PATCH__=true;if(typeof w.openOrder==="function"){const o=w.openOrder;w.openOrder=async function(id,...rest){const r=await o.call(w,id,...rest);afterRender();setTimeout(()=>{try{const d=f.contentDocument,x=d.getElementById("detail");if(x?.classList.contains("show")){const topY=f.getBoundingClientRect().top+scrollY+x.getBoundingClientRect().top+(w.scrollY||0);scrollTo({top:Math.max(0,topY-10),behavior:"smooth"})}}catch{}},70);return r}}if(typeof w.renderDetail==="function"){const o=w.renderDetail;w.renderDetail=function(...a){const r=o.apply(w,a);queueMicrotask(afterRender);return r}}if(typeof w.renderRamps==="function"){const o=w.renderRamps;w.renderRamps=function(...a){const r=o.apply(w,a);queueMicrotask(afterRender);return r}}if(typeof w.loadAll==="function"){const o=w.loadAll;w.loadAll=async function(...a){const r=await o.apply(w,a);afterRender();return r}}}
function openRequested(){const id=new URLSearchParams(location.search).get("open");if(!id)return;try{const w=f.contentWindow;if(typeof w.openOrder==="function"){w.openOrder(id);return}}catch{}if(openTries++<25)setTimeout(openRequested,250)}
async function build(){updateOuter();loader.style.display="flex";openTries=0;try{const r=await fetch(`utsending-core-v7.html?v=${VERSION}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);let html=await r.text();html=html.replace("</head>",`<script>window.BAMA_ENV_MODE=${JSON.stringify(MODE)};<\/script><script src="./ut-test-api.js?v=${VERSION}"><\/script></head>`);f.addEventListener("load",enhance,{once:true});f.srcdoc=html}catch(e){loader.textContent=`Kunne ikke laste Nordic ${MODE.toUpperCase()}: ${e.message||e}`}}
async function enhance(){const d=f.contentDocument;if(!d)return;try{f.contentWindow.BAMA_HOME_TARGET="test-home.html";d.querySelectorAll("a[href]").forEach(a=>a.target="_top");await inject(d,"utsending-production-flow.js","production-flow");await inject(d,"utsending-language.js","language");await inject(d,"utsending-allowed-picker.js","picker");await inject(d,"utsending-status-colors.js","status");await inject(d,"utsending-product-stock-v273.js","stock");await inject(d,"utsending-test-extra-products.js","extras");await inject(d,"utsending-compact-connection-v275.js","connection");await inject(d,"nordic-ut-env-scanner.js","nordic-env");patchCore();hideOldStock();d.querySelector("#utLanguageSwitch")?.addEventListener("click",()=>setTimeout(afterRender,0));afterRender();setTimeout(afterRender,250);setTimeout(afterRender,900);setTimeout(openRequested,300);loader.style.display="none"}catch(e){loader.textContent=`Nordic ${MODE.toUpperCase()} startfeil: ${e.message||e}`}}
function switchMode(next){if(next===MODE)return;MODE=next;f.src="about:blank";setTimeout(build,30)}
testBtn.onclick=()=>switchMode("test");
function startHold(e){if(MODE==="work")return;holdDone=false;clearTimeout(holdTimer);workBtn.textContent="🏭 WORK · ТРИМАЙ…";holdTimer=setTimeout(()=>{holdDone=true;workBtn.textContent="🏭 WORK";if(confirm("Перейти в WORK? Це реальний склад і реальні замовлення."))switchMode("work");else updateOuter()},1500);e?.preventDefault?.()}
function cancelHold(){if(!holdDone){clearTimeout(holdTimer);workBtn.textContent="🏭 WORK · УТРИМАТИ"}}
workBtn.addEventListener("pointerdown",startHold);workBtn.addEventListener("pointerup",cancelHold);workBtn.addEventListener("pointerleave",cancelHold);workBtn.addEventListener("pointercancel",cancelHold);
addEventListener("resize",resize,{passive:true});build();
</script></body></html>
