<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>TEST — Nordic ID UT Lager v2.6</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020}#utCore{display:block;width:100%;min-height:100vh;border:0;background:#0b1020}#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:100000}
</style>
</head>
<body>
<div id="loader">Laster TEST — Nordic ID UT Lager…</div>
<iframe id="utCore" title="TEST — Nordic ID UT Lager"></iframe>
<script>
"use strict";
const VERSION="20260809-2238";
const f=document.getElementById("utCore"),loader=document.getElementById("loader");
let openTries=0,brandTimer=0,nidIdle=0,nidArm=0,nidBusy=false,nidLockUntil=0,nidScans=0,nidAccepted=0,pendingCount=null;
function resize(){try{const d=f.contentDocument;f.style.height=Math.max(innerHeight,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+"px"}catch{}}
function inject(d,src){return new Promise((resolve,reject)=>{const s=d.createElement("script");s.src=`${src}?v=${VERSION}`;s.onload=resolve;s.onerror=reject;d.body.appendChild(s)})}
function order(){try{return typeof f.contentWindow.current==="function"?f.contentWindow.current():null}catch{return null}}
function hideKeyboard(w=f.contentWindow){try{w.document.activeElement?.blur?.()}catch{}try{w.navigator.virtualKeyboard?.hide?.()}catch{}}
function productName(id){return({bunner:"Bunner",hyller30:"Hyller x30",hyller60:"Hyller x60",forlengere_korte:"Forlengere korte",forlengere_lange:"Forlengere lange",forlengere_plast:"Forlengere plast"})[id]||id||"—"}
function setNidMessage(d,text,type=""){const n=d.getElementById("nidMessage");if(!n)return;n.textContent=text;n.className="nid-message"+(type?" "+type:"")}
function setRfidState(d,text,cls="ok"){const n=d.getElementById("nidState");if(!n)return;n.textContent=text;n.className=cls}
function updateCounters(d){const a=d.getElementById("nidScans"),b=d.getElementById("nidAccepted");if(a)a.textContent=String(nidScans);if(b)b.textContent=String(nidAccepted)}
function addNordicStyle(d){if(d.getElementById("nordicUtStyle"))return;const s=d.createElement("style");s.id="nordicUtStyle";s.textContent=`
.stock-card{display:none!important}.test-picker{display:none!important}#scanBox{display:none!important}
#nidScannerCard{margin:11px 0;padding:15px;border:2px solid #48d597;border-radius:18px;background:rgba(72,213,151,.055)}
#nidScannerCard .nid-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#nidScannerCard h2{margin:0;color:#48d597;font-size:22px}.nid-badge{padding:5px 8px;border:1px solid #48d597;border-radius:999px;color:#48d597;font-size:10px;font-weight:950}
.nid-status{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.nid-cell{padding:9px;border:1px solid #303b59;border-radius:11px;background:#0d1426;text-align:center;color:#aab4ce;font-size:9px;font-weight:900}.nid-cell strong{display:block;margin-top:4px;color:#f5f7ff;font-size:16px}.nid-cell strong.ok{color:#48d597}.nid-cell strong.live{color:#f4c430}.nid-message{min-height:46px;margin-top:10px;padding:10px;border:1px dashed #303b59;border-radius:11px;color:#aab4ce;font:800 12px/1.45 Arial,sans-serif;text-align:center}.nid-message.ok{border-color:#48d597;color:#bff5dc}.nid-message.bad{border-color:#ff7373;color:#ffc1c1}.nid-note{margin-top:8px;color:#aab4ce;font:700 10px/1.4 Arial,sans-serif;text-align:center}
#nidScanInput{position:fixed!important;left:-10000px!important;top:-10000px!important;width:1px!important;height:1px!important;min-height:0!important;opacity:0!important;padding:0!important;border:0!important;pointer-events:none!important}
#nidCountModal{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.82)}#nidCountModal.show{display:flex}#nidCountSheet{width:min(600px,100%);padding:18px;border:2px solid #f4c430;border-radius:20px;background:#111827;box-shadow:0 20px 70px rgba(0,0,0,.65)}#nidCountSheet h2{margin:0 0 9px;color:#f4c430;font-size:28px}.nid-lower{font:950 clamp(36px,12vw,62px)/1 monospace;color:#f4c430}.nid-count-detail{margin-top:10px;padding:10px;border:1px solid #303b59;border-radius:11px;background:#0d1426;line-height:1.45}.nid-count-fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.nid-count-fields label{display:block;margin-bottom:5px;color:#aab4ce;font-size:11px;font-weight:900}.nid-count-fields input{width:100%;min-height:50px;padding:10px;border:1px solid #303b59;border-radius:11px;background:#0d1426;color:#f5f7ff;font-size:19px;font-weight:950;text-align:center}.nid-count-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.nid-count-actions button{min-height:58px;border:0;border-radius:12px;font-weight:950;font-size:16px}.nid-save{background:#48d597;color:#062418}.nid-cancel{background:#303b59;color:#f5f7ff}.nid-count-msg{min-height:18px;margin-top:8px;color:#aab4ce;font-size:11px;text-align:center}
#utNordicCloneBanner{margin:10px 0 12px;padding:11px 13px;border:2px solid #48d597;border-radius:14px;background:rgba(72,213,151,.09);color:#eafff6;font:900 13px/1.45 Arial,sans-serif;text-align:center}
@media(max-width:520px){.nid-status,.nid-count-fields,.nid-count-actions{grid-template-columns:1fr}}
`;d.head.appendChild(s)}
function ensureModal(d){let m=d.getElementById("nidCountModal");if(m)return m;m=d.createElement("div");m.id="nidCountModal";m.innerHTML=`<div id="nidCountSheet"><h2 id="nidCountTitle">Forlengere</h2><div id="nidCountLower" class="nid-lower">—</div><div id="nidCountDetail" class="nid-count-detail"></div><div class="nid-count-fields"><div><label>Hyller</label><input id="nidHyller" type="number" min="0" step="1" inputmode="numeric"></div><div><label>Forlengere</label><input id="nidForlengere" type="number" min="0" step="1" inputmode="numeric"></div></div><div id="nidCountMsg" class="nid-count-msg"></div><div class="nid-count-actions"><button id="nidCountSave" class="nid-save" type="button">ЗБЕРЕГТИ</button><button id="nidCountCancel" class="nid-cancel" type="button">СКАСУВАТИ</button></div></div>`;d.body.appendChild(m);m.querySelector("#nidCountSave").onclick=()=>saveCounts(d);m.querySelector("#nidCountCancel").onclick=()=>closeCounts(d);return m}
function ensureNordicCard(d,w){addNordicStyle(d);const old=d.getElementById("scanBox");if(!old)return;let card=d.getElementById("nidScannerCard");if(!card){card=d.createElement("section");card.id="nidScannerCard";card.innerHTML=`<div class="nid-head"><h2>📡 Nordic ID</h2><span class="nid-badge">PROFESSIONAL RFID · TEST</span></div><input id="nidScanInput" type="text" readonly tabindex="-1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true"><div class="nid-status"><div class="nid-cell">RFID<strong id="nidState" class="ok">READY</strong></div><div class="nid-cell">Сканів<strong id="nidScans">0</strong></div><div class="nid-cell">Прийнято<strong id="nidAccepted">0</strong></div></div><div id="nidMessage" class="nid-message">Відкрийте RAMPE. Далі тільки короткий trigger Nordic — товар визначається автоматично.</div><div class="nid-note">Photo · AI · Manual input вимкнені. Клавіатура використовується тільки для Hyller + Forlengere у коротких/довгих продовжувачах.</div>`;old.insertAdjacentElement("beforebegin",card)}updateCounters(d);ensureModal(d);bindNordic(d,w)}
function bindNordic(d,w){if(d.__NORDIC_UT_BOUND__)return;d.__NORDIC_UT_BOUND__=true;d.addEventListener("keydown",e=>{const input=d.getElementById("nidScanInput");if(!input)return;if(e.key==="Unidentified"){if(performance.now()>=nidLockUntil)armNordic(d,w)}if((e.key==="Enter"||e.key==="Tab")&&!input.readOnly&&input.value){e.preventDefault();commitNordic(d,w)}},true);d.addEventListener("input",e=>{if(e.target?.id!=="nidScanInput")return;clearTimeout(nidIdle);nidIdle=setTimeout(()=>commitNordic(d,w),150)},true)}
function armNordic(d,w){const o=order(),input=d.getElementById("nidScanInput"),modal=d.getElementById("nidCountModal");if(!o||!input||nidBusy||modal?.classList.contains("show"))return;if(["staged","completed","cancelled"].includes(o.status)){setNidMessage(d,`RAMPE ${o.ramp} зараз має status ${o.status}.`,"bad");return}clearTimeout(nidArm);input.value="";input.readOnly=false;try{input.focus({preventScroll:true})}catch{input.focus()}try{w.navigator.virtualKeyboard?.hide?.()}catch{}setRfidState(d,"ACTIVE","live");nidArm=setTimeout(()=>{if(!input.value){input.readOnly=true;try{input.blur()}catch{}hideKeyboard(w);setRfidState(d,"READY","ok")}},1600)}
function normalizeEpc(v){return String(v||"").toUpperCase().replace(/[^0-9A-F]/g,"").slice(0,24)}
async function commitNordic(d,w){const input=d.getElementById("nidScanInput");if(!input||input.readOnly||nidBusy)return;clearTimeout(nidIdle);clearTimeout(nidArm);const epc=normalizeEpc(input.value);input.value="";input.readOnly=true;try{input.blur()}catch{}hideKeyboard(w);setRfidState(d,"READY","ok");if(epc.length!==24){if(epc)setNidMessage(d,`RFID отримано ${epc.length}/24 символів. Спробуйте короткий trigger.`,"bad");return}const o=order();if(!o){setNidMessage(d,"Спочатку відкрийте потрібну RAMPE.","bad");return}nidLockUntil=performance.now()+600;nidScans++;updateCounters(d);nidBusy=true;setNidMessage(d,`RAMPE ${o.ramp} · читаю ${epc.slice(-6)}…`);try{const data=await w.rpc("nordic_auto_scan",{p_order_id:o.id,p_epc:epc});const r=Array.isArray(data)?data[0]:data;if(!r?.ok)throw new Error("Nordic TEST scan failed");if(r.kind==="stock"){nidAccepted++;updateCounters(d);setNidMessage(d,`✅ ${productName(r.product)} ${r.done}/${r.ordered} · бірка ${r.physical_lower} · додано на RAMPE ${o.ramp}.`,"ok");await refreshOpened(w,o.id)}else if(r.kind==="counts"){pendingCount={...r,order_id:o.id,ramp:o.ramp};openCounts(d,r)}else if(r.kind==="complete"){setNidMessage(d,`✅ RAMPE ${o.ramp}: усі Nordic TEST-позиції вже підтверджені. Можна переходити до «Klar på rampe».`,"ok")}}catch(e){setNidMessage(d,e.message||String(e),"bad")}finally{nidBusy=false}}
function openCounts(d,r){pendingCount=pendingCount||r;const m=d.getElementById("nidCountModal");d.getElementById("nidCountTitle").textContent=productName(r.product);d.getElementById("nidCountLower").textContent=r.physical_lower||"—";d.getElementById("nidCountDetail").innerHTML=`<b>RAMPE ${pendingCount.ramp||order()?.ramp||"—"}</b><br>${productName(r.product)} · Vogn ${r.unit_index} av ${r.ordered}<br>Тільки тут введіть кількість полиць і продовжувачів.`;d.getElementById("nidHyller").value="";d.getElementById("nidForlengere").value="";d.getElementById("nidCountMsg").textContent="";m.classList.add("show");m.setAttribute("aria-hidden","false")}
function closeCounts(d){const m=d.getElementById("nidCountModal");m?.classList.remove("show");m?.setAttribute("aria-hidden","true");pendingCount=null;hideKeyboard(f.contentWindow);setRfidState(d,"READY","ok")}
async function saveCounts(d){if(!pendingCount||nidBusy)return;const h=d.getElementById("nidHyller"),x=d.getElementById("nidForlengere"),msg=d.getElementById("nidCountMsg"),hv=Number(h.value),xv=Number(x.value);if(h.value===""||x.value===""||!Number.isInteger(hv)||!Number.isInteger(xv)||hv<0||xv<0){msg.textContent="Введіть обидва цілі значення ≥ 0.";return}nidBusy=true;try{await f.contentWindow.rpc("confirm_ut_extra_unit",{p_order_id:pendingCount.order_id,p_product_id:pendingCount.product,p_unit_index:pendingCount.unit_index,p_hyller_count:hv,p_forlengere_count:xv});const orderId=pendingCount.order_id,product=pendingCount.product,idx=pendingCount.unit_index;nidAccepted++;updateCounters(d);closeCounts(d);setNidMessage(d,`✅ ${productName(product)} · Vogn ${idx}: Hyller ${hv} · Forlengere ${xv} · підтверджено.`,"ok");await refreshOpened(f.contentWindow,orderId)}catch(e){msg.textContent=e.message||String(e)}finally{nidBusy=false;hideKeyboard(f.contentWindow)}}
async function refreshOpened(w,id){try{await w.loadAll(true);if(typeof w.openOrder==="function")await w.openOrder(id,false)}catch{}setTimeout(()=>afterRender(false),80)}
function markTest(d){if(!d)return;const v=d.querySelector(".version");if(v)v.innerHTML="NORDIC TEST · UT Lager GREEN BASE · V2.6<br>Oppdatert 09.08.2026 kl. 22:38";let b=d.getElementById("utNordicCloneBanner");if(!b){b=d.createElement("div");b.id="utNordicCloneBanner";const title=d.querySelector("h1");if(title?.parentElement)title.insertAdjacentElement("beforebegin",b)}if(b)b.innerHTML="📡 <b>NORDIC ID TEST · ІЗОЛЬОВАНО</b> · GREEN-форма як основа, але всі дані йдуть тільки в ut_test_* · Photo / AI / Manual вимкнені.";const home=d.querySelector("a.home");if(home&&!home.dataset.nidBound){home.dataset.nidBound="1";home.href="scanner-home.html";home.target="_top";home.addEventListener("click",e=>{e.preventDefault();window.top.location.href="scanner-home.html"},{capture:true})}}
function afterRender(){try{const d=f.contentDocument,w=f.contentWindow;if(!d)return;addNordicStyle(d);d.querySelectorAll(".test-picker").forEach(n=>n.remove());ensureNordicCard(d,w);w.UT_LANGUAGE_APPLY?.();w.UT_PRODUCTION_ENHANCE?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();markTest(d);resize();setTimeout(resize,80)}catch{}}
function patchCore(){const w=f.contentWindow;if(w.__BAMA_NORDIC_TEST_PATCH__)return;w.__BAMA_NORDIC_TEST_PATCH__=true;if(typeof w.openOrder==="function"){const original=w.openOrder;w.openOrder=async function(id,...rest){const result=await original.call(w,id,...rest);afterRender();setTimeout(()=>{try{const d=f.contentDocument,detail=d.getElementById("detail");if(detail?.classList.contains("show")){const top=f.getBoundingClientRect().top+scrollY+detail.getBoundingClientRect().top+(w.scrollY||0);scrollTo({top:Math.max(0,top-10),behavior:"smooth"})}}catch{}},70);return result}}if(typeof w.renderDetail==="function"){const original=w.renderDetail;w.renderDetail=function(...args){const result=original.apply(w,args);queueMicrotask(afterRender);return result}}if(typeof w.renderRamps==="function"){const original=w.renderRamps;w.renderRamps=function(...args){const result=original.apply(w,args);queueMicrotask(afterRender);return result}}if(typeof w.loadAll==="function"){const original=w.loadAll;w.loadAll=async function(...args){const result=await original.apply(w,args);afterRender();return result}}}
function openRequested(){const p=new URLSearchParams(location.search),id=p.get("open");if(!id)return;try{const w=f.contentWindow;if(typeof w.openOrder==="function"){w.openOrder(id);return}}catch{}if(openTries++<25)setTimeout(openRequested,250)}
async function build(){try{const response=await fetch(`utsending-core-v7.html?v=${VERSION}`,{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);let html=await response.text();html=html.replace("</head>",`<script src="./ut-test-api.js?v=${VERSION}"><\/script></head>`);f.srcdoc=html}catch(error){loader.textContent=`Kunne ikke laste Nordic TEST UT: ${error.message||error}`}}
async function enhance(){const d=f.contentDocument;if(!d)return;try{f.contentWindow.BAMA_HOME_TARGET="utsending-nordic-test.html";d.querySelectorAll("a[href]").forEach(a=>a.target="_top");await inject(d,"utsending-production-flow.js");await inject(d,"utsending-language.js");await inject(d,"utsending-status-colors.js");await inject(d,"utsending-product-stock-v273.js");await inject(d,"utsending-compact-connection-v275.js");patchCore();afterRender();setTimeout(afterRender,250);setTimeout(openRequested,320);clearInterval(brandTimer);brandTimer=setInterval(afterRender,1200);loader.style.display="none"}catch(error){loader.textContent=`Nordic TEST startfeil: ${error.message||error}`}}
f.addEventListener("load",enhance,{once:true});addEventListener("resize",resize,{passive:true});build();
</script>
</body></html>
