<script>

const f=document.getElementById("utCore"),loader=document.getElementById("loader"),testBtn=document.getElementById("testBtn"),workBtn=document.getElementById("workBtn"),envNote=document.getElementById("envNote");
let MODE="test",openTries=0,holdTimer=0,holdDone=false,viewportTimer=0,modalWasOpen=false,progressSeq=0;
function updateOuter(){const work=MODE==="work";testBtn.classList.toggle("active",!work);workBtn.classList.toggle("active",work);loader.textContent=work?"Laster Nordic ID · НА РАМПУ · WORK…":"Laster Nordic ID · НА РАМПУ · TEST…";envNote.innerHTML=work?"<b>WORK · REAL DATABASE</b> · реальний склад · дублікати RFID заблоковані.":"<b>TEST</b> · environment=test · дублікати RFID дозволені."}

function mark(){try{const d=f.contentDocument,w=f.contentWindow;if(!d?.body)return;w.BAMA_HOME_TARGET="scanner-home.html";let b=d.getElementById("utNordicMirrorBanner");if(!b){b=d.createElement("div");b.id="utNordicMirrorBanner";const h=d.querySelector("h1");if(h?.parentElement)h.insertAdjacentElement("beforebegin",b)}if(b){const work=MODE==="work";b.style.cssText=`margin:10px 0 12px;padding:11px 13px;border:2px solid ${work?'#ff7373':'#48d597'};border-radius:14px;background:${work?'rgba(255,115,115,.09)':'rgba(72,213,151,.09)'};color:#f5f7ff;font:900 13px/1.45 Arial,sans-serif;text-align:center`;b.innerHTML=work?"🏭 <b>НА РАМПУ · WORK</b><br>V2.4 RFID engine · реальний склад.":"🧪 <b>НА РАМПУ · TEST</b><br>V2.4 RFID engine · INPUT LOCK + SMART FOCUS + COUNT COMPACT."}const v=d.querySelector(".version");if(v)v.innerHTML=`${PAGE_VERSION} · НА РАМПУ · COUNT COMPACT · ${MODE.toUpperCase()}<br>Oppdatert 10.08.2026 kl. 20:01`;const home=d.querySelector("a.home");if(home&&!home.dataset.nidHome){home.dataset.nidHome="1";home.href="scanner-home.html";home.target="_top";home.onclick=e=>{e.preventDefault();top.location.href="scanner-home.html"}}d.querySelectorAll("button").forEach(btn=>{if(btn.textContent.trim()==="readyRampButton")btn.textContent=(w.UT_LANG==="uk"?"Готово на рампі":w.UT_LANG==="pl"?"Gotowe na rampie":"Klar på rampe")})}catch{}}
function applyV24Skin(){try{const d=f.contentDocument;if(!d?.body)return;let s=d.getElementById("nidV24RampSkin");if(!s){s=d.createElement("style");s.id="nidV24RampSkin";s.textContent=`#nidCard{border:3px solid #48d597!important;border-radius:22px!important;background:#11182a!important;padding:13px!important}#nidCard .nid-head{display:none!important}#nidV24RampHead{margin-bottom:4px}.nid-v24-mini{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 2px 5px}.nid-v24-ramp{color:#48d597;font-size:25px;font-weight:1000;line-height:1}.nid-v24-tech{color:#aab4ce;font-size:9px;font-weight:900;text-align:right}.nid-v24-tech b{color:#f4c430}#nidWorkPanel{margin:5px 0 10px;padding:12px;border:2px solid #f4c430;border-radius:15px;background:rgba(244,196,48,.055)}.nwp-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;color:#f4c430;font-size:15px;font-weight:1000}.nwp-row{display:grid;grid-template-columns:1fr auto;gap:7px;padding:8px 0;border-top:1px solid #303b59;align-items:center}.nwp-row:first-of-type{border-top:0}.nwp-name{font-size:14px;font-weight:950}.nwp-count{text-align:right;font-size:15px;font-weight:1000}.nwp-count small{display:block;color:#aab4ce;font-size:9px;font-weight:900}.nwp-next{margin-top:9px;padding:10px;border-radius:11px;background:#0d1426;color:#f5f7ff;font-size:13px;font-weight:950;line-height:1.4}.nwp-next b{color:#48d597}.nwp-all{margin-top:9px;padding:12px;border:2px solid #48d597;border-radius:12px;background:rgba(72,213,151,.09);color:#bff5dc;text-align:center;font-size:15px;font-weight:1000;line-height:1.35}#nidCard .nid-grid{grid-template-columns:1fr!important;gap:9px!important}#nidCard .nid-grid .nid-cell:first-child{grid-column:1/-1!important;min-height:72px!important;display:flex!important;align-items:center!important;justify-content:center!important;border:2px solid #48d597!important;border-radius:15px!important;font-size:0!important}#nidCard .nid-grid .nid-cell:first-child strong{margin:0!important;color:#48d597!important;font-size:38px!important;font-weight:1000!important}#nidCard .nid-grid .nid-cell:not(:first-child){display:none!important}#nidModal .nid-sheet{padding-bottom:6px!important}#nidModal .nid-actions{position:sticky!important;bottom:0!important;z-index:20!important;margin-top:10px!important;padding:10px 0 max(5px,env(safe-area-inset-bottom))!important;background:linear-gradient(180deg,rgba(17,24,39,0),#111827 20%,#111827 100%)!important}`;d.head.appendChild(s)}const card=d.getElementById("nidCard");if(!card)return;let h=d.getElementById("nidV24RampHead");if(!h){h=d.createElement("div");h.id="nidV24RampHead";card.prepend(h)}const o=currentOrder();h.innerHTML=`<div class="nid-v24-mini"><div class="nid-v24-ramp">${o?.ramp?`RAMPE ${o.ramp}`:'ВІДКРИЙ RAMPE'}</div><div class="nid-v24-tech"><b>${PAGE_VERSION}</b><br>V2.4 RFID</div></div>`;let p=d.getElementById("nidWorkPanel");if(!p){p=d.createElement("div");p.id="nidWorkPanel";p.hidden=true;h.insertAdjacentElement("afterend",p)}}catch{}}
function hideOldStock(){try{const d=f.contentDocument;if(!d.getElementById("utHideOldStock")){const s=d.createElement("style");s.id="utHideOldStock";s.textContent=".stock-card{display:none!important}";d.head.appendChild(s)}}catch{}}
function scrollToInner(el){try{if(!el)return;const head=document.getElementById("envBar").getBoundingClientRect().bottom;const target=scrollY+f.getBoundingClientRect().top+el.getBoundingClientRect().top-head-6;scrollTo({top:Math.max(0,target),behavior:"smooth"})}catch{}}

async function refreshWorkPanel(autoFocus=false){const seq=++progressSeq;try{if(countEntryOpen())return;const d=f.contentDocument,w=f.contentWindow,o=currentOrder(),box=d?.getElementById("nidWorkPanel");if(!d||!box)return;if(!o){box.hidden=true;return}const c=pcopy(),rows=[];let r={b:+o.bunner_stacks||0,h30:+o.hyller30_sets||0,h60:+o.hyller60_sets||0},s={b:0,h30:0,h60:0};try{if(typeof w.requestQty==="function")r=w.requestQty(o);if(typeof w.scanQty==="function")s=w.scanQty()}catch{}if(+r.b>0)rows.push({id:"bunner",total:+r.b||0,done:+s.b||0});if(+r.h30>0)rows.push({id:"hyller30",total:+r.h30||0,done:+s.h30||0});if(+r.h60>0)rows.push({id:"hyller60",total:+r.h60||0,done:+s.h60||0});let extra=[];try{if(typeof w.rpc==="function")extra=await w.rpc("ut_extra_progress",{p_order_id:o.id})||[]}catch{}if(seq!==progressSeq||currentOrder()?.id!==o.id)return;const map=new Map();for(const x of Array.isArray(extra)?extra:[]){const id=x.product_id;if(!["forlengere_korte","forlengere_lange","forlengere_plast"].includes(id))continue;if(!map.has(id))map.set(id,{id,total:0,units:0,done:0});const g=map.get(id);g.units++;g.total=Math.max(g.total,+x.ordered_quantity||0);if(x.confirmed||x.staged||x.dispatched)g.done++}for(const id of ["forlengere_korte","forlengere_lange","forlengere_plast"]){const g=map.get(id);if(g){g.total=g.total||g.units;rows.push(g)}}box.hidden=false;if(!rows.length){box.innerHTML=`<div class="nwp-head">📋 RAMPE ${o.ramp||"—"} · ${c.order}</div><div class="nwp-next">—</div>`;if(autoFocus)scrollToWorkPanel();return}let next=null,allDone=true;const body=rows.map(x=>{const done=Math.min(+x.done||0,+x.total||0),left=Math.max(0,(+x.total||0)-done);if(left>0&&!next)next={...x,done,left};if(left>0)allDone=false;return`<div class="nwp-row"><div class="nwp-name">${productLabel(x.id)}</div><div class="nwp-count">${done} / ${x.total}<small>${left?`${c.left}: ${left}`:c.done}</small></div></div>`}).join("");box.innerHTML=`<div class="nwp-head"><span>📋 RAMPE ${o.ramp||"—"} · ${c.or function scannerHintForOrder(){try{const d=f.contentDocument,o=currentOrder(),n=d?.getElementById("nidMessage");if(n&&o){n.textContent=`RAMPE ${o.ramp} · READY`;n.className="nid-msg"}}catch{}}
function syncModalViewport(){try{const d=f.contentDocument,m=d?.getElementById("nidModal");if(!m)return;const open=m.classList.contains("show");if(open){const fr=f.getBoundingClientRect(),head=document.getElementById("envBar").getBoundingClientRect().bottom,vv=window.visualViewport,vh=vv?.height||innerHeight,topInFrame=Math.max(0,Math.round(head-fr.top+4)),visibleH=Math.max(220,Math.round(vh-head-8));m.style.position="absolute";m.style.inset="auto 0 auto 0";m.style.top=topInFrame+"px";m.style.height=visibleH+"px";m.style.minHeight=visibleH+"px";m.style.maxHeight=visibleH+"px";m.style.zIndex="2147483647";const sheet=m.querySelector(".nid-sheet");if(sheet)sheet.style.maxHeight=Math.max(190,visibleH-12)+"px"}else if(modalWasOpen){setTimeout(()=>refreshWorkPanel(false),280);setTimeout(()=>refreshWorkPanel(true),850)}modalWasOpen=open}catch{}}
function startViewportSync(){clearInterval(viewportTimer);viewportTimer=setInterval(syncModalViewport,180);syncModalViewport()}
function keepModalActionsVisible(e){try{if(e.target?.id!=="nidH"&&e.target?.id!=="nidF")return;setTimeout(()=>{syncModalViewport();const d=f.contentDocument,sheet=d?.querySelector("#nidModal .nid-sheet"),actions=d?.querySelector("#nidModal .nid-actions");if(e.target?.id==="nidF"&&sheet)sheet.scrollTop=sheet.scrollHeight;actions?.scrollIntoView({block:"nearest",behavior:"smooth"})},180)}catch{}}
function afterRender(){try{if(countEntryOpen()){syncModalViewport();resize();return}const w=f.contentWindow;hideOldStock();w.UT_LANGUAGE_APPLY?.();w.UT_PRODUCTION_ENHANCE?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();w.UT_PRODUCT_STOCK_REFRESH?.();w.UT_EXTRA_PRODUCTS_REFRESH?.();w.NORDIC_UT_REFRESH?.();mark();applyV24Skin();refreshWorkPanel(false);resize();setTimeout(()=>{if(countEntryOpen())return;mark();applyV24Skin();refreshWorkPanel(false);resize();syncModalViewport()},80)}catch{}}
function patchCore(){const w=f.contentWindow;if(w.__NORDIC_ENV_MIRROR_PATCH__)return;w.__NORDIC_ENV_MIRROR_PATCH__=true;const locked=()=>countEntryOpen();if(typeof w.openOrder==="function"){const o=w.openOrder;w.openOrder=async function(id,...rest){if(locked())return null;const r=await o.call(w,id,...rest);afterRender();scannerHintForOrder();setTimeout(()=>refreshWorkPanel(true),180);setTimeout(()=>refreshWorkPanel(false),650);return r}}if(typeof w.renderDetail==="function"){const o=w.renderDetail;w.renderDetail=function(...a){if(locked())return null;const r=o.apply(w,a);queueMicrotask(afterRender);return r}}if(typeof w.renderRamps==="function"){const o=w.renderRamps;w.renderRamps=function(...a){if(locked())return null;const r=o.apply(w,a);queueMicrotask(afterRender);return r}}if(typeof w.loadAll==="function"){const o=w.loadAll;w.loadAll=async function(...a){if(locked())return null;const r=await o.apply(w,a);afterRender();return r}}if(typeof w.UT_EXTRA_PRODUCTS_REFRESH==="function"){const o=w.UT_EXTRA_PRODUCTS_REFRESH;w.UT_EXTRA_PRODUCTS_REFRESH=async function(...a){if(locked())return null;return await o.apply(w,a)}}if(typeof w.NORDIC_UT_REFRESH==="function"){const o=w.NORDIC_UT_REFRESH;w.NORDIC_UT_REFRESH=function(...a){if(locked())return null;return o.apply(w,a)}}}
function openRequested(){const id=new URLSearchParams(location.search).get("open");if(!id)return;try{const w=f.contentWindow;if(typeof w.openOrder==="function"){w.openOrder(id);return}}catch{}if(openTries++<25)setTimeout(openRequested,250)}
async function enhance(){const d=f.contentDocument;if(!d)return;try{f.contentWindow.BAMA_HOME_TARGET="scanner-home.html";d.querySelectorAll("a[href]").forEach(a=>a.target="_top");await inject(d,"utsending-production-flow.js","production-flow");await inject(d,"utsending-language.js","language");await inject(d,"utsending-allowed-picker.js","picker");await inject(d,"utsending-status-colors.js","status");await inject(d,"utsending-product-stock-v273.js","stock");await inject(d,"utsending-test-extra-products.js","extras");await inject(d,"utsending-compact-connection-v275.js","connection");await inject(d,"nordic-ut-env-scanner.js","nordic-env");patchCore();hideOldStock();d.addEventListener("focusin",keepModalActionsVisible,true);d.querySelector("#utLanguageSwitch")?.addEventListener("click",()=>setTimeout(()=>{afterRender();refreshWorkPanel(true)},0));afterRender();startViewportSync();setTimeout(afterRender,250);setTimeout(afterRender,900);setTimeout(openRequested,300)}catch(e){loader.textContent=`Nordic ${MODE.toUpperCase()} startfeil: ${e.message||e}`;return}finally{if(!loader.textContent.includes("startfeil"))loader.style.display="none"}}
async function build(){updateOuter();loader.style.display="flex";openTries=0;modalWasOpen=false;progressSeq=0;clearInterval(viewportTimer);try{const r=await fetch(`utsending-core-v7.html?v=${VERSION}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);let html=await r.text();html=html.replace("</head>",`<script>window.BAMA_ENV_MODE=${JSON.stringify(MODE)};<\/script><script src="./ut-test-api.js?v=${VERSION}"><\/script></head>`);f.addEventListener("load",enhance,{once:true});f.srcdoc=html}catch(e){loader.textContent=`Kunne ikke laste Nordic ${MODE.toUpperCase()}: ${e.message||e}`}}
function switchMode(next){if(next===MODE)return;MODE=next;f.src="about:blank";setTimeout(build,30)}
testBtn.onclick=()=>switchMode("test");
function startHold(e){if(MODE==="work")return;holdDone=false;clearTimeout(holdTimer);workBtn.textContent="🏭 WORK · ТРИМАЙ…";holdTimer=setTimeout(()=>{holdDone=true;workBtn.textContent="🏭 WORK";if(confirm("Перейти в WORK? Це реальний склад і реальні замовлення."))switchMode("work");else updateOuter()},1500);e?.preventDefault?.()}
function cancelHold(){if(!holdDone){clearTimeout(holdTimer);workBtn.textContent="🏭 WORK · УТРИМАТИ"}}
workBtn.addEventListener("pointerdown",startHold);workBtn.addEventListener("pointerup",cancelHold);workBtn.addEventListener("pointerleave",cancelHold);workBtn.addEventListener("pointercancel",cancelHold);
addEventListener("resize",()=>{resize();syncModalViewport()},{passive:true});addEventListener("scroll",syncModalViewport,{passive:true});visualViewport?.addEventListener("resize",syncModalViewport,{passive:true});visualViewport?.addEventListener("scroll",syncModalViewport,{passive:true});build();
</script>
