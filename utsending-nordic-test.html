<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Nordic ID — НА РАМПУ · V2.9.1</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7ff;font-family:Arial,sans-serif}*{box-sizing:border-box}#envBar{position:sticky;top:0;z-index:100001;padding:9px 10px;background:#0b1020;border-bottom:1px solid #303b59}.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:760px;margin:auto}.env-btn{min-height:52px;border:2px solid #303b59;border-radius:13px;background:#151c30;color:#f5f7ff;font-size:16px;font-weight:950}.env-btn.test.active{border-color:#48d597;background:rgba(72,213,151,.13);color:#bff5dc}.env-btn.work.active{border-color:#ff7373;background:rgba(255,115,115,.14);color:#ffd0d0}.env-note{max-width:760px;margin:6px auto 0;color:#aab4ce;font-size:10px;line-height:1.35;text-align:center}.env-note b{color:#f5f7ff}#utCore{display:block;width:100%;min-height:calc(100vh - 95px);border:0;background:#0b1020}#loader{position:fixed;inset:94px 0 0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:100000}
</style>
</head>
<body>
<div id="envBar"><div class="env-grid"><button id="testBtn" class="env-btn test active" type="button">🧪 TEST</button><button id="workBtn" class="env-btn work" type="button">🏭 WORK · УТРИМАТИ</button></div><div id="envNote" class="env-note"><b>TEST</b> · ті самі робочі таблиці, тільки рядки environment=test · дублікати RFID дозволені.</div></div>
<div id="loader">Laster Nordic ID · НА РАМПУ · TEST…</div><iframe id="utCore" title="Nordic ID — НА РАМПУ · TEST / WORK"></iframe>
<script>
"use strict";
const VERSION="20260810-1804",PAGE_VERSION="V2.9.1",f=document.getElementById("utCore"),loader=document.getElementById("loader"),testBtn=document.getElementById("testBtn"),workBtn=document.getElementById("workBtn"),envNote=document.getElementById("envNote");
let MODE="test",openTries=0,holdTimer=0,holdDone=false;
function resize(){try{const d=f.contentDocument;f.style.height=Math.max(innerHeight-90,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+"px"}catch{}}
function inject(d,src,mark=""){return new Promise((ok,bad)=>{if(mark&&d.querySelector(`script[data-test-module="${mark}"]`))return ok();const s=d.createElement("script");s.src=`${src}?v=${VERSION}`;if(mark)s.dataset.testModule=mark;s.onload=ok;s.onerror=()=>bad(new Error(`Kunne ikke laste ${src}`));d.body.appendChild(s)})}
function updateOuter(){const work=MODE==="work";testBtn.classList.toggle("active",!work);workBtn.classList.toggle("active",work);loader.textContent=work?"Laster Nordic ID · НА РАМПУ · WORK…":"Laster Nordic ID · НА РАМПУ · TEST…";envNote.innerHTML=work?"<b>WORK · REAL DATABASE</b> · реальний склад · дублікати RFID заблоковані.":"<b>TEST</b> · ті самі робочі таблиці, тільки рядки environment=test · дублікати RFID дозволені."}
function mark(){try{const d=f.contentDocument,w=f.contentWindow;if(!d?.body)return;w.BAMA_HOME_TARGET="scanner-home.html";let b=d.getElementById("utNordicMirrorBanner");if(!b){b=d.createElement("div");b.id="utNordicMirrorBanner";const h=d.querySelector("h1");if(h?.parentElement)h.insertAdjacentElement("beforebegin",b)}if(b){const work=MODE==="work";b.style.cssText=`margin:10px 0 12px;padding:11px 13px;border:2px solid ${work?'#ff7373':'#48d597'};border-radius:14px;background:${work?'rgba(255,115,115,.09)':'rgba(72,213,151,.09)'};color:#f5f7ff;font:900 13px/1.45 Arial,sans-serif;text-align:center`;b.innerHTML=work?"🏭 <b>НА РАМПУ · WORK · REAL DATABASE</b><br>Реальні mottak_scans / ut_orders. V2.4 RFID engine. Повний EPC → scanner_code, останні 6 → lower_number.":"🧪 <b>НА РАМПУ · TEST</b><br>V2.4 RFID engine · ті самі таблиці, але environment=<b>test</b>. Одна RFID-бірка може використовуватись багато разів."}const v=d.querySelector(".version");if(v)v.innerHTML=`${PAGE_VERSION} · НА РАМПУ · V2.4 RFID ENGINE · ${MODE.toUpperCase()}<br>Oppdatert 10.08.2026 kl. 18:04`;const home=d.querySelector("a.home");if(home&&!home.dataset.nidHome){home.dataset.nidHome="1";home.href="scanner-home.html";home.target="_top";home.addEventListener("click",e=>{e.preventDefault();top.location.href="scanner-home.html"},{capture:true})}}catch{}}
function applyV24RampSkin(){try{const d=f.contentDocument,w=f.contentWindow;if(!d?.body)return;let s=d.getElementById("nidV24RampSkin");if(!s){s=d.createElement("style");s.id="nidV24RampSkin";s.textContent=`#nidCard{border:3px solid #48d597!important;border-radius:22px!important;background:#11182a!important;padding:17px!important;box-shadow:0 0 0 1px rgba(72,213,151,.12) inset!important}#nidCard .nid-head{display:none!important}#nidV24RampHead{margin-bottom:14px}.nid-v24-ver{color:#f4c430;font-size:clamp(42px,12vw,66px);font-weight:1000;line-height:1}.nid-v24-title{margin-top:10px;color:#f5f7ff;font-size:clamp(28px,8vw,44px);font-weight:1000;line-height:1.08}.nid-v24-base{margin-top:12px;padding:10px 12px;border:2px solid #75b7ff;border-radius:13px;background:rgba(117,183,255,.07);color:#d9e9ff;font-size:11px;font-weight:900;line-height:1.45}.nid-v24-ramp{margin-top:10px;color:#48d597;font-size:18px;font-weight:1000}.nid-v24-mode{display:inline-block;margin-top:8px;padding:5px 9px;border:1px solid #48d597;border-radius:999px;color:#bff5dc;font-size:10px;font-weight:1000}body[data-bama-env="work"] .nid-v24-mode{border-color:#ff7373;color:#ffd0d0}#nidCard .nid-grid{grid-template-columns:1fr 1fr!important;gap:9px!important}#nidCard .nid-grid .nid-cell:first-child{grid-column:1/-1!important;min-height:96px!important;display:flex!important;align-items:center!important;justify-content:center!important;border:2px solid #48d597!important;border-radius:15px!important;background:rgba(72,213,151,.05)!important;font-size:0!important}#nidCard .nid-grid .nid-cell:first-child strong{margin:0!important;color:#48d597!important;font-size:clamp(38px,12vw,58px)!important;font-weight:1000!important;letter-spacing:.02em!important}#nidCard .nid-grid .nid-cell:not(:first-child){min-height:70px!important;padding:11px!important;border-radius:13px!important}#nidCard .nid-grid .nid-cell:not(:first-child) strong{font-size:28px!important}#nidMessage{margin-top:11px!important;min-height:58px!important;font-size:13px!important}#nidNote{margin-top:10px!important;font-size:11px!important;line-height:1.45!important}`;d.head.appendChild(s)}const card=d.getElementById("nidCard");if(!card)return;let h=d.getElementById("nidV24RampHead");if(!h){h=d.createElement("div");h.id="nidV24RampHead";card.prepend(h)}let o=null;try{o=typeof w.current==="function"?w.current():null}catch{}const work=MODE==="work";h.innerHTML=`<div class="nid-v24-ver">${PAGE_VERSION}</div><div class="nid-v24-title">Nordic ID — НА РАМПУ</div><div class="nid-v24-base">RFID ENGINE: <b>V2.4 HIDDEN RFID INPUT</b> · та сама перевірена схема: hidden input → короткий Nordic trigger → 24 HEX EPC → 600 ms lock. Стабільна V2.4 не змінена.</div><div class="nid-v24-ramp">${o?.ramp?`RAMPE ${o.ramp}`:'ВІДКРИЙ RAMPE'}</div><span class="nid-v24-mode">${work?'🏭 WORK · REAL':'🧪 TEST'}</span>`}catch{}}
function scrollToNordicCard(){try{const d=f.contentDocument,card=d?.getElementById("nidCard");if(!card)return;const head=document.getElementById("envBar")?.getBoundingClientRect().bottom||0;const target=scrollY+f.getBoundingClientRect().top+card.getBoundingClientRect().top-head-8;scrollTo({top:Math.max(0,target),behavior:"smooth"})}catch{}}
function placeNordicModal(){try{const d=f.contentDocument,m=d?.getElementById("nidModal");if(!m)return;const fr=f.getBoundingClientRect(),head=document.getElementById("envBar")?.getBoundingClientRect().bottom||0;const topInFrame=Math.max(0,Math.round(head-fr.top+6));const visibleH=Math.max(260,Math.round(innerHeight-head-12));m.style.setProperty("position","absolute","important");m.style.setProperty("inset","auto 0 auto 0","important");m.style.setProperty("top",topInFrame+"px","important");m.style.setProperty("height",visibleH+"px","important");m.style.setProperty("min-height",visibleH+"px","important");m.style.setProperty("max-height",visibleH+"px","important");m.style.setProperty("z-index","2147483647","important");const sheet=m.querySelector(".nid-sheet");if(sheet)sheet.style.setProperty("max-height",Math.max(220,visibleH-24)+"px","important")}catch{}}
function installNordicViewportFix(){try{const d=f.contentDocument,m=d?.getElementById("nidModal");if(!m||m.dataset.viewportFix==="1")return;m.dataset.viewportFix="1";let was=m.classList.contains("show");const react=()=>{const now=m.classList.contains("show");placeNordicModal();if(now){setTimeout(placeNordicModal,0);setTimeout(placeNordicModal,80)}else if(was&&!now){setTimeout(scrollToNordicCard,100)}was=now};new MutationObserver(react).observe(m,{attributes:true,attributeFilter:["class","style"]});addEventListener("scroll",placeNordicModal,{passive:true});addEventListener("resize",placeNordicModal,{passive:true});react()}catch{}}
function hideOldStock(){try{const d=f.contentDocument;if(!d.getElementById("utHideOldStock")){const s=d.createElement("style");s.id="utHideOldStock";s.textContent=".stock-card{display:none!important}";d.head.appendChild(s)}}catch{}}
function afterRender(){try{const w=f.contentWindow;hideOldStock();w.UT_LANGUAGE_APPLY?.();w.UT_PRODUCTION_ENHANCE?.();w.UT_COMPACT_CONNECTION_REFRESH?.();w.UT_STATUS_COLORS_APPLY?.();w.UT_PRODUCT_STOCK_REFRESH?.();w.UT_EXTRA_PRODUCTS_REFRESH?.();w.NORDIC_UT_REFRESH?.();mark();applyV24RampSkin();installNordicViewportFix();placeNordicModal();resize();setTimeout(()=>{applyV24RampSkin();installNordicViewportFix();placeNordicModal();resize()},80)}catch{}}
function patchCore(){const w=f.contentWindow;if(w.__NORDIC_ENV_MIRROR_PATCH__)return;w.__NORDIC_ENV_MIRROR_PATCH__=true;if(typeof w.openOrder==="function"){const o=w.openOrder;w.openOrder=async function(id,...rest){const r=await o.call(w,id,...rest);afterRender();setTimeout(()=>{try{const d=f.contentDocument,x=d.getElementById("detail");if(x?.classList.contains("show"))scrollToNordicCard()}catch{}},90);return r}}if(typeof w.renderDetail==="function"){const o=w.renderDetail;w.renderDetail=function(...a){const r=o.apply(w,a);queueMicrotask(afterRender);return r}}if(typeof w.renderRamps==="function"){const o=w.renderRamps;w.renderRamps=function(...a){const r=o.apply(w,a);queueMicrotask(afterRender);return r}}if(typeof w.loadAll==="function"){const o=w.loadAll;w.loadAll=async function(...a){const r=await o.apply(w,a);afterRender();return r}}}
function openRequested(){const id=new URLSearchParams(location.search).get("open");if(!id)return;try{const w=f.contentWindow;if(typeof w.openOrder==="function"){w.openOrder(id);return}}catch{}if(openTries++<25)setTimeout(openRequested,250)}
async function build(){updateOuter();loader.style.display="flex";openTries=0;try{const r=await fetch(`utsending-core-v7.html?v=${VERSION}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);let html=await r.text();html=html.replace("</head>",`<script>window.BAMA_ENV_MODE=${JSON.stringify(MODE)};<\/script><script src="./ut-test-api.js?v=${VERSION}"><\/script></head>`);f.addEventListener("load",enhance,{once:true});f.srcdoc=html}catch(e){loader.textContent=`Kunne ikke laste Nordic ${MODE.toUpperCase()}: ${e.message||e}`}}
async function enhance(){const d=f.contentDocument;if(!d)return;try{f.contentWindow.BAMA_HOME_TARGET="scanner-home.html";d.querySelectorAll("a[href]").forEach(a=>a.target="_top");await inject(d,"utsending-production-flow.js","production-flow");await inject(d,"utsending-language.js","language");await inject(d,"utsending-allowed-picker.js","picker");await inject(d,"utsending-status-colors.js","status");await inject(d,"utsending-product-stock-v273.js","stock");await inject(d,"utsending-test-extra-products.js","extras");await inject(d,"utsending-compact-connection-v275.js","connection");await inject(d,"nordic-ut-env-scanner.js","nordic-env");patchCore();hideOldStock();d.querySelector("#utLanguageSwitch")?.addEventListener("click",()=>setTimeout(afterRender,0));afterRender();setTimeout(afterRender,250);setTimeout(afterRender,900);setTimeout(openRequested,300);loader.style.display="none"}catch(e){loader.textContent=`Nordic ${MODE.toUpperCase()} startfeil: ${e.message||e}`}}
function switchMode(next){if(next===MODE)return;MODE=next;f.src="about:blank";setTimeout(build,30)}
testBtn.onclick=()=>switchMode("test");
function startHold(e){if(MODE==="work")return;holdDone=false;clearTimeout(holdTimer);workBtn.textContent="🏭 WORK · ТРИМАЙ…";holdTimer=setTimeout(()=>{holdDone=true;workBtn.textContent="🏭 WORK";if(confirm("Перейти в WORK? Це реальний склад і реальні замовлення."))switchMode("work");else updateOuter()},1500);e?.preventDefault?.()}
function cancelHold(){if(!holdDone){clearTimeout(holdTimer);workBtn.textContent="🏭 WORK · УТРИМАТИ"}}
workBtn.addEventListener("pointerdown",startHold);workBtn.addEventListener("pointerup",cancelHold);workBtn.addEventListener("pointerleave",cancelHold);workBtn.addEventListener("pointercancel",cancelHold);
addEventListener("resize",()=>{resize();placeNordicModal()},{passive:true});build();
</script></body></html>
