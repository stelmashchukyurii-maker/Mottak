      --info: #75b7ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg), #11182a);
    }

    button, input { font: inherit; }
    .app { width: min(1180px, 100%); margin: 0 auto; padding: 14px 12px 48px; }
    .topbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .back { min-height: 44px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--dark); color: var(--text); text-decoration: none; font-weight: 800; }
    .version { color: var(--muted); font-size: 12px; text-align: right; }
    h1 { margin: 14px 0 5px; font-size: clamp(29px, 7vw, 46px); }
    h2 { margin: 0 0 12px; font-size: 21px; }
    .subtitle, .note { color: var(--muted); line-height: 1.5; }
    .card { margin: 13px 0; padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
    .grid3, .grid2, .actions, .stats { display: grid; gap: 9px; }
    .grid3 { grid-template-columns: repeat(3, 1fr); }
    .grid2, .actions { grid-template-columns: repeat(2, 1fr); }
    .stats { grid-template-columns: repeat(4, 1fr); }
    button, .file-button, .link { min-height: 50px; padding: 11px 13px; border: 0; border-radius: 12px; font-weight: 800; cursor: pointer; text-align: center; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .choice, .secondary { color: var(--text); background: var(--dark); border: 2px solid var(--line); }
    .choice.active { color: #17130a; background: var(--accent); border-color: var(--accent); }
    .primary { color: #17130a; background: var(--accent); }
    .success { color: #062418; background: var(--ok); }
    .danger { color: #ffd8dc; background: rgba(255,115,115,.17); border: 1px solid rgba(255,115,115,.45); }
    .link { display: flex; align-items: center; justify-content: center; color: var(--text); background: #2c395c; text-decoration: none; }
    input[type=password] { width: 100%; min-height: 48px; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: #070b14; color: var(--text); }
    input[type=file] { display: none; }
    .preview { display: none; margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #070b14; }
    .preview img { display: block; width: 100%; max-height: 60vh; object-fit: contain; }
    .message { min-height: 26px; margin-top: 10px; color: var(--muted); white-space: pre-wrap; }
    .message.ok { color: var(--ok); }
    .message.warn { color: var(--warn); }
    .message.bad { color: var(--bad); }
    .result { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .result-box { padding: 13px; border: 1px solid var(--line); border-radius: 13px; background: var(--dark); }
    .result-box span { display: block; color: var(--muted); font-size: 12px; }
    .result-box strong { display: block; margin-top: 5px; font: 900 clamp(28px, 8vw, 42px) Consolas, monospace; letter-spacing: .07em; }
    .stat { padding: 11px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--dark); text-align: center; }
    .stat span { display: block; color: var(--muted); font-size: 11px; }
    .stat strong { display: block; margin-top: 3px; font-size: 30px; }
    .toolbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar > div { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 13px; }
    table { width: 100%; min-width: 980px; border-collapse: collapse; background: var(--dark); }
    th, td { padding: 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { color: var(--muted); background: #111a31; font-size: 11px; text-transform: uppercase; }
    .mono { font-family: Consolas, monospace; font-weight: 800; }
    .thumb { width: 88px; height: 68px; object-fit: cover; border-radius: 9px; background: #070b14; }
    .no-photo { width: 88px; padding: 8px; border: 1px dashed var(--line); border-radius: 9px; color: var(--warn); font-size: 11px; text-align: center; }
    .status-pill { display: inline-block; padding: 5px 8px; border-radius: 999px; font-size: 11px; font-weight: 900; }

    .status-invalid { color: #2b080d; background: var(--bad); }
    .empty { padding: 22px; text-align: center; color: var(--muted); }

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    const url = URL.createObjectURL(file);
    image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
    image.onerror = () => { URL.revokeObjectURL(url); reject(new Error("IMAGE")); };
    image.src = url;
  });
}

async function compress(file) {
  const image = await loadImage(file);
  const max = 1600;
  const scale = Math.min(1, max / Math.max(image.naturalWidth, image.naturalHeight));
  const width = Math.max(1, Math.round(image.naturalWidth * scale));
  const height = Math.max(1, Math.round(image.naturalHeight * scale));
  const canvas = $("canvas");
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext("2d", { alpha: false });
  context.fillStyle = "#fff";
  context.fillRect(0, 0, width, height);
  context.drawImage(image, 0, 0, width, height);
  const dataUrl = canvas.toDataURL("image/jpeg", .82);
  const blob = await (await fetch(dataUrl)).blob();
  return { dataUrl, base64: dataUrl.split(",")[1], blob, mimeType: "image/jpeg" };
}

function extractText(data) {
  if (typeof data.output_text === "string" && data.output_text.trim()) return data.output_text.trim();
  const output = [];
  for (const step of data.steps || []) {
    for (const content of step.content || []) {
      if (content.type === "text" && typeof content.text === "string") output.push(content.text);
    }
  }
  return output.join("").trim();
}

function validate(value) {
  const line1 = String(value.line1 || "").trim();
  const line2 = String(value.line2 || "").trim().toUpperCase();
  const confidence = Number(value.confidence);
  return {
    line1,
    line2,
    confidence: Number.isFinite(confidence) ? Math.min(1, Math.max(0, confidence)) : 0,
    valid: /^\d{6}$/.test(line1) && /^[A-Z0-9]{6}$/.test(line2)
  };
}

async function recognize() {
  const key = $("apiKey").value.trim();
  if (!key) {
    show(t().needKey, "bad");
    $("apiKey").focus();
    return;

  if (!imageData) return;

  $("recognizeButton").disabled = true;
  show(t().analyzing);

  const prompt = "Find the yellow warehouse tag and the grey sticker directly above the QR code. Read exactly two printed lines. line1 must be exactly 6 digits. line2 must be exactly 6 uppercase A-Z or 0-9 characters. Ignore and do not decode the QR code. Return only JSON.";
  const body = {
    model: GEMINI_MODEL,
    store: false,
    input: [
      { type: "text", text: prompt },
      { type: "image", data: imageData.base64, mime_type: imageData.mimeType }
    ],
    response_format: {
      type: "text",
      mime_type: "application/json",
      schema: {
        type: "object",
        properties: {
          line1: { type: "string" },
          line2: { type: "string" },
          confidence: { type: "number", minimum: 0, maximum: 1 }
        },
        required: ["line1", "line2", "confidence"],
        additionalProperties: false
      }
    },
    generation_config: { max_output_tokens: 120, thinking_level: "minimal" }
  };

  try {
    const response = await fetch(GEMINI_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify(body)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data?.error?.message || `HTTP ${response.status}`);
    result = validate(JSON.parse(extractText(data)));
    renderResult();
    show(result.valid ? t().recognized : t().invalid, result.valid ? "ok" : "bad");
  } catch (error) {
    result = null;
    renderResult();
    show(`${t().invalid}\n${error.message || error}`, "bad");
  } finally {
    $("recognizeButton").disabled = !imageData;
  }
}

function uuid() {
  return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

async function saveCloud() {
  if (!(result?.valid && imageData)) return;

  $("saveButton").disabled = true;
  show(t().saving);
  const day = new Date().toISOString().slice(0, 10);
  const path = `camera/${day}/${deviceId}-${uuid()}.jpg`;
  let uploaded = false;

  try {
    const upload = await client.storage.from(BUCKET).upload(path, imageData.blob, {
      contentType: "image/jpeg",
      upsert: false
    });
    if (upload.error) throw upload.error;
    uploaded = true;

    const photoUrl = client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    const found = await client
      .from(TABLE)
      .select("id,scanner_code,status,source,device_id,raw_data,photo_path")
      .eq("upper_number", result.line1)
      .eq("lower_number", result.line2)
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();

    if (found.error) throw found.error;

    let databaseResult;
    if (found.data) {
      databaseResult = await client
        .from(TABLE)
        .update({
          product,
          photo_url: photoUrl,
          photo_path: path,
          confidence: result.confidence,
          source: found.data.scanner_code ? "camera+nordic_id" : "camera",
          status: found.data.status === "verified" ? "verified" : "pending",
          device_id: found.data.device_id || deviceId,
          raw_data: found.data.raw_data || "camera-photo"
        })
        .eq("id", found.data.id);
    } else {
      databaseResult = await client
        .from(TABLE)
        .insert({
          product,
          scanner_code: "",
          upper_number: result.line1,
          lower_number: result.line2,
          status: "pending",
          source: "camera",
          device_id: deviceId,
          raw_data: "camera-photo",
          photo_url: photoUrl,
          photo_path: path,
          confidence: result.confidence
        });
    }

    if (databaseResult.error) throw databaseResult.error;

    if (found.data?.photo_path && found.data.photo_path !== path) {
      await client.storage.from(BUCKET).remove([found.data.photo_path]);
    }

    show(found.data?.scanner_code ? t().savedLinked : t().savedNew, "ok");
    await loadTable();
    $("saveButton").disabled = true;
  } catch (error) {
    if (uploaded) await client.storage.from(BUCKET).remove([path]);
    show(`${t().saveError}\n${error.message || error}`, "bad");
    $("saveButton").disabled = false;
  }
}

function statusPill(status) {
  const safe = ["pending", "verified", "invalid"].includes(status) ? status : "pending";
  const label = safe === "verified" ? t().verified : safe === "invalid" ? t().problem : t().pending;
  return `<span class="status-pill status-${safe}">${esc(label)}</span>`;
}

function renderCounts() {
  $("allCount").textContent = rows.length;
  $("pendingCount").textContent = rows.filter(row => row.status === "pending").length;
  $("verifiedCount").textContent = rows.filter(row => row.status === "verified").length;
  $("withoutPhotoCount").textContent = rows.filter(row => !row.photo_url).length;
}

function renderTable() {
  const body = $("tableBody");
  renderCounts();
  if (!rows.length) {
    body.innerHTML = `<tr><td class="empty" colspan="9">${esc(t().empty)}</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(row => `
    <tr>
      <td>${row.photo_url
        ? `<a href="${esc(row.photo_url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(row.photo_url)}" loading="lazy" alt="Mottak"></a>`
        : `<div class="no-photo">${esc(t().noPhoto)}</div>`}
      </td>
      <td>${esc(new Date(row.created_at).toLocaleString())}</td>
      <td>${esc(PRODUCTS[row.product] || row.product || "—")}</td>
      <td class="mono">${esc(row.scanner_code || "—")}</td>
      <td class="mono">${esc(row.upper_number || "—")}</td>
      <td class="mono">${esc(row.lower_number || "—")}</td>
      <td>${statusPill(row.status)}</td>
      <td>${esc(row.source || "—")}</td>
      <td>
        <button class="success" type="button" data-action="verified" data-id="${esc(row.id)}">${esc(t().approve)}</button>
        <button class="danger" type="button" data-action="invalid" data-id="${esc(row.id)}">${esc(t().problem)}</button>
        <button class="danger" type="button" data-action="delete" data-id="${esc(row.id)}" data-path="${esc(row.photo_path || "")}">${esc(t().delete)}</button>
      </td>
    </tr>
  `).join("");
}

async function loadTable() {
  const response = await client
    .from(TABLE)
    .select("id,created_at,product,scanner_code,upper_number,lower_number,status,source,device_id,photo_url,photo_path,confidence,raw_data")
    .order("created_at", { ascending: false })
    .limit(300);

  if (response.error) {
    show(`${t().loadError}\n${response.error.message}`, "bad");
    return false;
  }

  rows = response.data || [];
  renderTable();
  return true;
}

async function updateRow(id, action, path = "") {
  try {
    if (action === "delete") {
      if (!confirm(t().confirmDelete)) return;
      if (path) {
        const removed = await client.storage.from(BUCKET).remove([path]);
        if (removed.error) throw removed.error;
      }
      const deleted = await client.from(TABLE).delete().eq("id", id);
      if (deleted.error) throw deleted.error;
    } else {
      const payload = action === "verified"
        ? { status: "verified", verified_at: new Date().toISOString() }
        : { status: "invalid" };
      const updated = await client.from(TABLE).update(payload).eq("id", id);
      if (updated.error) throw updated.error;
    }
    await loadTable();
  } catch (error) {
    show(`${t().updateError}\n${error.message || error}`, "bad");
  }
}

$("apiKey").value = sessionStorage.getItem("gemini_api_key") || "";
$("apiKey").addEventListener("input", () => {
  sessionStorage.setItem("gemini_api_key", $("apiKey").value.trim());
});

$("photoInput").addEventListener("change", async () => {
  const file = $("photoInput").files?.[0];
  if (!file) return;
  show(t().processing);
  result = null;
  renderResult();
  try {
    imageData = await compress(file);
    $("preview").src = imageData.dataUrl;
    $("previewWrap").style.display = "block";
    $("recognizeButton").disabled = false;
    $("newPhotoButton").disabled = false;
    show(t().ready, "ok");
  } catch (error) {
    resetPhoto();
    show(String(error.message || error), "bad");
  }
});

$("recognizeButton").addEventListener("click", recognize);
$("newPhotoButton").addEventListener("click", resetPhoto);
$("saveButton").addEventListener("click", saveCloud);
$("refreshButton").addEventListener("click", loadTable);

$("languages").addEventListener("click", event => {
  const button = event.target.closest("[data-language]");
  if (!button) return;
  language = button.dataset.language;
  localStorage.setItem(LANGUAGE_KEY, language);
  applyLanguage();
});

$("products").addEventListener("click", event => {
  const button = event.target.closest("[data-product]");
  if (!button) return;
  product = button.dataset.product;
  localStorage.setItem(PRODUCT_KEY, product);
  renderChoices();
});

$("tableBody").addEventListener("click", event => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  updateRow(button.dataset.id, button.dataset.action, button.dataset.path || "");
});

client
  .channel("camera-cloud-v2")
  .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, loadTable)
  .subscribe();

applyLanguage();
loadTable();
</script>
</body>
</html>
