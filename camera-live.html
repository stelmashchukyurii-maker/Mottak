<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Camera Live Mottak v1</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0b1020; --card:#151c30; --dark:#0d1426; --text:#f5f7ff;
      --muted:#aab4ce; --accent:#f4c430; --ok:#48d597; --bad:#ff6b6b; --line:#303b59;
    }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg),#11182a)}
    button,input{font:inherit}.app{width:min(900px,100%);margin:auto;padding:14px 12px 45px}h1{margin:0 0 6px;font-size:clamp(28px,7vw,42px)}h2{margin:0 0 12px;font-size:20px}
    .subtitle,.note{color:var(--muted);line-height:1.45}.version{font-size:12px;color:var(--muted)}.card{margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
    .grid3,.grid2,.actions{display:grid;gap:9px}.grid3{grid-template-columns:repeat(3,1fr)}.grid2,.actions{grid-template-columns:repeat(2,1fr)}
    button,.file-button,.link-button{min-height:50px;padding:11px 13px;border:0;border-radius:12px;font-weight:800;cursor:pointer;text-align:center}
    button:disabled{opacity:.45;cursor:not-allowed}.choice,.secondary{color:var(--text);background:var(--dark);border:2px solid var(--line)}.choice.active{color:#17130a;background:var(--accent);border-color:var(--accent)}
    .primary{color:#17130a;background:var(--accent)}.success{color:#062418;background:var(--ok)}.link-button{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);background:#2c395c}
    input[type=password]{width:100%;min-height:48px;padding:11px;border:1px solid var(--line);border-radius:11px;background:#070b14;color:var(--text)}input[type=file]{display:none}
    .preview{display:none;margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#070b14}.preview img{display:block;width:100%;max-height:60vh;object-fit:contain}
    .status{min-height:25px;margin-top:10px;color:var(--muted);white-space:pre-wrap}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
    .result{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-box{padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--dark)}.result-box span{display:block;color:var(--muted);font-size:12px}.result-box strong{display:block;margin-top:5px;font:900 clamp(28px,8vw,42px) Consolas,monospace;letter-spacing:.07em}
    .gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{padding:10px;border:1px solid var(--line);border-radius:13px;background:var(--dark)}.item img{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#070b14}.codes{margin-top:8px;font:800 17px Consolas,monospace}.small{margin-top:5px;color:var(--muted);font-size:12px}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
    @media(max-width:620px){.grid3,.grid2,.actions,.result,.gallery{grid-template-columns:1fr}.item img{height:auto;max-height:48vh}}
  </style>
</head>
<body>
<main class="app">
  <h1 data-t="title">Camera Live Mottak</h1>
  <div class="version">Camera Live v1 · updated 01.08.2026 21:28 Europe/Oslo</div>
  <p class="subtitle" data-t="subtitle"></p>

  <section class="card"><div class="grid3" id="languages">
    <button class="choice" data-language="nb">Norsk</button><button class="choice" data-language="pl">Polski</button><button class="choice" data-language="uk">Українська</button>
  </div></section>

  <section class="card"><h2 data-t="chooseProduct"></h2><div class="grid3" id="products">
    <button class="choice" data-product="bunner">Bunner</button><button class="choice" data-product="hyller30">Hyller x30</button><button class="choice" data-product="hyller60">Hyller x60</button>
  </div></section>

  <section class="card">
    <h2 data-t="geminiTitle"></h2>
    <input id="apiKey" type="password" autocomplete="off" data-placeholder="apiPlaceholder">
    <p class="note" data-t="apiNote"></p>
  </section>

  <section class="card">
    <h2 data-t="photoTitle"></h2>
    <label class="file-button primary" for="photoInput" data-t="takePhoto"></label>
    <input id="photoInput" type="file" accept="image/*" capture="environment">
    <div class="preview" id="previewWrap"><img id="preview" alt="Photo preview"></div>
    <div class="actions" style="margin-top:10px">
      <button class="primary" id="recognizeButton" data-t="recognize" disabled></button>
      <button class="secondary" id="newPhotoButton" data-t="newPhoto" disabled></button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <h2 data-t="resultTitle"></h2>
    <div class="result"><div class="result-box"><span data-t="upper"></span><strong id="upperValue">------</strong></div><div class="result-box"><span data-t="lower"></span><strong id="lowerValue">------</strong></div></div>
    <p class="note" id="confidence"></p>
    <button class="success" id="saveButton" data-t="saveCloud" disabled></button>
  </section>

  <section class="card">
    <div class="grid2"><a class="link-button" href="mottak-live-v2.html" data-t="openNordic"></a><button class="secondary" id="refreshButton" data-t="refresh"></button></div>
  </section>

  <section class="card"><h2 data-t="recentTitle"></h2><div class="gallery" id="gallery"></div></section>
</main>
<canvas id="canvas" hidden></canvas>
<script>
"use strict";
const SUPABASE_URL="https://hzjsatehehhpgpskckfi.supabase.co";
const SUPABASE_KEY="sb_publishable_5swzjbs4yq7N8sDNR00FHA_n1xbnMya";
const TABLE="mottak_scans", BUCKET="mottak-photos";
const LANGUAGE_KEY="camera_live_language",PRODUCT_KEY="camera_live_product",DEVICE_KEY="camera_live_device";
const GEMINI_URL="https://generativelanguage.googleapis.com/v1beta/interactions";
const GEMINI_MODEL="gemini-3.6-flash";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const PRODUCTS={bunner:"Bunner",hyller30:"Hyller x30",hyller60:"Hyller x60"};
const TEXT={
 nb:{title:"Camera Live Mottak",subtitle:"Ta bilde, les etiketten med Gemini og lagre bildet i den felles Mottak-databasen.",chooseProduct:"1. Velg produkt",geminiTitle:"2. Gemini API-nøkkel",apiPlaceholder:"Lim inn Gemini API-nøkkelen",apiNote:"Nøkkelen lagres bare i denne nettleserfanen.",photoTitle:"3. Ta bilde av etiketten",takePhoto:"📷 Ta bilde",recognize:"Les av nummer",newPhoto:"Nytt bilde",resultTitle:"4. Kontroller og lagre",upper:"Øvre nummer",lower:"Nedre nummer",saveCloud:"Lagre bilde og nummer i skyen",openNordic:"Åpne Nordic ID",refresh:"Oppdater",recentTitle:"Nylige bilder i Mottak",ready:"Bildet er klart. Trykk «Les av nummer».",processing:"Behandler bildet…",needKey:"Lim inn Gemini API-nøkkelen.",analyzing:"Gemini analyserer etiketten…",recognized:"Numrene er lest. Kontroller dem og lagre.",invalid:"Resultatet er ikke komplett: 6 sifre + 6 tegn A-Z/0-9 kreves.",saving:"Laster opp bildet og lagrer posten…",saved:"Bildet og posten er lagret i skyen.",saveError:"Kunne ikke lagre i skyen.",loadError:"Kunne ikke laste bilder. Kjør først supabase-photo-setup.sql.",empty:"Ingen bilder i databasen ennå.",noPhoto:"Uten bilde",confidence:"Sikkerhet"},
 pl:{title:"Camera Live Mottak",subtitle:"Zrób zdjęcie, odczytaj etykietę przez Gemini i zapisz zdjęcie we wspólnej bazie Mottak.",chooseProduct:"1. Wybierz produkt",geminiTitle:"2. Klucz Gemini API",apiPlaceholder:"Wklej klucz Gemini API",apiNote:"Klucz jest przechowywany tylko w tej karcie przeglądarki.",photoTitle:"3. Zrób zdjęcie etykiety",takePhoto:"📷 Zrób zdjęcie",recognize:"Rozpoznaj numer",newPhoto:"Nowe zdjęcie",resultTitle:"4. Sprawdź i zapisz",upper:"Górny numer",lower:"Dolny numer",saveCloud:"Zapisz zdjęcie i numery w chmurze",openNordic:"Otwórz Nordic ID",refresh:"Odśwież",recentTitle:"Ostatnie zdjęcia Mottak",ready:"Zdjęcie gotowe. Naciśnij „Rozpoznaj numer”.",processing:"Przetwarzanie zdjęcia…",needKey:"Wklej klucz Gemini API.",analyzing:"Gemini analizuje etykietę…",recognized:"Numery rozpoznano. Sprawdź je i zapisz.",invalid:"Wynik jest niepełny: wymagane 6 cyfr + 6 znaków A-Z/0-9.",saving:"Wysyłanie zdjęcia i zapisywanie wpisu…",saved:"Zdjęcie i wpis zapisano w chmurze.",saveError:"Nie udało się zapisać w chmurze.",loadError:"Nie udało się pobrać zdjęć. Najpierw uruchom supabase-photo-setup.sql.",empty:"Brak zdjęć w bazie.",noPhoto:"Bez zdjęcia",confidence:"Pewność"},
 uk:{title:"Camera Live Mottak",subtitle:"Сфотографуйте бірку, розпізнайте її через Gemini та збережіть фотографію у спільній базі Mottak.",chooseProduct:"1. Виберіть продукт",geminiTitle:"2. Gemini API Key",apiPlaceholder:"Вставте Gemini API Key",apiNote:"Ключ зберігається лише в цій вкладці браузера.",photoTitle:"3. Зробіть фото бірки",takePhoto:"📷 Зробити фото",recognize:"Розпізнати номер",newPhoto:"Нове фото",resultTitle:"4. Перевірте та збережіть",upper:"Верхній номер",lower:"Нижній номер",saveCloud:"Зберегти фото і номери в хмару",openNordic:"Відкрити Nordic ID",refresh:"Оновити",recentTitle:"Останні фотографії Mottak",ready:"Фото готове. Натисніть «Розпізнати номер».",processing:"Обробляю фотографію…",needKey:"Вставте Gemini API Key.",analyzing:"Gemini аналізує бірку…",recognized:"Номери розпізнано. Перевірте їх і збережіть.",invalid:"Результат неповний: потрібно 6 цифр + 6 символів A-Z/0-9.",saving:"Завантажую фотографію та зберігаю запис…",saved:"Фотографію і запис збережено у хмарі.",saveError:"Не вдалося зберегти у хмарі.",loadError:"Не вдалося завантажити фотографії. Спочатку виконайте supabase-photo-setup.sql.",empty:"У базі ще немає фотографій.",noPhoto:"Без фото",confidence:"Впевненість"}
};
const $=id=>document.getElementById(id);let language=TEXT[localStorage.getItem(LANGUAGE_KEY)]?localStorage.getItem(LANGUAGE_KEY):"nb";let product=PRODUCTS[localStorage.getItem(PRODUCT_KEY)]?localStorage.getItem(PRODUCT_KEY):"bunner";let imageData=null,result=null,channel=null;
const deviceId=(()=>{let v=localStorage.getItem(DEVICE_KEY);if(!v){v=`camera-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;localStorage.setItem(DEVICE_KEY,v)}return v})();
const t=()=>TEXT[language];
function setStatus(text,type=""){ $("status").textContent=text;$("status").className=`status ${type}` }
function renderChoices(){document.querySelectorAll("[data-language]").forEach(b=>b.classList.toggle("active",b.dataset.language===language));document.querySelectorAll("[data-product]").forEach(b=>b.classList.toggle("active",b.dataset.product===product))}
function applyLanguage(){document.documentElement.lang=language;document.querySelectorAll("[data-t]").forEach(e=>{const v=t()[e.dataset.t];if(typeof v==="string")e.textContent=v});document.querySelectorAll("[data-placeholder]").forEach(e=>e.placeholder=t()[e.dataset.placeholder]||"");renderChoices();renderResult()}
function renderResult(){ $("upperValue").textContent=result?.line1||"------";$("lowerValue").textContent=result?.line2||"------";$("confidence").textContent=result?`${t().confidence}: ${Math.round(result.confidence*100)}%`:"";$("saveButton").disabled=!(result?.valid&&imageData) }
function resetPhoto(){imageData=null;result=null;$("photoInput").value="";$("preview").removeAttribute("src");$("previewWrap").style.display="none";$("recognizeButton").disabled=true;$("newPhotoButton").disabled=true;renderResult();setStatus("")}
function loadImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("IMAGE"))};img.src=url})}
async function compress(file){const img=await loadImage(file);const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=$("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d",{alpha:false});ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);const dataUrl=canvas.toDataURL("image/jpeg",.82);const blob=await(await fetch(dataUrl)).blob();return{dataUrl,base64:dataUrl.split(",")[1],blob,mimeType:"image/jpeg"}}
function extractText(data){if(typeof data.output_text==="string"&&data.output_text.trim())return data.output_text.trim();const out=[];for(const step of data.steps||[])for(const c of step.content||[])if(c.type==="text"&&typeof c.text==="string")out.push(c.text);return out.join("").trim()}
function validate(v){const line1=String(v.line1||"").trim(),line2=String(v.line2||"").trim().toUpperCase(),confidence=Number(v.confidence);return{line1,line2,confidence:Number.isFinite(confidence)?Math.min(1,Math.max(0,confidence)):0,valid:/^\d{6}$/.test(line1)&&/^[A-Z0-9]{6}$/.test(line2)}}
async function recognize(){const key=$("apiKey").value.trim();if(!key){setStatus(t().needKey,"bad");$("apiKey").focus();return}if(!imageData)return;$("recognizeButton").disabled=true;setStatus(t().analyzing);const prompt="Find the yellow warehouse tag and the grey sticker directly above the QR code. Read exactly two printed lines. line1 must be exactly 6 digits. line2 must be exactly 6 uppercase A-Z or 0-9 characters. Ignore and do not decode the QR code. Return only JSON.";const body={model:GEMINI_MODEL,store:false,input:[{type:"text",text:prompt},{type:"image",data:imageData.base64,mime_type:imageData.mimeType}],response_format:{type:"text",mime_type:"application/json",schema:{type:"object",properties:{line1:{type:"string"},line2:{type:"string"},confidence:{type:"number",minimum:0,maximum:1}},required:["line1","line2","confidence"],additionalProperties:false}},generation_config:{max_output_tokens:120,thinking_level:"minimal"}};try{const response=await fetch(GEMINI_URL,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data?.error?.message||`HTTP ${response.status}`);result=validate(JSON.parse(extractText(data)));renderResult();setStatus(result.valid?t().recognized:t().invalid,result.valid?"ok":"bad")}catch(e){result=null;renderResult();setStatus(`${t().invalid}\n${e.message||e}`,"bad")}finally{$("recognizeButton").disabled=!imageData}}
function uuid(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`}
async function saveCloud(){if(!(result?.valid&&imageData))return;$("saveButton").disabled=true;setStatus(t().saving);const day=new Date().toISOString().slice(0,10),path=`camera/${day}/${deviceId}-${uuid()}.jpg`;try{const up=await client.storage.from(BUCKET).upload(path,imageData.blob,{contentType:"image/jpeg",upsert:false});if(up.error)throw up.error;const photoUrl=client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;const found=await client.from(TABLE).select("id,scanner_code,status,source").eq("upper_number",result.line1).eq("lower_number",result.line2).order("created_at",{ascending:false}).limit(1).maybeSingle();if(found.error)throw found.error;let db;if(found.data){db=await client.from(TABLE).update({product,photo_url:photoUrl,photo_path:path,confidence:result.confidence,source:found.data.scanner_code?found.data.source:"camera"}).eq("id",found.data.id)}else{db=await client.from(TABLE).insert({product,scanner_code:"",upper_number:result.line1,lower_number:result.line2,status:"pending",source:"camera",device_id:deviceId,raw_data:"camera-photo",photo_url:photoUrl,photo_path:path,confidence:result.confidence})}if(db.error)throw db.error;setStatus(t().saved,"ok");await loadRecent();$("saveButton").disabled=true}catch(e){setStatus(`${t().saveError}\n${e.message||e}`,"bad");$("saveButton").disabled=false}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}
async function loadRecent(){const q=await client.from(TABLE).select("id,created_at,product,scanner_code,upper_number,lower_number,status,source,photo_url").order("created_at",{ascending:false}).limit(30);if(q.error){$("gallery").innerHTML=`<div class="empty">${esc(t().loadError)}<br>${esc(q.error.message)}</div>`;return}const rows=q.data||[];if(!rows.length){$("gallery").innerHTML=`<div class="empty">${t().empty}</div>`;return}$("gallery").innerHTML=rows.map(r=>`<article class="item">${r.photo_url?`<img loading="lazy" src="${esc(r.photo_url)}" alt="Mottak photo">`:`<div class="empty">${t().noPhoto}</div>`}<div class="codes">${esc(r.upper_number)} ${esc(r.lower_number)}</div><div class="small">${esc(PRODUCTS[r.product]||r.product)} · ${esc(r.scanner_code||r.source)} · ${esc(new Date(r.created_at).toLocaleString())}</div></article>`).join("")}
$("apiKey").value=sessionStorage.getItem("gemini_api_key")||"";$("apiKey").addEventListener("input",()=>sessionStorage.setItem("gemini_api_key",$("apiKey").value.trim()));
$("photoInput").addEventListener("change",async()=>{const file=$("photoInput").files?.[0];if(!file)return;setStatus(t().processing);result=null;renderResult();try{imageData=await compress(file);$("preview").src=imageData.dataUrl;$("previewWrap").style.display="block";$("recognizeButton").disabled=false;$("newPhotoButton").disabled=false;setStatus(t().ready,"ok")}catch(e){resetPhoto();setStatus(String(e.message||e),"bad")}});
$("recognizeButton").addEventListener("click",recognize);$("newPhotoButton").addEventListener("click",resetPhoto);$("saveButton").addEventListener("click",saveCloud);$("refreshButton").addEventListener("click",loadRecent);
$("languages").addEventListener("click",e=>{const b=e.target.closest("[data-language]");if(!b)return;language=b.dataset.language;localStorage.setItem(LANGUAGE_KEY,language);applyLanguage();loadRecent()});
$("products").addEventListener("click",e=>{const b=e.target.closest("[data-product]");if(!b)return;product=b.dataset.product;localStorage.setItem(PRODUCT_KEY,product);renderChoices()});
channel=client.channel("camera-live-photos").on("postgres_changes",{event:"*",schema:"public",table:TABLE},loadRecent).subscribe();applyLanguage();loadRecent();
</script>
</body>
</html>
