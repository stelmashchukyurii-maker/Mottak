async function recognize(){const key=$("apiKey").value.trim();if(!key){show(t().needKey,"bad");$("apiKey").focus();return}if(!imageData||busy)return;busy=true;$("recognizeButton").disabled=true;renderResult();show(t().analyzing);const prompt="Find the yellow warehouse tag and the grey sticker directly above the QR code. Read exactly two printed lines. line1 must be exactly 6 digits. line2 must be exactly 6 uppercase A-Z or 0-9 characters. Ignore and do not decode the QR code. Return only JSON.",body={model:GEMINI_MODEL,store:false,input:[{type:"text",text:prompt},{type:"image",data:imageData.base64,mime_type:imageData.mimeType}],response_format:{type:"text",mime_type:"application/json",schema:{type:"object",properties:{line1:{type:"string"},line2:{type:"string"},confidence:{type:"number",minimum:0,maximum:1}},required:["line1","line2","confidence"],additionalProperties:false}},generation_config:{max_output_tokens:120,thinking_level:"minimal"}};try{const response=await fetch(GEMINI_URL,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data?.error?.message||`HTTP ${response.status}`);result=validate(JSON.parse(extractText(data)));show(result.valid?t().recognized:t().invalid,result.valid?"ok":"bad")}catch(error){result={line1:"",line2:"",confidence:0,valid:false};show(`${t().invalid}\n${error.message||error}`,"bad")}finally{busy=false;$("recognizeButton").disabled=!imageData;renderResult()}}
function uuid(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`}
async function saveCloud(){if(!imageData||busy)return;const current=readResultInputs();if(!current.valid){show(t().invalid,"bad");renderResult();return}busy=true;renderResult();show(t().saving);const day=new Date().toISOString().slice(0,10),path=`camera/${day}/${deviceId}-${uuid()}.jpg`;let uploaded=false;try{const upload=await client.storage.from(BUCKET).upload(path,imageData.blob,{contentType:"image/jpeg",upsert:false});if(upload.error)throw upload.error;uploaded=true;const photoUrl=client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,found=await client.from(TABLE).select("id,scanner_code,status,source,device_id,raw_data,photo_path").eq("upper_number",current.line1).eq("lower_number",current.line2).order("created_at",{ascending:false}).limit(1).maybeSingle();if(found.error)throw found.error;let databaseResult;if(found.data){databaseResult=await client.from(TABLE).update({product,photo_url:photoUrl,photo_path:path,confidence:current.confidence,source:found.data.scanner_code?"camera+nordic_id":"camera",status:found.data.status==="verified"?"verified":"pending",device_id:found.data.device_id||deviceId,raw_data:found.data.raw_data||"camera-photo"}).eq("id",found.data.id).select("id").maybeSingle()}else{databaseResult=await client.from(TABLE).insert({product,scanner_code:"",upper_number:current.line1,lower_number:current.line2,status:"pending",source:"camera",device_id:deviceId,raw_data:"camera-photo",photo_url:photoUrl,photo_path:path,confidence:current.confidence}).select("id").maybeSingle()}if(databaseResult.error)throw databaseResult.error;if(!databaseResult.data?.id)throw new Error(t().permissionBlocked);if(found.data?.photo_path&&found.data.photo_path!==path)await client.storage.from(BUCKET).remove([found.data.photo_path]);show(found.data?.scanner_code?t().savedLinked:t().savedNew,"ok");await loadTable(false);resetPhoto()}catch(error){if(uploaded)await client.storage.from(BUCKET).remove([path]);show(`${t().saveError}\n${error.message||error}`,"bad")}finally{busy=false;renderResult()}}
function statusPill(status){const safe=["pending","verified","invalid"].includes(status)?status:"pending",label=safe==="verified"?t().verified:safe==="invalid"?t().problem:t().pending;return `<span class="status-pill status-${safe}">${esc(label)}</span>`}
function renderCounts(){$("allCount").textContent=rows.length;$("pendingCount").textContent=rows.filter(r=>r.status==="pending").length;$("verifiedCount").textContent=rows.filter(r=>r.status==="verified").length;$("withoutPhotoCount").textContent=rows.filter(r=>!r.photo_url).length}
function productOptions(selected){return Object.entries(PRODUCTS).map(([key,label])=>`<option value="${esc(key)}"${key===selected?" selected":""}>${esc(label)}</option>`).join("")}
function renderNormalRow(row){return `<tr><td>${row.photo_url?`<a href="${esc(row.photo_url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(row.photo_url)}" loading="lazy" alt="Mottak"></a>`:`<div class="no-photo">${esc(t().noPhoto)}</div>`}</td><td>${esc(new Date(row.created_at).toLocaleString())}</td><td>${esc(PRODUCTS[row.product]||row.product||"—")}</td><td class="mono">${esc(row.scanner_code||"—")}</td><td class="mono">${esc(row.upper_number||"—")}</td><td class="mono">${esc(row.lower_number||"—")}</td><td>${statusPill(row.status)}</td><td>${esc(row.source||"—")}</td><td><div class="row-actions"><button class="info" type="button" data-action="edit" data-id="${esc(row.id)}">${esc(t().edit)}</button><button class="success" type="button" data-action="verified" data-id="${esc(row.id)}">${esc(t().approve)}</button><button class="danger" type="button" data-action="invalid" data-id="${esc(row.id)}">${esc(t().problem)}</button><button class="danger" type="button" data-action="delete" data-id="${esc(row.id)}" data-path="${esc(row.photo_path||"")}">${esc(t().delete)}</button></div></td></tr>`}
function renderEditRow(row){return `<tr class="editing" data-edit-row="${esc(row.id)}"><td>${row.photo_url?`<a href="${esc(row.photo_url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(row.photo_url)}" loading="lazy" alt="Mottak"></a>`:`<div class="no-photo">${esc(t().noPhoto)}</div>`}</td><td>${esc(new Date(row.created_at).toLocaleString())}</td><td class="edit-cell"><select class="field" data-edit-field="product">${productOptions(row.product)}</select></td><td class="edit-cell"><input class="field mono" data-edit-field="scanner_code" value="${esc(row.scanner_code||"")}" maxlength="100" /></td><td class="edit-cell"><input class="field mono" data-edit-field="upper_number" value="${esc(row.upper_number||"")}" inputmode="numeric" maxlength="6" /><span class="edit-help">6 digits</span></td><td class="edit-cell"><input class="field mono" data-edit-field="lower_number" value="${esc(row.lower_number||"")}" maxlength="6" /><span class="edit-help">A-Z / 0-9</span></td><td>${statusPill(row.status)}</td><td>${esc(row.source||"—")}</td><td><div class="row-actions"><button class="success" type="button" data-action="save-edit" data-id="${esc(row.id)}">${esc(t().saveEdit)}</button><button class="secondary" type="button" data-action="cancel-edit" data-id="${esc(row.id)}">${esc(t().cancel)}</button></div></td></tr>`}
function renderTable(){const body=$("tableBody");renderCounts();if(!rows.length){body.innerHTML=`<tr><td class="empty" colspan="9">${esc(t().empty)}</td></tr>`;return}body.innerHTML=rows.map(row=>row.id===editingId?renderEditRow(row):renderNormalRow(row)).join("")}
async function loadTable(showErrors=true){const response=await client.from(TABLE).select("id,created_at,product,scanner_code,upper_number,lower_number,status,source,device_id,photo_url,photo_path,confidence,raw_data").order("created_at",{ascending:false}).limit(300);if(response.error){if(showErrors)show(`${t().loadError}\n${response.error.message}`,"bad");return false}rows=response.data||[];if(editingId&&!rows.some(row=>row.id===editingId))editingId=null;renderTable();return true}
async function duplicateExists(id,upper,lower){const query=await client.from(TABLE).select("id").eq("upper_number",upper).eq("lower_number",lower).neq("id",id).limit(1);if(query.error)throw query.error;return(query.data||[]).length>0}
async function saveEdit(id){if(busy)return;const rowElement=document.querySelector(`[data-edit-row="${CSS.escape(id)}"]`);if(!rowElement)return;const productValue=rowElement.querySelector('[data-edit-field="product"]').value,scannerCode=rowElement.querySelector('[data-edit-field="scanner_code"]').value.trim(),upperField=rowElement.querySelector('[data-edit-field="upper_number"]'),lowerField=rowElement.querySelector('[data-edit-field="lower_number"]'),upper=normalizeUpper(upperField.value),lower=normalizeLower(lowerField.value);upperField.value=upper;lowerField.value=lower;upperField.classList.toggle("invalid-field",!/^\d{6}$/.test(upper));lowerField.classList.toggle("invalid-field",!/^[A-Z0-9]{6}$/.test(lower));if(!validNumbers(upper,lower)){show(t().invalid,"bad");return}busy=true;show(t().updating);try{if(await duplicateExists(id,upper,lower))throw new Error(t().duplicate);const response=await client.from(TABLE).update({product:productValue,scanner_code:scannerCode,upper_number:upper,lower_number:lower}).eq("id",id).select("id").maybeSingle();if(response.error)throw response.error;if(!response.data?.id)throw new Error(t().permissionBlocked);editingId=null;await loadTable(false);show(t().updated,"ok")}catch(error){show(`${t().updateError}\n${error.message||error}`,"bad")}finally{busy=false}}
async function setStatus(id,status){if(busy)return;busy=true;show(t().updating);try{const payload=status==="verified"?{status:"verified",verified_at:new Date().toISOString()}:{status:"invalid"},response=await client.from(TABLE).update(payload).eq("id",id).select("id").maybeSingle();if(response.error)throw response.error;if(!response.data?.id)throw new Error(t().permissionBlocked);await loadTable(false);show(t().updated,"ok")}catch(error){show(`${t().updateError}\n${error.message||error}`,"bad")}finally{busy=false}}
async function deleteRow(id,path){if(busy||!confirm(t().confirmDelete))return;busy=true;show(t().deleting);try{const response=await client.from(TABLE).delete().eq("id",id).select("id").maybeSingle();if(response.error)throw response.error;if(!response.data?.id)throw new Error(t().permissionBlocked);editingId=null;let cleanupError=null;if(path){const removed=await client.storage.from(BUCKET).remove([path]);cleanupError=removed.error||null}await loadTable(false);show(cleanupError?`${t().deleted}\n${t().photoCleanupWarning}`:t().deleted,cleanupError?"warn":"ok")}catch(error){show(`${t().deleteError}\n${error.message||error}`,"bad")}finally{busy=false}}
$("apiKey").value=sessionStorage.getItem("gemini_api_key")||"";$("apiKey").addEventListener("input",()=>sessionStorage.setItem("gemini_api_key",$("apiKey").value.trim()));
$("photoInput").addEventListener("change",async()=>{const file=$("photoInput").files?.[0];if(!file)return;show(t().processing);result=null;renderResult();try{imageData=await compress(file);$("preview").src=imageData.dataUrl;$("previewWrap").style.display="block";$("recognizeButton").disabled=false;$("newPhotoButton").disabled=false;result={line1:"",line2:"",confidence:0,valid:false};renderResult();show(t().ready,"ok")}catch(error){resetPhoto();show(String(error.message||error),"bad")}});
$("upperValue").addEventListener("input",()=>{readResultInputs();renderResult()});$("lowerValue").addEventListener("input",()=>{readResultInputs();renderResult()});$("recognizeButton").addEventListener("click",recognize);$("newPhotoButton").addEventListener("click",resetPhoto);$("saveButton").addEventListener("click",saveCloud);$("refreshButton").addEventListener("click",()=>loadTable(true));
$("languages").addEventListener("click",event=>{const button=event.target.closest("[data-language]");if(!button)return;language=button.dataset.language;localStorage.setItem(LANGUAGE_KEY,language);applyLanguage()});
$("products").addEventListener("click",event=>{const button=event.target.closest("[data-product]");if(!button)return;product=button.dataset.product;localStorage.setItem(PRODUCT_KEY,product);renderChoices()});
$("tableBody").addEventListener("input",event=>{if(event.target.matches('[data-edit-field="upper_number"]'))event.target.value=normalizeUpper(event.target.value);if(event.target.matches('[data-edit-field="lower_number"]'))event.target.value=normalizeLower(event.target.value)});
$("tableBody").addEventListener("click",event=>{const button=event.target.closest("[data-action]");if(!button||busy)return;const id=button.dataset.id,action=button.dataset.action;if(action==="edit"){editingId=id;renderTable();return}if(action==="cancel-edit"){editingId=null;renderTable();return}if(action==="save-edit"){saveEdit(id);return}if(action==="delete"){deleteRow(id,button.dataset.path||"");return}if(action==="verified"||action==="invalid")setStatus(id,action)});
client.channel("camera-cloud-v3").on("postgres_changes",{event:"*",schema:"public",table:TABLE},()=>{if(!editingId&&!busy)loadTable(false)}).subscribe();
applyLanguage();loadTable();
</script>
