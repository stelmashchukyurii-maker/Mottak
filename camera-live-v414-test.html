<!DOCTYPE html>
<html lang="nb" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>TEST — Camera Cloud v4.14</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:10}
  </style>
  <script src="./products.js?v=20260808-1233"></script>
</head>
<body>
  <div id="loader">Laster isolert TEST — Camera Cloud v4.14…</div>
  <iframe id="app" title="TEST — Camera Cloud v4.14"></iframe>
<script>
"use strict";
const VERSION="20260808-1233";
const SUPABASE_URL="https://hzjsatehehhpgpskckfi.supabase.co";
const SUPABASE_KEY="sb_publishable_5swzjbs4yq7N8sDNR00FHA_n1xbnMya";
const frame=document.getElementById("app"),loader=document.getElementById("loader");

function injectScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement("script");s.src=src;s.onload=resolve;s.onerror=reject;doc.body.appendChild(s)})}

function installDashboard(doc,win){
  if(doc.getElementById("utTestStockFlow")) return;
  const style=doc.createElement("style");
  style.textContent=`
    #utTestStockFlow{border:2px solid #48d597;background:linear-gradient(180deg,rgba(72,213,151,.10),rgba(117,183,255,.04))}
    .ut-test-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .ut-test-head h2{margin:0;color:#48d597}
    .ut-test-refresh{min-height:38px!important;padding:7px 11px!important;border:1px solid #48d597!important;background:#0d1426!important;color:#48d597!important}
    .ut-test-note{margin:7px 0 10px;color:#aab4ce;font-size:12px;line-height:1.45}
    .ut-test-grid{display:grid;gap:9px}
    .ut-test-product{padding:11px;border:1px solid #303b59;border-radius:13px;background:#0d1426}
    .ut-test-product>strong{display:block;margin-bottom:7px;font-size:17px}
    .ut-test-states{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .ut-test-state{padding:7px 5px;border:1px solid #303b59;border-radius:9px;text-align:center;background:#070b14}
    .ut-test-state span{display:block;color:#aab4ce;font-size:9px;line-height:1.2}
    .ut-test-state b{display:block;margin-top:3px;font-size:20px}
    .ut-test-state.free b{color:#48d597}.ut-test-state.reserve b{color:#75b7ff}.ut-test-state.ramp b{color:#f4c430}.ut-test-state.sent b{color:#ff9d72}
    .ut-test-footer{margin-top:9px;color:#aab4ce;font-size:10px}
    @media(max-width:560px){.ut-test-states{grid-template-columns:repeat(2,1fr)}}
  `;
  doc.head.appendChild(style);
  const panel=doc.createElement("section");
  panel.className="card";panel.id="utTestStockFlow";
  panel.innerHTML=`
    <div class="ut-test-head"><h2>🧪 TEST — Lagerbevegelse</h2><button type="button" class="ut-test-refresh" id="utTestRefresh">Oppdater</button></div>
    <div class="ut-test-note">Viser bare isolert TEST-lager. Når UT reserverer eller flytter en enhet til rampe, skal tallet flytte seg mellom kolonnene her — production påvirkes ikke.</div>
    <div class="ut-test-grid" id="utTestGrid"></div>
    <div class="ut-test-footer" id="utTestFooter">Laster TEST-lager…</div>`;
  const subtitle=doc.querySelector(".subtitle");
  if(subtitle) subtitle.insertAdjacentElement("afterend",panel); else doc.querySelector("main")?.prepend(panel);
  doc.getElementById("utTestRefresh")?.addEventListener("click",()=>refreshDashboard(doc,win));
}

async function refreshDashboard(doc,win){
  const grid=doc.getElementById("utTestGrid"),footer=doc.getElementById("utTestFooter");
  if(!grid||!footer) return;
  footer.textContent="Oppdaterer TEST-lager…";
  try{
    const url=`${SUPABASE_URL}/rest/v1/mottak_scans?select=product,status,stock_status,stage_ramp&limit=5000`;
    const res=await win.fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,Accept:"application/json"}});
    const text=await res.text();
    if(!res.ok) throw new Error(text||`HTTP ${res.status}`);
    const rows=text?JSON.parse(text):[];
    const products=["bunner","hyller30","hyller60"];
    const label={bunner:"Bunner",hyller30:"Hyller x30",hyller60:"Hyller x60"};
    const verified=rows.filter(r=>r.status==="verified");
    const pending=rows.filter(r=>r.status==="pending").length;
    grid.innerHTML=products.map(id=>{
      const list=verified.filter(r=>r.product===id);
      const count=(s)=>list.filter(r=>(r.stock_status||"in_stock")===s).length;
      return `<div class="ut-test-product"><strong>${label[id]}</strong><div class="ut-test-states">
        <div class="ut-test-state free"><span>På lager</span><b>${count("in_stock")}</b></div>
        <div class="ut-test-state reserve"><span>Reservert</span><b>${count("reserved")}</b></div>
        <div class="ut-test-state ramp"><span>På rampe</span><b>${count("staged")}</b></div>
        <div class="ut-test-state sent"><span>Sendt</span><b>${count("dispatched")}</b></div>
      </div></div>`;
    }).join("");
    footer.textContent=`TEST-tabell: ${verified.length} godkjente enheter${pending?` · ${pending} pending`:""} · sist oppdatert ${new Date().toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
  }catch(e){footer.textContent=`TEST-lagerfeil: ${e.message||e}`}
}

async function build(){
  try{
    const res=await fetch(`camera-live.html?v=${VERSION}`,{cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    let html=await res.text();
    html=html.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>',`<script src="./ut-test-api.js?v=${VERSION}"><\/script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>`);
    html=html.replace('BUCKET="mottak-photos"','BUCKET="ut-test-photos"');
    html=html.replace('href="index.html"','href="test-home.html"');
    frame.srcdoc=html;
  }catch(e){loader.textContent=`Kunne ikke laste TEST Camera Cloud: ${e.message||e}`}
}

frame.addEventListener("load",async()=>{
  try{
    const doc=frame.contentDocument,win=frame.contentWindow;
    win.BAMA_HOME_TARGET="camera-live-v414-test.html";
    await injectScript(doc,`camera-live-v4-source-fix.js?v=${VERSION}`);
    await injectScript(doc,`camera-live-v4-server-ocr.js?v=${VERSION}`);
    await injectScript(doc,`camera-live-v4-stock-filters.js?v=${VERSION}`);
    await injectScript(doc,`upper-number-policy.js?v=${VERSION}`);
    await injectScript(doc,`shared-stock-status.js?v=${VERSION}`);
    await injectScript(doc,`camera-live-v4-floating-camera.js?v=${VERSION}`);
    await injectScript(doc,`camera-live-v4-floating-workflow.js?v=${VERSION}`);
    await injectScript(doc,`camera-live-v4-compact-language.js?v=${VERSION}`);
    await injectScript(doc,`camera-live-v4-mobile-ui.js?v=${VERSION}`);
    const version=doc.querySelector(".version");
    if(version) version.innerHTML="TEST Kamera Cloud v4.14 · ISOLERT<br>Oppdatert 08.08.2026 kl. 12:33";
    const h1=doc.querySelector("h1");if(h1)h1.textContent="TEST — INN Kamera";
    installDashboard(doc,win);
    await refreshDashboard(doc,win);
    win.addEventListener("focus",()=>refreshDashboard(doc,win));
    doc.addEventListener("visibilitychange",()=>{if(!doc.hidden)refreshDashboard(doc,win)});
    setInterval(()=>{if(!doc.hidden)refreshDashboard(doc,win)},5000);
    loader.style.display="none";
  }catch(e){loader.textContent=`TEST Camera startfeil: ${e.message||e}`}
});
build();
</script>
</body>
</html>
