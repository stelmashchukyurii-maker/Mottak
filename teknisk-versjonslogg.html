<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Teknisk utviklingslogg</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    .langs{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:4px;padding:4px;border:1px solid rgba(48,59,89,.9);border-radius:10px;background:rgba(13,20,38,.9);box-shadow:0 4px 18px rgba(0,0,0,.24);backdrop-filter:blur(8px)}
    .lang{width:31px;height:27px;display:grid;place-items:center;border:1px solid #303b59;border-radius:7px;background:#151c30;color:#aab4ce;font:900 10px/1 Arial,Helvetica,sans-serif;letter-spacing:.04em;cursor:pointer}
    .lang.active{border-color:#75b7ff;background:#17304f;color:#d8ecff}
  </style>
</head>
<body>
  <div class="langs" aria-label="Language">
    <button class="lang" type="button" data-lang="no" aria-label="Norsk">NO</button>
    <button class="lang" type="button" data-lang="uk" aria-label="Українська">UK</button>
  </div>
  <iframe id="logFrame" title="Teknisk utviklingslogg"></iframe>
  <script>
  (()=>{
    "use strict";
    const KEY="technical_version_log_lang_v1";
    const frame=document.getElementById("logFrame");
    const buttons=[...document.querySelectorAll("[data-lang]")];
    const files={no:"teknisk-versjonslogg-no.html",uk:"teknisk-versjonslogg-uk.html"};

    function initialLanguage(){
      const q=new URLSearchParams(location.search).get("lang");
      if(q==="no"||q==="uk")return q;
      try{
        const saved=localStorage.getItem(KEY);
        if(saved==="no"||saved==="uk")return saved;
      }catch{}
      return "no";
    }

    function setLanguage(lang,writeUrl=true){
      if(!files[lang])lang="no";
      frame.src=files[lang];
      document.documentElement.lang=lang==="uk"?"uk":"nb";
      frame.title=lang==="uk"?"Технічний журнал розробки":"Teknisk utviklingslogg";
      buttons.forEach(btn=>{
        const active=btn.dataset.lang===lang;
        btn.classList.toggle("active",active);
        btn.setAttribute("aria-pressed",active?"true":"false");
      });
      try{localStorage.setItem(KEY,lang)}catch{}
      if(writeUrl){
        const url=new URL(location.href);
        url.searchParams.set("lang",lang);
        history.replaceState(null,"",url);
      }
    }

    buttons.forEach(btn=>btn.addEventListener("click",()=>setLanguage(btn.dataset.lang)));
    setLanguage(initialLanguage(),false);
  })();
  </script>
</body>
</html>
