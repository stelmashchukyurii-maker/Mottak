<!DOCTYPE html>
<html lang="nb" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GREEN — UT Kontor v37</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#10172a;--text:#f5f7ff;--muted:#aab4ce;--line:#303b59;--green:#48d597}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}body{display:flex;flex-direction:column}
.bar{flex:0 0 auto;padding:10px 12px;border-bottom:2px solid var(--green);background:var(--panel);box-shadow:0 4px 16px rgba(0,0,0,.28);z-index:5}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title{color:var(--green);font-weight:1000;font-size:17px;line-height:1.2}.sub{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.4}
.lang{display:flex;gap:5px}.lang button,.nav a{min-height:40px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);font-weight:950}.lang button{width:52px}.lang button.active{background:var(--green);border-color:var(--green);color:#062418}
.nav{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:6px;margin-top:8px}.nav a{display:flex;align-items:center;justify-content:center;padding:6px;text-decoration:none;font-size:10px;text-align:center}.nav a.current{border-color:var(--green);color:var(--green)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{padding:5px 8px;border:1px solid rgba(72,213,151,.45);border-radius:999px;background:rgba(72,213,151,.08);color:var(--green);font-size:10px;font-weight:900}
iframe{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:var(--bg)}#loader{position:fixed;inset:0;top:154px;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);font-weight:900;z-index:4;text-align:center}
#greenHomeFloat{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));z-index:99999;display:flex;align-items:center;justify-content:center;gap:7px;min-height:56px;padding:10px 18px;border:2px solid var(--green);border-radius:999px;background:#10281f;color:#eafff6;text-decoration:none;font-size:15px;font-weight:1000;box-shadow:0 14px 34px rgba(0,0,0,.48);touch-action:manipulation}
#greenHomeFloat:active{transform:translateY(1px)}
</style>
<script src="products.js?v=20260809-1117"></script>
</head>
<body class="notranslate">
<header class="bar">
  <div class="top"><div><div class="title" id="greenTitle">GREEN — UT Kontor v37</div><div class="sub" id="greenSub">Parallell klone. GREEN og WORKING bruker samme normale arbeidsdatabase. UT TEST er fortsatt isolert.</div></div><div class="lang"><button id="noBtn" type="button">NO</button><button id="uaBtn" type="button">UA</button></div></div>
  <nav class="nav"><a class="current" href="bestilling-green.html">UT Kontor GREEN</a><a href="camera-green.html">📷 Kamera GREEN</a></nav>
  <div class="badges"><span class="badge">GREEN · SHARED DB</span><span class="badge" id="productBadge">products.js</span></div>
</header>
<div id="loader">Laster GREEN — UT Kontor v37…</div>
<iframe id="app" title="GREEN — UT Kontor v37"></iframe>
<a id="greenHomeFloat" href="green-home.html">⌂ <span id="greenHomeText">HOME</span></a>
<script>
"use strict";
const BUILD="20260809-1117",LANG_KEY="mottak_ut_language";
const frame=document.getElementById("app"),loader=document.getElementById("loader");
let brandTimer=0;
function lang(){return localStorage.getItem(LANG_KEY)==="uk"?"uk":"nb"}
function uk(){return lang()==="uk"}
function paint(){document.getElementById("noBtn").classList.toggle("active",!uk());document.getElementById("uaBtn").classList.toggle("active",uk());document.documentElement.lang=uk()?"uk":"nb";document.getElementById("greenTitle").textContent=uk()?"GREEN — UT Офіс v37":"GREEN — UT Kontor v37";document.getElementById("greenHomeText").textContent=uk()?"ДОДОМУ":"HOME";const p=window.BAMA_PRODUCTS?.getActiveProducts?.()||[];document.getElementById("productBadge").textContent=`products.js v${window.BAMA_PRODUCTS?.meta?.version||"?"} · ${p.length}`}
function inject(doc,src,mark){return new Promise((ok,bad)=>{if(mark&&doc.querySelector(`script[data-green-module="${mark}"]`))return ok();const s=doc.createElement("script");s.src=`${src}?v=${BUILD}`;if(mark)s.dataset.greenModule=mark;s.onload=ok;s.onerror=()=>bad(new Error(`Kunne ikke laste ${src}`));doc.body.appendChild(s)})}
function brandInner(){try{const d=frame.contentDocument;if(!d?.body)return;const v=d.querySelector(".version");if(v)v.innerHTML=`GREEN UT Kontor v37 · 6 PRODUKTER<br>${uk()?"Оновлено":"Oppdatert"} 09.08.2026 kl. 11:17`;const home=d.querySelector("a.home");if(home)home.remove()}catch{}}
function applyLanguage(){paint();try{const w=frame.contentWindow;w.UT_TEST_LANG?.apply?.();w.UT_KONTOR_HISTORY_VISUALS?.decorate?.();w.BAMA_COMPACT_STOCK_REFRESH?.();brandInner()}catch{}}
frame.addEventListener("load",async()=>{loader.style.display="none";try{const d=frame.contentDocument,w=frame.contentWindow;w.BAMA_HOME_TARGET="";await inject(d,"ut-kontor-products.js","products");await inject(d,"ut-kontor-history-visuals.js","history");await inject(d,"ut-test-language.js","language");applyLanguage();setTimeout(applyLanguage,300);clearInterval(brandTimer);brandTimer=setInterval(brandInner,1200)}catch(e){console.error(e);loader.style.display="flex";loader.textContent=`GREEN startfeil: ${e.message||e}`}});
document.getElementById("noBtn").addEventListener("click",()=>{localStorage.setItem(LANG_KEY,"nb");applyLanguage()});document.getElementById("uaBtn").addEventListener("click",()=>{localStorage.setItem(LANG_KEY,"uk");applyLanguage()});paint();frame.src=`bestilling-core-v29.html?v=${BUILD}`;
</script>
</body>
</html>
