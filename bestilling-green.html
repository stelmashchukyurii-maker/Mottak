<!DOCTYPE html>
<html lang="nb" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GREEN — UT Kontor v33</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#10172a;--text:#f5f7ff;--muted:#aab4ce;--line:#303b59;--green:#48d597;--blue:#75b7ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}body{display:flex;flex-direction:column}
.bar{flex:0 0 auto;padding:10px 12px;border-bottom:2px solid var(--green);background:var(--panel);box-shadow:0 4px 16px rgba(0,0,0,.28);z-index:5}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title{color:var(--green);font-weight:1000;font-size:17px;line-height:1.2}.sub{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.4}
.lang{display:flex;gap:5px}.lang button,.nav a{min-height:40px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);font-weight:950}.lang button{width:52px}.lang button.active{background:var(--green);border-color:var(--green);color:#062418}
.nav{display:grid;grid-template-columns:80px minmax(0,1fr) 105px;gap:6px;margin-top:8px}.nav a{display:flex;align-items:center;justify-content:center;padding:6px;text-decoration:none;font-size:10px;text-align:center}.nav a.current{border-color:var(--green);color:var(--green)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{padding:5px 8px;border:1px solid rgba(72,213,151,.45);border-radius:999px;background:rgba(72,213,151,.08);color:var(--green);font-size:10px;font-weight:900}.badge.dim{border-color:rgba(117,183,255,.35);color:#cce4ff;background:rgba(117,183,255,.06)}
iframe{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:var(--bg)}#loader{position:fixed;inset:0;top:154px;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);font-weight:900;z-index:4;text-align:center}
</style>
<script src="./products.js?v=20260809-0116"></script>
</head>
<body class="notranslate">
<header class="bar">
  <div class="top"><div><div class="title" id="greenTitle">GREEN — UT Kontor v33</div><div class="sub" id="greenSub">Parallell klone. GREEN og WORKING bruker samme normale arbeidsdatabase. UT TEST er fortsatt isolert.</div></div><div class="lang"><button id="noBtn" type="button">NO</button><button id="uaBtn" type="button">UA</button></div></div>
  <nav class="nav"><a href="green-home.html">⌂ HOME</a><a class="current" href="utsending-green.html">✓ UT Lager GREEN</a><a href="camera-green.html">📷 Kamera GREEN</a></nav>
  <div class="badges"><span class="badge">GREEN · SHARED DB</span><span class="badge">WORKING + GREEN · SAME DATA</span><span class="badge dim" id="productBadge">products.js</span></div>
</header>
<div id="loader">Laster GREEN — UT Kontor v33…</div>
<iframe id="app" title="GREEN — UT Kontor v33"></iframe>
<script>
"use strict";
const VERSION="20260809-0116";
const LANG_KEY="mottak_ut_language";
const frame=document.getElementById("app"),loader=document.getElementById("loader");
let brandTimer=0;
function lang(){return localStorage.getItem(LANG_KEY)==="uk"?"uk":"nb"}
function uk(){return lang()==="uk"}
function paint(){
  document.getElementById("noBtn").classList.toggle("active",!uk());
  document.getElementById("uaBtn").classList.toggle("active",uk());
  document.documentElement.lang=uk()?"uk":"nb";
  document.getElementById("greenTitle").textContent=uk()?"GREEN — UT Офіс v33":"GREEN — UT Kontor v33";
  document.getElementById("greenSub").textContent=uk()?"Паралельний клон. GREEN і WORKING використовують одну нормальну робочу базу. UT TEST залишається ізольованим.":"Parallell klone. GREEN og WORKING bruker samme normale arbeidsdatabase. UT TEST er fortsatt isolert.";
  const p=window.BAMA_PRODUCTS?.getActiveProducts?.()||[];document.getElementById("productBadge").textContent=`products.js v${window.BAMA_PRODUCTS?.meta?.version||"?"} · ${p.length}`;
}
function inject(doc,src){return new Promise((ok,bad)=>{const s=doc.createElement("script");s.src=src;s.onload=ok;s.onerror=bad;doc.body.appendChild(s)})}
function brandInner(){const doc=frame.contentDocument;if(!doc?.body)return;const version=doc.querySelector(".version");if(version)version.innerHTML=`GREEN UT Kontor v33 · COMPACT STOCK SAFE<br>${uk()?"Оновлено":"Oppdatert"} 09.08.2026 kl. 01:16`;const home=doc.querySelector("a.home");if(home)home.href="green-home.html"}
async function build(){
  paint();
  try{
    const r=await fetch(`bestilling.html?v=${VERSION}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);let html=await r.text();
    html=html.replace(/<script src="office-home-setting\.js[^\"]*"><\/script>/i,"");
    html=html.replace(/<script src="compact-stock-counter\.js[^\"]*"><\/script>/i,`<script src="compact-stock-counter-v2.js?v=${VERSION}"><\/script>`);
    html=html.replace(/bestilling-party-fields\.js\?v=[^\"]+/i,`bestilling-party-fields.js?v=${VERSION}`);
    html=html.replace("</head>",`<script src="./green-ut-api.js?v=${VERSION}"><\/script></head>`);
    frame.srcdoc=html;
  }catch(e){loader.textContent=`GREEN startfeil: ${e.message||e}`}
}
function applyLanguage(){paint();const doc=frame.contentDocument,win=frame.contentWindow;if(!doc?.body)return;win.UT_TEST_LANG?.apply?.();win.UT_KONTOR_HISTORY_VISUALS?.decorate?.();win.BAMA_COMPACT_STOCK_REFRESH?.();brandInner()}
frame.addEventListener("load",async()=>{
  try{
    const doc=frame.contentDocument;const home=doc.querySelector("a.home");if(home)home.href="green-home.html";
    await inject(doc,`ut-kontor-products.js?v=${VERSION}`);await inject(doc,`ut-kontor-history-visuals.js?v=${VERSION}`);await inject(doc,`ut-test-language.js?v=${VERSION}`);
    applyLanguage();setTimeout(applyLanguage,300);clearInterval(brandTimer);brandTimer=setInterval(brandInner,1200);loader.style.display="none";
  }catch(e){loader.textContent=`GREEN startfeil: ${e.message||e}`}
});
document.getElementById("noBtn").addEventListener("click",()=>{localStorage.setItem(LANG_KEY,"nb");applyLanguage()});document.getElementById("uaBtn").addEventListener("click",()=>{localStorage.setItem(LANG_KEY,"uk");applyLanguage()});paint();build();
</script>
</body>
</html>
