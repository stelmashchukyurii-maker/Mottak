<!DOCTYPE html>
<html lang="nb" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>UT Kontor WORKING v37</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--text:#f5f7ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{display:flex;flex-direction:column}
iframe{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:var(--bg)}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);font:900 18px/1.5 Arial,sans-serif;text-align:center;z-index:9}
</style>
<script src="products.js?v=20260811-0810"></script>
</head>
<body class="notranslate">
<div id="loader">Laster UT Kontor WORKING v37…</div>
<iframe id="app" title="UT Kontor WORKING v37"></iframe>
<script>
"use strict";
const BUILD="20260813-1544";
const frame=document.getElementById("app"),loader=document.getElementById("loader");

function inject(doc,src,mark){
  return new Promise((ok,bad)=>{
    if(mark&&doc.querySelector(`script[data-working-module="${mark}"]`))return ok();
    const s=doc.createElement("script");
    s.src=`${src}?v=${BUILD}`;
    if(mark)s.dataset.workingModule=mark;
    s.onload=ok;
    s.onerror=()=>bad(new Error(`Kunne ikke laste ${src}`));
    doc.body.appendChild(s);
  });
}

async function waitForProducts(w){
  for(let i=0;i<50;i++){
    if(w.BAMA_UT_KONTOR_PRODUCTS)return true;
    await new Promise(r=>setTimeout(r,50));
  }
  return false;
}

function enablePhysicalStockCollapse(doc){
  if(doc.getElementById("utPhysicalStockCollapseStyle"))return true;
  const section=doc.querySelector("#bamaStockSummary8 .bs8-section.physical");
  const head=section?.querySelector(".bs8-head");
  if(!section||!head)return false;

  const style=doc.createElement("style");
  style.id="utPhysicalStockCollapseStyle";
  style.textContent=`
    #bamaStockSummary8 .bs8-section.physical.ut-stock-collapsed .bs8-grid{display:none!important}
    #bamaStockSummary8 .bs8-section.physical.ut-stock-collapsed .bs8-head{margin-bottom:0}
    #bamaStockSummary8 .bs8-section.physical .bs8-head{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
    #bamaStockSummary8 .ut-stock-chevron{flex:0 0 auto;min-width:34px;min-height:34px;border:1px solid #303b59;border-radius:10px;background:#151c30;color:#aab4ce;font:1000 15px/34px Arial,sans-serif;text-align:center}
  `;
  doc.head.appendChild(style);

  const chevron=doc.createElement("span");
  chevron.className="ut-stock-chevron";
  chevron.textContent="▼";
  head.appendChild(chevron);

  const setCollapsed=collapsed=>{
    section.classList.toggle("ut-stock-collapsed",collapsed);
    chevron.textContent=collapsed?"▼":"▲";
    head.setAttribute("aria-expanded",collapsed?"false":"true");
  };

  head.addEventListener("click",event=>{
    event.preventDefault();
    setCollapsed(!section.classList.contains("ut-stock-collapsed"));
  });

  setCollapsed(true);
  return true;
}

function applyWorkingBrand(){
  try{
    const d=frame.contentDocument;
    if(!d?.body)return;
    const home=d.querySelector("a.home");
    if(home)home.remove();
    const version=d.querySelector(".version");
    if(version)version.innerHTML="UT Kontor WORKING v37 · 8 PRODUKTER · 2 LAGERTELLERE<br>Oppdatert 13.08.2026 kl. 15:44";
  }catch{}
}

async function refreshInner(){
  try{
    const w=frame.contentWindow;
    await w.UT_KONTOR_HISTORY_VISUALS?.refreshProgress?.();
    w.UT_KONTOR_HISTORY_VISUALS?.decorate?.();
    await w.BAMA_STOCK_SUMMARY_REFRESH?.();
    enablePhysicalStockCollapse(frame.contentDocument);
    applyWorkingBrand();
  }catch{}
}

function applyLanguage(){
  try{
    const w=frame.contentWindow;
    w.UT_TEST_LANG?.apply?.();
    w.BAMA_STOCK_SUMMARY_REFRESH?.();
    enablePhysicalStockCollapse(frame.contentDocument);
    applyWorkingBrand();
    refreshInner();
  }catch{}
}

function hookStockRefreshAfterLoadUt(w){
  if(w.__BAMA_STOCK_SUMMARY_LOADUT_HOOK__||typeof w.loadUt!=="function")return;
  w.__BAMA_STOCK_SUMMARY_LOADUT_HOOK__=true;
  const base=w.loadUt;
  w.loadUt=async function(...args){
    const result=await base.apply(this,args);
    await w.BAMA_STOCK_SUMMARY_REFRESH?.();
    enablePhysicalStockCollapse(frame.contentDocument);
    return result;
  };
}

frame.addEventListener("load",async()=>{
  loader.style.display="none";
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    w.BAMA_HOME_TARGET="";
    w.localStorage.setItem("mottak_ut_language","no");
    await inject(d,"ut-kontor-products.js","products");
    await waitForProducts(w);
    await inject(d,"ut-kontor-vrak-products.js","vrak-products");
    await inject(d,"ut-kontor-history-visuals.js","history");
    await inject(d,"ut-test-language.js","language");
    await inject(d,"stock-summary-8-v1.js","stock-summary-8");
    enablePhysicalStockCollapse(d);
    hookStockRefreshAfterLoadUt(w);
    await refreshInner();
    applyLanguage();
    setTimeout(()=>{enablePhysicalStockCollapse(d);refreshInner()},350);
    setTimeout(()=>{enablePhysicalStockCollapse(d);applyWorkingBrand()},1200);
  }catch(e){
    console.error(e);
    loader.style.display="flex";
    loader.textContent=`UT Kontor startfeil: ${e.message||e}`;
  }
});

frame.src=`bestilling-core-v29.html?v=${BUILD}`;
</script>
</body>
</html>
