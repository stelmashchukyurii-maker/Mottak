<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Varebestilling til rampe</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #151c30;
      --dark: #0d1426;
      --text: #f5f7ff;
      --muted: #aab4ce;
      --accent: #f4c430;
      --ok: #48d597;
      --warn: #f6b94b;
      --bad: #ff7373;
      --line: #303b59;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg), #11182a);
      color: var(--text);
    }

    .page {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 14px 14px 44px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--dark);
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
    }

    .version {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .bunner-card {
      margin: 0 0 14px;
      padding: 16px;
      border: 2px solid rgba(244, 196, 48, 0.55);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(244, 196, 48, 0.12), rgba(21, 28, 48, 0.98));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .bunner-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .bunner-title {
      margin: 0;
      font-size: clamp(25px, 7vw, 38px);
      line-height: 1.05;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(246, 185, 75, 0.12);
    }

    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(72, 213, 151, 0.12);
    }

    .dot.bad {
      background: var(--bad);
      box-shadow: 0 0 0 4px rgba(255, 115, 115, 0.12);
    }

    .bunner-formula {
      margin-top: 14px;
      padding: 16px 12px;
      border: 1px solid rgba(244, 196, 48, 0.42);
      border-radius: 15px;
      background: rgba(13, 20, 38, 0.76);
      text-align: center;
    }

    .formula-line {
      display: block;
      color: var(--accent);
      font-size: clamp(23px, 7vw, 38px);
      font-weight: 900;
      line-height: 1.15;
    }

    .total-line {
      display: block;
      margin-top: 8px;
      font-size: clamp(29px, 9vw, 48px);
      font-weight: 950;
      line-height: 1;
    }

    .bunner-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .meta-box {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--dark);
      text-align: center;
    }

    .meta-box span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .meta-box strong {
      display: block;
      margin-top: 4px;
      font-size: 24px;
    }

    .explanation {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    iframe {
      display: block;
      width: 100%;
      min-height: 1700px;
      border: 0;
      border-radius: 18px;
      background: transparent;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="home-link" href="index.html">← Hovedmeny</a>
      <div class="version">Kontorbestilling v4<br />Oppdatert 03.08.2026 kl. 11:39</div>
    </div>

    <section class="bunner-card" aria-labelledby="bunnerTitle">
      <div class="bunner-head">
        <h1 class="bunner-title" id="bunnerTitle">Bunner</h1>
        <div class="connection">
          <span class="dot" id="databaseDot"></span>
          <span id="databaseStatus">Kobler til databasen…</span>
        </div>
      </div>

      <div class="bunner-formula">
        <strong class="formula-line" id="bunnerFormula">0 godkjente stabler × 10</strong>
        <strong class="total-line" id="bunnerTotal">0 Bunner totalt</strong>
      </div>

      <div class="bunner-meta">
        <div class="meta-box">
          <span>Godkjente skanninger / stabler</span>
          <strong id="verifiedStacks">0</strong>
        </div>
        <div class="meta-box">
          <span>Pending Bunner-stabler</span>
          <strong id="pendingStacks">0</strong>
        </div>
      </div>

      <p class="explanation">Én godkjent Bunner-skanning representerer én full stabel: 1 × 10 = 10 Bunner.</p>
    </section>

    <iframe id="officeApp" src="bestilling-app.html" title="Varebestilling til rampe"></iframe>
  </main>

  <script>
    "use strict";

    const SUPABASE_URL = "https://hzjsatehehhpgpskckfi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5swzjbs4yq7N8sDNR00FHA_n1xbnMya";
    const TABLE = "mottak_scans";
    const UNITS_PER_STACK = 10;

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    });

    const databaseDot = document.getElementById("databaseDot");
    const databaseStatus = document.getElementById("databaseStatus");
    const verifiedStacks = document.getElementById("verifiedStacks");
    const pendingStacks = document.getElementById("pendingStacks");
    const bunnerFormula = document.getElementById("bunnerFormula");
    const bunnerTotal = document.getElementById("bunnerTotal");
    const officeApp = document.getElementById("officeApp");

    function stackWord(count) {
      return count === 1 ? "stabel" : "stabler";
    }

    function setDatabaseStatus(text, type = "") {
      databaseStatus.textContent = text;
      databaseDot.className = `dot ${type}`.trim();
    }

    function renderBunner(rows) {
      const verified = rows.filter((row) => row.status === "verified").length;
      const pending = rows.filter((row) => row.status === "pending").length;
      const total = verified * UNITS_PER_STACK;

      verifiedStacks.textContent = String(verified);
      pendingStacks.textContent = String(pending);
      bunnerFormula.textContent = `${verified} godkjente ${stackWord(verified)} × ${UNITS_PER_STACK}`;
      bunnerTotal.textContent = `${total} Bunner totalt`;
    }

    async function loadBunner() {
      setDatabaseStatus("Oppdaterer Bunner…");

      try {
        const response = await client
          .from(TABLE)
          .select("id,status,product")
          .eq("product", "bunner")
          .limit(5000);

        if (response.error) throw response.error;

        const rows = response.data || [];
        renderBunner(rows);
        setDatabaseStatus(`Tilkoblet · ${rows.length} Bunner-poster`, "ok");
      } catch (error) {
        setDatabaseStatus("Kunne ikke laste Bunner", "bad");
        console.error(error);
      }
    }

    function resizeOfficeApp() {
      try {
        const documentInFrame = officeApp.contentDocument;
        if (!documentInFrame) return;

        const resize = () => {
          const height = Math.max(
            1400,
            documentInFrame.documentElement?.scrollHeight || 0,
            documentInFrame.body?.scrollHeight || 0
          );
          officeApp.style.height = `${height}px`;
        };

        documentInFrame.querySelectorAll("a[href]").forEach((link) => {
          try {
            const url = new URL(link.href, window.location.href);
            if (url.origin === window.location.origin) link.target = "_top";
          } catch {}
        });

        resize();
        setTimeout(resize, 250);
        setTimeout(resize, 1000);

        if (window.ResizeObserver && documentInFrame.body) {
          const observer = new ResizeObserver(resize);
          observer.observe(documentInFrame.body);
        }
      } catch (error) {
        console.warn("Kunne ikke tilpasse kontorsiden", error);
      }
    }

    officeApp.addEventListener("load", resizeOfficeApp);

    client
      .channel("office-bunner-summary-v4")
      .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, () => loadBunner())
      .subscribe();

    loadBunner();
  </script>
</body>
</html>
