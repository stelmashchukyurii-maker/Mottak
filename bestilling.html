<script>
"use strict";
const BUILD="20260821-2326";
const frame=document.getElementById("app"),loader=document.getElementById("loader");

function inject(doc,src,mark){
  return new Promise((ok,bad)=>{
    if(mark&&doc.querySelector(`script[data-working-module="${mark}"]`))return ok();
    const s=doc.createElement("script");
    s.src=`${src}?v=${BUILD}`;
    if(mark)s.dataset.workingModule=mark;
    s.onload=ok;
    s.onerror=()=>bad(new Error(`Kunne ikke laste ${src}`));
    doc.body.appendChild(s);
  });
}

async function waitForProducts(w){
  for(let i=0;i<50;i++){
    if(w.BAMA_UT_KONTOR_PRODUCTS)return true;
    await new Promise(r=>setTimeout(r,50));
  }
  return false;
}

function enableStockSectionsCollapse(doc){
  const root=doc.getElementById("bamaStockSummary8");
  if(!root)return false;
  if(!doc.getElementById("utStockSectionsCollapseStyle")){
    const style=doc.createElement("style");
    style.id="utStockSectionsCollapseStyle";
    style.textContent=`
      #bamaStockSummary8 .bs8-section.ut-stock-collapsed .bs8-grid{display:none!important}
      #bamaStockSummary8 .bs8-section.ut-stock-collapsed .bs8-head{margin-bottom:0}
      #bamaStockSummary8 .bs8-section .bs8-head{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
      #bamaStockSummary8 .ut-stock-chevron{flex:0 0 auto;min-width:34px;min-height:34px;border:1px solid #303b59;border-radius:10px;background:#151c30;color:#aab4ce;font:1000 15px/34px Arial,sans-serif;text-align:center}
    `;
    doc.head.appendChild(style);
  }
  root.querySelectorAll(".bs8-section.physical,.bs8-section.available").forEach(section=>{
    const head=section.querySelector(".bs8-head");
    if(!head||section.dataset.utCollapseReady==="1")return;
    section.dataset.utCollapseReady="1";
    const chevron=doc.createElement("span");
    chevron.className="ut-stock-chevron";
    head.appendChild(chevron);
    const setCollapsed=collapsed=>{
      section.classList.toggle("ut-stock-collapsed",collapsed);
      chevron.textContent=collapsed?"▼":"▲";
      head.setAttribute("aria-expanded",collapsed?"false":"true");
    };
    head.addEventListener("click",event=>{event.preventDefault();setCollapsed(!section.classList.contains("ut-stock-collapsed"));});
    setCollapsed(true);
  });
  return true;
}

function ensureTopActions(doc){
  const top=doc.querySelector(".top");
  if(!top)return false;
  if(!doc.getElementById("utTopActionsStyle")){
    const style=doc.createElement("style");
    style.id="utTopActionsStyle";
    style.textContent=`
      .top{display:grid!important;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"home users presentation" "version version version";gap:6px 8px;align-items:center!important}
      .top>a.home{grid-area:home;justify-self:start}
      .top>.ut-users-link{grid-area:users;justify-self:end;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 11px;border:1px solid rgba(72,213,151,.62);border-radius:12px;background:rgba(72,213,151,.1);color:#9df0c8;text-decoration:none;font-size:11px;font-weight:950;white-space:nowrap}
      .top>.ut-presentation-link{grid-area:presentation;justify-self:end;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 11px;border:1px solid rgba(244,196,48,.72);border-radius:12px;background:rgba(244,196,48,.1);color:#ffe17a;text-decoration:none;font-size:11px;font-weight:950;white-space:nowrap}
      .top>.version{grid-area:version;justify-self:end;text-align:right}
      @media(max-width:700px){.top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"home users" "presentation presentation" "version version"}.top>.ut-presentation-link{justify-self:end}.top>.ut-users-link,.top>a.home,.top>.ut-presentation-link{min-height:38px;padding:7px 9px;font-size:10px}}
    `;
    doc.head.appendChild(style);
  }
  let home=top.querySelector("a.home");
  if(!home){home=doc.createElement("a");home.className="home";top.prepend(home)}
  home.href="index.html";home.target="_top";home.textContent="⌂ HOVEDMENY";

  let users=top.querySelector(".ut-users-link");
  if(!users){
    users=doc.createElement("a");
    users.className="ut-users-link";
    users.href="florivo-terminal-users.html";
    users.target="_top";
    users.textContent="👥 BRUKERE / TILGANGER";
    top.insertBefore(users,top.querySelector(".ut-presentation-link")||top.querySelector(".version")||null);
  }

  let presentation=top.querySelector(".ut-presentation-link");
  if(!presentation){
    presentation=doc.createElement("a");presentation.className="ut-presentation-link";
    presentation.href="https://drive.google.com/file/d/1Js2sVvUDo_nLFwx3oOtfXgt6GYsQQVZS/view?usp=drivesdk";
    presentation.target="_blank";presentation.rel="noopener noreferrer";presentation.textContent="▶ PRESENTASJON";
    top.insertBefore(presentation,top.querySelector(".version")||null);
  }
  return true;
}

function applyWorkingBrand(){
  try{
    const d=frame.contentDocument;if(!d?.body)return;ensureTopActions(d);
    const version=d.querySelector(".version");
    if(version)version.innerHTML="UT Kontor WORKING v37.3 · BRUKERE / TILGANGER · UTEN SKANNING<br>Oppdatert 21.08.2026 kl. 23:26";
  }catch{}
}
async function refreshInner(){
  try{
    const w=frame.contentWindow;
    await w.UT_KONTOR_HISTORY_VISUALS?.refreshProgress?.();w.UT_KONTOR_HISTORY_VISUALS?.decorate?.();w.UT_KONTOR_STAGE_ALL_NO_SCAN?.decorate?.();
    await w.BAMA_STOCK_SUMMARY_REFRESH?.();enableStockSectionsCollapse(frame.contentDocument);applyWorkingBrand();
  }catch{}
}
function applyLanguage(){
  try{
    const w=frame.contentWindow;w.UT_TEST_LANG?.apply?.();w.BAMA_STOCK_SUMMARY_REFRESH?.();enableStockSectionsCollapse(frame.contentDocument);applyWorkingBrand();refreshInner();
  }catch{}
}
function hookStockRefreshAfterLoadUt(w){
  if(w.__BAMA_STOCK_SUMMARY_LOADUT_HOOK__||typeof w.loadUt!=="function")return;
  w.__BAMA_STOCK_SUMMARY_LOADUT_HOOK__=true;const base=w.loadUt;
  w.loadUt=async function(...args){const result=await base.apply(this,args);await w.BAMA_STOCK_SUMMARY_REFRESH?.();enableStockSectionsCollapse(frame.contentDocument);w.UT_KONTOR_STAGE_ALL_NO_SCAN?.decorate?.();return result};
}
frame.addEventListener("load",async()=>{
  loader.style.display="none";
  try{
    const d=frame.contentDocument,w=frame.contentWindow;ensureTopActions(d);w.BAMA_HOME_TARGET="";w.localStorage.setItem("mottak_ut_language","no");
    await inject(d,"ut-kontor-products.js","products");await waitForProducts(w);await inject(d,"ut-kontor-vrak-products.js","vrak-products");await inject(d,"ut-kontor-history-visuals.js","history");await inject(d,"ut-kontor-stage-all-no-scan.js","stage-all-no-scan");await inject(d,"ut-test-language.js","language");await inject(d,"stock-summary-8-v1.js","stock-summary-8");
    enableStockSectionsCollapse(d);hookStockRefreshAfterLoadUt(w);await refreshInner();applyLanguage();setTimeout(()=>{enableStockSectionsCollapse(d);refreshInner()},350);setTimeout(()=>{enableStockSectionsCollapse(d);applyWorkingBrand();w.UT_KONTOR_STAGE_ALL_NO_SCAN?.decorate?.()},1200);
  }catch(e){console.error(e);loader.style.display="flex";loader.textContent=`UT Kontor startfeil: ${e.message||e}`}
});
frame.src=`bestilling-core-v29.html?v=${BUILD}`;
</script>
