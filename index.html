<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Сканер бірки</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 14px 10px;
      background: #1f1f1f;
      border-bottom: 1px solid #444;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    #status {
      margin-top: 8px;
      min-height: 24px;
      color: #ddd;
      font-size: 15px;
      line-height: 1.4;
    }

    main {
      width: min(96%, 720px);
      margin: 0 auto;
      padding: 12px 0 30px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      height: 58vh;
      min-height: 430px;
      max-height: 760px;
      overflow: hidden;
      background: #000;
      border: 2px solid #555;
      border-radius: 14px;
    }

    #video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /*
      ВЕРТИКАЛЬНА ЗЕЛЕНА РАМКА.

      Рамка вузька та висока.
      Камера не повертається.
      Повернута лише форма рамки.
    */
    #scanFrame {
      position: absolute;
      left: 50%;
      top: 57%;

      width: 48%;
      height: 61%;

      transform: translate(-50%, -50%);

      border: 4px solid #00ff66;
      border-radius: 14px;

      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.25),
        0 0 22px rgba(0, 255, 102, 0.95);

      pointer-events: none;
    }

    #scanFrameText {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;

      width: 310px;
      max-width: 92vw;

      transform: translateX(-50%);

      color: #fff;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.25;

      text-shadow:
        0 2px 6px #000,
        0 0 8px #000;
    }

    .buttons {
      padding-top: 10px;
    }

    button,
    .fileButton {
      display: inline-block;
      width: min(96%, 540px);
      margin: 6px;
      padding: 14px 16px;

      border: none;
      border-radius: 12px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #startButton {
      background: #1689ef;
      color: #fff;
    }

    #captureButton {
      background: #00ad49;
      color: #fff;
    }

    #torchButton {
      background: #ffc107;
      color: #111;
    }

    #stopButton {
      background: #bd3327;
      color: #fff;
    }

    #copyButton {
      background: #16a085;
      color: #fff;
      display: none;
    }

    .fileButton {
      background: #805ad5;
      color: #fff;
    }

    #fileInput {
      display: none;
    }

    .panel {
      width: 100%;
      margin-top: 14px;
      padding: 12px;

      background: #222;
      border: 2px solid #555;
      border-radius: 14px;
    }

    .panelTitle {
      margin-bottom: 10px;
      color: #bbb;
      font-size: 15px;
    }

    #cropPanel,
    #processedPanel,
    #progressPanel {
      display: none;
    }

    #cropPreview,
    #processedPreview {
      display: block;
      width: 100%;
      max-height: 420px;

      object-fit: contain;

      background: #fff;
      border-radius: 9px;
    }

    #result {
      min-height: 110px;
      padding: 10px;

      color: #00ff66;

      font-family: monospace;
      font-size: 40px;
      font-weight: bold;
      line-height: 1.35;

      white-space: pre-wrap;
      word-break: break-word;
    }

    #rawResult {
      margin-top: 10px;
      padding: 12px;

      background: #111;
      color: #bbb;
      border-radius: 9px;

      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;

      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #progressText {
      margin-bottom: 9px;
      color: #ddd;
    }

    #progressTrack {
      width: 100%;
      height: 15px;

      overflow: hidden;

      background: #444;
      border-radius: 10px;
    }

    #progressBar {
      width: 0%;
      height: 100%;

      background: #00ad49;

      transition: width 0.15s linear;
    }

    canvas {
      display: none;
    }

    footer {
      padding: 18px 10px 25px;
      color: #888;
      font-size: 12px;
      border-top: 1px solid #333;
    }
  </style>
</head>

<body>

<header>
  <h1>Сканер бірки</h1>

  <div id="status">
    Відкрий камеру або вибери готове фото
  </div>
</header>

<main>

  <div id="cameraBox">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div id="scanFrame">

      <div id="scanFrameText">
        Помісти бірку вертикально всередину зеленої рамки
      </div>

    </div>

  </div>

  <div class="buttons">

    <button id="startButton">
      📷 Відкрити камеру
    </button>

    <button id="captureButton" disabled>
      📸 Зробити фото і прочитати
    </button>

    <button id="torchButton" disabled>
      🔦 Ліхтарик
    </button>

    <button id="stopButton" disabled>
      ⛔ Закрити камеру
    </button>

    <button id="copyButton">
      📋 Копіювати результат
    </button>

    <label class="fileButton" for="fileInput">
      🖼️ Перевірити готове фото
    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >

  </div>

  <div id="progressPanel" class="panel">

    <div id="progressText">
      Підготовка OCR…
    </div>

    <div id="progressTrack">
      <div id="progressBar"></div>
    </div>

  </div>

  <div id="cropPanel" class="panel">

    <div class="panelTitle">
      Область, яку програма вирізала
    </div>

    <img
      id="cropPreview"
      alt="Вирізаний фрагмент"
    >

  </div>

  <div id="processedPanel" class="panel">

    <div class="panelTitle">
      Оброблене зображення, яке читає OCR
    </div>

    <img
      id="processedPreview"
      alt="Оброблений фрагмент"
    >

  </div>

  <div class="panel">

    <div class="panelTitle">
      Результат
    </div>

    <div id="result">
      Очікування…
    </div>

    <div id="rawResult">
      Повний результат OCR з’явиться тут.
    </div>

  </div>

  <canvas id="photoCanvas"></canvas>
  <canvas id="cropCanvas"></canvas>
  <canvas id="processedCanvas"></canvas>

</main>

<footer>
  Версія 0.3 — вертикальна рамка
</footer>

<script>
"use strict";


/* =========================================================
   ЕЛЕМЕНТИ СТОРІНКИ
   ========================================================= */

const video =
  document.getElementById("video");

const scanFrame =
  document.getElementById("scanFrame");

const startButton =
  document.getElementById("startButton");

const captureButton =
  document.getElementById("captureButton");

const torchButton =
  document.getElementById("torchButton");

const stopButton =
  document.getElementById("stopButton");

const copyButton =
  document.getElementById("copyButton");

const fileInput =
  document.getElementById("fileInput");

const statusElement =
  document.getElementById("status");

const resultElement =
  document.getElementById("result");

const rawResultElement =
  document.getElementById("rawResult");

const progressPanel =
  document.getElementById("progressPanel");

const progressText =
  document.getElementById("progressText");

const progressBar =
  document.getElementById("progressBar");

const cropPanel =
  document.getElementById("cropPanel");

const processedPanel =
  document.getElementById("processedPanel");

const cropPreview =
  document.getElementById("cropPreview");

const processedPreview =
  document.getElementById("processedPreview");

const photoCanvas =
  document.getElementById("photoCanvas");

const cropCanvas =
  document.getElementById("cropCanvas");

const processedCanvas =
  document.getElementById("processedCanvas");


/* =========================================================
   ЗМІННІ
   ========================================================= */

let cameraStream = null;
let cameraTrack = null;

let torchEnabled = false;
let isProcessing = false;

let lastRecognizedText = "";


/* =========================================================
   ЗАТРИМКА
   ========================================================= */

function wait(milliseconds) {
  return new Promise(resolve => {
    setTimeout(resolve, milliseconds);
  });
}


/* =========================================================
   ВІДКРИТТЯ КАМЕРИ
   ========================================================= */

async function openCamera() {
  startButton.disabled = true;

  statusElement.textContent =
    "Відкриваємо задню камеру…";

  try {
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        "Цей браузер не підтримує доступ до камери."
      );
    }

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        audio: false,

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 3840
          },

          height: {
            ideal: 2160
          },

          frameRate: {
            ideal: 30,
            max: 30
          }
        }
      });

    video.srcObject = cameraStream;

    await video.play();

    cameraTrack =
      cameraStream.getVideoTracks()[0];

    try {
      const capabilities =
        cameraTrack.getCapabilities
          ? cameraTrack.getCapabilities()
          : {};

      if (
        Array.isArray(capabilities.focusMode) &&
        capabilities.focusMode.includes("continuous")
      ) {
        await cameraTrack.applyConstraints({
          advanced: [
            {
              focusMode: "continuous"
            }
          ]
        });
      }

      torchButton.disabled =
        capabilities.torch !== true;

    } catch (error) {
      console.log(
        "Браузер не дозволив керувати автофокусом:",
        error
      );
    }

    captureButton.disabled = false;
    stopButton.disabled = false;

    statusElement.textContent =
      "Помісти бірку вертикально всередину зеленої рамки.";

  } catch (error) {
    console.error(error);

    statusElement.textContent =
      "Камера не відкрилася. Перевір дозвіл камери в Chrome.";

    resultElement.textContent =
      error.message || "Немає доступу до камери.";
  }

  startButton.disabled = false;
}


/* =========================================================
   ЗАКРИТТЯ КАМЕРИ
   ========================================================= */

function closeCamera() {
  if (cameraStream) {
    cameraStream
      .getTracks()
      .forEach(track => track.stop());
  }

  cameraStream = null;
  cameraTrack = null;

  video.srcObject = null;

  captureButton.disabled = true;
  torchButton.disabled = true;
  stopButton.disabled = true;

  torchEnabled = false;

  torchButton.textContent =
    "🔦 Ліхтарик";

  statusElement.textContent =
    "Камеру закрито.";
}


/* =========================================================
   ЛІХТАРИК
   ========================================================= */

async function toggleTorch() {
  if (!cameraTrack) {
    return;
  }

  torchEnabled = !torchEnabled;

  try {
    await cameraTrack.applyConstraints({
      advanced: [
        {
          torch: torchEnabled
        }
      ]
    });

    torchButton.textContent =
      torchEnabled
        ? "💡 Вимкнути ліхтарик"
        : "🔦 Ліхтарик";

  } catch (error) {
    console.error(error);

    torchEnabled = false;

    torchButton.textContent =
      "🔦 Ліхтарик";

    statusElement.textContent =
      "Телефон не дозволив увімкнути ліхтарик.";
  }
}


/* =========================================================
   ФОТО З КАМЕРИ
   ========================================================= */

function captureCameraPhoto() {
  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {
    throw new Error(
      "Камера ще не підготувала зображення."
    );
  }

  photoCanvas.width =
    video.videoWidth;

  photoCanvas.height =
    video.videoHeight;

  const context =
    photoCanvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  context.clearRect(
    0,
    0,
    photoCanvas.width,
    photoCanvas.height
  );

  context.drawImage(
    video,
    0,
    0,
    photoCanvas.width,
    photoCanvas.height
  );

  return photoCanvas;
}


/* =========================================================
   ВІДКРИТТЯ ГОТОВОГО ФОТО
   ========================================================= */

async function loadPhotoFile(file) {
  const image = new Image();

  const temporaryUrl =
    URL.createObjectURL(file);

  try {
    await new Promise(
      (resolve, reject) => {
        image.onload = resolve;
        image.onerror = reject;
        image.src = temporaryUrl;
      }
    );

    const maximumSide = 3000;

    const scale =
      Math.min(
        1,
        maximumSide /
        Math.max(
          image.naturalWidth,
          image.naturalHeight
        )
      );

    photoCanvas.width =
      Math.round(
        image.naturalWidth * scale
      );

    photoCanvas.height =
      Math.round(
        image.naturalHeight * scale
      );

    const context =
      photoCanvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );

    context.clearRect(
      0,
      0,
      photoCanvas.width,
      photoCanvas.height
    );

    context.drawImage(
      image,
      0,
      0,
      photoCanvas.width,
      photoCanvas.height
    );

    return photoCanvas;

  } finally {
    URL.revokeObjectURL(
      temporaryUrl
    );
  }
}


/* =========================================================
   ОБЛАСТЬ ВЕРТИКАЛЬНОЇ РАМКИ НА КАМЕРІ
   ========================================================= */

function getCameraCropRectangle(sourceCanvas) {
  const videoRectangle =
    video.getBoundingClientRect();

  const frameRectangle =
    scanFrame.getBoundingClientRect();

  const visibleWidth =
    videoRectangle.width;

  const visibleHeight =
    videoRectangle.height;

  const sourceWidth =
    sourceCanvas.width;

  const sourceHeight =
    sourceCanvas.height;

  /*
    Відео показується через object-fit: cover.
    Частина кадру може бути обрізана.
  */

  const displayScale =
    Math.max(
      visibleWidth / sourceWidth,
      visibleHeight / sourceHeight
    );

  const displayedSourceWidth =
    sourceWidth * displayScale;

  const displayedSourceHeight =
    sourceHeight * displayScale;

  const hiddenLeft =
    (displayedSourceWidth - visibleWidth) / 2;

  const hiddenTop =
    (displayedSourceHeight - visibleHeight) / 2;

  const frameLeft =
    frameRectangle.left -
    videoRectangle.left;

  const frameTop =
    frameRectangle.top -
    videoRectangle.top;

  let sourceX =
    (frameLeft + hiddenLeft) /
    displayScale;

  let sourceY =
    (frameTop + hiddenTop) /
    displayScale;

  let cropWidth =
    frameRectangle.width /
    displayScale;

  let cropHeight =
    frameRectangle.height /
    displayScale;

  sourceX =
    Math.max(0, sourceX);

  sourceY =
    Math.max(0, sourceY);

  cropWidth =
    Math.min(
      cropWidth,
      sourceWidth - sourceX
    );

  cropHeight =
    Math.min(
      cropHeight,
      sourceHeight - sourceY
    );

  return {
    x: sourceX,
    y: sourceY,
    width: cropWidth,
    height: cropHeight
  };
}


/* =========================================================
   ОБЛАСТЬ ДЛЯ ГОТОВОГО ФОТО
   ========================================================= */

function getUploadedPhotoCropRectangle(sourceCanvas) {
  /*
    Для твого тестового фото.

    Область захоплює:
    078500
    2CB739
  */

  return {
    x: sourceCanvas.width * 0.15,
    y: sourceCanvas.height * 0.63,
    width: sourceCanvas.width * 0.60,
    height: sourceCanvas.height * 0.36
  };
}


/* =========================================================
   ВИРІЗАННЯ ФРАГМЕНТА
   ========================================================= */

function cropTextArea(
  sourceCanvas,
  rectangle
) {
  const enlargement = 2;

  cropCanvas.width =
    Math.max(
      1,
      Math.round(
        rectangle.width *
        enlargement
      )
    );

  cropCanvas.height =
    Math.max(
      1,
      Math.round(
        rectangle.height *
        enlargement
      )
    );

  const context =
    cropCanvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  context.clearRect(
    0,
    0,
    cropCanvas.width,
    cropCanvas.height
  );

  context.imageSmoothingEnabled =
    true;

  context.imageSmoothingQuality =
    "high";

  context.drawImage(
    sourceCanvas,

    rectangle.x,
    rectangle.y,
    rectangle.width,
    rectangle.height,

    0,
    0,
    cropCanvas.width,
    cropCanvas.height
  );

  cropPreview.src =
    cropCanvas.toDataURL(
      "image/jpeg",
      0.97
    );

  cropPanel.style.display =
    "block";

  return cropCanvas;
}


/* =========================================================
   ОБРОБКА ЗОБРАЖЕННЯ
   ========================================================= */

function preprocessImage(sourceCanvas) {
  processedCanvas.width =
    sourceCanvas.width;

  processedCanvas.height =
    sourceCanvas.height;

  const context =
    processedCanvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  context.clearRect(
    0,
    0,
    processedCanvas.width,
    processedCanvas.height
  );

  context.drawImage(
    sourceCanvas,
    0,
    0
  );

  const imageData =
    context.getImageData(
      0,
      0,
      processedCanvas.width,
      processedCanvas.height
    );

  const pixels =
    imageData.data;

  for (
    let index = 0;
    index < pixels.length;
    index += 4
  ) {
    let gray =
      pixels[index] * 0.299 +
      pixels[index + 1] * 0.587 +
      pixels[index + 2] * 0.114;

    gray =
      (gray - 128) * 1.25 + 128;

    gray =
      Math.max(
        0,
        Math.min(255, gray)
      );

    pixels[index] = gray;
    pixels[index + 1] = gray;
    pixels[index + 2] = gray;
    pixels[index + 3] = 255;
  }

  context.putImageData(
    imageData,
    0,
    0
  );

  processedPreview.src =
    processedCanvas.toDataURL(
      "image/png"
    );

  processedPanel.style.display =
    "block";

  return processedCanvas;
}


/* =========================================================
   НОРМАЛІЗАЦІЯ OCR
   ========================================================= */

function normalizeOcrText(text) {
  return String(text || "")
    .toUpperCase()
    .replace(/[^A-Z0-9\n\r ]/g, " ");
}


/* =========================================================
   ПОШУК ПЕРШОГО РЯДКА
   ========================================================= */

function findFirstLine(text) {
  const normalized =
    normalizeOcrText(text);

  const lines =
    normalized
      .split(/\r?\n/)
      .map(line =>
        line
          .replace(/\s+/g, "")
          .trim()
      )
      .filter(Boolean);

  for (const line of lines) {
    if (/^\d{6}$/.test(line)) {
      return line;
    }
  }

  for (const line of lines) {
    const match =
      line.match(/\d{6}/);

    if (match) {
      return match[0];
    }
  }

  for (const line of lines) {
    const corrected =
      line
        .replace(/O/g, "0")
        .replace(/Q/g, "0")
        .replace(/I/g, "1")
        .replace(/L/g, "1")
        .replace(/Z/g, "2")
        .replace(/S/g, "5")
        .replace(/G/g, "6")
        .replace(/B/g, "8");

    const match =
      corrected.match(/\d{6}/);

    if (match) {
      return match[0];
    }
  }

  return "";
}


/* =========================================================
   ПОШУК ДРУГОГО РЯДКА
   ========================================================= */

function findSecondLine(
  text,
  firstLine
) {
  const normalized =
    normalizeOcrText(text);

  const lines =
    normalized
      .split(/\r?\n/)
      .map(line =>
        line
          .replace(/\s+/g, "")
          .trim()
      )
      .filter(Boolean);

  for (const line of lines) {
    if (
      /^[A-Z0-9]{6}$/.test(line) &&
      line !== firstLine &&
      /[A-Z]/.test(line) &&
      /\d/.test(line)
    ) {
      return line;
    }
  }

  for (const line of lines) {
    const candidates =
      line.match(/[A-Z0-9]{6}/g);

    if (!candidates) {
      continue;
    }

    for (const candidate of candidates) {
      if (
        candidate !== firstLine &&
        /[A-Z]/.test(candidate) &&
        /\d/.test(candidate)
      ) {
        return candidate;
      }
    }
  }

  return "";
}


/* =========================================================
   ОЧИЩЕНИЙ РЕЗУЛЬТАТ
   ========================================================= */

function cleanOcrText(text) {
  const firstLine =
    findFirstLine(text);

  const secondLine =
    findSecondLine(
      text,
      firstLine
    );

  if (
    firstLine &&
    secondLine
  ) {
    return (
      firstLine +
      "\n" +
      secondLine
    );
  }

  if (firstLine) {
    return firstLine;
  }

  const normalized =
    normalizeOcrText(text);

  const fallbackLines =
    normalized
      .split(/\r?\n/)
      .map(line =>
        line
          .replace(/\s+/g, "")
          .trim()
      )
      .filter(line =>
        line.length >= 4 &&
        line.length <= 10
      );

  return fallbackLines
    .slice(0, 2)
    .join("\n");
}


/* =========================================================
   ОЦІНКА РЕЗУЛЬТАТУ
   ========================================================= */

function calculateResultScore(
  cleanedText,
  confidence
) {
  const lines =
    String(cleanedText || "")
      .split("\n")
      .filter(Boolean);

  let score =
    Number(confidence) || 0;

  if (
    lines.length >= 1 &&
    /^\d{6}$/.test(lines[0])
  ) {
    score += 100;
  }

  if (
    lines.length >= 2 &&
    /^[A-Z0-9]{6}$/.test(lines[1]) &&
    /[A-Z]/.test(lines[1]) &&
    /\d/.test(lines[1])
  ) {
    score += 100;
  }

  if (lines.length === 2) {
    score += 30;
  }

  return score;
}


/* =========================================================
   OCR
   ========================================================= */

async function runOcr(
  imageCanvas,
  label
) {
  progressPanel.style.display =
    "block";

  progressText.textContent =
    label;

  const result =
    await Tesseract.recognize(
      imageCanvas,
      "eng",
      {
        logger(message) {
          if (
            typeof message.progress ===
            "number"
          ) {
            const percentage =
              Math.round(
                message.progress * 100
              );

            progressBar.style.width =
              percentage + "%";

            progressText.textContent =
              label +
              ": " +
              percentage +
              "%";
          }
        },

        tessedit_char_whitelist:
          "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ",

        preserve_interword_spaces:
          "1",

        tessedit_pageseg_mode:
          "6"
      }
    );

  const rawText =
    result.data.text || "";

  const cleanedText =
    cleanOcrText(rawText);

  return {
    rawText: rawText,

    cleanedText: cleanedText,

    confidence:
      result.data.confidence || 0,

    score:
      calculateResultScore(
        cleanedText,
        result.data.confidence
      )
  };
}


/* =========================================================
   ГОЛОВНА ОБРОБКА
   ========================================================= */

async function processPhoto(
  sourceCanvas,
  fromCamera
) {
  if (isProcessing) {
    return;
  }

  isProcessing = true;

  captureButton.disabled = true;
  copyButton.style.display = "none";

  resultElement.textContent =
    "Розпізнавання…";

  rawResultElement.textContent =
    "Очікування результату OCR…";

  progressPanel.style.display =
    "block";

  progressBar.style.width =
    "0%";

  try {
    statusElement.textContent =
      "Вирізаємо область усередині рамки…";

    const rectangle =
      fromCamera
        ? getCameraCropRectangle(
            sourceCanvas
          )
        : getUploadedPhotoCropRectangle(
            sourceCanvas
          );

    const croppedImage =
      cropTextArea(
        sourceCanvas,
        rectangle
      );

    const processedImage =
      preprocessImage(
        croppedImage
      );

    statusElement.textContent =
      "OCR читає символи…";

    const processedResult =
      await runOcr(
        processedImage,
        "OCR сірого зображення"
      );

    const originalResult =
      await runOcr(
        croppedImage,
        "OCR кольорового зображення"
      );

    const bestResult =
      processedResult.score >=
      originalResult.score
        ? processedResult
        : originalResult;

    if (bestResult.cleanedText) {
      lastRecognizedText =
        bestResult.cleanedText;

      resultElement.textContent =
        bestResult.cleanedText;

      copyButton.style.display =
        "inline-block";

      statusElement.textContent =
        "✅ Готово.";

      if (navigator.vibrate) {
        navigator.vibrate([
          100,
          60,
          120
        ]);
      }

    } else {
      lastRecognizedText = "";

      resultElement.textContent =
        "Не розпізнано";

      statusElement.textContent =
        "OCR не знайшов потрібні два рядки.";
    }

    rawResultElement.textContent =
      "Обраний результат:\n\n" +
      (bestResult.rawText || "(порожньо)") +
      "\n\nВпевненість: " +
      Math.round(
        bestResult.confidence
      ) +
      "%" +
      "\n\nСірий варіант:\n" +
      (processedResult.rawText ||
        "(порожньо)") +
      "\n\nКольоровий варіант:\n" +
      (originalResult.rawText ||
        "(порожньо)");

  } catch (error) {
    console.error(error);

    resultElement.textContent =
      "Помилка";

    rawResultElement.textContent =
      error.message ||
      String(error);

    statusElement.textContent =
      "Сталася помилка під час OCR.";

  } finally {
    isProcessing = false;

    captureButton.disabled =
      !cameraTrack;

    setTimeout(() => {
      progressPanel.style.display =
        "none";
    }, 1200);
  }
}


/* =========================================================
   ФОТО З КАМЕРИ
   ========================================================= */

async function captureAndRecognize() {
  if (!cameraTrack) {
    statusElement.textContent =
      "Спочатку відкрий камеру.";

    return;
  }

  try {
    captureButton.disabled = true;

    statusElement.textContent =
      "Чекаємо автофокус…";

    await wait(1000);

    const photo =
      captureCameraPhoto();

    await processPhoto(
      photo,
      true
    );

  } catch (error) {
    console.error(error);

    resultElement.textContent =
      "Помилка камери";

    statusElement.textContent =
      error.message ||
      "Не вдалося зробити фото.";

    captureButton.disabled =
      false;
  }
}


/* =========================================================
   КОПІЮВАННЯ
   ========================================================= */

async function copyResult() {
  if (!lastRecognizedText) {
    return;
  }

  try {
    await navigator.clipboard.writeText(
      lastRecognizedText
    );

    statusElement.textContent =
      "📋 Результат скопійовано.";

  } catch (error) {
    console.error(error);

    statusElement.textContent =
      "Не вдалося скопіювати результат.";
  }
}


/* =========================================================
   КНОПКИ
   ========================================================= */

startButton.addEventListener(
  "click",
  openCamera
);

captureButton.addEventListener(
  "click",
  captureAndRecognize
);

torchButton.addEventListener(
  "click",
  toggleTorch
);

stopButton.addEventListener(
  "click",
  closeCamera
);

copyButton.addEventListener(
  "click",
  copyResult
);


/* =========================================================
   ГОТОВЕ ФОТО
   ========================================================= */

fileInput.addEventListener(
  "change",
  async function() {
    const file =
      fileInput.files &&
      fileInput.files[0];

    if (!file) {
      return;
    }

    try {
      statusElement.textContent =
        "Відкриваємо фотографію…";

      const photo =
        await loadPhotoFile(file);

      await processPhoto(
        photo,
        false
      );

    } catch (error) {
      console.error(error);

      resultElement.textContent =
        "Помилка фото";

      rawResultElement.textContent =
        error.message ||
        String(error);

      statusElement.textContent =
        "Не вдалося відкрити фотографію.";
    }

    fileInput.value = "";
  }
);


/* =========================================================
   ЗАКРИТТЯ СТОРІНКИ
   ========================================================= */

window.addEventListener(
  "pagehide",
  function() {
    if (cameraStream) {
      cameraStream
        .getTracks()
        .forEach(
          track => track.stop()
        );
    }
  }
);
</script>
