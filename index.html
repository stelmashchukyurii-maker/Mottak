<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#111827" />

  <title>AI Scanner Mottak v3</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #0b1020;
      --card: #151c30;
      --card-dark: #0d1426;
      --text: #f5f7ff;
      --muted: #aab4ce;
      --accent: #f4c430;
      --ok: #48d597;
      --bad: #ff6b6b;
      --line: #303b59;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(
        180deg,
        #0b1020 0%,
        #11182a 100%
      );
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 14px 44px;
    }

    h1 {
      margin: 4px 0 6px;
      font-size: clamp(25px, 7vw, 38px);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.45;
    }

    .card {
      margin: 12px 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(21, 28, 48, 0.95);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .tiny {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    label.field-label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input[type="password"] {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card-dark);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
    }

    input[type="file"] {
      display: none;
    }

    button,
    .file-button {
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition:
        transform 0.08s ease,
        opacity 0.2s ease,
        border-color 0.2s ease;
    }

    button:active,
    .file-button:active {
      transform: scale(0.985);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .primary {
      background: var(--accent);
      color: #151515;
    }

    .secondary {
      background: #2c395c;
      color: var(--text);
    }

    .success {
      background: var(--ok);
      color: #062418;
    }

    .danger {
      background: rgba(255, 107, 107, 0.16);
      color: #ffb0b0;
      border: 1px solid rgba(255, 107, 107, 0.38);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 560px) {
      .row.two {
        grid-template-columns: 1fr 1fr;
      }
    }

    .language-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .language-button {
      min-height: 48px;
      padding: 9px 6px;
      background: var(--card-dark);
      color: var(--text);
      border: 2px solid var(--line);
      font-size: clamp(13px, 3.7vw, 16px);
    }

    .language-button.active {
      background: var(--accent);
      color: #17130a;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(244, 196, 48, 0.18);
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 600px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .product-button {
      min-height: 72px;
      background: var(--card-dark);
      color: var(--text);
      border: 2px solid var(--line);
    }

    .product-button.active {
      color: #17130a;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(244, 196, 48, 0.18);
    }

    .selected-product {
      margin: 12px 0 0;
      color: var(--muted);
      text-align: center;
    }

    .selected-product strong {
      color: var(--accent);
    }

    .totals-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .total-box {
      min-width: 0;
      padding: 12px 7px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card-dark);
      text-align: center;
    }

    .total-name {
      display: block;
      min-height: 34px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .total-value {
      display: block;
      margin-top: 4px;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 900;
      line-height: 1;
    }

    .grand-total {
      margin: 13px 0 0;
      text-align: center;
      color: var(--muted);
    }

    .grand-total strong {
      color: var(--text);
      font-size: 20px;
    }

    .preview-wrap {
      display: none;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 15px;
      background: #070a11;
      border: 1px solid var(--line);
    }

    #preview {
      display: block;
      width: 100%;
      max-height: 62vh;
      object-fit: contain;
    }

    .status {
      min-height: 26px;
      margin-top: 12px;
      color: var(--muted);
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.bad {
      color: var(--bad);
    }

    .result-product {
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card-dark);
      color: var(--muted);
      text-align: center;
    }

    .result-product strong {
      color: var(--accent);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 520px) {
      .result-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .result-box {
      padding: 14px;
      border-radius: 14px;
      background: var(--card-dark);
      border: 1px solid var(--line);
    }

    .result-box span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .result-value {
      min-height: 42px;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;
      font-size: clamp(27px, 8vw, 42px);
      font-weight: 900;
      letter-spacing: 0.08em;
      word-break: break-all;
    }

    .confidence {
      margin: 12px 0;
      color: var(--muted);
    }

    .history-list {
      display: grid;
      gap: 9px;
      margin-top: 12px;
    }

    .history-empty {
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
      border-radius: 13px;
      background: var(--card-dark);
      border: 1px solid var(--line);
    }

    .history-product {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .history-code {
      margin-top: 4px;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;
      font-size: 17px;
      font-weight: 800;
      word-break: break-word;
    }

    .history-time {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .delete-one {
      width: 42px;
      min-height: 42px;
      padding: 0;
      border-radius: 10px;
      background: rgba(255, 107, 107, 0.14);
      color: #ffaaaa;
      border: 1px solid rgba(255, 107, 107, 0.32);
      font-size: 20px;
    }

    .warning {
      padding: 11px 12px;
      border-radius: 12px;
      background: rgba(244, 196, 48, 0.1);
      border: 1px solid rgba(244, 196, 48, 0.34);
      color: #f7df8b;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>AI Scanner Mottak v3</h1>

    <p
      class="subtitle"
      data-i18n="subtitle"
    ></p>

    <section class="card">
      <div class="language-grid" id="languageGrid">
        <button
          class="language-button"
          type="button"
          data-language="nb"
        >
          Norsk
        </button>

        <button
          class="language-button"
          type="button"
          data-language="pl"
        >
          Polski
        </button>

        <button
          class="language-button"
          type="button"
          data-language="uk"
        >
          Українська
        </button>
      </div>
    </section>

    <section class="card">
      <h2
        class="section-title"
        data-i18n="selectProduct"
      ></h2>

      <div class="product-grid" id="productGrid">
        <button
          class="product-button"
          type="button"
          data-product="bunner"
        >
          Bunner
        </button>

        <button
          class="product-button"
          type="button"
          data-product="hyller30"
        >
          Hyller x30
        </button>

        <button
          class="product-button"
          type="button"
          data-product="hyller60"
        >
          Hyller x60
        </button>
      </div>

      <p class="selected-product">
        <span data-i18n="selected"></span>:
        <strong id="selectedProductName">Bunner</strong>
      </p>
    </section>

    <section class="card">
      <h2
        class="section-title"
        data-i18n="totalAmount"
      ></h2>

      <div class="totals-grid">
        <div class="total-box">
          <span class="total-name">Bunner</span>
          <strong id="totalBunner" class="total-value">0</strong>
        </div>

        <div class="total-box">
          <span class="total-name">Hyller x30</span>
          <strong id="totalHyller30" class="total-value">0</strong>
        </div>

        <div class="total-box">
          <span class="total-name">Hyller x60</span>
          <strong id="totalHyller60" class="total-value">0</strong>
        </div>
      </div>

      <p class="grand-total">
        <span data-i18n="totalRecords"></span>:
        <strong id="grandTotal">0</strong>
      </p>

      <div
        class="tiny"
        data-i18n="countNote"
      ></div>
    </section>

    <section class="card">
      <label
        class="field-label"
        for="apiKey"
        data-i18n="apiKey"
      ></label>

      <input
        id="apiKey"
        type="password"
        autocomplete="off"
        data-i18n-placeholder="apiPlaceholder"
      />

      <div
        class="tiny"
        data-i18n="apiNote"
      ></div>
    </section>

    <section class="card">
      <h2
        class="section-title"
        data-i18n="takePhotoTitle"
      ></h2>

      <label
        class="file-button primary"
        for="photoInput"
        data-i18n="takePhoto"
      ></label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        capture="environment"
      />

      <div id="previewWrap" class="preview-wrap">
        <img
          id="preview"
          alt=""
        />
      </div>

      <div class="row two" style="margin-top: 12px;">
        <button
          id="scanBtn"
          class="primary"
          type="button"
          data-i18n="scanNumber"
          disabled
        ></button>

        <button
          id="clearBtn"
          class="secondary"
          type="button"
          data-i18n="newPhoto"
          disabled
        ></button>
      </div>

      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <h2
        class="section-title"
        data-i18n="result"
      ></h2>

      <p class="result-product">
        <span data-i18n="productForRecord"></span>:
        <strong id="resultProductName">—</strong>
      </p>

      <div class="result-grid">
        <div class="result-box">
          <span data-i18n="firstLine"></span>

          <div id="line1" class="result-value">
            ------
          </div>
        </div>

        <div class="result-box">
          <span data-i18n="secondLine"></span>

          <div id="line2" class="result-value">
            ------
          </div>
        </div>
      </div>

      <p id="confidence" class="confidence"></p>

      <button
        id="addBtn"
        class="success"
        type="button"
        data-i18n="add"
        disabled
      ></button>
    </section>

    <section class="card">
      <h2
        class="section-title"
        data-i18n="history"
      ></h2>

      <div class="row two">
        <button
          id="undoBtn"
          class="secondary"
          type="button"
          data-i18n="undoLast"
          disabled
        ></button>

        <button
          id="clearAllBtn"
          class="danger"
          type="button"
          data-i18n="clearShift"
          disabled
        ></button>
      </div>

      <div id="historyList" class="history-list"></div>
    </section>

    <div
      class="warning"
      data-i18n="warning"
    ></div>
  </main>

      return new Intl.DateTimeFormat(

    function loadImage(
      file
    ) {
      return new Promise(
        (
          resolve,
          reject
        ) => {
          const img =
            new Image();

          const url =
            URL.createObjectURL(
              file
            );

          img.onload =
            () => {
              URL.revokeObjectURL(
                url
              );

              resolve(img);
            };

          img.onerror =
            () => {
              URL.revokeObjectURL(
                url
              );

              reject(
                new Error(
                  "photoOpenError"
                )
              );
            };

          img.src =
            url;
        }
      );
    }

    function compressToJpeg(
      img
    ) {
      const maxSide =
        1800;

      let width =
        img.naturalWidth;

      let height =
        img.naturalHeight;

      if (
        Math.max(
          width,
          height
        ) > maxSide
      ) {
        const scale =
          maxSide /
          Math.max(
            width,
            height
          );

        width =
          Math.round(
            width * scale
          );

        height =
          Math.round(
            height * scale
          );
      }

      canvas.width =
        width;

      canvas.height =
        height;

      const ctx =
        canvas.getContext(
          "2d",
          {
            alpha: false
          }
        );

      ctx.fillStyle =
        "#ffffff";

      ctx.fillRect(
        0,
        0,
        width,
        height
      );

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      const dataUrl =
        canvas.toDataURL(
          "image/jpeg",
          0.9
        );

      return {
        dataUrl,

        base64:
          dataUrl.split(",")[1],

        mimeType:
          "image/jpeg"
      };
    }

    function extractOutputText(
      response
    ) {
      if (
        typeof response.output_text ===
          "string" &&
        response.output_text.trim()
      ) {
        return response.output_text.trim();
      }

      const parts =
        [];

      for (
        const step of
        response.steps || []
      ) {
        if (
          step.type !==
          "model_output"
        ) {
          continue;
        }

        for (
          const content of
          step.content || []
        ) {
          if (
            content.type ===
              "text" &&
            typeof content.text ===
              "string"
          ) {
            parts.push(
              content.text
            );
          }
        }
      }

      return parts
        .join("")
        .trim();
    }

    function validateResult(
      value
    ) {
      const line1 =
        String(
          value.line1 || ""
        ).trim();

      const line2 =
        String(
          value.line2 || ""
        )
          .trim()
          .toUpperCase();

      const confidence =
        Number(
          value.confidence
        );

      const line1Valid =
        /^\d{6}$/.test(
          line1
        );

      const line2Valid =
        /^[A-Z0-9]{6}$/.test(
          line2
        );

      const confidenceValid =
        Number.isFinite(
          confidence
        ) &&
        confidence >= 0 &&
        confidence <= 1;

      return {
        line1,

        line2,

        confidence:
          confidenceValid
            ? confidence
            : 0,

        valid:
          line1Valid &&
          line2Valid
      };
    }

    async function scanImage() {
      const apiKey =
        apiKeyInput.value.trim();

      if (!apiKey) {
        setStatus(
          "insertApiKey",
          "bad"
        );

        apiKeyInput.focus();

        return;
      }

      if (!currentImage) {
        setStatus(
          "statusInitial",
          "bad"
        );

        return;
      }

      const productForThisScan =
        selectedProduct;

      scanBtn.disabled =
        true;

      clearBtn.disabled =
        true;

      resetResult();

      setStatus(
        "analyzing",
        "",
        {
          product:
            PRODUCTS[
              productForThisScan
            ].name
        }
      );

      const requestBody = {
        model:
          MODEL,

        store:
          false,

        input: [
          {
            type:
              "text",

            text:
              PROMPT
          },

          {
            type:
              "image",

            data:
              currentImage.base64,

            mime_type:
              currentImage.mimeType
          }
        ],

        response_format: {
          type:
            "text",

          mime_type:
            "application/json",

          schema: {
            type:
              "object",

            properties: {
              line1: {
                type:
                  "string",

                description:
                  "Exactly 6 digits from the first line above the QR code."
              },

              line2: {
                type:
                  "string",

                description:
                  "Exactly 6 uppercase Latin letters A-Z or digits 0-9 from the second line above the QR code."
              },

              confidence: {
                type:
                  "number",

                minimum:
                  0,

                maximum:
                  1,

                description:
                  "Estimated confidence from 0 to 1."
              }
            },

            required: [
              "line1",
              "line2",
              "confidence"
            ],

            additionalProperties:
              false
          }
        },

        generation_config: {
          max_output_tokens:
            120,

          thinking_level:
            "minimal"
        }
      };

      try {
        const response =
          await fetch(
            API_URL,
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "x-goog-api-key":
                  apiKey
              },

              body:
                JSON.stringify(
                  requestBody
                )
            }
          );

        const data =
          await response
            .json()
            .catch(
              () => ({})
            );

        if (!response.ok) {
          const apiMessage =
            data?.error?.message ||
            `HTTP ${response.status}`;

          throw new Error(
            apiMessage
          );
        }

        const outputText =
          extractOutputText(
            data
          );

        if (!outputText) {
          throw new Error(
            "NO_TEXT_RESULT"
          );
        }

        let parsed;

        try {
          parsed =
            JSON.parse(
              outputText
            );
        } catch {
          setStatus(
            "invalidJson",
            "bad",
            {
              details:
                outputText.slice(
                  0,
                  180
                )
            }
          );

          return;
        }

        const checked =
          validateResult(
            parsed
          );

        currentResult = {
          ...checked,

          product:
            productForThisScan
        };

        line1El.textContent =
          checked.line1 ||
          "------";

        line2El.textContent =
          checked.line2 ||
          "------";

        resultProductNameEl.textContent =
          PRODUCTS[
            productForThisScan
          ].name;

        renderConfidence();

        if (!checked.valid) {
          addBtn.disabled =
            true;

          setStatus(
            "invalidResult",
            "bad"
          );
        } else {
          addBtn.disabled =
            false;

          setStatus(
            "recognized",
            "ok"
          );
        }
      } catch (error) {
        currentResult =
          null;

        addBtn.disabled =
          true;

        if (
          error.message ===
          "NO_TEXT_RESULT"
        ) {
          setStatus(
            "noTextResult",
            "bad"
          );
        } else {
          setStatus(
            "apiError",
            "bad",
            {
              message:
                error.message ||
                String(error)
            }
          );
        }
      } finally {
        scanBtn.disabled =
          !currentImage;

        clearBtn.disabled =
          !currentImage;
      }
    }

    scanBtn.addEventListener(
      "click",
      scanImage
    );

    function isDuplicate(
      line1,
      line2
    ) {
      return entries.some(
        (entry) => {
          return (
            entry.line1 ===
              line1 &&
            entry.line2 ===
              line2
          );
        }
      );
    }

    addBtn.addEventListener(
      "click",
      () => {
        if (
          !currentResult ||
          !currentResult.valid
        ) {
          return;
        }

        if (
          isDuplicate(
            currentResult.line1,
            currentResult.line2
          )
        ) {
          setStatus(
            "duplicate",
            "bad",
            {
              line1:
                currentResult.line1,

              line2:
                currentResult.line2
            }
          );

          addBtn.disabled =
            true;

          return;
        }

        const entry = {
          id:
            typeof crypto !==
              "undefined" &&
            crypto.randomUUID

              ? crypto.randomUUID()

              : `${Date.now()}-${Math.random()
                  .toString(16)
                  .slice(2)}`,

          product:
            currentResult.product,

          line1:
            currentResult.line1,

          line2:
            currentResult.line2,

          confidence:
            currentResult.confidence,

          createdAt:
            new Date().toISOString()
        };

        entries.push(
          entry
        );

        saveEntries();
        renderTotals();
        renderHistory();

        addBtn.disabled =
          true;

        setStatus(
          "added",
          "ok",
          {
            product:
              PRODUCTS[
                entry.product
              ].name,

            line1:
              entry.line1,

            line2:
              entry.line2
          }
        );
      }
    );

    undoBtn.addEventListener(
      "click",
      () => {
        if (
          entries.length === 0
        ) {
          return;
        }

        const removed =
          entries.pop();

        saveEntries();
        renderTotals();
        renderHistory();

        setStatus(
          "undone",
          "ok",
          {
            product:
              PRODUCTS[
                removed.product
              ].name,

            line1:
              removed.line1,

            line2:
              removed.line2
          }
        );
      }
    );

    clearAllBtn.addEventListener(
      "click",
      () => {
        if (
          entries.length === 0
        ) {
          return;
        }

        const confirmed =
          window.confirm(
            t("confirmClear")
          );

        if (!confirmed) {
          return;
        }

        entries =
          [];

        saveEntries();
        renderTotals();
        renderHistory();
        resetResult();

        setStatus(
          "allCleared",
          "ok"
        );
      }
    );

    historyListEl.addEventListener(
      "click",
      (event) => {
        const button =
          event.target.closest(
            "button[data-id]"
          );

        if (!button) {
          return;
        }

        const entryIndex =
          entries.findIndex(
            (entry) => {
              return (
                entry.id ===
                button.dataset.id
              );
            }
          );

        if (
          entryIndex === -1
        ) {
          return;
        }

        const entry =
          entries[
            entryIndex
          ];

        const confirmed =
          window.confirm(
            t(
              "confirmDelete",
              {
                product:
                  PRODUCTS[
                    entry.product
                  ].name,

                line1:
                  entry.line1,

                line2:
                  entry.line2
              }
            )
          );

        if (!confirmed) {
          return;
        }

        entries.splice(
          entryIndex,
          1
        );

        saveEntries();
        renderTotals();
        renderHistory();

        setStatus(
          "recordDeleted",
          "ok",
          {
            product:
              PRODUCTS[
                entry.product
              ].name,

            line1:
              entry.line1,

            line2:
              entry.line2
          }
        );
      }
    );

    renderAll();
  </script>
</body>
</html>
