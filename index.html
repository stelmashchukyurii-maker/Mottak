<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f4f4f4;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
}

#result{
    margin-top:20px;
    padding:15px;
    background:white;
    border-radius:10px;
    font-size:22px;
    word-break:break-all;
    color:#006400;
}

button{
    margin-top:20px;
    padding:12px 20px;
    font-size:18px;
}
</style>

</head>

<body>

<h2>Сканування QR</h2>

<div id="reader"></div>

<div id="result">
Очікування QR...
</div>

<button onclick="startScanner()">
Запустити камеру
</button>

<script>

let scanner;

function startScanner(){

scanner=new Html5Qrcode("reader");

scanner.start(

{ facingMode:"environment" },

{
fps:15,
qrbox:{
width:250,
height:250
}
},

function(decodedText){

document.getElementById("result").innerHTML=decodedText;

// якщо потрібно зупинити після першого QR
// scanner.stop();

},

function(error){

}

);

}

</script>

</body>
</html>
