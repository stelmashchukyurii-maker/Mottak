<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    margin:20px;
    background:#f4f4f4;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
}

#result{
    margin-top:20px;
    padding:15px;
    font-size:30px;
    font-weight:bold;
    color:#008000;
    background:#fff;
    border-radius:10px;
    word-break:break-all;
}
</style>

</head>

<body>

<h2>Сканування QR</h2>

<div id="reader"></div>

<div id="result">
Очікування QR...
</div>

<script>

let lastCode = "";

const scanner = new Html5Qrcode("reader");

scanner.start(
    { facingMode: "environment" },
    {
        fps: 15,
        qrbox: { width: 250, height: 250 }
    },
    function(decodedText){

        // Якщо потрібно лише другий рядок QR:
        // let code = (decodedText.split(/\r?\n/)[1] || decodedText).trim();

        // Якщо потрібен весь текст QR:
        let code = decodedText.trim();

        if(code !== lastCode){
            lastCode = code;
            document.getElementById("result").innerText = code;
        }

    },
    function(error){}
);

</script>

</body>
</html>
