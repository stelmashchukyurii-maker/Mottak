<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Тест OCR бірки</title>

  <!-- OCR-бібліотека -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 14px 10px;
      background: #202020;
      border-bottom: 1px solid #444;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    #status {
      margin-top: 8px;
      min-height: 22px;
      color: #ddd;
      font-size: 15px;
    }

    main {
      width: min(96%, 700px);
      margin: 0 auto;
      padding: 12px 0 30px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      height: 58vh;
      min-height: 380px;
      max-height: 720px;
      overflow: hidden;
      background: black;
      border: 2px solid #555;
      border-radius: 14px;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: black;
    }

    /*
      Зелена рамка — область, у якій повинні бути два рядки.
      Програма під час фотографування вирізає саме цю частину кадру.
    */
    #scanFrame {
      position: absolute;
      left: 50%;
      top: 60%;
      width: 84%;
      height: 31%;
      transform: translate(-50%, -50%);
      border: 4px solid #00ff66;
      border-radius: 12px;
      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.25),
        0 0 18px rgba(0, 255, 102, 0.9);
      pointer-events: none;
    }

    #scanFrame span {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      width: 300px;
      max-width: 90vw;
      transform: translateX(-50%);
      color: white;
      font-weight: bold;
      text-shadow: 0 2px 5px black;
    }

    .buttons {
      margin-top: 12px;
    }

    button,
    .fileButton {
      display: inline-block;
      width: min(96%, 520px);
      margin: 6px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #198cff;
      color: white;
    }

    #captureButton {
      background: #00b84f;
      color: white;
    }

    #torchButton {
      background: #ffc107;
      color: #111;
    }

    #stopButton {
      background: #c0392b;
      color: white;
    }

    .fileButton {
      background: #805ad5;
      color: white;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #fileInput {
      display: none;
    }

    .panel {
      margin-top: 14px;
      padding: 12px;
      background: #222;
      border: 2px solid #555;
      border-radius: 14px;
    }

    .title {
      margin-bottom: 10px;
      color: #bbb;
      font-size: 14px;
    }

    #cropPreview,
    #processedPreview {
      display: block;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: white;
      border-radius: 8px;
    }

    #cropPanel,
    #processedPanel,
    #progressPanel {
      display: none;
    }

    #result {
      min-height: 90px;
      padding: 10px;
      color: #00ff66;
      font-family: monospace;
      font-size: 38px;
      line-height: 1.35;
      font-weight: bold;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #rawResult {
      margin-top: 10px;
      padding: 10px;
      background: #111;
      color: #bbb;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #progressTrack {
      width: 100%;
      height: 15px;
      overflow: hidden;
      background: #444;
      border-radius: 10px;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #00b84f;
      transition: width 0.15s linear;
    }

    #progressText {
      margin-bottom: 8px;
      color: #ddd;
    }

    canvas {
      display: none;
    }

    footer {
      padding: 18px 10px 25px;
      color: #888;
      font-size: 12px;
      border-top: 1px solid #333;
    }
  </style>
</head>

<body>

<header>
  <h1>Тест читання бірки</h1>
  <div id="status">
    Відкрий камеру або вибери готове фото
  </div>
</header>

<main>

  <div id="cameraBox">
    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div id="scanFrame">
      <span>
        Помісти обидва рядки всередину зеленої рамки
      </span>
    </div>
  </div>

  <div class="buttons">

    <button id="startButton">
      📷 Відкрити камеру
    </button>

    <button id="captureButton" disabled>
      📸 Зробити фото і прочитати
    </button>

    <button id="torchButton" disabled>
      🔦 Ліхтарик
    </button>

    <button id="stopButton" disabled>
      ⛔ Закрити камеру
    </button>

    <label class="fileButton" for="fileInput">
      🖼️ Перевірити готове фото
    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
    >

  </div>

  <div id="progressPanel" class="panel">
    <div id="progressText">
      Підготовка OCR…
    </div>

    <div id="progressTrack">
      <div id="progressBar"></div>
    </div>
  </div>

  <div id="cropPanel" class="panel">
    <div class="title">
      Область, вирізана з фотографії
    </div>

    <img id="cropPreview" alt="Вирізаний текст">
  </div>

  <div id="processedPanel" class="panel">
    <div class="title">
      Оброблене зображення, яке бачить OCR
    </div>

    <img id="processedPreview" alt="Оброблене зображення">
  </div>

  <div class="panel">
    <div class="title">
      Результат
    </div>

    <div id="result">
      Очікування…
    </div>

    <div id="rawResult">
      Повний необроблений результат OCR з’явиться тут.
    </div>
  </div>

  <canvas id="photoCanvas"></canvas>
  <canvas id="cropCanvas"></canvas>
  <canvas id="processedCanvas"></canvas>

</main>

<footer>
  Версія 0.1 — тест OCR без QR
</footer>

<script>
"use strict";

const video = document.getElementById("video");
const cameraBox = document.getElementById("cameraBox");
const scanFrame = document.getElementById("scanFrame");

const startButton = document.getElementById("startButton");
const captureButton = document.getElementById("captureButton");
const torchButton = document.getElementById("torchButton");
const stopButton = document.getElementById("stopButton");
const fileInput = document.getElementById("fileInput");

const statusElement = document.getElementById("status");
const resultElement = document.getElementById("result");
const rawResultElement = document.getElementById("rawResult");

const progressPanel = document.getElementById("progressPanel");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

const cropPanel = document.getElementById("cropPanel");
const processedPanel = document.getElementById("processedPanel");

const cropPreview = document.getElementById("cropPreview");
const processedPreview = document.getElementById("processedPreview");

const photoCanvas = document.getElementById("photoCanvas");
const cropCanvas = document.getElementById("cropCanvas");
const processedCanvas = document.getElementById("processedCanvas");

let cameraStream = null;
let cameraTrack = null;
let torchEnabled = false;
let isProcessing = false;


/* =========================================================
   ВІДКРИТТЯ КАМЕРИ
   ========================================================= */

async function openCamera() {
  statusElement.textContent = "Відкриваємо задню камеру…";
  startButton.disabled = true;

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,

      video: {
        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 3840
        },

        height: {
          ideal: 2160
        },

        frameRate: {
          ideal: 30,
          max: 30
        }
      }
    });

    video.srcObject = cameraStream;

    await video.play();

    cameraTrack = cameraStream.getVideoTracks()[0];

    /*
      Пробуємо увімкнути безперервний автофокус.
      Не всі телефони дозволяють керувати ним із браузера.
    */
    try {
      const capabilities = cameraTrack.getCapabilities();

      if (
        Array.isArray(capabilities.focusMode) &&
        capabilities.focusMode.includes("continuous")
      ) {
        await cameraTrack.applyConstraints({
          advanced: [
            {
              focusMode: "continuous"
            }
          ]
        });
      }

      torchButton.disabled = !capabilities.torch;

    } catch (error) {
      console.log("Немає ручного керування фокусом:", error);
    }

    captureButton.disabled = false;
    stopButton.disabled = false;

    statusElement.textContent =
      "Наведи два рядки всередину зеленої рамки.";

  } catch (error) {
    console.error(error);

    statusElement.textContent =
      "Камера не відкрилася. Перевір дозвіл камери в Chrome.";

    resultElement.textContent = "Немає доступу до камери.";
  }

  startButton.disabled = false;
}


/* =========================================================
   ЗАКРИТТЯ КАМЕРИ
   ========================================================= */

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
  }

  cameraStream = null;
  cameraTrack = null;

  video.srcObject = null;

  captureButton.disabled = true;
  torchButton.disabled = true;
  stopButton.disabled = true;

  statusElement.textContent = "Камеру закрито.";
}


/* =========================================================
   ЛІХТАРИК
   ========================================================= */

async function toggleTorch() {
  if (!cameraTrack) {
    return;
  }

  torchEnabled = !torchEnabled;

  try {
    await cameraTrack.applyConstraints({
      advanced: [
        {
          torch: torchEnabled
        }
      ]
    });

    torchButton.textContent = torchEnabled
      ? "💡 Вимкнути ліхтарик"
      : "🔦 Ліхтарик";

  } catch (error) {
    console.error(error);

    torchEnabled = false;
    torchButton.textContent = "🔦 Ліхтарик";

    statusElement.textContent =
      "Телефон не дозволив керувати ліхтариком.";
  }
}


/* =========================================================
   ФОТО З КАМЕРИ
   ========================================================= */

function captureCameraPhoto() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error("Камера ще не підготувала зображення.");
  }

  photoCanvas.width = video.videoWidth;
  photoCanvas.height = video.videoHeight;

  const context = photoCanvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

  context.drawImage(
    video,
    0,
    0,
    photoCanvas.width,
    photoCanvas.height
  );

  return photoCanvas;
}


/* =========================================================
   ЗАВАНТАЖЕННЯ ГОТОВОЇ ФОТОГРАФІЇ
   ========================================================= */

async function loadPhotoFile(file) {
  const image = new Image();
  const temporaryUrl = URL.createObjectURL(file);

  try {
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = reject;
      image.src = temporaryUrl;
    });

    /*
      Зменшуємо дуже великі фотографії,
      щоб браузер телефону не завис.
    */
    const maximumSide = 3000;

    const scale = Math.min(
      1,
      maximumSide /
      Math.max(image.naturalWidth, image.naturalHeight)
    );

    photoCanvas.width =
      Math.round(image.naturalWidth * scale);

    photoCanvas.height =
      Math.round(image.naturalHeight * scale);

    const context = photoCanvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

    context.drawImage(
      image,
      0,
      0,
      photoCanvas.width,
      photoCanvas.height
    );

    return photoCanvas;

  } finally {
    URL.revokeObjectURL(temporaryUrl);
  }
}


/* =========================================================
   ВИЗНАЧЕННЯ ОБЛАСТІ ЗЕЛЕНОЇ РАМКИ
   ========================================================= */

function getCameraCropRectangle(sourceCanvas) {
  /*
    Визначаємо, де зелена рамка розташована
    відносно видимого елемента камери.
  */

  const videoRectangle = video.getBoundingClientRect();
  const frameRectangle = scanFrame.getBoundingClientRect();

  const visibleWidth = videoRectangle.width;
  const visibleHeight = videoRectangle.height;

  /*
    Через object-fit: cover частина реального кадру
    може бути обрізана з боків або зверху.
  */

  const sourceWidth = sourceCanvas.width;
  const sourceHeight = sourceCanvas.height;

  const displayScale = Math.max(
    visibleWidth / sourceWidth,
    visibleHeight / sourceHeight
  );

  const displayedSourceWidth =
    sourceWidth * displayScale;

  const displayedSourceHeight =
    sourceHeight * displayScale;

  const hiddenLeft =
    (displayedSourceWidth - visibleWidth) / 2;

  const hiddenTop =
    (displayedSourceHeight - visibleHeight) / 2;

  const frameLeft =
    frameRectangle.left - videoRectangle.left;

  const frameTop =
    frameRectangle.top - videoRectangle.top;

  let sourceX =
    (frameLeft + hiddenLeft) / displayScale;

  let sourceY =
    (frameTop + hiddenTop) / displayScale;

  let sourceCropWidth =
    frameRectangle.width / displayScale;

  let sourceCropHeight =
    frameRectangle.height / displayScale;

  sourceX = Math.max(0, sourceX);
  sourceY = Math.max(0, sourceY);

  sourceCropWidth = Math.min(
    sourceCropWidth,
    sourceWidth - sourceX
  );

  sourceCropHeight = Math.min(
    sourceCropHeight,
    sourceHeight - sourceY
  );

  return {
    x: sourceX,
    y: sourceY,
    width: sourceCropWidth,
    height: sourceCropHeight
  };
}


/* =========================================================
   ОБЛАСТЬ ДЛЯ ГОТОВОЇ ФОТОГРАФІЇ
   ========================================================= */

function getUploadedPhotoCropRectangle(sourceCanvas) {
  /*
    Для готового фото беремо центральну область.

    На надісланому фото текст знаходиться
    приблизно в центральній нижній частині.
  */

  return {
    x: sourceCanvas.width * 0.16,
    y: sourceCanvas.height * 0.49,
    width: sourceCanvas.width * 0.70,
    height: sourceCanvas.height * 0.38
  };
}


/* =========================================================
   ВИРІЗАННЯ ТЕКСТУ
   ========================================================= */

function cropTextArea(sourceCanvas, rectangle) {
  /*
    Збільшуємо фрагмент приблизно у 3 рази.
    Надмірне збільшення часто погіршує OCR.
  */

  const enlargement = 3;

  cropCanvas.width =
    Math.round(rectangle.width * enlargement);

  cropCanvas.height =
    Math.round(rectangle.height * enlargement);

  const context = cropCanvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = "high";

  context.clearRect(
    0,
    0,
    cropCanvas.width,
    cropCanvas.height
  );

  context.drawImage(
    sourceCanvas,

    rectangle.x,
    rectangle.y,
    rectangle.width,
    rectangle.height,

    0,
    0,
    cropCanvas.width,
    cropCanvas.height
  );

  cropPreview.src =
    cropCanvas.toDataURL("image/jpeg", 0.97);

  cropPanel.style.display = "block";

  return cropCanvas;
}


/* =========================================================
   ПІДСИЛЕННЯ КОНТРАСТУ
   ========================================================= */

function preprocessImage(sourceCanvas) {
  processedCanvas.width = sourceCanvas.width;
  processedCanvas.height = sourceCanvas.height;

  const context = processedCanvas.getContext(
    "2d",
    {
      willReadFrequently: true
    }
  );

  context.drawImage(
    sourceCanvas,
    0,
    0
  );

  const imageData = context.getImageData(
    0,
    0,
    processedCanvas.width,
    processedCanvas.height
  );

  const pixels = imageData.data;

  /*
    Спочатку визначаємо середню яскравість.
  */

  let brightnessSum = 0;
  let pixelCount = 0;

  for (let i = 0; i < pixels.length; i += 4) {
    const gray =
      pixels[i] * 0.299 +
      pixels[i + 1] * 0.587 +
      pixels[i + 2] * 0.114;

    brightnessSum += gray;
    pixelCount++;
  }

  const averageBrightness =
    brightnessSum / pixelCount;

  /*
    Поріг трохи нижчий за середню яскравість.
    Чорні символи залишаються чорними,
    світлий фон стає білим.
  */

  const threshold = Math.max(
    75,
    Math.min(190, averageBrightness * 0.76)
  );

  for (let i = 0; i < pixels.length; i += 4) {
    let gray =
      pixels[i] * 0.299 +
      pixels[i + 1] * 0.587 +
      pixels[i + 2] * 0.114;

    /*
      Додатково підсилюємо контраст.
    */

    gray = (gray - 128) * 1.65 + 128;

    const value =
      gray > threshold ? 255 : 0;

    pixels[i] = value;
    pixels[i + 1] = value;
    pixels[i + 2] = value;
    pixels[i + 3] = 255;
  }

  context.putImageData(
    imageData,
    0,
    0
  );

  processedPreview.src =
    processedCanvas.toDataURL("image/png");

  processedPanel.style.display = "block";

  return processedCanvas;
}


/* =========================================================
   ОЧИЩЕННЯ РЕЗУЛЬТАТУ
   ========================================================= */

function cleanOcrText(text) {
  const lines = String(text || "")
    .toUpperCase()
    .replace(/[^A-Z0-9\n\r ]/g, "")
    .split(/\r?\n/)
    .map(line => line.replace(/\s+/g, "").trim())
    .filter(line => line.length >= 4)
    .filter(line => line.length <= 10);

  /*
    Шукаємо рядки, схожі на наш формат:
    6 цифр;
    6 символів із цифр та літер.
  */

  const firstLine = lines.find(line =>
    /^\d{6}$/.test(line)
  );

  const secondLine = lines.find(line =>
    /^[A-Z0-9]{6}$/.test(line) &&
    line !== firstLine
  );

  if (firstLine && secondLine) {
    return firstLine + "\n" + secondLine;
  }

  return lines.slice(0, 2).join("\n");
}


/* =========================================================
   OCR
   ========================================================= */

async function recognizeText(imageCanvas) {
  progressPanel.style.display = "block";
  progressBar.style.width = "0%";

  const result = await Tesseract.recognize(
    imageCanvas,
    "eng",
    {
      logger(message) {
        if (typeof message.progress === "number") {
          const percentage =
            Math.round(message.progress * 100);

          progressBar.style.width =
            percentage + "%";

          const statusNames = {
            "loading tesseract core":
              "Завантаження OCR",

            "initializing tesseract":
              "Запуск OCR",

            "loading language traineddata":
              "Завантаження мовної моделі",

            "initializing api":
              "Підготовка OCR",

            "recognizing text":
              "Розпізнавання тексту"
          };

          progressText.textContent =
            (statusNames[message.status] ||
              message.status ||
              "Обробка") +
            ": " +
            percentage +
            "%";
        }
      }
    }
  );

  return result;
}


/* =========================================================
   ГОЛОВНА ОБРОБКА
   ========================================================= */

async function processPhoto(
  sourceCanvas,
  fromCamera
) {
  if (isProcessing) {
    return;
  }

  isProcessing = true;

  captureButton.disabled = true;

  resultElement.textContent =
    "Розпізнавання…";

  rawResultElement.textContent =
    "Очікування результату OCR…";

  try {
    statusElement.textContent =
      "Вирізаємо область із текстом…";

    const rectangle = fromCamera
      ? getCameraCropRectangle(sourceCanvas)
      : getUploadedPhotoCropRectangle(sourceCanvas);

    const croppedImage =
      cropTextArea(sourceCanvas, rectangle);

    const processedImage =
      preprocessImage(croppedImage);

    statusElement.textContent =
      "OCR читає символи…";

    /*
      Дозволяємо лише цифри і великі латинські літери.
    */

    const ocrResult = await Tesseract.recognize(
      processedImage,
      "eng",
      {
        logger(message) {
          if (typeof message.progress === "number") {
            const percentage =
              Math.round(message.progress * 100);

            progressPanel.style.display = "block";

            progressBar.style.width =
              percentage + "%";

            progressText.textContent =
              "Розпізнавання: " +
              percentage +
              "%";
          }
        },

        tessedit_char_whitelist:
          "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ",

        preserve_interword_spaces:
          "1"
      }
    );

    const rawText =
      ocrResult.data.text || "";

    const cleanedText =
      cleanOcrText(rawText);

    rawResultElement.textContent =
      "Необроблений OCR:\n\n" +
      (rawText || "(порожньо)") +
      "\n\nВпевненість: " +
      Math.round(ocrResult.data.confidence || 0) +
      "%";

    if (cleanedText) {
      resultElement.textContent =
        cleanedText;

      statusElement.textContent =
        "✅ Готово.";

      if (navigator.vibrate) {
        navigator.vibrate([100, 60, 120]);
      }

    } else {
      resultElement.textContent =
        "Не розпізнано";

      statusElement.textContent =
        "OCR не знайшов потрібні два рядки.";
    }

  } catch (error) {
    console.error(error);

    resultElement.textContent =
      "Помилка";

    rawResultElement.textContent =
      error.message || String(error);

    statusElement.textContent =
      "Сталася помилка під час OCR.";

  } finally {
    isProcessing = false;

    captureButton.disabled =
      !cameraTrack;

    setTimeout(() => {
      progressPanel.style.display = "none";
    }, 1200);
  }
}


/* =========================================================
   КНОПКА ФОТО
   ========================================================= */

async function captureAndRecognize() {
  try {
    statusElement.textContent =
      "Чекаємо автофокус…";

    /*
      Даємо камері трохи часу сфокусуватися.
    */
    await new Promise(resolve =>
      setTimeout(resolve, 900)
    );

    const photo =
      captureCameraPhoto();

    await processPhoto(
      photo,
      true
    );

  } catch (error) {
    console.error(error);

    resultElement.textContent =
      "Помилка камери";

    statusElement.textContent =
      error.message || "Не вдалося зробити фото.";
  }
}


/* =========================================================
   ПОДІЇ
   ========================================================= */

startButton.addEventListener(
  "click",
  openCamera
);

captureButton.addEventListener(
  "click",
  captureAndRecognize
);

torchButton.addEventListener(
  "click",
  toggleTorch
);

stopButton.addEventListener(
  "click",
  closeCamera
);

fileInput.addEventListener(
  "change",
  async function() {
    const file = fileInput.files?.[0];

    if (!file) {
      return;
    }

    try {
      statusElement.textContent =
        "Відкриваємо фотографію…";

      const photo =
        await loadPhotoFile(file);

      await processPhoto(
        photo,
        false
      );

    } catch (error) {
      console.error(error);

      resultElement.textContent =
        "Помилка фото";

      statusElement.textContent =
        "Не вдалося відкрити фотографію.";
    }

    fileInput.value = "";
  }
);


/* =========================================================
   ЗАКРИТТЯ СТОРІНКИ
   ========================================================= */

window.addEventListener(
  "pagehide",
  function() {
    if (cameraStream) {
      cameraStream
        .getTracks()
        .forEach(track => track.stop());
    }
  }
);
</script>

</html>
