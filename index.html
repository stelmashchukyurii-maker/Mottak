<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>Сканер складських бірок</title>

    <!-- OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script>

    <!-- QR як додатковий резервний спосіб -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 14px 10px;
            background: #1c1c1c;
        }

        h1 {
            margin: 0;
            font-size: 23px;
        }

        #status {
            margin-top: 8px;
            min-height: 23px;
            color: #ddd;
            font-size: 16px;
        }

        #camera-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            overflow: hidden;
            background: black;
        }

        #video {
            display: block;
            width: 100%;
            height: 58vh;
            min-height: 370px;
            max-height: 700px;
            object-fit: cover;
            background: black;
        }

        #scan-frame {
            position: absolute;
            z-index: 5;

            width: 82%;
            max-width: 500px;
            height: 190px;

            left: 50%;
            top: 49%;

            transform: translate(-50%, -50%);

            border: 4px solid #00ff66;
            border-radius: 16px;

            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.38),
                0 0 18px rgba(0, 255, 102, 0.85);

            pointer-events: none;
        }

        #scan-frame.success {
            border-color: #00ff66;
            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.25),
                0 0 35px rgba(0, 255, 102, 1);
        }

        #scan-frame.error {
            border-color: #ff4444;
            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.38),
                0 0 30px rgba(255, 68, 68, 0.9);
        }

        #frame-label {
            position: absolute;
            left: 50%;
            top: -42px;

            width: 100%;
            transform: translateX(-50%);

            color: white;
            font-size: 17px;
            font-weight: bold;
            text-shadow: 0 2px 5px black;
        }

        #scan-line {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 15px;

            height: 3px;
            background: #00ff66;
            box-shadow: 0 0 10px #00ff66;

            animation: scanMove 2s linear infinite;
        }

        @keyframes scanMove {
            0% {
                top: 15px;
            }

            50% {
                top: calc(100% - 18px);
            }

            100% {
                top: 15px;
            }
        }

        #canvas,
        #processed-canvas {
            display: none;
        }

        .controls {
            padding: 14px 8px;
            background: #101010;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 17px;
            margin: 5px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        #start-button {
            width: min(94%, 470px);
            padding: 16px;
            background: #00ad49;
            color: white;
            font-size: 22px;
        }

        #recognize-button {
            width: min(94%, 470px);
            padding: 17px;
            background: #00ad49;
            color: white;
            font-size: 22px;
        }

        #recognize-button:disabled {
            background: #555;
            color: #aaa;
        }

        #torch-button {
            background: #ffc107;
            color: #111;
        }

        #stop-button {
            background: #a72b2b;
            color: white;
        }

        .zoom-controls {
            margin-bottom: 7px;
        }

        .zoom-button {
            min-width: 63px;
            background: #343434;
            color: white;
        }

        .zoom-button.active {
            background: #1685ee;
        }

        .zoom-button:disabled,
        #torch-button:disabled {
            opacity: 0.38;
        }

        #progress-box {
            display: none;
            width: min(94%, 650px);
            margin: 12px auto;
            padding: 13px;
            background: #222;
            border-radius: 12px;
        }

        #progress-text {
            margin-bottom: 9px;
            color: #ddd;
            font-size: 15px;
        }

        #progress-track {
            width: 100%;
            height: 13px;
            overflow: hidden;

        #progress-bar {
            width: 0;

        #result-box {
            width: min(94%, 650px);

        }

        #main-code {

        }

        #all-text {
            margin-top: 13px;

            font-family: monospace;
            font-size: 22px;
            font-weight: bold;

            white-space: pre-wrap;
            word-break: break-word;
        }

        #raw-text {
            margin-top: 12px;

            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;

        #camera-info {
            width: min(94%, 650px);

        }

        footer {
            margin-top: 18px;

        @media (max-width: 430px) {
            #video {

            #scan-frame {

            }

    </style>

<body>

<header>
    <h1>Сканер складських бірок</h1>
    <div id="status">
        Натисніть «Відкрити камеру»
    </div>
</header>

<main>

    <div id="camera-container">

        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>

        <div id="scan-frame">

            <div id="frame-label">
                Наведіть цифри в рамку
            </div>

            <div id="scan-line"></div>

        </div>

    </div>

    <canvas id="canvas"></canvas>
    <canvas id="processed-canvas"></canvas>

    <div class="controls">

        <button id="start-button">
            📷 Відкрити камеру
        </button>

        <div id="working-controls" hidden>

            <div class="zoom-controls">
                <button class="zoom-button" data-zoom="1">1×</button>
                <button class="zoom-button active" data-zoom="2">2×</button>
                <button class="zoom-button" data-zoom="3">3×</button>
                <button class="zoom-button" data-zoom="4">4×</button>
            </div>

            <button id="torch-button" disabled>
                🔦 Ліхтарик
            </button>

            <br>

            <button id="recognize-button">
                🔎 Розпізнати цифри
            </button>

            <br>

            <button id="stop-button">
                ⛔ Закрити камеру
            </button>

        </div>

    </div>

    <div id="progress-box">

        <div id="progress-text">
            Підготовка OCR…
        </div>

        <div id="progress-track">
            <div id="progress-bar"></div>
        </div>

    </div>

    <div id="result-box">

        <div id="result-label">
            Знайдений код:
        </div>

        <div id="main-code">
            Очікування…
        </div>

        <div id="all-text"></div>

        <div id="raw-text"></div>

    </div>

    <div id="camera-info">
        Камера ще не запущена.
    </div>

</main>

<footer>
    <div><strong>Версія коду:</strong> 0.2</div>
    <div><strong>Оновлено:</strong> 30.07.2026, 17:15</div>
    <div>Етап 2: OCR друкованих цифр і резервне читання QR</div>
</footer>

<script>
"use strict";

/* =========================================================
   ВЕРСІЯ
========================================================= */

const APP_VERSION = "0.2";
const CODE_UPDATED = "30.07.2026, 17:15";

/* =========================================================
   ЕЛЕМЕНТИ
========================================================= */

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");
const processedCanvas =
    document.getElementById("processed-canvas");

const statusElement =
    document.getElementById("status");

const scanFrame =
    document.getElementById("scan-frame");

const startButton =
    document.getElementById("start-button");

const recognizeButton =
    document.getElementById("recognize-button");

const stopButton =
    document.getElementById("stop-button");

const torchButton =
    document.getElementById("torch-button");

const workingControls =
    document.getElementById("working-controls");

const zoomButtons =
    document.querySelectorAll(".zoom-button");

const mainCodeElement =
    document.getElementById("main-code");

const allTextElement =
    document.getElementById("all-text");

const rawTextElement =
    document.getElementById("raw-text");

const cameraInfo =
    document.getElementById("camera-info");

const progressBox =
    document.getElementById("progress-box");

const progressText =
    document.getElementById("progress-text");

const progressBar =
    document.getElementById("progress-bar");

/* =========================================================
   ЗМІННІ
========================================================= */

let stream = null;
let videoTrack = null;

let currentZoom = 2;
let torchEnabled = false;

let ocrWorker = null;
let ocrWorkerReady = false;
let recognitionRunning = false;

/* =========================================================
   КАМЕРА
========================================================= */

async function startCamera() {

    resetResult();

    if (!window.isSecureContext) {
        showError(
            "Камера працює лише через HTTPS. " +
            "Відкрийте сторінку github.io."
        );
        return;
    }

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {
        showError(
            "Цей браузер не підтримує камеру. " +
            "Відкрийте сайт у Google Chrome."
        );
        return;
    }

    startButton.disabled = true;
    startButton.textContent =
        "Відкриваємо камеру…";

    statusElement.textContent =
        "Очікуємо дозвіл на камеру…";

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({
                audio: false,

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 3840
                    },

                    height: {
                        ideal: 2160
                    },

                    frameRate: {
                        ideal: 30,
                        max: 30
                    }
                }
            });

        video.srcObject = stream;

        await video.play();

        videoTrack =
            stream.getVideoTracks()[0];

        workingControls.hidden = false;
        startButton.hidden = true;

        readCameraCapabilities();

        await setZoom(2);

        statusElement.textContent =
            "Наведіть цифри в рамку і натисніть «Розпізнати цифри».";

    } catch (error) {

        handleCameraError(error);

    } finally {

        startButton.disabled = false;
        startButton.textContent =
            "📷 Відкрити камеру";
    }
}

/* =========================================================
   МОЖЛИВОСТІ КАМЕРИ
========================================================= */

function readCameraCapabilities() {

    if (!videoTrack) {
        return;
    }

    let capabilities = {};
    let settings = {};

    try {

        capabilities =
            videoTrack.getCapabilities
                ? videoTrack.getCapabilities()
                : {};

        settings =
            videoTrack.getSettings
                ? videoTrack.getSettings()
                : {};

    } catch (error) {
        console.warn(error);
    }

    const width =
        settings.width || "невідомо";

    const height =
        settings.height || "невідомо";

    const zoomSupported =
        capabilities.zoom !== undefined;

    const torchSupported =
        capabilities.torch === true ||
        Array.isArray(capabilities.torch);

    let zoomText =
        "не підтримується";

    if (zoomSupported) {
        zoomText =
            `${capabilities.zoom.min}–${capabilities.zoom.max}×`;
    }

    cameraInfo.innerHTML = `
        <strong>Роздільна здатність:</strong>
        ${width} × ${height}<br>

        <strong>Зум:</strong>
        ${zoomText}<br>

        <strong>Ліхтарик:</strong>
        ${torchSupported ? "підтримується" : "не підтримується"}<br>

        <strong>Поточний зум:</strong>
        <span id="current-zoom-info">1×</span>
    `;

    torchButton.disabled =
        !torchSupported;

    zoomButtons.forEach((button) => {

        if (!zoomSupported) {
            button.disabled = true;
            return;
        }

        const zoom =
            Number(button.dataset.zoom);

        button.disabled =
            zoom < capabilities.zoom.min ||
            zoom > capabilities.zoom.max;
    });
}

/* =========================================================
   ЗУМ
========================================================= */

async function setZoom(requestedZoom) {

    if (!videoTrack) {
        return;
    }

    let capabilities = {};

    try {
        capabilities =
            videoTrack.getCapabilities
                ? videoTrack.getCapabilities()
                : {};
    } catch (error) {
        return;
    }

    if (capabilities.zoom === undefined) {

        statusElement.textContent =
            "Камера працює, але браузер не дає керувати зумом.";

        return;
    }

    const safeZoom =
        Math.min(
            capabilities.zoom.max,
            Math.max(
                capabilities.zoom.min,
                requestedZoom
            )
        );

    try {

        await videoTrack.applyConstraints({
            advanced: [
                {
                    zoom: safeZoom
                }
            ]
        });

        currentZoom = safeZoom;

        zoomButtons.forEach((button) => {

            button.classList.toggle(
                "active",
                Number(button.dataset.zoom) === requestedZoom
            );
        });

        const zoomInfo =
            document.getElementById("current-zoom-info");

        if (zoomInfo) {
            zoomInfo.textContent =
                `${safeZoom}×`;
        }

        statusElement.textContent =
            `Камера працює. Зум ${safeZoom}×.`;

    } catch (error) {

        statusElement.textContent =
            "Не вдалося змінити зум.";
    }
}

/* =========================================================
   ЛІХТАРИК
========================================================= */

async function toggleTorch() {

    if (!videoTrack) {
        return;
    }

    torchEnabled = !torchEnabled;

    try {

        await videoTrack.applyConstraints({
            advanced: [
                {
                    torch: torchEnabled
                }
            ]
        });

        torchButton.textContent =
            torchEnabled
                ? "💡 Вимкнути ліхтарик"
                : "🔦 Ліхтарик";

    } catch (error) {

        torchEnabled = false;

        torchButton.textContent =
            "🔦 Ліхтарик";

        statusElement.textContent =
            "Ліхтарик не підтримується.";
    }
}

/* =========================================================
   СТОП-КАДР І ОБРІЗАННЯ ЦЕНТРАЛЬНОЇ РАМКИ
========================================================= */

function captureFrame() {

    if (
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ) {
        throw new Error(
            "Відео ще не готове."
        );
    }

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;

    if (
        !videoWidth ||
        !videoHeight
    ) {
        throw new Error(
            "Немає зображення з камери."
        );
    }

    /*
      Беремо центральну зону, яка відповідає рамці.
      Вона ширша за напис, щоб не обрізати символи.
    */

    const cropWidth =
        Math.round(videoWidth * 0.72);

    const cropHeight =
        Math.round(videoHeight * 0.30);

    const cropX =
        Math.round(
            (videoWidth - cropWidth) / 2
        );

    const cropY =
        Math.round(
            (videoHeight - cropHeight) / 2
        );

    /*
      Збільшуємо стоп-кадр у 2 рази.
      Це допомагає OCR побачити маленькі символи.
    */

    const scale = 2;

    canvas.width =
        cropWidth * scale;

    canvas.height =
        cropHeight * scale;

    const context =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = "high";

    context.drawImage(
        video,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;
}

/* =========================================================
   ПІДГОТОВКА ЗОБРАЖЕННЯ ДЛЯ OCR
========================================================= */

function preprocessImage(sourceCanvas) {

    processedCanvas.width =
        sourceCanvas.width;

    processedCanvas.height =
        sourceCanvas.height;

    const context =
        processedCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    context.drawImage(
        sourceCanvas,
        0,
        0
    );

    const imageData =
        context.getImageData(
            0,
            0,
            processedCanvas.width,
            processedCanvas.height
        );

    const pixels =
        imageData.data;

    /*
      Перетворюємо зображення у чорно-біле
      та посилюємо контраст.
    */

    for (
        let index = 0;
        index < pixels.length;
        index += 4
    ) {

        const red =
            pixels[index];

        const green =
            pixels[index + 1];

        const blue =
            pixels[index + 2];

        let gray =
            0.299 * red +
            0.587 * green +
            0.114 * blue;

        /*
          Контраст.
        */

        gray =
            (gray - 128) * 1.9 + 128;

        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );

        /*
          Просте порогове перетворення.
        */

        const value =
            gray > 125
                ? 255
                : 0;

        pixels[index] = value;
        pixels[index + 1] = value;
        pixels[index + 2] = value;
    }

    context.putImageData(
        imageData,
        0,
        0
    );

    return processedCanvas;
}

/* =========================================================
   OCR WORKER
========================================================= */

async function prepareOcrWorker() {

    if (ocrWorkerReady && ocrWorker) {
        return;
    }

    progressBox.style.display =
        "block";

    progressText.textContent =
        "Завантаження OCR-модуля…";

    progressBar.style.width =
        "5%";

    ocrWorker =
        await Tesseract.createWorker(
            "eng",
            1,
            {
                logger: (message) => {

                    if (
                        typeof message.progress ===
                        "number"
                    ) {

                        const percent =
                            Math.round(
                                message.progress * 100
                            );

                        progressBar.style.width =
                            `${percent}%`;

                        progressText.textContent =
                            translateOcrStatus(
                                message.status,
                                percent
                            );
                    }
                }
            }
        );

    /*
      Дозволяємо OCR очікувати тільки цифри
      та великі латинські літери.
    */

    await ocrWorker.setParameters({

        tessedit_char_whitelist:
            "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ",

        preserve_interword_spaces:
            "1",

        /*
          Режим для невеликого блоку тексту.
        */
        tessedit_pageseg_mode:
            Tesseract.PSM.SINGLE_BLOCK
    });

    ocrWorkerReady = true;

    progressBar.style.width =
        "100%";

    progressText.textContent =
        "OCR готовий.";
}

function translateOcrStatus(
    status,
    percent
) {

    const statuses = {

        "loading tesseract core":
            "Завантаження ядра OCR",

        "initializing tesseract":
            "Запуск OCR",

        "loading language traineddata":
            "Завантаження мовної моделі",

        "initializing api":
            "Підготовка розпізнавання",

        "recognizing text":
            "Розпізнавання тексту"
    };

    const translated =
        statuses[status] ||
        status ||
        "Обробка";

    return `${translated}: ${percent}%`;
}

/* =========================================================
   РОЗПІЗНАВАННЯ
========================================================= */

async function recognizeLabel() {

    if (recognitionRunning) {
        return;
    }

    if (!videoTrack) {
        showError(
            "Спочатку відкрийте камеру."
        );
        return;
    }

    recognitionRunning = true;

    recognizeButton.disabled = true;
    recognizeButton.textContent =
        "⏳ Розпізнавання…";

    scanFrame.classList.remove(
        "success",
        "error"
    );

    mainCodeElement.textContent =
        "Обробка…";

    allTextElement.textContent = "";
    rawTextElement.textContent = "";

    statusElement.textContent =
        "Тримайте бірку нерухомо.";

    try {

        await prepareOcrWorker();

        const capturedCanvas =
            captureFrame();

        const preparedCanvas =
            preprocessImage(
                capturedCanvas
            );

        /*
          Спочатку пробуємо QR зі звичайного
          кольорового стоп-кадру.
        */

        const qrText =
            tryReadQr(
                capturedCanvas
            );

        if (qrText) {

            displaySuccess(
                extractUsefulCode(qrText),
                qrText,
                "QR прочитано"
            );

            return;
        }

        progressBox.style.display =
            "block";

        progressText.textContent =
            "Розпізнаємо надруковані символи…";

        progressBar.style.width =
            "15%";

        const result =
            await ocrWorker.recognize(
                preparedCanvas
            );

        const rawText =
            result.data.text || "";

        const cleanedText =
            cleanOcrText(rawText);

        const usefulCode =
            extractUsefulCode(
                cleanedText
            );

        if (
            cleanedText &&
            usefulCode
        ) {

            displaySuccess(
                usefulCode,
                cleanedText,
                "Текст розпізнано"
            );

        } else if (cleanedText) {

            displayPartialResult(
                cleanedText,
                rawText
            );

        } else {

            displayFailure(
                "Текст не знайдено. " +
                "Спробуйте 2× або 3×, " +
                "піднесіть ближче та тримайте нерухомо."
            );
        }

    } catch (error) {

        console.error(error);

        displayFailure(
            "Помилка OCR: " +
            (
                error.message ||
                "невідома помилка"
            )
        );

    } finally {

        recognitionRunning = false;

        recognizeButton.disabled = false;
        recognizeButton.textContent =
            "🔎 Розпізнати цифри";

        setTimeout(() => {

            progressBox.style.display =
                "none";

        }, 1000);
    }
}

/* =========================================================
   QR ІЗ СТОП-КАДРУ
========================================================= */

function tryReadQr(sourceCanvas) {

    if (
        typeof jsQR !== "function"
    ) {
        return "";
    }

    const context =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    const imageData =
        context.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );

    const result =
        jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
                inversionAttempts:
                    "attemptBoth"
            }
        );

    return result && result.data
        ? result.data.trim()
        : "";
}

/* =========================================================
   ОЧИЩЕННЯ OCR
========================================================= */

function cleanOcrText(text) {

    return String(text || "")
        .toUpperCase()

        /*
          Залишаємо лише латинські літери,
          цифри, пробіли та переноси.
        */
        .replace(
            /[^A-Z0-9\r\n ]/g,
            ""
        )

        /*
          Прибираємо зайві пробіли.
        */
        .replace(
            /[ \t]+/g,
            ""
        )

        /*
          Прибираємо порожні рядки.
        */
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .join("\n")
        .trim();
}

/* =========================================================
   ПОШУК ПОТРІБНОГО КОДУ
========================================================= */

function extractUsefulCode(text) {

    const normalized =
        String(text || "")
            .toUpperCase()
            .replace(
                /[^A-Z0-9]/g,
                ""
            );

    /*
      Шукаємо код, схожий на:
      2CB739

      Тобто 6 символів, де є хоча б
      одна буква і хоча б одна цифра.
    */

    const candidates =
        normalized.match(
            /[A-Z0-9]{6}/g
        ) || [];

    for (const candidate of candidates) {

        const hasLetter =
            /[A-Z]/.test(candidate);

        const hasNumber =
            /[0-9]/.test(candidate);

        if (
            hasLetter &&
            hasNumber
        ) {
            return candidate;
        }
    }

    /*
      Якщо буквено-цифровий код не знайдений,
      шукаємо 6 цифр, наприклад 078500.
    */

    const numberCode =
        normalized.match(
            /\d{6}/
        );

    if (numberCode) {
        return numberCode[0];
    }

    return "";
}

/* =========================================================
   ПОКАЗ РЕЗУЛЬТАТІВ
========================================================= */

function displaySuccess(
    usefulCode,
    cleanedText,
    statusText
) {

    mainCodeElement.textContent =
        usefulCode;

    allTextElement.textContent =
        cleanedText;

    rawTextElement.textContent = "";

    statusElement.textContent =
        `✅ ${statusText}. Код знайдено.`;

    scanFrame.classList.remove(
        "error"
    );

    scanFrame.classList.add(
        "success"
    );

    if (navigator.vibrate) {
        navigator.vibrate(
            [120, 70, 120]
        );
    }

    setTimeout(() => {
        scanFrame.classList.remove(
            "success"
        );
    }, 1800);
}

function displayPartialResult(
    cleanedText,
    rawText
) {

    mainCodeElement.textContent =
        "Перевірте текст";

    allTextElement.textContent =
        cleanedText;

    rawTextElement.textContent =
        `Сирий результат OCR:\n${rawText}`;

    statusElement.textContent =
        "⚠️ Символи знайдено, але потрібний код не визначено.";

    scanFrame.classList.add(
        "error"
    );

    if (navigator.vibrate) {
        navigator.vibrate(150);
    }
}

function displayFailure(message) {

    mainCodeElement.textContent =
        "Не знайдено";

    allTextElement.textContent = "";
    rawTextElement.textContent = "";

    statusElement.textContent =
        message;

    scanFrame.classList.add(
        "error"
    );

    if (navigator.vibrate) {
        navigator.vibrate(200);
    }
}

function resetResult() {

    mainCodeElement.textContent =
        "Очікування…";

    allTextElement.textContent = "";
    rawTextElement.textContent = "";

    scanFrame.classList.remove(
        "success",
        "error"
    );
}

function showError(message) {

    mainCodeElement.textContent =
        "Помилка";

    allTextElement.textContent = "";
    rawTextElement.textContent = "";

    statusElement.textContent =
        message;

    scanFrame.classList.add(
        "error"
    );
}

/* =========================================================
   ЗУПИНКА КАМЕРИ
========================================================= */

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        stream = null;
    }

    video.srcObject = null;
    videoTrack = null;

    torchEnabled = false;

    workingControls.hidden = true;
    startButton.hidden = false;

    statusElement.textContent =
        "Камеру закрито.";

    cameraInfo.textContent =
        "Камера ще не запущена.";
}

/* =========================================================
   ПОМИЛКИ КАМЕРИ
========================================================= */

function handleCameraError(error) {

    console.error(
        "Помилка камери:",
        error
    );

    let message =
        "Не вдалося відкрити камеру.";

    switch (error.name) {

        case "NotAllowedError":
        case "PermissionDeniedError":

            message =
                "Доступ до камери заборонено. " +
                "У Chrome дозвольте камеру для цього сайту.";

            break;

        case "NotFoundError":
        case "DevicesNotFoundError":

            message =
                "Камеру не знайдено.";

            break;

        case "NotReadableError":
        case "TrackStartError":

            message =
                "Камера зайнята іншою програмою.";

            break;

        case "OverconstrainedError":

            message =
                "Телефон не підтримує запитані параметри камери.";

            break;

        case "SecurityError":

            message =
                "Браузер заблокував камеру через налаштування безпеки.";

            break;
    }

    showError(message);

    workingControls.hidden = true;
    startButton.hidden = false;
}

/* =========================================================
   КНОПКИ
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);

recognizeButton.addEventListener(
    "click",
    recognizeLabel
);

stopButton.addEventListener(
    "click",
    stopCamera
);

torchButton.addEventListener(
    "click",
    toggleTorch
);

zoomButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const zoom =
                Number(
                    button.dataset.zoom
                );

            setZoom(zoom);
        }
    );
});

/* =========================================================
   ЗАКРИТТЯ СТОРІНКИ
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        if (stream) {

            stream
                .getTracks()
                .forEach(track => {
                    track.stop();
                });
        }

        if (ocrWorker) {
            ocrWorker.terminate();
        }
    }
);

console.log(
    `Версія ${APP_VERSION}, ` +
    `оновлено ${CODE_UPDATED}`
);
</script>
