<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    text-align:center;
}

h2{
    margin-bottom:15px;
}

#reader{
    width:100%;
    max-width:450px;
    margin:auto;
}

#result{
    margin-top:20px;
    padding:15px;
    background:white;
    border-radius:10px;
    font-size:30px;
    font-weight:bold;
    color:green;
    word-break:break-all;
}
</style>

</head>

<body>

<h2>Сканування QR</h2>

<div id="reader"></div>

<div id="result">
Очікування QR...
</div>

<script>

let lastCode = "";

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(

{
    facingMode: "environment"
},

{
    fps: 15,
    qrbox: {
        width: 250,
        height: 250
    }
}

).then(() => {

    // Пробуємо встановити 2× зум
    html5QrCode.applyVideoConstraints({
        advanced: [
            { zoom: 2 }
        ]
    }).catch(() => {});

    html5QrCode.render(
        (decodedText) => {

            let code = decodedText.trim();

            if(code !== lastCode){

                lastCode = code;

                document.getElementById("result").innerText = code;

            }

        },

        (errorMessage) => {

        }

    );

}).catch(err => {

    document.getElementById("result").innerText =
        "Помилка запуску камери";

});

</script>

</body>
</html>
