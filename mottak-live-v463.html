<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Nordic ID v4.6.3 single lock</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b1020}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1020;color:#f5f7ff;font:800 18px/1.5 Arial,sans-serif;text-align:center;z-index:5}
  </style>
</head>
<body>
  <div id="loader">Завантаження Nordic ID v4.6.3…</div>
  <iframe id="app" title="Nordic ID v4.6.3" src="mottak-live-v46.html?base=463-2156"></iframe>
  <script>
    "use strict";
    const frame = document.getElementById("app");
    const loader = document.getElementById("loader");

    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;
        const oldFix = doc.querySelector('script[src*="mottak-live-v46-wedge-fix.js"]');
        if (oldFix) oldFix.remove();

        const recovery = doc.createElement("script");
        recovery.src = "mottak-live-v46-wedge-v462.js?v=463-2156";
        recovery.onload = () => {
          const lock = doc.createElement("script");
          lock.src = "mottak-live-v46-single-lock-v463.js?v=463-2156";
          lock.onload = () => { loader.style.display = "none"; };
          lock.onerror = () => { loader.textContent = "Не вдалося завантажити замок v4.6.3."; };
          doc.body.appendChild(lock);
        };
        recovery.onerror = () => { loader.textContent = "Не вдалося завантажити відновлення Wedge."; };
        doc.body.appendChild(recovery);
      } catch (error) {
        loader.textContent = `Помилка запуску v4.6.3: ${error.message || error}`;
      }
    });
  </script>
</body>
</html>
